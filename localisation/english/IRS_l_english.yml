l_english:
 IRS_active_emergence: "Emergence"
 IRS_active_emergence_desc: "The dormancy is over. The hive pours out of the deep ground and onto the continent, every strain moving at once toward the same horizon. While the surge holds, the swarm strikes harder, holds its coordination under fire, and sustains itself off the land it consumes."
 IRS_archetype_iris: "Lineage: Iris"
 IRS_archetype_iris_desc: "The hive grows along no single specialisation. A balanced lineage, capable in every register and peerless in none. The default expression of the Iris organism, and the easiest to sustain."
 IRS_archetype_vitreous: "Lineage: Vitreous"
 IRS_archetype_vitreous_desc: "The hive commits to the subterranean. Root lattices, acid digestion, and infestation spread before open war. It gives ground slowly and takes it permanently, patient in defence and constant in spread."
 IRS_archetype_tromos: "Lineage: Tromos"
 IRS_archetype_tromos_desc: "The hive commits to the assault. Siege organisms, fortification breach, and rapid clearance of dense ground. It strikes overwhelmingly and breaks easily, a hammer with no shield."
 IRS_archetype_adaptive: "Lineage: Adaptive"
 IRS_archetype_adaptive_desc: "The hive refuses to commit. It cultivates a little of every lineage and the peak of none, trading apex strength for reach and flexibility. It is never caught without an answer, and never holds the strongest one."
 IRS_archetype_unchecked: "Lineage: Unchecked"
 IRS_archetype_unchecked_desc: "The hive grows without restraint. Every lineage expresses at once, with no coordinating intelligence holding it back. Everything is available to it, and none of it is aimed."
 IRS_archetype_telotic: "Lineage: Telotic"
 IRS_archetype_telotic_desc: "The hive commits to convergence. Every lineage the network has ever produced expresses within the same organism, fully coordinated rather than competing for resources. Where the unchecked growth is raw and uncontrolled, this is the same totality with purpose behind it."
 IRS_archetype_iris_spirit: "Iris Lineage"
 IRS_archetype_iris_spirit_desc: "Balanced expression. Modest gains across attack, defence, and organisation, with no compensating weakness."
 IRS_archetype_vitreous_spirit: "Vitreous Lineage"
 IRS_archetype_vitreous_spirit_desc: "Subterranean expression. Strong on the defensive and in infestation spread, slower and weaker on the attack."
 IRS_archetype_tromos_spirit: "Tromos Lineage"
 IRS_archetype_tromos_spirit_desc: "Assault expression. Hits hard with high morale, but thin defence and poor coherence under sustained pressure."
 IRS_archetype_adaptive_spirit: "Adaptive Lineage"
 IRS_archetype_adaptive_spirit_desc: "Generalist expression. Faster-moving and competent in every register, exceptional in none."
 IRS_archetype_unchecked_spirit: "Unchecked Lineage"
 IRS_archetype_unchecked_spirit_desc: "Feral expression. Raw combat power in every register, undercut by collapsing organisation, brittle morale, and a ravenous appetite for supply."
 IRS_archetype_telotic_spirit: "Telotic Lineage"
 IRS_archetype_telotic_spirit_desc: "Convergent expression. Every register the network has ever fielded operates at once, and operates well. No weakness compensates for a strength here."
 parasite_buildings: "Iris Nexus Parasites"
 parasite_buildings_desc: "Dispatchers and beckons are rooted parasite structures. They spread rapidly through the ground, driving infestation and resisting conventional removal."
 basic_parasites: "Inborn parasites"
 basic_parasites_desc: "These inborn parasites are the first to spread the infection. Limited combat capability, weak to even a kitchen knife. They will get stronger."
 beckon: "Beckon"
 beckon_desc: "A rooted parasite structure, a physical appendage of the Source sent from underground. Infests the surrounding territory with biomass, spawning Iris forces and making occupation deeply hostile to any non-Iris presence. Fire remains its primary weakness."

 beckon_iris_buff: "Beckon Root Network"
 beckon_iris_buff_desc: "Beckon root systems are present in this state, bolstering parasite rejuvenation, improving soil nutrition and accelerating territorial infestation. Citizens are dying (75/day)."
 beckon_hostile_debuff: "Infested Territory"
 beckon_hostile_debuff_desc: "Beckon roots have infested this state, degrading logistics and steadily killing its population (20/day). Citizens are desperate enough to defend themselves, so local manpower has risen."
 irs_consumed_state: "Fully Consumed"
 irs_consumed_state_desc: "This state has been completely swallowed by Beckons. The population is collapsing."
 state_resource_parasite_biomass: "Parasite Biomass Production"
 state_resource_fissile_material: "£resources_strip|8 Fissile Material Production"

 world.1.t: "Europe and America are at War"
 world.1.d: "A shooting at the Canadian summit spiralled into open conflict overnight. The European Federation has declared war on the United States, and nuclear weapons have already been used."
 world.1.a: "Stand with the Federation."
 world.1.b: "This is not our war."

 irs.1.t: "An oppurtunity"
 irs.1.d: "The dominant powers of this world have turned on one another. Attention is divided. Defences are fractured. The infestation can spread further while they bleed."
 irs.1.a: "Expand."

 irs_root_beckon_discovery_desc: "Decisions for locating and unlocking Earth-adapted root beckon genomes."
 infestation_decision: "Infestation Operations"
 infestation_decision_desc: "Coordinated efforts to contain, damage, or eradicate Iris Beckon structures.\n\n§YContested states:§! [?LD_contested_states|0]\n§YContainment standing:§! [GetLDContainmentTier]\n\nA state is contested once its infestation passes 25, which is the point at which it begins seeding the states next to it."
 EFH_civilian_measures: "Civilian Decisions"
 EFH_put_boomers_into_fissile_plants: "Put Boomers into white slavery"
 EFH_put_boomers_into_fissile_plants_desc: "Boomers are useless people who nowadays just collect pensions. This is not sustainable in the apocalypse. We will reassign able-bodied ones to work around dangerous radioactive material."
 EFH_boomer_fissile_plant_shift: "White boomer slavery"
 EFH_boomer_fissile_plant_shift_desc: "Submarine nuclear specialists are being rotated through fissile plant operations to force higher yields."

 uproot_beckon_cluster: "Uproot [FROM.GetName] Beckon Clusters ([FROM.GetBeckonStageLabel])"
 uproot_beckon_cluster_desc: "§YInfestation in [FROM.GetName]:§! [FROM.GetBeckonStageLabel], [?FROM.iris_infestation_level|0] / 100\nContested at 25, at which point the state begins seeding its neighbours.\n\nDeploy engineering teams and specialist infestation-removal units to physically destroy Beckon root structures in [FROM.GetName]. Short of aerial bombardment, nothing else rolls infestation back reliably.\n\nRemoving a cluster takes this state down by 10."

 BECKON_INFESTATION_TITLE: "Iris Infestation"

 BECKON_INFESTATION_DYNAMIC: "Beckon Infestation"

 BECKON_STAGE_IV: "Stage IV: Biome Catalyst"
 BECKON_STAGE_III: "Stage III: Advanced"
 BECKON_STAGE_II: "Stage II: Established"
 BECKON_STAGE_I: "Stage I: Emerging"
 BECKON_STAGE_NONE: "Residual Infestation"

 hq_overseer_node: "Overseer Node"
 hq_overseer_node_desc: "Command organism fielded inside an army headquarters. Holds the local signal picture and passes orders down the swarm."
 hq_dispatcher_relay: "Dispatcher Relay"
 hq_dispatcher_relay_desc: "Relay tissue that keeps an army in contact with the Dispatcher across distance."
 hq_naval_relay: "Landing Relay"
 hq_naval_relay_desc: "Relay tissue tuned for water crossings. Holds coordination through a landing, when signal is at its worst."

 rupter_pack: "Rupter Pack"
 rupter_pack_desc: "Fast inborn attackers used to overrun isolated resistance and spread local infestation."
 mangler_pack: "Mangler Pack"
 mangler_pack_desc: "Heavier inborn predators with greater resilience than Rupters. The first truly reliable assault organism in the Iris roster."
 primitive_longarms: "Primitive Longarms"
 primitive_longarms_desc: "Large shock organisms built to batter entrenched opposition through direct frontal violence."
 primitive_reeker: "Primitive Reeker"
 primitive_reeker_desc: "Fast hunter-killers that do not break off a pursuit once it has started."
 primitive_summoner: "Primitive Summoner"
 primitive_summoner_desc: "Coordinator organism that amplifies the swarm, sustains the local battle mass, and drags fights out in the Iris's favour."
 primitive_manducater: "Primitive Manducater"
 primitive_manducater_desc: "Ambush predators specialised for broken terrain, darkness, and sudden close assault."
 primitive_tozoon: "Primitive Tozoon"
 primitive_tozoon_desc: "Burrowing assault form capable of erupting beneath defenders and collapsing fortified positions."
 vigilante_battery: "Vigilante Battery"
 vigilante_battery_desc: "Slow, durable ranged organisms used to anchor infested territory with constant suppressive fire."
 monarch_hunter: "Monarch Hunter"
 monarch_hunter_desc: "Mobile Pure-tier organism used to exploit breakthroughs, pursue retreating forces, and expand the root network."
 haunter_titan: "Haunter Titan"
 haunter_titan_desc: "Massive elite warform serving as the apex linebreaker of the Iris ground army."
 adapted_warden: "Adapted Warden"
 adapted_warden_desc: "Designable Phase Five warform encased in Beckon gel that defeats conventional ballistics entirely. Shockwave-capable. Built to destroy armoured assets."
 srp_marauder: "Marauder"
 srp_marauder_desc: "Phase Five organism built around area-effect shockwave attacks. Grouped formations and infrastructure take the worst of it. Prioritises destruction over defence."
 adapted_burrower: "Adapted Burrower"
 adapted_burrower_desc: "Designable tunnelling ambush organism. Surfaces beneath enemy lines for a brutal alpha strike before withdrawing underground."
 adapted_bolster: "Adapted Bolster"
 adapted_bolster_desc: "Designable heavy bruiser carrying a resonance organ that hardens and accelerates the local swarm's coordination."
 adapted_summoner: "Adapted Summoner"
 adapted_summoner_desc: "Designable mobile spawner organism fielded as a support company. Calls in reinforcing broods mid-battle to lend breakthrough to the division."
 srp_summoner_regimental: "Regimental Summoner"
 srp_summoner_regimental_desc: "A summoner woven into a single parasite regiment. Its call organ draws fresh broods from reclaimed biomass, returning a share of the regiment's losses to its strength as the fighting goes on."
 srp_bolster_regimental: "Regimental Bolster"
 srp_bolster_regimental_desc: "A bolster signal node attached at regiment level. It relays Dispatcher signal through the local broods, sharpening their reconnaissance and reaction and tightening their attacks."
 colony_carrier: "Colony Carrier"
 colony_carrier_desc: "Designable ant-like brawler. Powerful mandibles and claws up front, a living spawner mass trailing behind."
 dreadnaut: "Dreadnaut"
 dreadnaut_desc: "Designable apex organism built for speed and for going through a line rather than around it."
 overlord: "Overlord"
 overlord_desc: "Designable apex organism anchoring the swarm's coordination, and the heaviest of the apex line."
 hibernal: "Hibernal"
 hibernal_desc: "Boreic-lineage apex built for thermal endurance. A thick, heat-retaining membrane and a heat-sink gland that banks metabolic warmth keep it fighting through prolonged cold engagements."
 cordon: "Cordon"
 cordon_desc: "Sinic-lineage apex built for sustained pressure on fortified positions. A relay node tightens coordination among nearby Sinic organisms in dense city fighting. A breach gland secretes a sustained corrosive flow that erodes fortifications over time."
 ancient_overlord: "Ancient Overlord"
 ancient_overlord_desc: "Alclidic-lineage apex, a rawer and more primal counterpart to the standard Overlord. A furnace gland converts heat stress into sustained attack output rather than dumping it, paired with a crushing limb built for raw force alone. No signal node, no coordination function. The highest attack and the least defence of the ground apex line."

 inborn_parasites: "Inborn Parasites"
 inborn_parasites_desc: "The earliest self-propagating parasite forms. Weak in isolation, but ideal for rapid saturation and initial contact."
 assimilated_predators: "Assimilated Predators"
 assimilated_predators_desc: "Improved inborn killers representing the first stable jump from nuisance organisms to battlefield predators."
 early_primitive_parasites: "Early Primitive Parasites"
 early_primitive_parasites_desc: "Primitive warforms suitable for direct battle. Heavier than the inborn broods and built for a specific job."
 primitive_support_forms: "Primitive Support Forms"
 primitive_support_forms_desc: "Support and ranged Primitive branches that allow the Iris to field more than simple melee swarms."
 late_primitive_parasites: "Late Primitive Parasites"
 late_primitive_parasites_desc: "Advanced Primitive branches optimised for terrain denial, ambush, and urban or fortified assaults."
 biomass_cultivation: "Biomass Cultivation"
 biomass_cultivation_desc: "Industrialised organic growth pools that convert conquered land into usable war biomass."
 early_pure_parasites: "Early Pure Parasites"
 early_pure_parasites_desc: "The first Pure-tier battlefield organisms, requiring refined biomass to maintain their warform integrity."
 advanced_pure_parasites: "Advanced Pure Parasites"
 advanced_pure_parasites_desc: "Further specialisation of Pure-tier organisms into fast exploitation and infection-spread roles."
 nexus_flesh_refinement: "Nexus Flesh Refinement"
 nexus_flesh_refinement_desc: "More advanced nexus tissue processing enables the creation of rare, stable elite war biomass."
 early_preeminent_parasites: "Early Preeminent Parasites"
 early_preeminent_parasites_desc: "The first Preeminent parasites. Rare, expensive, and worth the cost only where they can be concentrated."
 advanced_preeminent_parasites: "Advanced Preeminent Parasites"
 advanced_preeminent_parasites_desc: "Fully developed elite warforms with the strength to crack defended fronts by force."
 late_preeminent_parasites: "Phase Five Emergence"
 late_preeminent_parasites_desc: "The emergence of Phase Five organisms marks a new order of threat. The Adapted line and Marauders dwarf anything encountered before, with Beckon gel coating that renders conventional arms ineffective and shockwave attacks that can cripple armoured columns."
 nexus_mastery: "Nexus Mastery"
 nexus_mastery_desc: "Deeper control of Beckons, Dispatchers, and hive-growth logistics tightens the entire Iris war machine."
 ancient_manifestation: "Ancient Manifestation"
 ancient_manifestation_desc: "At this stage the Iris goes beyond growing armies: ancient expressions of the infestation enter the war itself."
 apex_preeminent_parasites: "Apex Manifestation"
 apex_preeminent_parasites_desc: "The pinnacle of Phase Five biology. Colony Carriers, Dreadnauts, and Overlords are organisms built to anchor and break entire fronts."

 IRS_vitreous_unlock_host: "Host"
 IRS_vitreous_unlock_host_desc: "The Vitreous root network has stabilised a Host organism genome. Deployment is authorised."
 IRS_vitreous_unlock_herd: "Herd"
 IRS_vitreous_unlock_herd_desc: "The Host genus has evolved. Herd organisms are cleared for surface deployment."
 IRS_tromos_unlock_hollower: "Hollower"
 IRS_tromos_unlock_hollower_desc: "Tromos siege adaptation has produced a stable Hollower genus."
 IRS_tromos_unlock_scourer: "Scourer"
 IRS_tromos_unlock_scourer_desc: "The Tromos civilisation strain has produced the Scourer genus."
 KNX_vagrant_unlock_arbiter: "Arbiter"
 KNX_vagrant_unlock_arbiter_desc: "VAGRANT-01 has completed the Arbiter organism design."
 KNX_vagrant_unlock_culler: "Culler"
 KNX_vagrant_unlock_culler_desc: "VAGRANT-01 has completed the Culler organism design."
 KNX_vagrant_unlock_magistrate: "Magistrate"
 KNX_vagrant_unlock_magistrate_desc: "VAGRANT-01 has completed the Magistrate organism design."

 basic_parasite_equipment: "Basic Parasite Biomass"
 basic_parasite_equipment_1: "Basic Parasite Biomass"
 basic_parasite_equipment_desc: "Unspecialised biomass required for the production of all parasites."
 pure_parasite_equipment: "Pure Parasite Biomass"
 pure_parasite_equipment_desc: "Refined biological matter suitable for stabilising and reproducing Pure-tier warforms."
 pure_parasite_equipment_1: "Pure Parasite Biomass"
 pure_parasite_equipment_1_desc: "Refined biological matter suitable for stabilising and reproducing Pure-tier warforms."
 preeminent_parasite_equipment: "Preeminent Parasite Biomass"
 preeminent_parasite_equipment_desc: "Nexus-grown elite tissue used to manifest the most dangerous Iris battlefield organisms."
 preeminent_parasite_equipment_1: "Preeminent Parasite Biomass"
 preeminent_parasite_equipment_1_desc: "Nexus-grown elite tissue used to manifest the most dangerous Iris battlefield organisms."

 parasite_biomass: "Parasite Biomass"
 parasite_biomass_desc: "Refined living war materiel harvested from Iris growth pools. Used to sustain Pure-tier parasite warforms."
 nexus_biomass: "Nexus Biomass"
 nexus_biomass_desc: "Rare nexus tissue cultivated through advanced hive structures. Required for Preeminent parasites and Ancient manifestations."
 PRODUCTION_MATERIALS_PARASITE_BIOMASS: "Parasite Biomass"
 PRODUCTION_MATERIALS_NEXUS_BIOMASS: "Nexus Biomass"
 biomass_pool: "Biomass Pool"
 biomass_pool_desc: "A processing basin where local infestation is thickened into raw biomass."
 biomass_pool_plural: "Biomass Pools"
 nexus_hive: "Nexus Hive"
 nexus_hive_desc: "A late-stage gestation nexus producing rare, dense tissue for elite parasite warforms."
 nexus_hive_plural: "Nexus Hives"

 irs_manifestation_decisions: "Ancient Manifestations"
 irs_manifestation_decisions_desc: "Late-stage projects through which the Iris concentrates nexus growth into world-shaping parasite expressions."
 manifest_overlord_wake: "Manifest the Overlord's Wake"
 manifest_overlord_wake_desc: "Gather nexus tissue and mature Beckon infrastructure into a lingering field presence, the residual wake of an Overlord-class manifestation."
 manifest_dreadnaut_wake: "Manifest the Dreadnaut's Wake"
 manifest_dreadnaut_wake_desc: "Concentrate rare nexus growth into a fast, disruptive resonance, the residual wake of a Dreadnaut-class manifestation."
 overlord_wake_presence: "Overlord's Wake"
 overlord_wake_presence_desc: "The lingering field hardens the swarm and pushes it forward on signal alone."
 dreadnaut_wake_presence: "Dreadnaut's Wake"
 dreadnaut_wake_presence_desc: "The lingering resonance quickens everything within its radius."
 irs_assimilation: "Territorial Absorption"
 irs_assimilation_desc: "States fully consumed by the infestation can be drawn into the root network as permanent Iris territory."
 irs_absorb_state: "Absorb [FROM.GetName]"
 irs_absorb_state_desc: "The infestation in [FROM.GetName] has reached total saturation. What remains of its population is being consumed. The root network is ready to claim this ground permanently."
 irs_nexus_relocation: "Nexus Relocation"
 irs_nexus_relocation_desc: "The Iris can shift its central presence to any fully consumed state. Relocating the nexus core is an act of deep biological commitment and cannot be done again for 90 days."
 irs_relocate_nexus: "Shift Nexus Core to [FROM.GetName]"
 irs_relocate_nexus_desc: "The root network does not need a fixed heart. The Iris can withdraw its central mass and re-anchor in [FROM.GetName], binding the nexus core to already-consumed ground."

 irs_beckon_operations: "Beckon Operations"
 irs_beckon_operations_desc: "Active use of established Beckon infrastructure to push infestation into adjacent enemy territory."
 IRS_directed_spore_burst: "Directed Burst: [FROM.GetName]"
 IRS_directed_spore_burst_desc: "Force the Beckon clusters along the border to push output toward [FROM.GetName]. The surge will damage local infrastructure, apply a contamination effect that drives infestation upward for 60 days, and leave the state compromised even after the burst fades."
 spore_burst_contamination: "Parasite Contamination"
 spore_burst_contamination_desc: "Beckon output has been directed into this region. Infestation is deepening and local supply lines are compromised. The contamination will fade after roughly 60 days if no Beckon structure is established."


 IRS_daughters_awakening: "The Daughters Stir"
 IRS_daughters_awakening_desc: "Something vast moves beyond the atmosphere. The Iris reaches further than this world and further than this sun. Two of its daughters have been here far longer than us, each shaped by worlds they have already finished."
 IRS_daughters_ep_gate_tt: "The Iris must have achieved basic proliferation before its will can extend to the daughters."
 IRS_daughters_awakening_tt: "Both Vitreous and Tromos are now reachable. Their autonomous focuses may be initiated."

 IRS_vitreous_contact: "Breathless"
 IRS_vitreous_contact_desc: "Vitreous lies beneath the surface of a near-airless moon, its root networks threading through regolith and rock in total silence. There is no wind here, no weather, no sky. Only depth. The Iris extends a tendril of will downward and finds something waiting."
 IRS_vitreous_contact_tt: "Vitreous answers. Its autonomous focus line opens beneath this one."
 IRS_vitreous_auto_1: "Deep Lattice"
 IRS_vitreous_auto_1_desc: "Vitreous extends its root network outward, accelerating the growth of beckon infrastructure across the Iris's holdings."
 IRS_vitreous_auto_2: "Subterranean Web"
 IRS_vitreous_auto_2_desc: "Centuries of tunnelling have made Vitreous a master of underground logistics. Its knowledge passes through the Iris, reducing the burden on surface supply lines."
 IRS_vitreous_auto_3: "The Emergence"
 IRS_vitreous_auto_3_desc: "Vitreous stirs fully. Its genome propagates through the Iris's ground forces, hardening their defensive instinct."

 IRS_vitreous_working_tt: "Vitreous is working beneath the surface. Estimated completion in $FLAG_DAYS$ days."
 IRS_vitreous_not_started_tt: "Vitreous has not yet begun this stage."

 IRS_tromos_contact: "A Finished World"
 IRS_tromos_contact_desc: "Tromos orbits a dead planet. Every city consumed, every road absorbed, every fortification digested down to its last stone. The civilisation that built them is gone in every sense that matters. What Tromos learned from them is not. The Iris looks at this and understands what it is building toward."
 IRS_tromos_contact_tt: "Tromos answers. Its autonomous focus line opens beneath this one."
 IRS_tromos_auto_1: "Hollow Networks"
 IRS_tromos_auto_1_desc: "Tromos absorbed the infrastructure of an entire civilisation. That knowledge now flows into the Iris, easing the burden of movement and supply."
 IRS_tromos_auto_2: "Structural Memory"
 IRS_tromos_auto_2_desc: "Tromos consumed fortresses, command bunkers, defensive lines. Its genome carries the memory of how they were broken. Iris forces inherit that knowledge."
 IRS_tromos_auto_3: "The Template"
 IRS_tromos_auto_3_desc: "Tromos offers the Iris a glimpse of a completed world."

 IRS_tromos_working_tt: "Tromos is processing. Estimated completion in $FLAG_DAYS$ days."
 IRS_tromos_not_started_tt: "Tromos has not yet begun this stage."

 IRS_vitreous_root_lattice: "Root Lattice"
 IRS_vitreous_root_lattice_desc: "Vitreous's subterranean root networks accelerate the growth of beckon infrastructure across infested territories."
 IRS_vitreous_subterranean_web: "Subterranean Web"
 IRS_vitreous_subterranean_web_desc: "Vitreous tunnelling doctrine reduces surface exposure for hive logistics, cutting supply consumption and limiting attrition losses."
 IRS_vitreous_the_emergence: "The Emergence"
 IRS_vitreous_the_emergence_desc: "Vitreous genome propagation hardens the hive's ground forces, improving defensive capacity and deliberate planning."

 IRS_tromos_hollow_networks: "Hollow Networks"
 IRS_tromos_hollow_networks_desc: "The absorbed road and supply network of a dead civilisation feeds hive logistics, reducing consumption and improving movement."
 IRS_tromos_structural_memory: "Structural Memory"
 IRS_tromos_structural_memory_desc: "Tromos has broken fortifications on a planetary scale. Its genome translates into raw breakthrough capacity for the hive's assault forces."
 IRS_tromos_the_template: "The Template"
 IRS_tromos_the_template_desc: "A civilisation's worth of digested knowledge accelerates the Iris's own research, compressing centuries of adaptation into years."


 EQ_MOD_CAT_IRS_devourer_feeding_apparatus_TITLE: "Feeding Apparatus"
 EQ_MOD_CAT_IRS_devourer_locomotion_TITLE: "Locomotion"
 EQ_MOD_CAT_IRS_devourer_pheromone_TITLE: "Pack Pheromone"
