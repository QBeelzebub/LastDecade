l_english:

 economy: "Economic Posture"
 trade_laws: "Trade & Supply"
 mobilization_laws: "Military Commitment"

 srp_peacetime_economy: "Peacetime Economy"
 srp_peacetime_economy_desc: "The state operates under standard market conditions. Defence spending is restrained, consumer goods are freely available, and the private sector remains the primary driver of production."

 srp_crisis_mobilization: "Crisis Mobilisation"
 srp_crisis_mobilization_desc: "With the threat clearly visible, the government begins redirecting resources toward national defence. Emergency procurement channels are opened and arms production receives priority funding."

 srp_wartime_direction: "Wartime Direction"
 srp_wartime_direction_desc: "The state exercises direct authority over industrial output. Factory capacity is reoriented toward military production, and civilian-to-military conversion costs are reduced across the board."

 srp_total_war_production: "Total War Production"
 srp_total_war_production_desc: "Every available factory works for the war effort. Consumer goods are rationed hard, and people at home start to resent it."

 srp_emergency_command_economy: "Emergency Command Economy"
 srp_emergency_command_economy_desc: "The state takes direct control of all production. Civilian construction stops and everything goes to the military."

 srp_open_global_market: "Open Global Market"
 srp_open_global_market_desc: "The country participates fully in international trade."

 srp_managed_imports: "Managed Imports"
 srp_managed_imports_desc: "The government begins exercising selective control over trade flows, prioritising strategic imports while moderating export dependency. Economic efficiency is maintained at a moderate cost."

 srp_strategic_protectionism: "Strategic Protectionism"
 srp_strategic_protectionism_desc: "Exports are sharply curtailed and domestic industry is shielded from foreign competition. The economy turns inward. Construction and production are redirected toward self-sufficiency."

 srp_emergency_rationing: "Emergency Rationing"
 srp_emergency_rationing_desc: "With global supply chains disrupted or severed, the state imposes strict rationing on goods and materials."

 srp_total_supply_lockdown: "Total Supply Lockdown"
 srp_total_supply_lockdown_desc: "All exports cease. The country operates in complete economic isolation, drawing entirely on domestic resources."

 srp_national_policy: "National Policy"
 srp_national_policy_desc: "Manage the state's governing posture and economic philosophy. These policies apply additional modifiers on top of your core laws."
 srp_crisis_authority: "CRISIS AUTHORITY"
 srp_fiscal_policy: "FISCAL POLICY"

 srp_civil_society_intact: "Civil Society Intact"
 srp_civil_society_intact_desc: "Democratic institutions, civil liberties, and the rule of law function without significant restriction. Political capital flows freely and public trust in government remains high, though urgency is limited."

 srp_emergency_legislation: "Emergency Legislation"
 srp_emergency_legislation_desc: "Parliament grants the executive expanded powers to respond to the crisis. Emergency procurement is streamlined and public construction is accelerated. Civil liberties remain largely intact."

 srp_security_state: "Security State"
 srp_security_state_desc: "Surveillance is expanded, movement is monitored, and the internal security services get broad authority. The opposition has less room to work."

 srp_martial_law: "Martial Law"
 srp_martial_law_desc: "The military takes over civilian government in many regions. Curfews, censorship and conscription are enforced by the armed forces."

 srp_total_emergency_regime: "Total Emergency Regime"
 srp_total_emergency_regime_desc: "The government has assumed near-total control of daily life. Civil institutions are suspended, dissent is suppressed, and the entire apparatus of the state is bent toward survival. Elections are postponed until further notice."

 srp_laissez_faire: "Laissez-Faire"
 srp_laissez_faire_desc: "The government refrains from heavy intervention in the economy. Low taxation and minimal regulation allow the private sector to operate efficiently. Political power flows easily, though inequality deepens and social stability is fragile."

 srp_keynesian_intervention: "Keynesian Intervention"
 srp_keynesian_intervention_desc: "The state uses targeted spending and fiscal stimulus to manage the economy. Infrastructure investment is favoured and the government acts as a stabilising force during downturns, without fully directing production."

 srp_social_democracy: "Social Democracy"
 srp_social_democracy_desc: "A broad welfare state, funded by progressive taxation, provides social stability and invests in education and research."

 srp_austerity_measures: "Austerity Measures"
 srp_austerity_measures_desc: "Emergency budget cuts slash civilian spending and redirect resources toward industry. Welfare programmes are curtailed, public services stripped back."

 srp_war_socialism: "War Socialism"
 srp_war_socialism_desc: "The state nationalises key industries and directs the full weight of the economy toward the war effort. Consumer goods nearly vanish."

 srp_professional_force: "Professional Force"
 srp_professional_force_desc: "The military is composed entirely of volunteers. Smaller in size, it compensates with intensive training and high unit cohesion. Organisation is excellent, but manpower numbers remain limited."

 srp_selective_service: "Selective Service"
 srp_selective_service_desc: "The state introduces a limited draft, expanding the manpower pool while retaining a professional core. Basic training is maintained and overall military cohesion drops only slightly."

 srp_national_service_requirement: "National Service Requirement"
 srp_national_service_requirement_desc: "Every eligible citizen serves a period in the armed forces, which grow substantially. Not everyone is happy about it."

 srp_universal_conscription: "Universal Conscription"
 srp_universal_conscription_desc: "Every available adult is called up. Training is compressed and organisation suffers, but the numbers are huge."

 srp_desperate_enlistment: "Desperate Enlistment"
 srp_desperate_enlistment_desc: "With losses mounting and options exhausted, the state lowers every recruitment threshold. The untrained, the unfit, and those previously exempted are pressed into service. Numbers are enormous. Quality is not."
 srp_nogov_every_hand_armed: "Every Hand Armed"
 srp_nogov_every_hand_armed_desc: "Nobody issues call-up papers any more. Anyone who can carry a rifle picks one up from whatever depot is still standing and walks to the nearest line."
 srp_nogov_salvage_economy: "Salvage Economy"
 srp_nogov_salvage_economy_desc: "The ministries are gone. What still runs is what the workers keep running, with parts stripped from whatever stopped."
 srp_nogov_no_exports: "No Exports"
 srp_nogov_no_exports_desc: "There is nobody left to sign a contract or collect a payment. Whatever the country still produces stays in the country."
 SRP_no_functioning_government: "No Functioning Government"
 SRP_no_functioning_government_desc: "The capital is lost and the cabinet with it. The country has not surrendered. There is simply nobody left with the authority to surrender, or to do anything else. Units fight on under whichever officer is closest."
 srp_nogov.1.t: "No One in Charge"
 srp_nogov.1.d: "The last government offices stopped answering this week. There is no cabinet, no ministry and no chain of command above the divisional level.\n\nThe army is still fighting. Nobody has ordered it to stop."
 srp_nogov.1.a: "Hold the line."
 srp_nogov.2.t: "A Government Again"
 srp_nogov.2.d: "Enough ground is back under our control for a provisional administration to form. The ministries are reopening in borrowed buildings, and the laws are back on paper."
 srp_nogov.2.a: "Get to work."


 IRS_passive_accumulation: "Passive Accumulation"
 IRS_passive_accumulation_desc: "The hive directs biomass toward building its infrastructure base. Beckons spread deeper, biomass pools accumulate reserves, and the nexus network expands. Military production is secondary for now."

 IRS_cultivation_focus: "Cultivation Focus"
 IRS_cultivation_focus_desc: "A balanced posture. Infrastructure growth continues at pace while military output is not sacrificed. The hive builds steadily across all fronts."

 IRS_surge_directive: "Surge Directive"
 IRS_surge_directive_desc: "The Iris redirects biomass flow toward military production. Beckons receive less, factories for parasite forms receive more. Infrastructure expansion slows as the swarm prepares for war."

 IRS_apex_consumption: "Apex Consumption"
 IRS_apex_consumption_desc: "All biomass goes into combat forms. Infrastructure is stripped and stockpiles are burned. The hive is spending what it built."


 IRS_dormant_emergence: "Dormant Emergence"
 IRS_dormant_emergence_desc: "The swarm moves slowly and with minimal aggression, conserving energy and maintaining a defensive posture. Organisation is reduced, but the hive holds its ground well."

 IRS_coordinated_brood: "Coordinated Brood"
 IRS_coordinated_brood_desc: "The hive operates with standard coherence. Broods act in concert and combat units maintain good formation discipline."

 IRS_hive_convergence: "Hive Convergence"
 IRS_hive_convergence_desc: "The Iris pushes greater unity across all active broods. The hive mind speaks more clearly."

 IRS_total_swarm_state: "Total Swarm State"
 IRS_total_swarm_state_desc: "The Iris puts all of its coordination into the military. Every form acts as one, and the strain on the hive is severe."


 IRS_measured_digestion: "Measured Digestion"
 IRS_measured_digestion_desc: "The hive draws from its territory carefully, sustaining long-term supply efficiency without over-consuming. A patient approach."

 IRS_aggressive_absorption: "Aggressive Absorption"
 IRS_aggressive_absorption_desc: "The Iris extracts more aggressively from controlled states, improving supply and lending an edge to its combat forms."

 IRS_total_assimilation: "Total Assimilation"
 IRS_total_assimilation_desc: "Everything under the hive's control is drawn into the biological economy. Supply lines run lean, combat forms hit harder, but the strain of rapid assimilation introduces internal friction."

 IRS_ecological_dominion: "Ecological Dominion"
 IRS_ecological_dominion_desc: "The Iris asserts full ecological authority over its territory. The ground is no longer being competed for."


 KNX_hidden_reserve: "Hidden Reserve"
 KNX_hidden_reserve_desc: "Knox keeps its capabilities concealed. No flag is raised, no territory claimed publicly. Political capital accumulates quietly while the rest of the world remains uncertain what it is dealing with."

 KNX_opportunist_footing: "Opportunist Footing"
 KNX_opportunist_footing_desc: "The Vagrant's forces are positioned to respond quickly to openings. Political capital is maintained at a solid level, and combat effectiveness begins to sharpen."

 KNX_active_expansion: "Active Expansion"
 KNX_active_expansion_desc: "Knox County commits to visible growth. Construction accelerates and combat forces press outward. Political discretion is spent in exchange for tangible territorial and military gains."

 KNX_open_campaign: "Open Campaign"
 KNX_open_campaign_desc: "Knox County stops hiding and fights in the open."


 KNX_minimal_strain: "Minimal Strain"
 KNX_minimal_strain_desc: "Only a core force of proven strains is maintained. Numbers are limited and cohesion is exceptional. A force this small only works because none of it is wasted."

 KNX_selective_cultivation: "Selective Cultivation"
 KNX_selective_cultivation_desc: "Additional strains are brought into service through careful selection."

 KNX_full_brood_expansion: "Full Brood Expansion"
 KNX_full_brood_expansion_desc: "Knox commits to a significant expansion of its parasite forces. A larger pool of strains enters active service."

 KNX_emergency_spawning: "Emergency Spawning"
 KNX_emergency_spawning_desc: "With reserves drawn low, Knox accelerates spawning beyond sustainable rates. Numbers surge dramatically at the cost of cohesion and internal stability. A gamble the Vagrant may not be able to undo."


 KNX_complete_isolation: "Complete Isolation"
 KNX_complete_isolation_desc: "No contact with outside powers. Knox shares nothing and receives nothing. Research suffers from the absence of external input, but the faction remains perfectly hidden."

 KNX_silent_observation: "Silent Observation"
 KNX_silent_observation_desc: "Knox observes the world without engaging it."

 KNX_selective_dialogue: "Selective Dialogue"
 KNX_selective_dialogue_desc: "Carefully chosen contacts are opened with specific outside parties. Political opportunities present themselves, and research access expands. Knox remains selective about who knows it exists."

 KNX_strategic_alignment: "Strategic Alignment"
 KNX_strategic_alignment_desc: "Knox commits to meaningful engagement with allied powers. The Vagrant has decided the world must know where it stands."

 TET_brood_husbandry: "Brood Husbandry"
 TET_brood_husbandry_desc: "The brood grows what it is told to grow, on ground already digested for it. Nothing here is decided locally."

 TET_bound_supply: "Bound Supply"
 TET_bound_supply_desc: "Supply arrives along the bond to the parent hive and nowhere else. The brood has no reason to reach a market and no way to be reached by one."

 TET_brood_spawning: "Brood Spawning"
 TET_brood_spawning_desc: "New forms are budded at a rate the parent lineage sets. Output is steady, slow, and never asked to be more than that."

 modifier_production_speed_beckon_cluster_factor: "Beckon Cluster Production Speed"
 modifier_production_speed_biomass_pool_factor: "Biomass Pool Production Speed"
 modifier_production_speed_nexus_hive_factor: "Nexus Hive Production Speed"



 SRP_threat_iris_arrival: "The Arrival"
 SRP_threat_knox_emergence: "Knox County"
 SRP_threat_armageddon: "Armageddon Declared"
 SRP_threat_armed_truce: "The Armed Truce"
 SRP_threat_canal_conceded: "The Canal Conceded"
