 RULE_SRP_INFESTATION_GROWTH: "Infestation Growth"
 RULE_SRP_INFESTATION_GROWTH_DESC: "How fast infestation deepens on parasite held and Beckon ground. This scales parasite growth only. Human containment and cleanup are never affected."
 RULE_SRP_INFESTATION_GROWTH_OFF_DESC: "Infestation never rises on its own. Existing infestation can still be cleared, but Beckons will not deepen it. The gentlest possible world."
 RULE_SRP_INFESTATION_GROWTH_SLOW_DESC: "Infestation grows at half the normal rate. Humanity has more room to hold the line."
 RULE_SRP_INFESTATION_GROWTH_NORMAL_DESC: "The intended rate. Beckons deepen infestation steadily and the map slips a little further every day."
 RULE_SRP_INFESTATION_GROWTH_FAST_DESC: "Infestation grows half again as fast. Containment becomes a losing race."

 RULE_SRP_STATE_HANDOVER: "State Handover"
 RULE_SRP_STATE_HANDOVER_DESC: "Whether fully overwhelmed human states are seized outright by the parasites, and how long the grace window lasts before the claim lands."
 RULE_SRP_STATE_HANDOVER_OFF_DESC: "No state is ever taken by infestation alone. A region can sit fully overwhelmed and suffer for it, but it stays in human hands until lost on the battlefield."
 RULE_SRP_STATE_HANDOVER_SLOW_DESC: "Overwhelmed states are seized, but only after a long grace window. There is time to fight back before the claim lands."
 RULE_SRP_STATE_HANDOVER_NORMAL_DESC: "The intended timing. A fully overwhelmed state has a short grace window, then it is claimed by the bordering parasite power."
 RULE_SRP_STATE_HANDOVER_FAST_DESC: "The grace window is brief. Once a state is overwhelmed it is lost almost at once."

 RULE_SRP_OCCUPATION_FLIP: "Occupied Ground"
 RULE_SRP_OCCUPATION_FLIP_DESC: "Whether ground the parasites occupy eventually becomes ground they own, and how deeply infested it has to be first. Territory absorbed this way never comes back through a peace settlement."
 RULE_SRP_OCCUPATION_FLIP_OFF_DESC: "Occupied territory stays on its owner's books no matter how long the parasites sit on it. Ground only changes hands through capitulation and the usual terms."
 RULE_SRP_OCCUPATION_FLIP_SLOW_DESC: "Occupied territory is absorbed, but only once it is very heavily infested. There is a long window to push the parasites back off it first."
 RULE_SRP_OCCUPATION_FLIP_NORMAL_DESC: "The intended setting. Ground the parasites hold is absorbed once it is halfway consumed, which takes a few weeks of unbroken occupation."
 RULE_SRP_OCCUPATION_FLIP_FAST_DESC: "Ground is absorbed while it is still only lightly infested. A breakthrough becomes permanent almost as soon as it happens."

 RULE_SRP_CRISIS_LAYER: "Crisis Layer"
 RULE_SRP_CRISIS_LAYER_DESC: "Proto-Supreme sites and the directed spore burst. Sites still appear through the Iris's focuses, so this changes their severity and availability, not how often they are seeded."
 RULE_SRP_CRISIS_LAYER_OFF_DESC: "No Proto-Supreme sites form and the directed spore burst is unavailable. The slow infestation grind remains, but its sharpest crises do not."
 RULE_SRP_CRISIS_LAYER_NORMAL_DESC: "The intended setting. Proto-Supreme sites and spore bursts behave as designed."
 RULE_SRP_CRISIS_LAYER_INTENSE_DESC: "Spore bursts hit harder, each Proto-Supreme site darkens the sky twice as fast, and the bulbs are harder to destroy."

 RULE_SRP_CONTAINMENT_EFFICIENCY: "Containment Efficiency"
 RULE_SRP_CONTAINMENT_EFFICIENCY_DESC: "How much ground humanity wins back per day of cleanup. Scales the suppression doctrine decay rates and the Containment Node bonus. Infestation Growth never touches decay, so this is the other half of that dial."
 RULE_SRP_CONTAINMENT_EFFICIENCY_WEAK_DESC: "Cleanup runs at half rate. Ground that has been infested once tends to stay infested, and the doctrines buy time rather than territory."
 RULE_SRP_CONTAINMENT_EFFICIENCY_NORMAL_DESC: "The intended rate. A committed containment effort can hold a region and slowly push the infestation back out of it."
 RULE_SRP_CONTAINMENT_EFFICIENCY_STRONG_DESC: "Cleanup runs half again as fast. Quarantine actually works, and the war becomes a question of whether you can reach the ground in time."

 RULE_SRP_INFESTATION_SPREAD: "Border Spread"
 RULE_SRP_INFESTATION_SPREAD_DESC: "How hard infestation bleeds out of parasite held ground into the states next to it. Separate from Infestation Growth, which only ever governed ground the parasites already hold."
 RULE_SRP_INFESTATION_SPREAD_OFF_DESC: "Infestation does not cross borders at all. It appears only where a Beckon is planted or a directed burst puts it, which makes the front line the only thing that matters."
 RULE_SRP_INFESTATION_SPREAD_LOW_DESC: "Borders bleed at half rate. A single infested neighbour is no real threat, and it takes a deep salient to lose ground this way."
 RULE_SRP_INFESTATION_SPREAD_MEDIUM_DESC: "The intended rate. One infested neighbour can be held with routine cleanup. Two or more, and the state starts slipping."
 RULE_SRP_INFESTATION_SPREAD_HIGH_DESC: "Borders bleed half again as fast. Anything bordering the tide is already losing, and pockets rot from the inside before anyone reaches them."

 RULE_SRP_PARASITE_ATTRITION: "Attrition"
 RULE_SRP_PARASITE_ATTRITION_DESC: "How much manpower infested, consumed and irradiated ground costs per day. This is what makes losing territory hurt instead of just recolouring the map."
 RULE_SRP_PARASITE_ATTRITION_LIGHT_DESC: "Half the daily bleed. Losing a region is a strategic problem rather than a demographic one, and reserves last."
 RULE_SRP_PARASITE_ATTRITION_NORMAL_DESC: "The intended cost. Ground lost keeps taking people long after the fighting there has stopped."
 RULE_SRP_PARASITE_ATTRITION_SEVERE_DESC: "Half again as much. Every region that falls takes a generation with it, and manpower becomes the war's real limit."

 RULE_SRP_PARASITE_AGGRESSION: "Parasite Aggression"
 RULE_SRP_PARASITE_AGGRESSION_DESC: "How hard the parasite AI presses a war it is already fighting, and how much its appetite for divisions grows with each nation it takes. Nothing is added or removed by this, only the weight behind the push."
 RULE_SRP_PARASITE_AGGRESSION_PASSIVE_DESC: "The tide advances, but without urgency. Fronts stall, offensives peter out, and a defending nation gets time to reorganise between pushes."
 RULE_SRP_PARASITE_AGGRESSION_NORMAL_DESC: "The intended pressure. Every war a parasite enters becomes a war of conquest, and each victory makes the next army larger."
 RULE_SRP_PARASITE_AGGRESSION_RELENTLESS_DESC: "Twice the drive and twice the hunger. The tide does not pause to consolidate, and a nation that falls anywhere feeds the push everywhere."

 RULE_SRP_AI_BEHAVIOUR: "AI Behaviour"
 RULE_SRP_AI_BEHAVIOUR_DESC: "Whether AI nations fight their wars the way the decade is written, or the way that wins them. This covers how wars are fought, not which paths a nation takes. That is still the historical focus setting."
 RULE_SRP_AI_BEHAVIOUR_STORY_DESC: "The intended behaviour. Some wars are held back so the decade plays out as written. The first Atlantic war ends in a draw, Washington besieges Knox County instead of storming it, and the Iris takes the south and China before it turns on Europe."
 RULE_SRP_AI_BEHAVIOUR_PLAY_TO_WIN_DESC: "No nation holds back for the story. A side that can finish a war will try to, the Iris goes wherever the line is thinnest, and the decade can come apart years ahead of schedule."

 RULE_SRP_PUBLIC_PANIC: "Public Panic"
 RULE_SRP_PUBLIC_PANIC_DESC: "How hard each shock hits the public. This scales how fast panic rises, never how fast it falls, and never the floor that world tension and lost ground hold it at."
 RULE_SRP_PUBLIC_PANIC_LOW_DESC: "Half the rise. People take the decade more calmly than they have any right to, and governments get longer to act before panic starts setting their agenda."
 RULE_SRP_PUBLIC_PANIC_NORMAL_DESC: "The intended pace. Panic climbs with the war and the ground lost to it, and falls only when a government works to bring it down."
 RULE_SRP_PUBLIC_PANIC_HIGH_DESC: "Half again as much rise. Every headline lands harder, and panic takes over national politics years sooner."

 RULE_SRP_EVOLUTION_ECONOMY: "Evolution Economy"
 RULE_SRP_EVOLUTION_ECONOMY_DESC: "How quickly the Iris earns the evolution points it spends on new genomes. This scales its renewable income only. One time focus rewards are a fixed budget and are never affected."
 RULE_SRP_EVOLUTION_ECONOMY_LEAN_DESC: "Half income. The Iris climbs its genome ladder slowly and has to choose what it becomes instead of taking everything."
 RULE_SRP_EVOLUTION_ECONOMY_NORMAL_DESC: "The intended pace. New forms arrive steadily through the decade, roughly in step with what the front demands."
 RULE_SRP_EVOLUTION_ECONOMY_ABUNDANT_DESC: "Half again as much income. The Iris fields organisms humanity has no answer to, years before humanity expected to need one."

 RULE_SRP_SCORCHED_EARTH: "Scorched Earth"
 RULE_SRP_SCORCHED_EARTH_DESC: "How willing the AI is to poison its own territory to stop an infestation. This weights AI decisions only. Every suppression doctrine stays available to you at every setting."
 RULE_SRP_SCORCHED_EARTH_NEVER_DESC: "No AI nation will irradiate its own ground, whatever the infestation reaches. Containment stays conventional, and it stays slower."
 RULE_SRP_SCORCHED_EARTH_DESPERATE_DESC: "The intended behaviour. Governments hold the line with conventional means until a region is far gone, then reach for whatever is left."
 RULE_SRP_SCORCHED_EARTH_FREELY_DESC: "Chemicals go down at the first sign of spread and radiological containment follows soon after. The infestation is held back, and the map is ruined either way."

 RULE_SRP_LETHAL_EVENTS: "Telotic Events"
 RULE_SRP_LETHAL_EVENTS_DESC: "Whether story critical figures can die. Enabling this opens outcomes that reshape the endgame and make it far harder. The most punishing way to play."
 RULE_SRP_LETHAL_EVENTS_DISABLED_DESC: "Story critical figures cannot be killed by events."
 RULE_SRP_LETHAL_EVENTS_ENABLED_DESC: "Story critical figures can be lost. What follows is harder, and there is no taking it back."

 RULE_SRP_NUCLEAR_MECHANICS: "Nuclear Mechanics"
 RULE_SRP_NUCLEAR_MECHANICS_DESC: "How warheads are delivered. Building them never changes: factories assemble warhead components and the reserve is drawn from them every month. What moves is what happens to a finished warhead."
 RULE_SRP_NUCLEAR_MECHANICS_ORBITAL_DESC: "The intended behaviour. Warheads are held in a strategic reserve, mounted on military satellites, and dropped from orbit onto anything you can see. Interception is possible and the whole programme is visible to everyone."
 RULE_SRP_NUCLEAR_MECHANICS_SIMPLE_DESC: "No satellites and no orbital programme. Warheads go straight to the national stockpile and are delivered the ordinary way, by strategic bomber, by missile from a rocket site, or from a submarine. Conventional, cheaper, and far less interesting to watch."
 RULE_SRP_NUCLEAR_MECHANICS_LORE_DESC: "Warheads accumulate and there is no way to spend them yourself. Nothing you own can deliver one, and the stockpile only moves when the story reaches for it. If the count is empty when that moment comes, it goes badly."

 RULE_SRP_STATE_ABSORB: "State Absorption"
 RULE_SRP_STATE_DECISION: "Decision"
 RULE_SRP_STATE_DECISION_DESC: "States get absorbed manually through a decision. Fast, costs power, full control over what is eaten and when."
 RULE_SRP_STATE_INSTANT: "Instant"
 RULE_SRP_STATE_INSTANT_DESC: "Fully infested parasite ground is absorbed on the next daily tick, free. The map hardens almost as soon as it saturates."
 RULE_SRP_STATE_DAYS_30: "30 Days"
 RULE_SRP_STATE_DAYS_30_DESC: "Fully infested parasite ground is absorbed on its own after a month of unbroken control, free. Losing control or letting infestation slip resets the wait."
 RULE_SRP_STATE_DAYS_60: "60 Days"
 RULE_SRP_STATE_DAYS_60_DESC: "Fully infested parasite ground is absorbed on its own after two months of unbroken control, free. The intended pace for hands-off assimilation."
 RULE_SRP_STATE_DAYS_90: "90 Days"
 RULE_SRP_STATE_DAYS_90_DESC: "Fully infested parasite ground is absorbed on its own after three months of unbroken control, free. A long window to push the parasites back off it first."
 RULE_SRP_STATE_DAYS_180: "6 Months"
 RULE_SRP_STATE_DAYS_180_DESC: "Fully infested parasite ground is absorbed on its own after six months of unbroken control, free. Barely faster than doing nothing."

 EFH_USA_escalation: "EF-US Escalation"
 EFH_USA_escalation_desc: "The temperature of the rivalry between the European Federation and the United States. Cooperation frees both powers to fight the parasites. Confrontation bleeds them both, and at the brink it turns to open war."

 SRP_escalation_cooperation_side: "Cooperation"
 SRP_escalation_confrontation_side: "Confrontation"

 SRP_escalation_neutral_range: "Wary Coexistence"
 SRP_escalation_detente_range: "Detente"
 SRP_escalation_entente_range: "Entente"
 SRP_escalation_rivalry_range: "Renewed Rivalry"
 SRP_escalation_coldwar_range: "Cold War Footing"
 SRP_escalation_brink_range: "The Brink"

 SRP_escalation_detente_idea: "Detente"
 SRP_escalation_detente_idea_desc: "Open channels with Washington keep the rivalry quiet. Resources that would feed a standoff are spent on the real war instead."
 SRP_escalation_entente_idea: "Entente"
 SRP_escalation_entente_idea_desc: "Working cooperation with the United States holds. Both governments concentrate on the parasite emergency rather than on each other. While the parasites are active and the rivalry stays this cool, the two powers may sit in the same alliance."
 SRP_escalation_standoff_idea: "Wary Coexistence"
 SRP_escalation_standoff_idea_desc: "No crisis and no agreement. Both governments budget for the other, maintain the postings, and read each other's exercises closely. The arrangement costs a little and settles nothing."
 SRP_escalation_rivalry_idea: "Renewed Rivalry"
 SRP_escalation_rivalry_idea_desc: "The old hostility has resurfaced. Posturing on both sides draws attention away from the containment effort."
 SRP_escalation_coldwar_idea: "Cold War Footing"
 SRP_escalation_coldwar_idea_desc: "Proxy pressure, embargo and counter-intelligence consume industry and patience. The standoff is expensive long before it turns to shooting."
 SRP_escalation_brink_idea: "On the Brink"
 SRP_escalation_brink_idea_desc: "One incident away from open war. Mobilisation, fear and propaganda run hot, and the parasite front pays the price."

 SRP_escalation_category: "EF-US Standoff"
 SRP_escalation_category_desc: "Current EF-US Escalation: [?EFH_USA_escalation|0] / 100. Below 30 the powers cooperate and free resources for the parasite war. Below 16, with the parasites already out, they may share a faction. Above 80 the next Canadian summit ends in open, nuclear war."

 SRP_diplomatic_outreach: "Quiet Diplomacy"
 SRP_diplomatic_outreach_desc: "Open a back channel and lower the temperature. Spends political capital to ease the standoff a step toward cooperation."
 SRP_proxy_theater: "Fund a Proxy Theatre"
 SRP_proxy_theater_desc: "Arm and bankroll a distant proxy against the rival. Sharpens the army and stiffens resolve, and nudges the rivalry hotter."
 SRP_economic_pressure: "Economic Pressure Campaign"
 SRP_economic_pressure_desc: "Squeeze the rival's markets and supply lines. Inflicts a lasting economic penalty on them and drives the standoff sharply toward confrontation."

 srp_flashpoint.1.t: "Intercept Over the North Atlantic"
 srp_flashpoint.1.d: "An American interceptor pair closed to within thirty metres of a Federation maritime patrol aircraft over the North Atlantic and held position there for eleven minutes. The patrol crew's recording is clear, time-stamped, and already on the desk of every relevant ministry. Washington has said nothing."
 srp_flashpoint.1.a: "Protest through the attache channel."
 srp_flashpoint.1.b: "Release the recording to the press."
 srp_flashpoint.1.c: "Escorts hold course next time."

 srp_flashpoint.2.t: "Freighters Held in American Ports"
 srp_flashpoint.2.d: "United States customs authorities have impounded three Federation-flagged freighters over sanctions paperwork that was, by every prior reading, in order. The cargo is industrial and the legal case is thin. The signal is not subtle."
 srp_flashpoint.2.a: "Negotiate the release quietly."
 srp_flashpoint.2.b: "Begin reciprocal inspections of American shipping."

 srp_flashpoint.3.t: "Contact in the Exercise Area"
 srp_flashpoint.3.d: "A Federation submarine has been tracked inside the boundary of an active United States Navy exercise area for six hours. It is not hiding particularly well, which the analysts read as the point. The carrier group commander is requesting instructions."
 srp_flashpoint.3.a: "Shadow it and log everything."
 srp_flashpoint.3.b: "Force it to the surface."
 srp_flashpoint.3.c: "Lodge a public protest."

 srp_flashpoint.4.t: "Expulsions from Federation Capitals"
 srp_flashpoint.4.d: "The European Federation has expelled four American military attaches over what its interior ministry calls collection activity incompatible with diplomatic status. The four are already in the air. State and Defense disagree, as usual, about whether the charge was accurate. It was."
 srp_flashpoint.4.a: "Reciprocate in kind."
 srp_flashpoint.4.b: "Let it pass."
 srp_flashpoint.4.c: "Expel twice as many."

 SRP_goal_ep_anti_parasite_front: "Open the Anti-Parasite Front"
 SRP_goal_ep_anti_parasite_front_desc: "The European Pact takes the field against the Hive. Federal forces, and those of its partners, commit to the war the rest of the world is still pretending to ignore."
 SRP_goal_ep_war_industry: "Continental War Industry"
 SRP_goal_ep_war_industry_desc: "Convert the Federation's factories to a war footing."
 SRP_goal_ep_outlast_america: "Outlast the United States"
 SRP_goal_ep_outlast_america_desc: "The old rival will exhaust itself on its own ambitions. The Pact need only still be standing when it does."

 SRP_goal_wa_hemisphere: "Reassert the Hemisphere"
 SRP_goal_wa_hemisphere_desc: "From the Arctic to the Horn, the Americas answer to Washington. No European foothold will be tolerated in the New World."
 SRP_goal_wa_arsenal: "Arsenal of the Hemisphere"
 SRP_goal_wa_arsenal_desc: "American industry, mobilized. Enough steel and shells to arm the Western Alliance twice over."
 SRP_goal_wa_break_efh: "Break the European Federation"
 SRP_goal_wa_break_efh_desc: "Forget the parasites. The Federation is what stands in the way. Break it and the century is American again."

 SRP_goal_ph_proliferate: "Proliferate"
 SRP_goal_ph_proliferate_desc: "The presence becomes endemic. What was anomaly is now ecology."
 SRP_goal_ph_assimilate: "Assimilate"
 SRP_goal_ph_assimilate_desc: "The continents become feeding ground."
 SRP_goal_ph_dominion: "Global Dominion"
 SRP_goal_ph_dominion_desc: "The signal reaches every shore. Unclaimed ground no longer exists."
 SRP_manifest_european_pact: "In Varietate Concordia"
 SRP_manifest_western_alliance: "Pax Americana"
 SRP_manifest_parasite_hive: "Harbour The End"
 SRP_manifest_european_pact_desc: "United in diversity. The Federation holds a continent of old rivals together against the parasites."
 SRP_manifest_western_alliance_desc: "The peace of American power. The hemisphere, and the trade that runs through it, kept in order from Washington."
 SRP_manifest_parasite_hive_desc: "Every shore, every field, every body. The Iris digests."
 SRP_goal_ep_exploit_parasites: "Exploit the Parasites"
 SRP_goal_ep_exploit_parasites_desc: "Contained Beckons can be harnessed to feed the Federation's industry, the same way they fed the enemy's."
 SRP_consortium: "Research Consortium"
 SRP_consortium_desc: "Coordinate anti-parasite research with allied nations."

 SRP_establish_consortium: "Establish Anti-Parasite Consortium"
 SRP_establish_consortium_desc: "Formalise joint research between the nations fighting the parasites. The Consortium pools what its members learn and speeds up every breakthrough."

 SRP_join_consortium: "Join the Anti-Parasite Consortium"
 SRP_join_consortium_desc: "Apply to join the existing research framework. Consortium members gain shared research progress when any member achieves a major breakthrough."

 SRP_leave_consortium: "Withdraw from Consortium"
 SRP_leave_consortium_desc: "End participation in the joint research programme. All shared research bonuses are lost."

 SRP_consortium_tier_1: "Research Consortium (Small)"
 SRP_consortium_tier_1_desc: "A small coalition of nations sharing anti-parasite research."

 SRP_consortium_tier_2: "Research Consortium (Established)"
 SRP_consortium_tier_2_desc: "An established multi-nation research framework."

 SRP_consortium_tier_3: "Research Consortium (Full Coalition)"
 SRP_consortium_tier_3_desc: "A broad coalition of nations pooling the full scope of their anti-parasite research."

 srp_consortium.1.t: "Anti-Parasite Research Consortium Established"
 srp_consortium.1.d: "[ROOT.GetName] has established the Anti-Parasite Research Consortium, a framework for sharing scientific data on parasite weaknesses. Member nations gain access to shared research breakthroughs and joint combat intelligence."
 srp_consortium.1.a: "We will monitor this development."

 srp_consortium.3.t: "Expelled from the Consortium"
 srp_consortium.3.d: "By declaring war on a fellow member state, we have violated the core principle of the Anti-Parasite Research Consortium. Our membership has been revoked, and access to shared research data is cut off."
 srp_consortium.3.a: "A costly mistake."

 srp_consortium.10.t: "Consortium Breakthrough: STBN Tank Munitions"
 srp_consortium.10.d: "A Consortium member has completed the STBN tank shell project. Key findings on sulfur hexafluoride warhead integration have been shared with all member states, allowing our researchers to apply the results to their own armour programmes."
 srp_consortium.10.a: "Our engineers will study these findings."

 srp_consortium.11.t: "Consortium Breakthrough: STBN Naval Compatibility"
 srp_consortium.11.d: "A Consortium member has achieved STBN shell compatibility for naval guns. Fleet integration data has been distributed to all members, providing a head start for our own naval research."
 srp_consortium.11.a: "Forward the data to the admiralty."

 srp_consortium.12.t: "Consortium Breakthrough: Fusion Drive Technology"
 srp_consortium.12.d: "A Consortium member has successfully developed a viable carrier fusion drive. The magnetic confinement specifications have been shared, giving our naval engineers a significant research advantage."
 srp_consortium.12.a: "Remarkable. Our engineers will begin at once."

 srp_consortium.13.t: "Consortium Breakthrough: SF6 Jet Engine"
 srp_consortium.13.d: "A Consortium member has cracked SF6 combustion cycle engine design. Flight test data and thrust specifications have been distributed, accelerating our own aerospace research."
 srp_consortium.13.a: "Our pilots will benefit from this."

 srp_consortium.14.t: "Consortium Breakthrough: Parasite Weak-Point Analysis"
 srp_consortium.14.d: "A Consortium member has completed the parasite weak-point targeting algorithm. Combat data on parasite physiology and where the membrane gives has been shared across all members."
 srp_consortium.14.a: "Distribute the findings to our armoured divisions."

 srp_consortium.15.t: "Consortium Breakthrough: Onboard Fuel Synthesis"
 srp_consortium.15.d: "A Consortium member has developed carrier-based electrolytic fuel synthesis. The design specifications have been shared, giving our naval engineers a foundation to build from."
 srp_consortium.15.a: "Our shipyards will review the data."

 srp_consortium.16.t: "Consortium Breakthrough: Tactical Nuclear Artillery"
 srp_consortium.16.d: "A Consortium member has completed development of tactical nuclear gun batteries. Yield calibration data and warhead integration specs have been shared, accelerating our own nuclear artillery research."
 srp_consortium.16.a: "A grim but necessary development."


 LD_containment_failure: "Containment Failure"
 LD_containment_failure_desc: "Contested states: §R[?LD_contested_states|0]§!\nStanding: [GetLDContainmentTier]\n\nTwo or more states are past the threshold at which the infestation seeds its own neighbours. The ministry has ninety days to bring that count back under two. If it does not, the standing falls another step, and the count starts again from where it is now."

 LD_containment_tier_0: "§GContained§!"
 LD_containment_tier_1: "§YZones Surrendered§!"
 LD_containment_tier_2: "§YThe Cordon Is A Line On A Map§!"
 LD_containment_tier_3: "§RContainment In Name Only§!"

 LD_containment_strain_1: "Zones Surrendered"
 LD_containment_strain_1_desc: "Ground has been given up where the public can count it. The word used in the briefing is consolidation."

 LD_containment_strain_2: "The Cordon Is A Line On A Map"
 LD_containment_strain_2_desc: "The perimeter is drawn where the ministry can hold it rather than where the infestation stops. Everyone inside the room knows the difference."

 LD_containment_strain_3: "Containment In Name Only"
 LD_containment_strain_3_desc: "Containment remains the official posture. There is no longer any operation that corresponds to it."

 LD_PARASITE_DIPLO_BLOCKED_TT: "Parasite entities do not engage in agreements with human nations."
 LD_PARASITE_FACTION_BLOCKED_TT: "Parasite entities cannot participate in human military alliances."
 LD_EFH_USA_FACTION_BLOCKED_TT: "Deep strategic rivalries prevent these blocs from entering the same alliance."
 LD_EFH_USA_GUARANTEE_BLOCKED_TT: "The European Federation and the United States do not extend security guarantees to each other."
 LD_parasite_isolation: "Parasite Isolation"
 LD_efh_usa_friction: "Ongoing kaltkrieg"
 LD_rsf_hostile_to_efh: "Geopolitical Tension"
 LD_rsf_hostile_to_chn: "Eastern Rivalry"
 LD_knx_efh_channel: "Back Channel"
 LD_knx_efh_partnership: "Knox Accord"
 SRP_testing: "Testing"
 SRP_testing_desc: "Out-of-character switchboard. Turns unfinished features on and off, and provides shortcuts for reaching a testable state. Not part of the game."
 SRP_testing_toggle_national_policy_on: "Enable National Policy"
 SRP_testing_toggle_national_policy_on_desc: "Shows the National Policy tab, where Crisis Authority and Fiscal Policy are set. Off by default while the design is being decided. Your country keeps whichever policy ideas it started with either way."
 SRP_testing_toggle_national_policy_off: "Disable National Policy"
 SRP_testing_toggle_national_policy_off_desc: "Hides the National Policy tab again. Policy ideas already in effect stay in effect. You just cannot change them while this is off."
 SRP_testing_grant_evolution_points: "Grant 100 Evolution Points"
 SRP_testing_grant_evolution_points_desc: "Adds 100 to the hive's evolution point total. The economy, trade and mobilisation postures unlock at 50, 150 and 300, so three clicks reach the top of every ladder."
 SRP_testing_clear_evolution_points: "Reset Evolution Points"
 SRP_testing_clear_evolution_points_desc: "Sets the hive's evolution point total back to zero, relocking every gated posture."

 generic_sentinel_arms: "Sentinel Arms Co."
 generic_sentinel_arms_desc: "A mid-tier defence contractor specialising in infantry weapons and support equipment. Sentinel Arms has no cutting-edge research to sell, but its platforms are reliable, affordable and always in stock."

 generic_sentinel_initial: "Standard Issue Programme"
 generic_sentinel_initial_desc: "Sentinel Arms enforces baseline quality standards across all production runs. Weapons leaving the factory are slightly more effective than the baseline average."

 generic_sentinel_root: "Component Standardisation"
 generic_sentinel_root_desc: "Sentinel Arms consolidates its parts suppliers into a single approved list. Weapons become easier to repair in the field and cheaper to produce at scale."

 generic_sentinel_t2a: "Assault Configuration"
 generic_sentinel_t2a_desc: "Sentinel Arms optimises its weapons platform for offensive operations. Lighter weight, faster rate of fire, and improved ergonomics increase lethality in contact."

 generic_sentinel_t2b: "Defensive Loadout"
 generic_sentinel_t2b_desc: "Reinforced stocks, improved barrel profiles, and ruggedised receivers. Sentinel Arms builds weapons for soldiers who need to hold a position and keep holding it."

 generic_sentinel_t3: "Combat-Proven Doctrine"
 generic_sentinel_t3_desc: "Sentinel Arms incorporates feedback from active combat zones into its production line. The result is a weapons family that performs consistently under the worst possible conditions."

 generic_rampart_heavy: "Rampart Heavy Industries"
 generic_rampart_heavy_desc: "An armoured vehicle manufacturer that builds for durability over innovation. Rampart's tanks prioritise long service life over impressive specifications, staying useful after newer platforms have been stripped for parts."

 generic_rampart_initial: "Armour Fundamentals Programme"
 generic_rampart_initial_desc: "Rampart Heavy Industries builds every vehicle so the crew can keep it running without a depot."

 generic_rampart_root: "Integrated Drive Train"
 generic_rampart_root_desc: "Rampart standardises its powertrain components across all vehicle variants. Vehicles become more reliable in the field and incrementally cheaper to produce."

 generic_rampart_t2a: "Hardened Armour Package"
 generic_rampart_t2a_desc: "Rampart applies additional composite layers to its standard hull configuration. Vehicles survive heavier contacts before requiring withdrawal for repair."

 generic_rampart_t2b: "Fire Control Systems"
 generic_rampart_t2b_desc: "Rampart integrates third-party targeting computers into its production line. Gunnery accuracy and armour penetration at combat range improve substantially."

 generic_rampart_t3: "Battlefield Supremacy"
 generic_rampart_t3_desc: "Rampart combines its protection and firepower research into a unified platform upgrade. The resulting vehicle outperforms every earlier production run."

 generic_meridian_aerospace: "Meridian Aerospace"
 generic_meridian_aerospace_desc: "A mid-sized aerospace manufacturer with contracts in several countries. Meridian Aerospace builds practical jets that work, can be maintained outside of a factory environment, and keep the confidence of their pilots."

 generic_meridian_initial: "Aerodynamic Baseline"
 generic_meridian_initial_desc: "Meridian Aerospace applies consistent aerodynamic standards to every airframe it produces. Pilots notice a modest improvement in handling across the board."

 generic_meridian_root: "Aerodynamic Refinement"
 generic_meridian_root_desc: "Meridian Aerospace refines its manufacturing tolerances on control surfaces and fuselage profiles. Aircraft become more responsive and cheaper per unit to produce."

 generic_meridian_t2a: "Air Superiority Package"
 generic_meridian_t2a_desc: "Meridian Aerospace optimises its airframe for high-altitude manoeuvring. Improved control authority and structural rigidity give pilots an edge in turning engagements."

 generic_meridian_t2b: "Extended Operations"
 generic_meridian_t2b_desc: "Improved fuel systems and more efficient engine tuning. Meridian Aerospace aircraft can patrol further from their bases and sustain longer operational cycles."

 generic_meridian_t3: "Theatre Dominance"
 generic_meridian_t3_desc: "Meridian Aerospace incorporates lessons from deployed operations into a comprehensive airframe upgrade. The result is a faster, more agile aircraft with improved survivability in contested airspace."

 generic_trident_naval: "Trident Naval Group"
 generic_trident_naval_desc: "A naval shipbuilder with experience in destroyer escorts, submarine design, and carrier modifications. Trident Naval Group builds reliable hulls for clients who cannot afford to wait for cutting-edge vessels."

 generic_trident_initial: "Hull Integrity Standards"
 generic_trident_initial_desc: "Trident Naval Group applies rigorous hull testing to all vessels before delivery. Ships are more reliable and require less emergency maintenance at sea."

 generic_trident_root: "Hull Reinforcement Programme"
 generic_trident_root_desc: "Trident Naval Group redesigns its core hull sections with reinforced framing. Ships become harder to sink and incrementally cheaper to commission."

 generic_trident_t2a: "Anti-Submarine Suite"
 generic_trident_t2a_desc: "Trident Naval Group installs improved sonar arrays and active detection systems across its destroyer and escort variants. Hunting submarines and defending convoys become substantially more effective."

 generic_trident_t2b: "Fleet Endurance"
 generic_trident_t2b_desc: "Extended fuel storage, improved propulsion efficiency, and better damage control systems. Trident Naval Group builds ships that can stay at sea longer and absorb more punishment before going down."

 generic_trident_t3: "Blue-Water Capability"
 generic_trident_t3_desc: "Trident Naval Group consolidates its endurance and survivability research into a unified hull upgrade programme. The resulting vessels are capable of sustained deep-ocean operations against any threat."

 generic_ironwall_munitions: "Ironwall Munitions"
 generic_ironwall_munitions_desc: "An artillery and ordnance manufacturer serving states that need reliable indirect fire capability without the cost of a premium contractor. Ironwall Munitions builds shells, howitzers, and rocket systems that do what they are supposed to do, every time."

 generic_ironwall_initial: "Propellant Quality Control"
 generic_ironwall_initial_desc: "Ironwall Munitions enforces strict propellant and casing standards across its production lines. Every shell that leaves the factory performs to specification."

 generic_ironwall_root: "Reliable Platforms"
 generic_ironwall_root_desc: "Ironwall Munitions standardises its artillery chassis and carriage components. Systems become easier to maintain in the field and cheaper to produce at volume."

 generic_ironwall_t2a: "Extended Range"
 generic_ironwall_t2a_desc: "Ironwall Munitions improves barrel profiles and introduces a line of extended-range propellant charges. Artillery platforms reach further and penetrate hardened targets more effectively."

 generic_ironwall_t2b: "Rapid Production"
 generic_ironwall_t2b_desc: "Ironwall Munitions streamlines its manufacturing process and reduces component lead times. Artillery systems reach the front faster and in larger numbers."

 generic_ironwall_t3: "Saturation Fire"
 generic_ironwall_t3_desc: "Ironwall Munitions combines its range and production improvements into a unified fire support doctrine. Artillery concentrations get larger and last longer."

