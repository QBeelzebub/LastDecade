 SRP_threat_newyork_lost: "New York Lost"
 SRP_threat_beijing_lost: "Beijing Lost"

 srp_panic_tt_any: "Public Panic: [?ROOT.public_panic] / 1000"
 srp_panic_tt_100: "Public Panic: [?ROOT.public_panic] / 1000 (requires 100+)"
 srp_panic_tt_150: "Public Panic: [?ROOT.public_panic] / 1000 (requires 150+)"
 srp_panic_tt_200: "Public Panic: [?ROOT.public_panic] / 1000 (requires 200+)"
 srp_panic_tt_300: "Public Panic: [?ROOT.public_panic] / 1000 (requires 300+)"
 srp_panic_tt_800: "Public Panic: [?ROOT.public_panic] / 1000 (requires 800+)"
 srp_panic_tt_below_900: "Public Panic: [?ROOT.public_panic] / 1000 (must be below 900)"

 public_panic_modifier: "Public Panic"
 public_panic_modifier_desc: "A measure of how the civilian population is responding to the parasite crisis. Elevated panic reduces stability, political power generation, and war support as the scale of the threat becomes harder to suppress."

 srp_public_confidence: "Public Confidence"
 srp_public_confidence_desc: "Current panic level: [?ROOT.public_panic] / 1000.\n\nElevated public panic reduces stability, political power generation, and war support. Infestation of major population centres will drive panic higher. Use the decisions below to manage it."

 srp_emergency_broadcast: "Emergency Public Address"
 srp_emergency_broadcast_desc: "Government channels issue guidance and reassurance directly to the population. Reduces panic by 80."

 srp_civilian_resilience: "Civilian Resilience Programme"
 srp_civilian_resilience_desc: "A structured programme to establish community emergency networks, distribute response protocols, and train civilian response teams. More resource-intensive than a public address, but the effect is more durable. Reduces panic by 120."

 srp_impose_information_control: "Emergency Information Controls"
 srp_impose_information_control_desc: "Suppress unverified parasite sightings, restrict civilian communications in contested areas, and route all crisis reporting through official channels. People notice, and trust in official accounts drops. Reduces panic by 200. Costs 3% stability. Requires Emergency Legislation or higher."

 srp_military_readiness_display: "Armed Forces Readiness Exercise"
 srp_military_readiness_display_desc: "Armour on the streets and aircraft over the major cities, to show the government is still in control. Reduces panic by 60."

 srp_civil_defense_act: "Emergency Civil Defence Legislation"
 srp_civil_defense_act_desc: "Shelters are designated, response chains are written down, and part of the civilian sector is reorganised toward defence production. Reduces panic by 150. Requires baseline stability. Grants 90 days of improved factory efficiency."

 srp_civil_defense_bonus: "Civil Defence Mobilisation"
 srp_civil_defense_bonus_desc: "Emergency civil defence legislation has reorganised part of the civilian sector toward defence production and shelter logistics. The structural efficiency improvements persist for the duration of the programme."

 EFH_federal_solidarity_protocol: "Federal Solidarity Declaration"
 EFH_federal_solidarity_protocol_desc: "Amsterdam issues one statement through every member state's channels at once, affirming that the federal response is in control. Reduces panic by 180."

 EFH_emergency_authority_decree: "Federal Emergency Authority Decree"
 EFH_emergency_authority_decree_desc: "The Federal Council takes emergency override powers over member-state crisis communications, civil movement and resource allocation. Reduces panic by 250. Imposes emergency powers for 90 days: reduced stability and political power generation."

 EFH_emergency_powers_active: "Emergency Federal Authority"
 EFH_emergency_powers_active_desc: "The Federal Emergency Authority Decree is in effect. The suspension of normal governance procedures and the concentration of power in Amsterdam are producing friction with member state governments, reflected in reduced stability and political throughput."

 EFH_continental_threat_briefing: "Issue Continental Threat Briefing"
 EFH_continental_threat_briefing_desc: "The monitoring network compiles its case data into a classified briefing for the response services and the member state governments. The material feeds the laboratories and the intelligence directorates for a time. Requires the parasite threat assessment to have been completed."

 EFH_parasite_containment_sweep: "Coordinated Containment Sweep"
 EFH_parasite_containment_sweep_desc: "The Federal Emergency Mandate runs a coordinated sweep across the affected member states using the standing response apparatus. People read competence as control. Reduces panic by 160. Requires the Federal Emergency Mandate."

 EFH_joint_command_readiness_exercise: "Run Joint Readiness Exercise"
 EFH_joint_command_readiness_exercise_desc: "The Joint Anti-Parasite Command rotates formations from across the member states through a shared exercise. Grants army experience and a period of heightened readiness against the parasites. Requires the Joint Anti-Parasite Command."

 EFH_federalize_parasite_response: "Federalise the Parasite Response"
 EFH_federalize_parasite_response_desc: "Amsterdam merges assessment, monitoring, emergency powers and command into one permanent continental body under federal authority. Shifts the balance of power toward the federal government."


 EFH_declare_armageddon: "Declare Armageddon"
 EFH_declare_armageddon_desc: "The European Federation designates the parasite crisis an existential threat to humanity and declares a permanent state of emergency. Every federal institution answers to the war effort.\n\nRequires: public panic at 800 or above. At least 5 major world cities at 50% infestation or beyond."

 EFH_armageddon_state: "Armageddon Declaration"
 EFH_armageddon_state_desc: "The European Federation has declared Armageddon. Every civilian and institutional priority comes second to the parasite response. The mobilisation bonuses are real, and running a permanent emergency state costs political power and stability every day."

 EFH_armageddon_cities_tt: "At least 5 major world cities are infested"
 EFH_armageddon_irreversible_tt: "This declaration is §RPERMANENT§! and cannot be reversed. The European Federation will be locked into a permanent emergency state. Public panic will be §Rlocked at 1000§!.\n§9This will have dire consequences later on.§!"

 srp_armageddon.1.t: "Armageddon Declared"
 srp_armageddon.1.d: "In an address broadcast across every member state and the international emergency channels, the President of the Federal Council has declared a state of Armageddon. The European Federation will devote everything it has to eliminating the parasites on Earth. There is no timeline for lifting the declaration."
 srp_armageddon.1.a: "The world watches."

 srp_armageddon.2.t: "The Declaration"
 srp_armageddon.2.d: "The European Federation has declared Armageddon. Everything it has now goes to fighting us, on a footing it cannot hold forever."
 srp_armageddon.2.a: "Let them be afraid."

 USA_congressional_emergency_resolution: "Congressional Emergency Resolution"
 USA_congressional_emergency_resolution_desc: "Bring a resolution before Congress authorizing expanded federal crisis communications and emergency public information programs. People trust a message Congress signed more than one the White House sent alone. Reduces panic by 150. Requires stable public trust in federal institutions."

 USA_presidential_address: "Presidential Address to the Nation"
 USA_presidential_address_desc: "The President addresses the nation on the emergency broadcast system. It only works if people still trust the presidency enough to hear it as leadership and not damage control. Reduces panic by 220. Requires high public trust. Costs credibility."

 CHN_state_media_reassurance: "State Media Reassurance Campaign"
 CHN_state_media_reassurance_desc: "State broadcasters run a coordinated reassurance programme. Owning the networks makes it quick. Reduces panic by 100."

 CHN_social_stability_enforcement: "Social Stability Enforcement Directive"
 CHN_social_stability_enforcement_desc: "Restrict the spread of unverified parasite incident reports. Local Party committees enforce information discipline and suppress destabilising narratives. Reduces panic by 200. Costs 4% stability."

 CHN_peoples_war_mobilization: "People's War Doctrine Declaration"
 CHN_peoples_war_mobilization_desc: "Frame the parasite crisis as a People's War. State media stops reassuring and starts mobilising, turning fear into enlistment, labour and research. Increases panic by 200. Grants 120 days of mobilisation bonuses: weekly manpower and accelerated research."

 CHN_peoples_war_spirit: "People's War Spirit"
 CHN_peoples_war_spirit_desc: "The People's War Doctrine is in effect. The state keeps awareness of the crisis high on purpose, and enlistment and research participation run above normal."

 EFH_nuclear_war_rally: "For Europe"
 EFH_nuclear_war_rally_desc: "The Federation struck first. Recruitment halls are full, and front-line commanders are asking for more."
 EFH_nuclear_war_blowback: "International Outcry"
 EFH_nuclear_war_blowback_desc: "The first strike drew near-universal condemnation. Embassies are closing and trade partners are reassessing."
 USA_nuclear_war_shock: "Nuclear Shock"
 USA_nuclear_war_shock_desc: "Cities are gone. The government is scrambling for answers. The public is in panic and the political class is tearing itself apart over who to blame and what to do next."



 world.2.t: "Unusual Reports from Ile-de-France"
 world.2.d: "Metro infrastructure in multiple arrondissements has gone dark. Municipal maintenance teams sent to investigate have not returned. H&A Containment is reviewing satellite imagery. The readings are not consistent with known outbreak signatures."
 world.2.a: "Flag it. Send a team."
 world.2.b: "Growth proceeds."

 world.3.t: "Paris Containment Declared"
 world.3.d: "The French military has established a cordon at the city periphery. Civilian evacuation of central arrondissements is underway. H&A Containment reports that the growth is coherent and structured, anchored around a fixed source."
 world.3.a: "Hold the perimeter."
 world.3.b: "The city is learning a new function."

 world.4.t: "Paris: No Response"
 world.4.d: "The last organised transmission from central Paris came from a field hospital in the 12th arrondissement. Aerial observation since then has recorded only canopy spread across the riverbanks and the upper floors of Haussmann buildings. The perimeter is still held. What it is containing is no longer a city."
 world.4.a: "The loss is recorded."
 world.4.b: "A deep site. It will hold long after the stone wears."


 world.5.t: "Anomalous Readings Along the Thames"
 world.5.d: "Environmental monitoring stations on the Thames embankment have returned unexplained biological readings for the third consecutive week. Underground infrastructure surveys in several districts have been suspended pending investigation. The reports have not yet reached public channels."
 world.5.a: "Send the containment unit."
 world.5.b: "The river is already working for us."

 world.6.t: "London Underground Sealed"
 world.6.d: "Transport for London has suspended service across eleven lines following the discovery of root growth in tunnel infrastructure. A military cordon is operational around central districts. H&A Containment reports the growth is following the Underground network outward from the centre."
 world.6.a: "The surface is still ours. Hold it."
 world.6.b: "Infrastructure follows the root. Efficient."

 world.7.t: "London: Signal Lost"
 world.7.d: "The BBC emergency broadcast relay ceased transmission at 03:22. A transmission from Westminster was received fourteen minutes later and has not been repeated. Signals Corps confirms that what remains of the city's communication network is routing somewhere."
 world.7.a: "Document everything received."
 world.7.b: "A relay node now. More efficient than the original."


 world.8.t: "Seismic Anomaly Below Brandenburg"
 world.8.d: "The Federal Institute for Geosciences has flagged subsurface anomalies beneath the Tiergarten district and the Spree riverbed. The readings do not match geological records. Field assessment teams are being assembled. H&A Structural Division has been informed."
 world.8.a: "Get eyes underground."
 world.8.b: "Old foundations hold the spores well."

 world.9.t: "Berlin: Contamination Zone Established"
 world.9.d: "The German government has declared a biological contamination zone across central Berlin. The Reichstag is operating from an emergency facility. H&A Containment estimates the growth rate in Berlin's urban substrate is faster than any previously recorded European site."
 world.9.a: "The government must not collapse."
 world.9.b: "Industrial substrate gives much."

 world.10.t: "Berlin Designated Lost, Reichstag Relocates"
 world.10.d: "An emergency session of the Bundestag voted to formally designate central Berlin as a hazard zone beyond recovery threshold. Personnel have been evacuated. Canopy growth is visible from satellite imagery above the former governmental district. The Tiergarten is unrecognisable."
 world.10.a: "Keep the government running."
 world.10.b: "Let it grow."


 world.11.t: "Infrastructure Failures in Moscow's Outer Districts"
 world.11.d: "Russian state media has not acknowledged the reports. H&A intelligence has confirmed that maintenance crews sent to the Lyublino and Pechatniki districts have been unreachable for eleven days. Rail access to the outer ring road has been suspended. No reason was given."
 world.11.a: "The blackout is itself information."
 world.11.b: "Silence tells us more than the signal would."

 world.12.t: "Red Square Access Restricted"
 world.12.d: "Corroborated reports from Moscow indicate that Kremlin district access has been suspended for all non-essential personnel. Metro service is partially halted. H&A Containment's estimate, based on satellite thermal imagery, places the infestation depth at multiple city blocks. The Russian government has not confirmed."
 world.12.a: "Plan as if Moscow confirmed it."
 world.12.b: "The centre is always the last to admit it."

 world.13.t: "Moscow: Government Communications Offline"
 world.13.d: "H&A Intelligence received its last confirmed communication from a Russian government contact at 11:41. Subsequent signals have not been authenticated. Thermal satellite imagery of the central district shows heat signatures inconsistent with human infrastructure. Emergency broadcasts from eastern regions are advising inland movement."
 world.13.a: "We are watching an end."
 world.13.b: "The capital feeds the root structure well."


 world.14.t: "Shinjuku District Readings Disputed"
 world.14.d: "The Tokyo Metropolitan Government has classified internal reports regarding biological anomalies in the Shinjuku and Shibuya ward perimeters. H&A's Tokyo monitoring team reports that foot traffic patterns changed three weeks before the classification order."
 world.14.a: "Press Tokyo for the reports."
 world.14.b: "Dense cities read cleanly from above."

 world.15.t: "Yamanote Line Suspended, Tokyo Wards Under Evacuation"
 world.15.d: "The Imperial Japanese Army has issued an evacuation order for eleven central Tokyo wards. The Yamanote Line loop has been suspended. Growth structures have been documented above ground in the Asakusa and Akihabara areas. H&A Containment has issued a Category Three regional alert."
 world.15.a: "Coordinate with the Imperial Army on population logistics."
 world.15.b: "Density accelerates the take."

 world.16.t: "Tokyo: Final Army Transmission"
 world.16.d: "The last authenticated communication from the Imperial Army's Tokyo Command came by radio relay from Shibuya at 08:15. The SkyTree broadcast relay has been offline for forty hours. Aerial observation shows canopy coverage above the former central wards. No communication has been received from north of Shinjuku."
 world.16.a: "We keep moving."
 world.16.b: "A node this size will anchor regional expansion for years."


 world.17.t: "CDC Preliminary Alert: New York"
 world.17.d: "The U.S. Centers for Disease Control has issued a restricted preliminary alert regarding biological anomalies in the Staten Island and Queens boroughs. The alert cites unexplained root-like growth in storm drain infrastructure. H&A received a copy through secondary channels."
 world.17.a: "Get ahead of this before the press does."
 world.17.b: "The harbour infrastructure is already useful to us."

 world.18.t: "Manhattan Access Restricted"
 world.18.d: "Bridge and tunnel access to Manhattan has been restricted to emergency vehicles. Below-ground assessments of the subway system have been suspended after multiple teams lost contact. H&A's northeastern logistics hub has been relocated to Philadelphia."
 world.18.a: "The city must not be written off."
 world.18.b: "The financial centre is no longer functioning as one."

 world.19.t: "UN Emergency Session: New York Dark"
 world.19.d: "The United Nations General Assembly has gone into indefinite recess. A final communique was released at 14:00 calling for a coordinated global response. Aerial observation of Manhattan shows growth extending above the roofline of buildings across the lower island. There is no further communication from within the cordon."
 world.19.a: "Then the world responds without a centre."
 world.19.b: "The infrastructure holds. The people were the variable."


 world.20.t: "Unusual Growth Near Northern Beijing"
 world.20.d: "Intelligence sources indicate that construction teams working in the northern district have encountered growth structures inconsistent with any known biological category. The Chinese government has placed a news blackout on the region. H&A has two assets in Beijing. One has not reported in nine days."
 world.20.a: "The other asset is more valuable now."
 world.20.b: "Northern approach vectors are always productive."

 world.21.t: "Forbidden City District Under Military Lockdown"
 world.21.d: "Satellite imagery has confirmed military vehicle concentrations around Zhongnanhai and the Forbidden City perimeter. Communications from the central government district are now routed exclusively through secured military channels. H&A Containment estimates the growth has reached the palace grounds."
 world.21.a: "Seal the district."
 world.21.b: "Old power centres absorb well. The roots remember the depth."

 world.22.t: "Beijing Central District: Communications Terminated"
 world.22.d: "H&A has lost all contact with its remaining Beijing assets. Chinese state media has ceased broadcasting from the capital. Emergency government functions are being routed from Chongqing. Thermal imaging of the Zhongnanhai compound shows no heat signatures consistent with human activity."
 world.22.a: "The world is smaller tonight."
 world.22.b: "The eastern network begins here."

 world.30.t: "An Arrival, Confirmed"
 world.30.d: "Six observatories confirmed it within the same hour, and amateur astronomers had it a day earlier: a body has entered a stable solar orbit, and it did not fall into one. It decelerated. Size estimates are being revised upward by teams who first assumed their instruments were broken. Every government on Earth has convened an emergency session. Every broadcast carries the same photograph, a faint green point of light that was not there last month."
 world.30.a: "The sky is wrong."
 world.30.b: "It is here."
 world.31.t: "Landfall in West Africa"
 world.31.d: "Something came down along the Gulf of Guinea coast, and the footage leaving the region does not agree with itself: growth where growth should not be, whole districts gone silent, roads closed by things the cameras never quite hold in frame. Foreign desks run the story below the fold. It is a long way away, and the object in the sky has used up the world's alarm for now. Governments issue statements of concern and schedule follow-up briefings. Somewhere else, it is somebody else's problem."
 world.31.a: "A tragedy, somewhere else."
 world.31.b: "It is not somewhere else."
 world.31.c: "Landfall."
 world.32.t: "The Coast Goes Quiet"
 world.32.d: "The reports from the Bight coast stopped contradicting each other three days ago, which is worse than when they disagreed. Seven states of coastline and interior have stopped answering. Reconnaissance flights bring back imagery of structured growth, green-lit and spreading, and columns of people walking out of it who do not all arrive. The capitals abroad have sent condolences and observers. Whatever this is, it begins here, and no one else is coming."
 world.32.a: "Mobilise. Now."
 world.32.b: "Contain the panic first."

 ldnews.1.t: "Europapa Wins in Malmö"
 ldnews.1.d: "The Netherlands has won the Eurovision Song Contest in Malmö with Joost Klein's Europapa, a song about a Europe without borders. The jury and the public vote agreed, for once. The final drew the largest audience the contest has ever recorded, and for three hours nobody on stage mentioned the parasites. The Federation's communications office has already asked about the rights."
 ldnews.1.a: "Douze points."
 ldnews.1.b: "Nobody here was watching."
 ldnews.1.c: "More noise."
 ldnews.2.t: "A Car in Solar Orbit"
 ldnews.2.d: "An American heavy-lift rocket flew for the first time yesterday and sent a red sports car past the orbit of Mars, a mannequin in the driver's seat. Both side boosters landed back at the Cape within a second of each other. The car is the first in orbit around the Sun and will pass Earth again in 2091. The company is already selling the photographs."
 ldnews.2.a: "Impressive, for a car."
 ldnews.2.b: "American engineering."
 ldnews.2.c: "More noise."
 ldnews.3.t: "France Takes the Cup"
 ldnews.3.d: "France beat Croatia 4-2 in the World Cup final at the Luzhniki. The Federation's sports commissioner had a statement ready congratulating a European side, and released it with France written in above the line. Moscow ran the whole tournament without an incident worth reporting, which was the point of running it."
 ldnews.3.a: "Allez."
 ldnews.3.b: "Soccer."
 ldnews.3.c: "More noise."
 ldnews.4.t: "A Black Hole, Photographed"
 ldnews.4.d: "Eight radio telescopes on four continents, run as one instrument the size of the Earth, have produced the first image of a black hole: an orange ring around the dark centre of galaxy M87, fifty-five million light years away. There was too much data to send over the internet. It was flown between observatories on half a tonne of hard drives."
 ldnews.4.a: "Frame it."
 ldnews.4.b: "Nice picture."
 ldnews.4.c: "More noise."
 ldnews.5.t: "The Tokyo Games Open"
 ldnews.5.d: "The Games of the XXXII Olympiad opened in Tokyo on schedule, in front of sixty-eight thousand people and a security cordon twice the size planned. The delegations from the Bight coast did not arrive, and their flags were carried in by volunteers from the host city. The organisers describe ticket sales as strong."
 ldnews.5.a: "Good for Tokyo."
 ldnews.5.b: "Win the medal table."
 ldnews.5.c: "More noise."
 ldnews.6.t: "Eurovision Suspended"
 ldnews.6.d: "The European Broadcasting Union has suspended this year's Song Contest. Malmö was to host the final on the eleventh. Thirty-seven broadcasters had already submitted entries, and the songs have been released anyway, which leaves the scoring to the listeners. It is the first year without a contest since 1956."
 ldnews.6.a: "Next year, then."
 ldnews.6.b: "What contest?"
 ldnews.6.c: "Quieter."
 ldnews.7.t: "The Paris Games Open"
 ldnews.7.d: "The Games of the XXXIII Olympiad opened on the Seine, the athletes carried downriver on boats past a city that spent four years preparing and the last two arguing over whether to go ahead. Several teams marched under the Olympic flag because their governments no longer answer the committee's letters. The river was declared clean enough to swim in."
 ldnews.7.a: "Let the Games begin."
 ldnews.7.b: "See you in Los Angeles."
 ldnews.7.c: "More noise."
 ldnews.8.t: "The Paris Games Cancelled"
 ldnews.8.d: "The International Olympic Committee has cancelled the Paris Games, citing the situation in the Île-de-France, and did not elaborate. No replacement host has been named and no city has asked. Los Angeles still expects to hold the 2028 Games and says so in every statement."
 ldnews.8.a: "Of course."
 ldnews.8.b: "Los Angeles is ready."
 ldnews.8.c: "Quieter."


 srp_moon.1.t: "Lunar Programme Launched"
 srp_moon.1.d: "The procurement tranche is cleared and the programme directors have their mandate. Engineers are being pulled from every parallel project. The lunar programme is open."
 srp_moon.1.a: "Let nothing slow us down."

 srp_moon.2.t: "First Lunar Touchdown"
 srp_moon.2.d: "The probe has confirmed its landing site in the crater basin. The surveying equipment is live. For the first time since Apollo, we have broken the lunar surface with something built to stay. The landing zone is marked and ready for the first structural delivery."
 srp_moon.2.a: "Begin the construction phases."

 srp_moon.4.t: "Procurement Irregularity Flagged"
 srp_moon.4.d: "An internal audit has identified a gap between a third-party contractor's billing records and their delivery manifests. The discrepancy runs into eight figures. The subcontractor's legal team has been informed. They are not cooperating."
 srp_moon.4.a: "Open a quiet investigation."

 srp_moon.5.t: "Survey Data Exceeds Projections"
 srp_moon.5.d: "The processing array's first surface survey has returned helium-3 concentration readings substantially above baseline. It appears we selected a better crater than the initial orbital data suggested. The extraction phase looks more viable than originally modelled."
 srp_moon.5.a: "Reallocate to capitalise on this."

 srp_moon.6.t: "Launch Vehicle Acquired"
 srp_moon.6.d: "One of our procurement officers has arranged the acquisition of an unattended commercial launch vehicle from a storage depot. The ownership paperwork is still in transit. The booster is already in transit as well, just in a different direction. The programme timeline has been updated accordingly."
 srp_moon.6.a: "What they don't know won't hurt them."

 srp_moon.7.t: "Rival Alleges Supply Chain Incident"
 srp_moon.7.d: "Intelligence intercepts indicate our rival is tracking missing components from their own supply chain back toward our acquisition network. They have not issued a public statement. What they have done is begin an internal investigation with our programme's contractors named as persons of interest."
 srp_moon.7.a: "Deny everything through back channels."

 srp_moon.8.t: "Procurement Scandal in Press"
 srp_moon.8.d: "Documents alleging systematic financial misconduct in our lunar programme have reached international media. The story is running on every major network and the attribution is detailed. Someone with access handed these to a journalist deliberately. The timing is impeccable."
 srp_moon.8.a: "Issue a denial. Restructure quietly."

 srp_moon.9.t: "Anomalous Regolith Reading"
 srp_moon.9.d: "The research complex's deep-core survey unit has returned an unusual composition reading from the northern crater wall. The sample does not match any known lunar geological layer. The team flagged it immediately. A follow-up core extraction has been scheduled to determine whether this is a calibration error or something that needs to be classified."
 srp_moon.9.a: "Schedule the follow-up survey."

 srp_moon.10.t: "Lunar Base: Operational"
 srp_moon.10.d: "Final integration is complete. The lunar base is operational. We have built a permanent human outpost beyond Earth during the worst sustained crisis in recorded history. The research support it provides, the helium-3 supply chain, the strategic positioning: none of it was possible before today. The war council has begun mapping what changes."
 srp_moon.10.a: "Put it to work."
 srp_moon.10.b: "And what was found in the northern wall?"

 srp_moon.11.t: "Rival Lunar Base Complete"
 srp_moon.11.d: "Our programme is still active. Theirs is complete. They have established a permanent lunar base and are already drawing operational benefit from it. We are behind. The gap in research capacity, resource access, and strategic positioning will widen until we close this."
 srp_moon.11.a: "Accelerate."









 SRP_lunar_anomaly_insight: "Anomaly Analysis: Ongoing"
 SRP_lunar_anomaly_insight_desc: "The deep-core sample from the lunar crater wall does not match any known geological layer. The composition analysis is running in parallel with active programme operations. Whatever it is, studying it is producing unexpected side results across multiple research disciplines."

