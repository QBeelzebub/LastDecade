l_english:
 knx_consumed_state: "Integrated Hive Ground"
 knx_consumed_state_desc: "This state has been integrated into the Knox root network. The remaining population no longer exists as a human administrative category."
 knx_integrated_ground_buff: "Integrated Hive Ground"
 knx_integrated_ground_buff_desc: "This ground has been deliberately shaped for Knox command patterns, receiver routing, and biomass movement."
 knx_integrated_ground_resistance: "Hostile Knox Root Network"
 knx_integrated_ground_resistance_desc: "The Knox root network resists control by any outside administration. Routes close, signals mislead, and living infrastructure works against the occupier."
 knx_root_stronghold: "Designed Hive Stronghold"
 knx_root_stronghold_desc: "VAGRANT-01 has structured this root network with deliberate defensive intent. Approaches are mapped, receiver coverage is dense, and the ground itself is difficult to attack."
 knx_assimilation: "Knox Assimilation"
 knx_assimilation_desc: "Fully saturated states can be integrated into the Knox root network."
 knx_absorb_state: "Integrate [FROM.GetName]"
 knx_absorb_state_desc: "The infestation in [FROM.GetName] has reached total saturation. Knox can bind the ground into its own root network without giving it to the Iris."
 knx_override_iris_state: "Override Iris Root Network in [FROM.GetName]"
 knx_override_iris_state_desc: "The Iris has already consumed [FROM.GetName]. VAGRANT-01 can still unmake its root pattern, but the work is slower and costlier. The old root pattern fights back the whole way."
 knx_nexus_relocation: "Knox Nexus Relocation"
 knx_nexus_relocation_desc: "The Knox hive can shift its active center to already-integrated ground."
 knx_relocate_nexus: "Relocate Knox Nexus to [FROM.GetName]"
 knx_relocate_nexus_desc: "The local nexus can be re-anchored in [FROM.GetName]. The movement is slow and hard to reverse."


 KNX: "Knox Exclusion Zone"
 KNX_DEF: "the Knox Exclusion Zone"
 KNX_ADJ: "Knox"
 KNX_democratic: "Knox Exclusion Zone"
 KNX_democratic_DEF: "the Knox Exclusion Zone"
 KNX_democratic_ADJ: "Knox"
 KNX_fascism: "Knox Exclusion Zone"
 KNX_fascism_DEF: "the Knox Exclusion Zone"
 KNX_fascism_ADJ: "Knox"
 KNX_communism: "Knox Exclusion Zone"
 KNX_communism_DEF: "the Knox Exclusion Zone"
 KNX_communism_ADJ: "Knox"
 KNX_neutrality: "Knox Exclusion Zone"
 KNX_neutrality_DEF: "the Knox Exclusion Zone"
 KNX_neutrality_ADJ: "Knox"
 KNX_LAST_DECADE_DESC: "Knox County is not present as an independent actor on Day 1. Tennessee begins under the United States. Around 2023, VAGRANT-01 emerges and Knox County becomes playable."
 KNX_focus: "Knox County Focus Tree"
 KNX_VAGRANT_ONE: "VAGRANT-01"
 KNX_VAGRANT_ONE_DESC: "The first stable Vagrant is not aligned with humanity or the Iris. Knox County is a civilisation-building project. The county waits, reads, and acts only when the exchange is worth the cost."

 KNX_silent_emergence: "Silent Emergence"
 KNX_silent_emergence_desc: "The county is no longer a county in the old sense. It is a local exception with roots, receivers, and a mind that understands systems before it understands borders."
 KNX_dispatcher_inheritance: "Dispatcher Inheritance"
 KNX_dispatcher_inheritance_desc: "The flowers along the spine receive constantly. Military traffic. Civilian traffic. Static. Panic. The network does not need permission to listen."
 KNX_transactional_logic_baseline: "Transactional Logic"
 KNX_transactional_logic_baseline_desc: "Alignment is too blunt a category. Knox will trade information, access, and restraint. Nothing else is implied."
 KNX_read_the_perimeter: "Read the Perimeter"
 KNX_read_the_perimeter_desc: "The first requirement is knowing what approaches the hive. Convoys, patrols, aircraft, refugee columns, and signal discipline all leave patterns."
 KNX_hive_construction_phase_1: "Hive Construction: Phase I"
 KNX_hive_construction_phase_1_desc: "The early structures are cultivated to hive specification. Root depth increases. Receiver density improves. Redundancy is grown in place."
 KNX_us_invisibility_continued: "Continue Invisibility"
 KNX_us_invisibility_continued_desc: "The United States has a category for anomalous infestation. It does not yet have a category for this. That gap remains useful."
 KNX_unacknowledged_efh_channel: "Unacknowledged EF Channel"
 KNX_unacknowledged_efh_channel_desc: "The Federation receives what Knox sends. Nothing about the channel is written down."
 KNX_resource_exchange_terms: "Resource Exchange Terms"
 KNX_resource_exchange_terms_desc: "Information has value. So does silence. The exchange rate is adjusted accordingly."
 KNX_price_of_silence: "The Price of Silence"
 KNX_price_of_silence_desc: "Outside actors learn that Knox can withhold as precisely as it can disclose. Silence is a negotiated condition."
 KNX_selective_disclosure: "Selective Disclosure"
 KNX_selective_disclosure_desc: "A full picture would create panic and obligation. Knox sends fragments instead, each shaped to produce the least wasteful response."

 KNX_anomalous_infestation: "Anomalous Infestation"
 KNX_anomalous_infestation_desc: "External observers read the county as a local infestation. The assessment is incomplete and operationally useful."
 KNX_transactional_logic: "Transactional Logic"
 KNX_transactional_logic_desc: "Knox signs nothing that obliges it to fight for anyone. Exchanges only."
 KNX_civilization_project: "Civilisation Project"
 KNX_civilization_project_desc: "The hive is an attempt to build a stable system on infested ground."

 KNX_dispatcher_inheritance_ns: "Dispatcher Inheritance"
 KNX_dispatcher_inheritance_ns_desc: "The local network receives and interprets signal traffic with an ease human agencies cannot reproduce."
 KNX_perimeter_reading: "Perimeter Reading"
 KNX_perimeter_reading_desc: "The county tracks patterns at its edge. Foot traffic, engines, aircraft routing, and transmission habits are all legible."
 KNX_hive_construction_phase_1_ns: "Hive Construction: Phase I"
 KNX_hive_construction_phase_1_ns_desc: "Early hive infrastructure favours Beckon depth, Dispatcher coverage, and local stability over outward pressure."
 KNX_us_invisibility: "American Misclassification"
 KNX_us_invisibility_desc: "American field reports continue to describe Knox as an anomalous local infestation. That mistake is permitted to continue."
 EFH_knox_intelligence_summary: "Knox Intelligence Summary"
 EFH_knox_intelligence_summary_desc: "An unacknowledged package has arrived through channels no Federation office admits to maintaining. Its contents are useful."
 USA_knox_exclusion_zone: "Knox Exclusion Zone"
 USA_knox_exclusion_zone_desc: "Federal reporting describes the Tennessee breach as an exclusion zone around a persistent infestation event. The terminology is insufficient."
 knx_vagrant_one_manifestation: "VAGRANT-01 Manifestation"
 knx_vagrant_one_manifestation_desc: "The first stable Vagrant is active in Knox County, a local exception that survived long enough to become a system."

 KNX_reading_group: "Knox Reading Group"
 KNX_reading_group_desc: "Passive signal interception and perimeter interpretation."
 KNX_transactional_diplomacy: "Transactional Diplomacy"
 KNX_transactional_diplomacy_desc: "One-shot exchanges with outside actors. No alliance is implied."
 KNX_passive_listening: "Passive Listening"
 KNX_passive_listening_desc: "Let the traffic pass through the receivers. Most signals do not know they are speaking to Knox."
 KNX_send_intelligence_summary_to_EFH: "Send Intelligence Summary to the Federation"
 KNX_send_intelligence_summary_to_EFH_desc: "Transmit a curated packet through an unacknowledged channel. The Federation receives value. Knox receives value. Nothing else is recorded."

 knx.1.t: "Emergence"
 knx.1.d: "The National Guard in Knox County has stopped responding. Field teams report rooted growth and receiver structures. The county is gone."
 knx.1.d_other: "Contact with Knox County, Tennessee has stopped. The last reports out describe rooted growth and receiver structures across the whole county. Nothing has come out of it since."
 knx.1.a: "What"
 knx.2.t: "Tennessee Containment Notice"
 knx.2.d: "Reports from eastern Tennessee describe a contained but persistent biological anomaly. Local command requests classification as an infestation breach. The request is approved. No further category is available."
 knx.2.a: "Contain it locally."
 knx.3.t: "Unacknowledged File Transfer"
 knx.3.d: "A packet is delivered through the channel. The contents are sorted, indexed, and more complete than expected. The receiving office does not ask how the vagrant obtained half of it."
 knx.3.a: "Valuable"
 KNX_passive_listening_unlocked_tt: "Unlocks the §YPassive Listening§! decision."
 KNX_efh_channel_open_tt: "Unlocks transactional intelligence exchanges with the European Federation."
 KNX_human_diplomacy_unlocked_tt: "Knox County may now conduct diplomacy with human states, including lend-lease, guarantees and faction membership."


 KNX_loyal_strain_cultivation: "Loyal Strain Program"
 KNX_loyal_strain_cultivation_desc: "Vagrant 1 has spent two years understanding the Beckon network from inside it. The next step is to cultivate organisms carrying the vagrant's own biological signature, which answer to nobody else."
 KNX_personal_guard: "The Personal Guard"
 KNX_personal_guard_desc: "The first loyal parasite brood is small enough to lose in an afternoon. They fight differently, following one signal with none of the panic found in Iris-directed organisms."
 KNX_brood_expansion: "Brood Expansion"
 KNX_brood_expansion_desc: "The strain is reliable. It is time to grow it."

 KNX_hive_construction_phase_2: "Hive Construction: Phase II"
 KNX_hive_construction_phase_2_desc: "The Knox network has stabilised. Phase two begins: additional growth nodes, deeper infrastructure, and the first cultivated biomass production that doesn't depend on what the Iris wants."
 KNX_food_sovereignty: "Food Sovereignty"
 KNX_food_sovereignty_desc: "Human survival in Knox County has always depended on what could be grown in soil that the Iris hasn't touched yet. Vagrant 1 has spent time studying which Beckon-adjacent land is safe and which isn't. The results are useful."
 KNX_appalachian_claim: "Appalachian Perimeter"
 KNX_appalachian_claim_desc: "The mountains slow infestation. They also slow relief. What they do not slow is the gradual expansion of a settlement that knows exactly where to build."

 KNX_vagrant_goes_to_canada: "The Walk to Canada"
 KNX_vagrant_goes_to_canada_desc: "Vagrant 1 has decided that the time for quiet is over. They will walk into a European Federation government office in Canada, survive whatever happens next, and ask for a specific person to be brought in from H&A Hyperbiology. The exchange becomes the first voluntary parasite-to-human contact on record."
 KNX_first_accord: "The First Accord"
 KNX_first_accord_desc: "A working relationship. Not trust, not alliance. A set of terms that both sides can live with, drafted by parties who have recently established that one of them cannot be killed by small arms."
 KNX_ef_formal_recognition: "Formal Recognition"
 KNX_ef_formal_recognition_desc: "The European Federation formally recognized Knox County as a separate diplomatic entity. It isn't a country in any sense of the word, and the United States still says Knox County is US territory."

 KNX_loyal_strain_ns: "Loyal Strain Cultivated"
 KNX_loyal_strain_ns_desc: "Vagrant 1's personal parasite organisms carry a distinct biological signature. They do not respond to Iris signals."
 KNX_loyal_strain_matured_ns: "Loyal Strain, Full Expression"
 KNX_loyal_strain_matured_ns_desc: "The cultivated strain has matured into a stable, combat-ready form. It answers only to the Vagrant's own biological signature."
 KNX_personal_guard_ns: "Personal Guard Active"
 KNX_personal_guard_ns_desc: "A brood of loyal parasite organisms protects Knox County's territory and personnel."
 KNX_brood_expansion_ns: "Expanded Brood"
 KNX_brood_expansion_ns_desc: "The loyal parasite population has grown to a scale that materially affects Knox County's defensive capacity."
 KNX_hive_phase_2_ns: "Second Hive Phase Complete"
 KNX_hive_phase_2_ns_desc: "Extended beckon infrastructure and biomass production, independent of Iris direction."
 KNX_food_sovereignty_ns: "Food Sovereignty Secured"
 KNX_food_sovereignty_ns_desc: "Knox County controls sufficient clean agricultural land to sustain its population through continued infestation pressure."
 KNX_appalachian_claim_ns: "Appalachian Perimeter Established"
 KNX_appalachian_claim_ns_desc: "The mountain boundary has been mapped, secured, and incorporated into Knox County's territorial strategy."
 KNX_first_accord_ns: "First Accord"
 KNX_first_accord_ns_desc: "A working agreement with the European Federation. Both parties exchange information and agree not to interfere with each other's operations."
 KNX_ef_formal_recognition_ns: "EF Partner Status"
 KNX_ef_formal_recognition_ns_desc: "Knox County is formally recognised by the European Federation as a strategic partner. The relationship has legal standing, which neither side entirely expected."
 EFH_knx_partner_ns: "Knox County Partnership"
 EFH_knx_partner_ns_desc: "The European Federation has formalised its relationship with Knox County. Vagrant 1's biological insights have begun filtering into H&A Hyperbiology's research pipeline."

 KNX_loyal_strain_cultivation_tt: "Vagrant 1 begins cultivating parasites loyal to their unique biological signature. These organisms do not respond to Iris signals."
 KNX_appalachian_claim_tt: "Knox County's territorial claims into the Appalachian region become legally and militarily actionable."
 KNX_vagrant_goes_to_canada_efh_canada_tt: "The European Federation controls territory in Canada."

 knx.4.t: "The Walk"
 knx.4.d: "Vagrant 1 left Knox County at 0400 on a Tuesday. They walked into a European Federation consulate office in Toronto, were shot four times, stood up, and calmly requested that a specific H&A Hyperbiology researcher be brought in within twenty-four hours.\n\nThey are still sitting in the waiting room."
 knx.4.a: "They know what they're doing."

 knx.5.t: "Hostile in the Waiting Room"
 knx.5.d: "A parasite-human hybrid entered the Federation consulate in Toronto, survived being shot by security, and is currently waiting in a sealed room. They have not spoken further. They have left a single document on the desk: a name from our Hyperbiology roster."
 knx.5.a: "Send the researcher. See what they want."
 knx.5.b: "Parasite contact protocol. Seal the building."

 knx.6.t: "One Line in the Accord"
 knx.6.d: "The accord as drafted covers resource transfers, disclosure limits and a schedule of contacts. Knox County has added a clause at the end asking the Federation to state publicly that an attack on the county would be treated as an attack on the Federation.\n\nThe cost of saying so is five points of political capital. The cost of the Americans reading it is not estimated."
 knx.6.a: "Sign the clause as written."
 knx.6.b: "Strike it. The rest stands."


 KNX_vagrant_genome_mio: "1st Vagrant Genome"
 KNX_vagrant_genome_mio_desc: "The Knox County Vagrant designs its own genome. Its organisms are built with intent: precise, dual-purpose, and architecturally unlike anything in the Iris lineage. They are effective against humans and Iris parasites alike, which is not an accident."

 KNX_vagrant_genome_core: "Vagrant Genome: Foundation"
 KNX_vagrant_genome_core_desc: "The first generation of hand-designed organisms. Even this baseline exceeds what unguided parasite evolution produces. The Vagrant understands what it is building and why."

 KNX_vagrant_dual_target: "Dual-Target Architecture"
 KNX_vagrant_dual_target_desc: "Organisms designed to engage both armoured human equipment and Iris parasite units without significant performance loss against either. A narrow engineering window, and the Vagrant found it."

 KNX_vagrant_adaptive_resilience: "Adaptive Resilience"
 KNX_vagrant_adaptive_resilience_desc: "Structural redundancy built into every organism. These do not stop functioning after the first hit. The Vagrant's designs survive contact longer than anything in the standard Iris line."

 KNX_vagrant_arbiter_release: "Arbiter Release"
 KNX_vagrant_arbiter_release_desc: "The dual-target architecture reaches operational maturity. The Arbiter is authorised: a precision organism designed to neutralise specific high-value targets in either human or parasite formations."

 KNX_vagrant_culler_protocol: "Culler Protocol"
 KNX_vagrant_culler_protocol_desc: "Adaptive resilience encoded into an elimination-focused body plan. The Culler is authorised: durable, high-attack, built to stay in contact until the target stops moving."

 KNX_vagrant_sovereignty: "Vagrant Sovereignty"
 KNX_vagrant_sovereignty_desc: "The 1st Vagrant genome at full expression. Its capability comes from the Vagrant's own design, separate from the Iris lineage."


 KNX_vagrant_genome_initial: "Vagrant Design Philosophy"

 KNX_propose_resource_exchange: "Propose Resource Exchange"
 KNX_propose_resource_exchange_desc: "The exchange terms are settled. Knox forwards a shipment through unmarked carriers and the Federation forwards political cover in return. Nothing is signed and nothing needs to be."
 KNX_expanded_disclosure: "Expanded Disclosure"
 KNX_expanded_disclosure_desc: "Release a deeper read of the Dispatcher perimeter than the routine summary allows. The Federation learns more than it admits to wanting. Knox decides exactly how much more."
 KNX_formalize_hyperbiology_exchange: "Formalize the Hyperbiology Exchange"
 KNX_formalize_hyperbiology_exchange_desc: "Stand up a permanent research channel with H&A. The Vagrant can work with parasite material in ways no human laboratory can match, and the corporation knows it. This is the point where the relationship stops being deniable."
 KNX_share_strain_research: "Share Strain Research"
 KNX_share_strain_research_desc: "Pass a batch of strain data into the Hyperbiology channel. The Federation's parasite research moves faster for it. Knox keeps the lineage that matters."
 KNX_request_materiel_support: "Request Materiel Support"
 KNX_request_materiel_support_desc: "Draw on Federation logistics and field medicine as a recognised partner. The support arrives without ceremony and without an audit trail."

 EFH_knx_resource_exchange: "Knox Resource Exchange"
 EFH_knx_resource_exchange_desc: "Material arriving through Knox channels keeps Federation construction supplied past what the official ledgers can account for."
 EFH_knx_deep_intelligence: "Knox Perimeter Read"
 EFH_knx_deep_intelligence_desc: "A detailed picture of the Dispatcher perimeter, more complete than anything the Federation's own listening posts can assemble."
 EFH_knx_hyperbiology_exchange: "Knox Hyperbiology Channel"
 EFH_knx_hyperbiology_exchange_desc: "A standing collaboration with the 1st Vagrant. H&A's Hyperbiology programme advances faster with a partner who can handle parasite material directly."
 EFH_knx_strain_data: "Knox Strain Data"
 EFH_knx_strain_data_desc: "A current batch of strain analysis from Knox, feeding directly into Federation parasite research."

 KNX_dug_in_homeland: "Dug-In Homeland"
 KNX_dug_in_homeland_desc: "The First builds ground to be held. Every position is sited, layered, and prepared long before it is needed, and the ground gives up nothing cheaply."

 KNX_homeland_defense: "Homeland Defence"
 KNX_homeland_defense_desc: "Extend the Kentucky model to new ground."
 KNX_fortify_root_stronghold: "Establish Root Stronghold"
 KNX_fortify_root_stronghold_desc: "Build out a target state the way Kentucky was built: layered defences, buried supply, and prepared ground. Applies the Root Stronghold modifier permanently, giving the state the same defensive weight as the original homeland."


 sp_land_loyal_strain_expression_aggression: "Loyal Strain, Aggressive Expression"
