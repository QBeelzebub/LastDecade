l_english:
 SRP_moon_base: "Second Space Race: Moon Base"
 SRP_moon_base_desc: "The second space race, an interplanetary threat, and Laytheo's launch costs have together made a permanent lunar base plausible for the first time. Helium-3 off the surface would put Europe's grid on full fusion.\nProgress: §Y[?SRP_moon_base_progress|0]%§!\nModules deployed: §Y[?SRP_moon_base_modules|0]§!/15\nSecurity: §Y[?SRP_moon_base_security|0]§!\nProcurement heat: §Y[?SRP_moon_base_procurement_heat|0]§!"
 SRP_moon_base_status: "Moon Base Status"
 SRP_moon_base_status_desc: "Progress: §Y[?SRP_moon_base_progress|0]%§!\nModules deployed: §Y[?SRP_moon_base_modules|0]§!/15\nSecurity: §Y[?SRP_moon_base_security|0]§!\nProcurement heat: §Y[?SRP_moon_base_procurement_heat|0]§!\nEach point of Security is a 10% chance to stop a rival's sabotage, up to 40%.\n\nThe programme is assembled from Earth-launched precision machinery and lunar-built bulk structures. After the construction yard comes online, rover bodies, shielding, pads, and simple frame elements can be fabricated from local regolith."
 SRP_moon_base_poach_rival_tt: "The rival programme loses §R1%§! progress, unless its Security stops it."
 SRP_moon_base_booster_rival_tt: "The rival programme loses §R2%§! progress, unless its Security stops it."
 SRP_moon_base_scandal_rival_tt: "The rival's procurement scandal goes public, unless its Security stops it."
 SRP_moon_base_programme_initiation: "Authorise the Moon Base Programme"
 SRP_moon_base_programme_initiation_desc: "Commit the state to a permanent lunar surface programme. The Federation relies on Laytheo and H&A's lunar architecture work. The United States relies on its national launch and aerospace base."
 SRP_moon_base_module_01_site_survey: "Lunar Site Survey Package"
 SRP_moon_base_module_01_site_survey_desc: "Map stable terrain, regolith quality, thermal cycles, and candidate landing zones for a surface base."
 SRP_moon_base_module_02_transfer_schedule: "Lunar Transfer Schedule"
 SRP_moon_base_module_02_transfer_schedule_desc: "Reserve the launch cadence, transfer windows, and cargo manifests needed to move from demonstration flights to routine lunar logistics."
 SRP_moon_base_module_03_landing_zone: "Landing Beacon and Cargo Zone"
 SRP_moon_base_module_03_landing_zone_desc: "Deploy automated beacons and prepare hardened cargo flats for repeat landings."
 SRP_moon_base_module_04_starter_grid: "Surface Power Starter Grid"
 SRP_moon_base_module_04_starter_grid_desc: "Install the first compact power systems so later surface equipment can survive lunar nights and heavy industrial loads."
 SRP_moon_base_module_05_regolith_handling: "Regolith Handling Equipment"
 SRP_moon_base_module_05_regolith_handling_desc: "Launch excavators, compactors, haulers, and remote maintenance kits. The Moon has material. It needs hands."
 SRP_moon_base_module_06_construction_yard: "Lunar Construction Yard"
 SRP_moon_base_module_06_construction_yard_desc: "Commission the first yard capable of turning local regolith into shielding, pads, frames, and rover bodies."
 SRP_moon_base_module_07_habitat_shells: "Habitat Pressure Shells"
 SRP_moon_base_module_07_habitat_shells_desc: "Assemble pressure shells and bury them under local shielding. Precision seals still come from Earth. The mass comes from the Moon."
 SRP_moon_base_module_08_life_support: "Life Support and Thermal Core"
 SRP_moon_base_module_08_life_support_desc: "Launch and integrate the fragile parts: air handling, heat rejection, recycling loops, and failure isolation."
 SRP_moon_base_module_09_rover_chassis: "Rover Chassis Fabrication"
 SRP_moon_base_module_09_rover_chassis_desc: "Build rover bodies and frame elements locally, freeing launch mass for the parts too complex to print in dust."
 SRP_moon_base_module_10_rover_systems: "He-3 Rover Systems Package"
 SRP_moon_base_module_10_rover_systems_desc: "Send extraction heads, sensors, processors, and high-tolerance machinery for the rover fleet."
 SRP_moon_base_module_11_processing_array: "Regolith Processing Array"
 SRP_moon_base_module_11_processing_array_desc: "Bake, sift, separate, and catalogue the lunar surface material at industrial scale."
 SRP_moon_base_module_12_refinement_storage: "He-3 Refinement and Cryogenic Storage"
 SRP_moon_base_module_12_refinement_storage_desc: "Install the Earth-built systems needed to refine extracted helium-3 and hold it safely before export."
 SRP_moon_base_module_13_export_logistics: "Lunar Export Logistics"
 SRP_moon_base_module_13_export_logistics_desc: "Create the return capsule, transfer-stage, and cargo routing chain that turns lunar extraction into Earth-side fuel."
 SRP_moon_base_module_14_research_complex: "Research and Anomaly Observation Complex"
 SRP_moon_base_module_14_research_complex_desc: "Expand the base into a research platform and a deep-space sensor post."
 SRP_moon_base_module_15_final_integration: "Full Moon Base Integration"
 SRP_moon_base_module_15_final_integration_desc: "Commission the base as a permanent surface installation and future staging point for deeper operations."
 SRP_moon_base_prestige_broadcast: "Launch Prestige Broadcast"
 SRP_moon_base_prestige_broadcast_desc: "Broadcast a carefully edited progress package. Very little dust, no screams from the engineering console, excellent music."
 SRP_moon_base_emergency_catchup_funding: "Emergency Catch-Up Funding"
 SRP_moon_base_emergency_catchup_funding_desc: "Pour political capital into faster procurement and parallel testing. It works, but everyone can smell the smoke."
 SRP_moon_base_inspect_rival_supply_chains: "Inspect Rival Launch Supply Chains"
 SRP_moon_base_inspect_rival_supply_chains_desc: "Map where the rival stores engines, avionics, test articles, and other things that are normally protected by laws."
 SRP_moon_base_poach_engineers: "Poach Aerospace Engineers"
 SRP_moon_base_poach_engineers_desc: "Offer better contracts, better labs, and fewer meetings to specialists working on the rival programme."
 SRP_moon_base_acquire_unattended_booster: "Acquire an Unattended Booster"
 SRP_moon_base_acquire_unattended_booster_desc: "A launch vehicle is only stolen if the paperwork agrees with the accusation."
 SRP_moon_base_expose_rival_scandal: "Expose Rival Procurement Scandal"
 SRP_moon_base_expose_rival_scandal_desc: "Turn their heat into headlines before anyone asks too many questions about your own hangars."
 SRP_lunar_race_pressure: "Lunar Race Pressure"
 SRP_lunar_race_pressure_desc: "The moon base programme is a prestige project now, and the budget follows it."
 SRP_moon_base_active_base: "Active Lunar Outpost"
 SRP_moon_base_active_base_desc: "A real surface base exists now, fragile but politically electrifying."
 SRP_moon_base_he3_partial: "Pilot He-3 Operations"
 SRP_moon_base_he3_partial_desc: "The first helium-3 extraction and storage systems are producing useful data and modest industrial returns."
 SRP_moon_base_he3_full: "Lunar He-3 Supply Chain"
 SRP_moon_base_he3_full_desc: "Regular helium-3 deliveries from the Moon have begun. Grid planners are starting to count on them."
 SRP_moon_base_research: "Lunar Research Complex"
 SRP_moon_base_research_desc: "The base's research complex gives scientists a clean platform for surface, orbital, and deep-space observation."
 SRP_moon_base_complete: "Completed Moon Base"
 SRP_moon_base_complete_desc: "A permanent lunar surface base now supports helium-3 extraction, advanced research, prestige operations, and future deep-space missions."
 SRP_moon_base_procurement_scandal: "Lunar Procurement Scandal"
 SRP_moon_base_procurement_scandal_desc: "Aerospace procurement has become a public embarrassment. Officials insist nothing was stolen, which is not the same as saying where it came from."
 EQ_MOD_CAT_srp_internal_weapons_TITLE: "Internal Weapons"
 basic_cannon: "27mm Cannon"
 basic_cannon_desc: "27mm autocannon. Standard close-range armament on fighter and strike aircraft. High rate of fire with dual-role capability."
 basic_jet_engine: "Basic Afterburning Engine"
 basic_jet_engine_desc: "Standard afterburning turbofan. Reliable and widely used across 4th-generation fighter and strike platforms."
 IRMissile: "IR Missile"
 IRMissile_desc: "Infrared-guided air-to-air missile. Highly manoeuvrable with advanced infrared homing. Effective against a wide range of aerial targets."
 bomb_locks: "Precision Bombing Systems"
 bomb_locks_desc: "Advanced targeting pods and guidance systems for precision-guided munitions. Enables accurate delivery against ground targets in contested environments."
 nuclear_bomb_locks: "Nuclear Bomb Locks"
 nuclear_bomb_locks_desc: "Bomb locks that carry low yield nuclear bombs. Commonly used for close air support against other nations and parasites. Highly effective, but expensive."
 EQ_MOD_CAT_srp_wing_configuration_TITLE: "Wing Configuration"
 EQ_MOD_CAT_srp_bomb_bay_TITLE: "Bomb Bays"
 srp_wing_conventional: "Conventional Wings"
 srp_wing_conventional_desc: "A standard swept-wing configuration. Reliable across all mission types with no significant tradeoffs."
 srp_wing_canard_delta: "Canard Delta Wings"
 srp_wing_canard_delta_desc: "Forward canards paired with a delta wing improve pitch response and low-speed handling. Favoured for close air support and engagements requiring tight manoeuvres at low altitude."
 EFH_ha_wing_canard_delta: "European Canard Delta Wings"
 EFH_ha_wing_canard_delta_desc: "Europe's signature wing configuration. A direct upgrade from the standard Canard Delta configuration."
 srp_wing_delta: "Delta Wings"
 srp_wing_delta_desc: "A pure delta configuration optimised for high-speed, high-altitude flight. Preferred for interception roles. Sacrifices agility for straight-line performance."
 srp_wing_tandem: "Tandem Wings"
 srp_wing_tandem_desc: "A secondary wing provides additional lift and stability over long distances. Well suited to naval strike and extended patrol missions over contested territory."
 srp_strategic_bomber_airframe: "Strategic Bomber"
 srp_strategic_bomber_airframe_desc: "A long-range strategic strike platform capable of deep penetration bombing missions. Designed for sustained operations over contested and infested territory."
 srp_strategic_bomber_1_airframe: "Strategic Bomber 2018 Airframe"
 srp_strategic_bomber_1_airframe_desc: "First-generation strategic bomber airframe. Optimised for high-altitude penetration and standoff munitions delivery."
 srp_strategic_engine: "Strategic Turbofan Engine"
 srp_strategic_engine_desc: "A high-bypass turbofan optimised for range over speed. The backbone of long-range strategic strike capability."
 srp_bomb_bay: "Conventional Bomb Bay"
 srp_bomb_bay_desc: "Internal weapons bay for conventional ordnance. Reduces radar cross-section compared to external hardpoints."
 srp_nuclear_bomb_bay: "Nuclear Bomb Bay"
 srp_nuclear_bomb_bay_desc: "A hardened internal bay rated for nuclear payload delivery. Requires specialist handling and fissile material allocation."
 srp_countermeasures: "Countermeasures Pod"
 srp_countermeasures_desc: "Electronic and physical countermeasures suite. Improves survivability in high-threat environments."
 srp_ground_radar: "Strategic Ground Radar"
 srp_ground_radar_desc: "High-resolution synthetic aperture radar for all-weather ground targeting. Reduces mission abort rates in low-visibility conditions."
 srp_aesa_radar: "AESA Radar"
 srp_aesa_radar_desc: "Active electronically scanned array radar. Improves air-to-air detection and engagement, with a marked advantage in night interception."
 srp_bomb_sights: "Precision Bomb Sights"
 srp_bomb_sights_desc: "Integrated targeting system for improved strike accuracy."
 srp_bomber_2: "Project DAMOCLES"
 srp_bomber_2_desc: "Nuclear-capable strike package integration for strategic bomber airframes. Grants a credible nuclear delivery option against hardened targets."
 strategic_bomber_equipment_1: "Strategic Bomber"
 srp_ew_suite: "Electronic Warfare Suite"
 srp_ew_suite_desc: "Radar jamming, decoy deployment, and signal intelligence suite. Increases strategic bomber survivability in contested airspace."
 srp_stealth_coating: "Stealth Coating"
 srp_stealth_coating_desc: "Radar-absorbent coating applied to strategic bomber airframes. Reduces radar cross-section significantly on deep penetration missions."


 sp_land_stbn_tank_shell: "STBN Anti-Parasite Shells"
 sp_land_stbn_tank_shell_desc: "Advanced fabricated parasites and their membranes are making standard ballistics less effective every month. Rounds ricochet, or land without killing. By heating the tip with nuclear materials we can vaporise the membrane coating and deliver a small nuclear payload directly into the organism."

 sp_land_reward_stbn_containment_breach: "Containment Failure"
 sp_land_reward_stbn_containment_breach_desc: "A seal on the SF6 pressure vessel ruptured during live-fire testing. The test site is contaminated and the head researcher has been exposed."
 sp_land_reward_option_stbn_containment_breach_seal: "Seal the facility. We cannot afford casualties."
 sp_land_reward_option_stbn_containment_breach_continue: "Continue testing. The data is too valuable to waste."

 sp_land_reward_stbn_warhead_calibration: "Yield Calibration"
 sp_land_reward_stbn_warhead_calibration_desc: "The warhead design is mature, but locking in the final spec means putting it through its paces. How hard should the team push the test programme?"
 sp_land_reward_option_stbn_calibration_controlled_series: "Run a controlled test series"
 sp_land_reward_option_stbn_calibration_live_fire_validation: "Push for live fire validation"

 srp_tank_stbn_cannon: "STBN Cannon"
 srp_tank_stbn_cannon_desc: "A modified high-pressure cannon chambered for STBN rounds. The barrel is coated in lead to prevent radiation sickness for crews. The shells are composed of a nuclear heating element, and a small nuclear payload that is triggered when the projectile comes to a stop or is exposed to a Beckon's internal pressure."

 sp_naval_stbn_shell: "STBN Fleet Ammunition Programme"
 sp_naval_stbn_shell_desc: "Adapting the STBN warhead principle to naval gun calibres. The physics remain the same: SF6 injection, membrane penetration, and internal detonation. Delivery systems, handling procedures, and blast containment requirements are entirely different at sea."

 sp_naval_reward_stbn_naval_calibration: "Naval Calibration"
 sp_naval_reward_stbn_naval_calibration_desc: "The at-sea test firings are complete. The data will determine the final configuration of the STBN shell for fleet-wide deployment."
 sp_naval_reward_option_stbn_naval_calibration_penetration: "Prioritise armour-piercing performance"
 sp_naval_reward_option_stbn_naval_calibration_blast: "Prioritise blast yield per round"

 sp_naval_stbn_shell_bonus: "STBN Fleet Shells"

 sp_naval_fusion_engine: "Carrier Fusion Engine"
 sp_naval_fusion_engine_desc: "The commercial fusion reactors that went online in 2017 were a landmark, but they were stationary machines the size of a city block. Engineering a compact magnetic confinement core for a supercarrier is a different problem, especially under combat vibration, saltwater corrosion, and missile damage."

 srp_carrier_fusion_engine: "Fusion Drive"
 srp_carrier_fusion_engine_desc: "A compact magnetic confinement fusion drive. Generates substantially greater thrust than the nuclear reactors it replaces. Fuel requirements are negligible. The additional power output also benefits onboard systems."

 sp_naval_reward_fusion_engine_containment_choice: "Containment Configuration"
 sp_naval_reward_fusion_engine_containment_choice_desc: "The prototype core is stable, but locking in a containment geometry means stress testing it. How far should the team push the reactor before calling it done?"
 sp_naval_reward_option_fusion_engine_incremental_trials: "Run incremental containment trials"
 sp_naval_reward_option_fusion_engine_full_load_stress_test: "Push the core to full load"

 sp_air_sf6_jet_engine: "SF6 Atmospheric Jet Engine"
 sp_air_sf6_jet_engine_desc: "Beckons vent sulfur hexafluoride into the lower atmosphere as a byproduct of luxsynthesis. At sufficient concentration, SF6 can be captured mid-flight and used as a supplementary oxidiser in a modified jet combustion cycle, for a big gain in thrust-to-weight and less of the range penalty high-performance jet engines usually pay."

 srp_sf6_engine_1x: "SF6 Turbojet (Single)"
 srp_sf6_engine_1x_desc: "Single SF6-cycle turbojet. Captures atmospheric sulfur hexafluoride through inlet scoops and routes it into the combustion chamber alongside standard oxidiser. Delivers significantly greater thrust and improved range efficiency compared to axial turbofans of equivalent size."

 srp_sf6_engine_2x: "SF6 Turbojet (Twin)"
 srp_sf6_engine_2x_desc: "Twin SF6-cycle turbojets in a paired configuration. Combined output exceeds most single-engine designs in the same weight class."
 srp_afterburner: "Afterburner"
 srp_afterburner_desc: "Afterburning thrust augmentation. Injects fuel into the exhaust for a large gain in top speed and thrust, at the cost of range and a steep rise in fuel consumption."

 sp_air_reward_sf6_combustion_ratio_choice: "Combustion Ratio Configuration"
 sp_air_reward_sf6_combustion_ratio_choice_desc: "The combustion ratio can be locked in from bench data alone, or proven out in the air. Which is worth the team's time?"
 sp_air_reward_option_sf6_bench_calibration_runs: "Run bench calibration passes"
 sp_air_reward_option_sf6_inflight_combustion_trials: "Take the engine airborne for live trials"

 sp_land_parasite_weakpoint_algorithm: "Parasite Weak-Point Analysis System"
 sp_land_parasite_weakpoint_algorithm_desc: "All parasites have slightly different internal structures. This makes locating key organs and weak points hard for crews in the heat of battle. However with enough data, a skilled scientist can figure out the precise position of these weak points and figure out what will happen when shot with different projectiles. We aim to replicate this with a computer that overlays targeting recommendations in the crew interface."

 sp_land_parasite_weakpoint_algorithm_bonus: "Parasite Targeting Computer"

 sp_land_reward_weakpoint_data_calibration: "Targeting Doctrine"
 sp_land_reward_weakpoint_data_calibration_desc: "The algorithm is functional. The final tuning will determine how it prioritises targets, choosing between high-value kill shots, broad suppression, or a hybrid approach."
 sp_land_reward_option_weakpoint_data_calibration_aggressive: "Prioritise hard kills on major parasites"
 sp_land_reward_option_weakpoint_data_calibration_efficient: "Prioritise suppression and sustained fire"
 sp_land_reward_option_weakpoint_data_calibration_comprehensive: "Full-spectrum targeting with a slower rollout"

 sp_naval_carrier_fuel_synthesis: "Onboard Jet Fuel Synthesis"
 sp_naval_carrier_fuel_synthesis_desc: "A carrier at sea cannot resupply its air wing indefinitely. By using surplus reactor power to run electrolysis at scale, the ship synthesises jet fuel straight from seawater instead of waiting on tankers."

 srp_carrier_fuel_synthesis: "Electrolytic Fuel Synthesizer"
 srp_carrier_fuel_synthesis_desc: "A modular electrolysis array installed in the lower decks. Uses surplus reactor output to synthesise jet fuel from seawater. Increases the carrier's effective air wing capacity and reduces dependence on fleet replenishment."

 sp_naval_reward_fuel_synthesis_design: "Synthesis Plant Layout"
 sp_naval_reward_fuel_synthesis_design_desc: "The electrolysis array works. Locking in the final layout means deciding how far to push the validation runs before committing to production."
 sp_naval_reward_option_fuel_synthesis_lab_scale_runs: "Run lab scale synthesis trials"
 sp_naval_reward_option_fuel_synthesis_full_deck_trial: "Trial the system at full deck scale"

 sp_land_nuclear_artillery: "Nuclear Artillery"
 sp_land_nuclear_artillery_desc: "The challenge is miniaturising a nuclear warhead enough for self-propelled artillery while keeping the gun intact and the crew alive long enough to relocate."

 srp_nuclear_artillery_eq: "Tactical Nuclear Shell"
 srp_nuclear_artillery_eq_desc: "A miniaturised nuclear warhead designed for artillery delivery. SF6-triggered detonation sequence adapted from the STBN anti-parasite programme. The blast does not distinguish between biological and conventional targets."

 srp_nuclear_artillery_eq_1: "Mk.1 Tactical Nuclear Shell"
 srp_nuclear_artillery_eq_1_desc: "First-generation production model. The yield is carefully calibrated to remain within the gun's safe engagement envelope. Fissile material handling requires specialised crew training and modified ammunition bays."

 srp_nuclear_artillery_brigade: "Nuclear Artillery Battery"
 srp_nuclear_artillery_brigade_desc: "A self-propelled nuclear gun battery. Highly mobile to avoid counter-battery fire after each firing. Crew are specialists in both artillery operations and nuclear ordnance handling."

 sp_land_reward_nuclear_artillery_yield_choice: "Warhead Yield Configuration"
 sp_land_reward_nuclear_artillery_yield_choice_desc: "The prototype warheads have been tested. A final yield decision will determine whether the shell is optimised for defeating hardened targets or for area saturation."
 sp_land_reward_option_nuclear_artillery_yield_choice_precision: "Optimise for hard-target defeat"
 sp_land_reward_option_nuclear_artillery_yield_choice_blast: "Optimise for area saturation"
 sp_land_reward_option_nuclear_artillery_yield_choice_balanced: "Balanced yield with moderate losses in both areas"

 sp_land_reward_nuclear_artillery_fissile_efficiency: "Fissile Material Efficiency Breakthrough"
 sp_land_reward_nuclear_artillery_fissile_efficiency_desc: "A junior member of the team has devised a packing geometry that reduces the critical mass required per shell. The fissile material savings per unit are modest, but significant at scale."
 sp_land_reward_option_nuclear_artillery_fissile_efficiency: "Document the discovery and apply it to production"

 sp_land_nanocomposite: "Nanocomposite Armour"
 sp_land_nanocomposite_desc: "Conventional armour is reaching its limits. Chobham composites and spaced arrays offer diminishing returns. Engineered nanostructure composites represent the theoretical ceiling of passive protection: ceramic-matrix nanolaminates bonded to steel at the molecular level. The production process is slow and chromium-intensive, but the result is armour that defeats anything in current service."

 sp_land_reward_nanocomposite_synthesis_milestone: "Synthesis Breakthrough"
 sp_land_reward_nanocomposite_synthesis_milestone_desc: "The team has cracked the bonding process for the ceramic nanolaminate layers. The composite holds under simulated penetrator impact. Full production is still some way off, but the hardest problem is solved."
 sp_land_reward_option_nanocomposite_synthesis_milestone: "Continue on the current programme"

 sp_land_railgun: "Electromagnetic Railgun"
 sp_land_railgun_desc: "Conventional propellants are a chemical ceiling. An electromagnetic launcher accelerates a kinetic penetrator to velocities that make armour irrelevant, since no plate is thick enough to absorb the impact energy. The engineering problems are power storage, barrel erosion, and thermal management. The prototype works, though it remains far from production-ready."

 sp_land_reward_railgun_power_surge: "Power Surge"
 sp_land_reward_railgun_power_surge_desc: "A capacitor bank discharged unexpectedly during a live test. The degree of damage depends on how quickly the safety systems responded."
 sp_land_reward_option_railgun_power_surge_contained: "Safety systems held. Minor delay only."
 sp_land_reward_option_railgun_power_surge_overload: "The surge propagated into the facility. The lead engineer is injured and the test bay needs repair."

 SRP_orbital_program: "Orbital Programme"
 SRP_orbital_program_desc: "Surveillance satellites deployed: [?SRP_surveillance_satellites|0]\nMilitary satellites deployed: [?SRP_military_satellites|0]\nTotal orbital assets: [?SRP_total_satellites|0]\n\nOrbital nuclear warheads: [?SRP_orbital_regular_warheads|0]\nOrbital thermonuclear warheads: [?SRP_orbital_thermo_warheads|0]\nArmed orbital warheads: [?SRP_orbital_armed_warheads|0]\nMilitary satellite capacity: [?SRP_military_satellites|0]\n\nOrbital picture:\n[EFH.GetNameDef]: [?EFH.SRP_total_satellites|0] total, [?EFH.SRP_military_satellites|0] military, [?EFH.SRP_orbital_armed_warheads|0] armed\n[USA.GetNameDef]: [?USA.SRP_total_satellites|0] total, [?USA.SRP_military_satellites|0] military, [?USA.SRP_orbital_armed_warheads|0] armed\n\nSurveillance tiers: 1, 3, 6, 11, and 21 satellites.\nMilitary satellites can be armed with stockpiled nuclear weapons for orbital strikes and anti-satellite intercepts."
 SRP_launch_surveillance_satellite: "Launch Surveillance Satellite"
 SRP_launch_surveillance_satellite_desc: "Place another reconnaissance and signals platform into orbit. Each launch strengthens the constellation, but the strategic value of each additional satellite declines as coverage becomes redundant."
 SRP_launch_surveillance_satellite_tt: "Adds one surveillance satellite and recalculates orbital surveillance bonuses."
 SRP_launch_military_satellite: "Launch Military Satellite"
 SRP_launch_military_satellite_desc: "Deploy a hardened orbital platform able to coordinate strategic weapons release and anti-satellite intercepts."
 SRP_launch_military_satellite_tt: "Adds one military satellite."
 SRP_arm_orbital_nuclear_warhead: "Arm Orbital Nuclear Warhead"
 SRP_arm_orbital_nuclear_warhead_desc: "Move a stockpiled nuclear weapon into orbit and mate it to a military satellite. The satellite remains in service after launch, but the warhead is consumed."
 SRP_arm_orbital_nuclear_warhead_tt: "Consumes one warhead from the national stockpile and adds one armed orbital nuclear warhead."
 SRP_arm_orbital_thermonuclear_warhead: "Arm Orbital Thermonuclear Warhead"
 SRP_arm_orbital_thermonuclear_warhead_desc: "Move a thermonuclear strike package into orbit and mate it to a military satellite. The satellite remains in service after launch, but the warhead is consumed."
 SRP_arm_orbital_thermonuclear_warhead_tt: "Consumes one warhead from the national stockpile and adds one armed orbital thermonuclear warhead."
 SRP_conduct_asat_intercept: "Conduct ASAT Intercept"
 SRP_conduct_asat_intercept_desc: "Commit orbital tracking, interceptor assets, and launch capacity to destroy part of the rival constellation."
 SRP_asat_operation_tt: "An intercept run against the rival constellation. Armed military platforms are targeted first, and a clean pass takes two."
 SRP_asat_failure_tt: "The intercept fails to destroy any satellites."
 SRP_asat_success_tt: "The intercept destroys one enemy satellite, prioritising armed military platforms."
 SRP_asat_critical_success_tt: "The intercept destroys two enemy satellites, prioritising armed military platforms."
 SRP_orbital_surveillance_tier_1: "Orbital Surveillance Net I"
 SRP_orbital_surveillance_tier_1_desc: "A small orbital constellation improves strategic collection and gives analysts a steadier picture of hostile movement."
 SRP_orbital_surveillance_tier_2: "Orbital Surveillance Net II"
 SRP_orbital_surveillance_tier_2_desc: "Coverage is broad enough to support military intelligence across multiple theatres."
 SRP_orbital_surveillance_tier_3: "Orbital Surveillance Net III"
 SRP_orbital_surveillance_tier_3_desc: "Persistent orbital observation is now part of the national command system."
 SRP_orbital_surveillance_tier_4: "Orbital Surveillance Net IV"
 SRP_orbital_surveillance_tier_4_desc: "The constellation can cross-check signals, imagery, and military movement with limited delay."
 SRP_orbital_surveillance_tier_5: "Orbital Surveillance Net V"
 SRP_orbital_surveillance_tier_5_desc: "The network is dense, redundant, and difficult to blind without a dedicated orbital campaign."
 SRP_orbital_strikes: "Orbital Strikes"
 raid_category_header_SRP_orbital_strikes: "Orbital Strikes"
 tooltip_raid_category_SRP_orbital_strikes: "§HOrbital strikes§!\nNuclear strikes launched from armed military satellites."
 SRP_orbital_nuclear_strike: "Orbital Nuclear Strike"
 SRP_orbital_nuclear_strike_desc: "Release a nuclear weapon through orbital delivery infrastructure. The satellite remains in service, but the warhead is consumed."
