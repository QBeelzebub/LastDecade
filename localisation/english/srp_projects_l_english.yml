 srp_warhead_production: "Warhead Production"
 srp_warhead_production_desc: "Nuclear warheads in reserve: §Y[?SRP_nuclear_warheads|0]§!\n\nManage the strategic warhead reserve. Warhead components assembled on production lines are converted to reserve stockpile automatically each month. Deploy warheads to the active nuclear inventory or return them to reserve as needed."
 srp_warhead_component: "Warhead Component"
 srp_warhead_component_desc: "Precision nuclear warhead assembly for the strategic reserve programme. Requires fissile material. Components are converted to ready warheads automatically each month."
 srp_warhead_component_1: "Strategic Nuclear Warhead"
 srp_warhead_component_1_desc: "Precision nuclear warhead assembly for the strategic reserve programme. Requires fissile material. Components are converted to ready warheads automatically each month."
 SRP_deploy_warhead_to_active: "Deploy Warhead to Active Inventory"
 SRP_deploy_warhead_to_active_desc: "Transfer one nuclear warhead from the strategic reserve into the active nuclear inventory. Once transferred it is available for conventional nuclear strike orders."
 SRP_deploy_warhead_to_active_tt: "Transfers one warhead from the strategic reserve (§Y[?SRP_nuclear_warheads|0]§!) to the active nuclear inventory."
 SRP_return_nuke_to_stockpile: "Return Nuke to Strategic Reserve"
 SRP_return_nuke_to_stockpile_desc: "Withdraw one active nuclear weapon from the national arsenal and return it to the strategic reserve. Reduces the conventional nuclear count by one."
 SRP_return_nuke_to_stockpile_tt: "Removes one active nuclear weapon and returns it to the strategic reserve."
 srp_critical_nuclear_reserve: "Critical Nuclear Reserve"
 srp_critical_nuclear_reserve_desc: "Warhead stockpile has fallen below operational minimums. Production penalties are in effect and all political decisions carry an increased review burden until the reserve is restored."

 srp_nuclear.1.t: "Emergency Council: Warhead Reserve Critical"
 srp_nuclear.1.d: "The joint chiefs have formally notified the council: the strategic warhead reserve has fallen below the minimum operational threshold. Production reallocation has been authorised. Political capital will be consumed at elevated rates until the deficit is corrected."
 srp_nuclear.1.a: "Understood. Prioritise production."
 srp_nuclear.2.t: "NSC/STRATCOM: Warhead Reserve Status"
 srp_nuclear.2.d: "STRATCOM has flagged a shortfall in the ready warhead inventory. The reserve is below the minimum threshold established in the nuclear posture review. SECDEF has authorised the production surge directive."
 srp_nuclear.2.a: "Activate the surge directive."

 sp_land_IRS_adapted_beckon_cultivation: "Adapted Beckon Cultivation"
 sp_land_IRS_adapted_beckon_cultivation_desc: "Standard Beckon Clusters draw biomass slowly from the surrounding root network. With calibrated growth conditions and denser root stock, the refined structure draws considerably more from the same infested ground."

 sp_land_reward_adapted_beckon_growth_choice: "Growth Calibration"
 sp_land_reward_adapted_beckon_growth_choice_desc: "The cultivated stock is viable. The team must decide how aggressively to encourage its spread before locking in the final structure."
 sp_land_reward_option_adapted_beckon_growth_choice_density: "Push for maximum root density"
 sp_land_reward_option_adapted_beckon_growth_choice_caution: "Proceed cautiously, monitor surrounding terrain"

 sp_land_reward_adapted_beckon_overgrowth: "Overgrowth Risk"
 sp_land_reward_adapted_beckon_overgrowth_desc: "The cultivated stock is spreading faster than expected, well beyond the bounds of the test plot. The team must decide whether to contain it or let it run."
 sp_land_reward_option_adapted_beckon_overgrowth_contain: "Contain the spread, slow the programme"
 sp_land_reward_option_adapted_beckon_overgrowth_release: "Let it run, study the results"

 sp_air_IRS_aerial_genome_calibration: "Aerial Genome Calibration"
 sp_air_IRS_aerial_genome_calibration_desc: "The Yelloweye genome has stabilised, but its targeting organs remain crude. By directing further refinement of the strain's sensory clusters, the programme can both sharpen the swarm's strike accuracy and feed fresh genome data into the organism's continued development."

 sp_air_reward_aerial_genome_calibration_drift: "Calibration Drift"
 sp_air_reward_aerial_genome_calibration_drift_desc: "Early test specimens are diverging in two directions, some toward sharper accuracy, others toward sturdier organs. The team must decide which trait to encourage."
 sp_air_reward_option_aerial_genome_calibration_drift_accuracy: "Encourage the accuracy line"
 sp_air_reward_option_aerial_genome_calibration_drift_resilience: "Encourage the resilience line"

 sp_land_KNX_loyal_strain_refinement: "Loyal Strain Refinement"
 sp_land_KNX_loyal_strain_refinement_desc: "The organism cultivated under the Loyal Strain Programme already carries the Vagrant's own biological signature, distinct from the Iris lineage. Continued refinement can mature it into a stable, full expression, a parasite that answers only to its creator."

 sp_land_reward_loyal_strain_expression_choice: "Expression Choice"
 sp_land_reward_loyal_strain_expression_choice_desc: "The maturing strain can be steered toward different traits before its expression stabilises permanently. The team must choose a direction."
 sp_land_reward_option_loyal_strain_expression_choice_aggression: "Steer toward aggression"
 sp_land_reward_option_loyal_strain_expression_choice_resilience: "Steer toward resilience, proceed carefully"

 sp_land_reward_loyal_strain_signature_drift: "Signature Drift"
 sp_land_reward_loyal_strain_signature_drift_desc: "The organism's biological signature is fluctuating during maturation. Left unchecked, it risks drifting back toward baseline Iris patterns."
 sp_land_reward_option_loyal_strain_signature_drift_steady: "Hold the signature steady"
 sp_land_reward_option_loyal_strain_signature_drift_unstable: "Push through the instability"


 sp_air_aerial_genome_calibration_accuracy: "Calibration Drift, Attack"
 sp_air_aerial_genome_calibration_resilience: "Calibration Drift, Resilience"
