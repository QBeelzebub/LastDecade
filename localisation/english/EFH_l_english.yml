l_english:
 EFH_power_balance: "Federal vs H&A influence"
 EFH_federal_authority_side: "European Federation"
 EFH_ha_corporation_side: "H&A Corporation"

 EFH_bop_neutral_range: "Uneasy Balance"
 EFH_bop_ef_low_range: "Federal Consensus"
 EFH_bop_ef_medium_range: "Federal Primacy"
 EFH_bop_ef_total_range: "Federal Dominance"

 EFH_bop_ha_low_range: "Corporate Influence"
 EFH_bop_ha_medium_range: "Corporate Authority"
 EFH_bop_ha_total_range: "Corporate Capture"

 EFH_bop_ef_low_idea: "Federal Consensus"
 EFH_bop_ef_low_idea_desc: "The European Federation's parliament holds a clear mandate. Political capital flows freely through established channels."
 EFH_bop_ef_medium_idea: "Federal Primacy"
 EFH_bop_ef_medium_idea_desc: "The federal government has reasserted its authority over the defence and security apparatus. H&A operates under tighter oversight."
 EFH_bop_ef_total_idea: "Federal Dominance"
 EFH_bop_ef_total_idea_desc: "Brussels is firmly in control. H&A answers to the parliament now, whatever its board minutes say. The army follows a single chain of command."

 EFH_bop_ha_low_idea: "Corporate Influence"
 EFH_bop_ha_low_idea_desc: "H&A's growing role in the parasite response has earned it real political weight. Its recommendations carry more than they used to."
 EFH_bop_ha_medium_idea: "Corporate Authority"
 EFH_bop_ha_medium_idea_desc: "H&A now shapes policy as much as it follows it. Its logistics networks and research arms are things the government cannot do without."
 EFH_bop_ha_total_idea: "Corporate Capture"
 EFH_bop_ha_total_idea_desc: "The line between the European Federation and H&A has all but disappeared. The corporation funds the wars, supplies the armies, and increasingly writes the laws."

 EFH_balance_of_power_category: "Federal-Corporate Balance"

 EFH_assert_federal_authority: "Assert Federal Authority"
 EFH_assert_federal_authority_desc: "The federal government asserts its primacy over the direction of European policy. Spending political capital this way sends a clear signal to Brussels and H&A alike: the state still sets the agenda."

 EFH_ha_lobby_parliament: "H&A Lobbies Parliament"
 EFH_ha_lobby_parliament_desc: "H&A spends its influence on parliamentary opinion. Nothing is offered in a room that keeps minutes."


 EFH_ha_controversial_researcher: "Controversial Hyperbio Employee"
 EFH_ha_controversial_researcher_desc: "Leads the Hyperbiology division's most sensitive work. Her relationship with the Federation's resident vagrants is a subject nobody in administration wants to put in writing."

 EFH_honorable_socdem: "Honorable Social Democrat"
 EFH_honorable_socdem_desc: "A committed defender of democratic values and the social contract. Principled. Respected. The polling data from his districts has been trending in a direction his colleagues find difficult to explain."

 EFH_ashley_woods: "Ashley Woods"
 EFH_ashley_woods_desc: "Star employee of H&A's Hyperbiology division and refuses to treat what she studies as mere weapons research. Her internal reports have a habit of clearing a room. She keeps filing them. Deeply antisocial."

 EFH_henrik_jorgensen: "Henrik Jørgensen"
 EFH_henrik_jorgensen_desc: "A Social Democrat from Aarhus. Longtime advocate for workers' rights, fair wages, and the kind of strong institutions that keep society together. Deeply honorable. Very popular at home."

 EFH_guy_verhofstadt: "Guy Verhofstadt"
 EFH_guy_verhofstadt_desc: "Has been making the case for a unified Europe since before most of his colleagues entered politics. On a first-name basis with every minister on the continent."

 EFH_roberta_metsola: "Roberta Metsola"
 EFH_roberta_metsola_desc: "Speaker of the European Parliament, which is now the institution the Federation shows the public. She has held the chair through four governments and has never lost a confidence vote."

 EFH_manon_aubry: "Manon Aubry"
 EFH_manon_aubry_desc: "Came up through the left flank and never pretended otherwise. Her coalition work is effective precisely because everyone knows where she stands."

 EFH_charles_michel: "Charles Michel"
 EFH_charles_michel_desc: "Former Council president. Has survived more internal crises than most people know about, largely because he saw them coming first."

 EFH_margrethe_vestager: "Margrethe Vestager"
 EFH_margrethe_vestager_desc: "Spent years forcing multinationals to pay their bills and didn't stop when the apocalypse started. The Federation's supply chains function because someone is watching the numbers."

 EFH_thierry_breton: "Thierry Breton"
 EFH_thierry_breton_desc: "Built factories before he built policy. Treats industrial capacity as a strategic asset and has the background to prove it. Has never missed a production deadline in his life."

 EFH_daniel_freund: "Daniel Freund"
 EFH_daniel_freund_desc: "Came to Brussels to fix the institution and has been at it ever since. He publishes what he finds, which is why his inbox is always full."

 EFH_jens_stoltenberg: "Jens Stoltenberg"
 EFH_jens_stoltenberg_desc: "Ran NATO for longer than most of his peers held any office. The Federation inherited his contact list and his conviction that maritime lanes decide wars."

 EFH_josep_borrell: "Josep Borrell"
 EFH_josep_borrell_desc: "Never let diplomacy become an excuse to avoid the harder question of force. His briefings on ground warfare doctrine are blunter than the civil service prefers. The military prefers them for exactly that reason."

 EFH_ska_keller: "Ska Keller"
 EFH_ska_keller_desc: "Came to defence through climate policy and never left. Her models of long-range air deployment aren't dependent on anything but herself."

 EFH_thierry_burkhard: "Thierry Burkhard"
 EFH_thierry_burkhard_desc: "Chief of the Defence Staff. His approach to the parasite front is methodical and aggressive in equal measure."

 EFH_eberhard_zorn: "Eberhard Zorn"
 EFH_eberhard_zorn_desc: "Former German Inspector General. Spent years arguing that European armies needed to move faster. The parasite war proved him right, and he has been very busy since."

 EFH_claudio_graziano: "Claudio Graziano"
 EFH_claudio_graziano_desc: "Former chair of the EU Military Committee. His doctrine of layered defensive lines is the standard template for holding parasite advance zones, and he has not been surprised by one yet."

 EFH_pierre_vandier: "Pierre Vandier"
 EFH_pierre_vandier_desc: "Chief of the Naval Staff. Considers naval superiority a precondition for everything else the Federation wants to achieve, and has the deployment records to argue it."

 EFH_kay_achim_schoenbach: "Kay-Achim Schönbach"
 EFH_kay_achim_schoenbach_desc: "Former German Navy Inspector. His understanding of littoral and supply-interdiction operations has aged well in a world where coastal corridors are contested at every point."

 EFH_stephane_mille: "Stéphane Mille"
 EFH_stephane_mille_desc: "Chief of the Air and Space Force. His doctrine integrates air support directly into ground operations rather than treating it as a separate theatre."

 EFH_ingo_gerhartz: "Ingo Gerhartz"
 EFH_ingo_gerhartz_desc: "German Air Force Inspector. Has run exercises in conditions that ground most conventional aircraft. His squadrons fly in weather other commands won't file a plan for."

 EFH_alfons_mais: "Alfons Mais"
 EFH_alfons_mais_desc: "Was the first senior officer to state publicly that the Federation's infantry was not ready for a war of this kind. He then spent the next three years making sure it was."

 EFH_robert_brieger: "Robert Brieger"
 EFH_robert_brieger_desc: "Austrian general and former EU Military Committee chair. His armoured doctrine was written for a conventional opponent and has been revised twice since the parasite front opened. Both revisions held."

 EFH_margarita_robles: "Margarita Robles"
 EFH_margarita_robles_desc: "Former Spanish Defence Minister, now in uniform. Her strength is logistics: she understands that armies do not move without systems, and systems do not function without oversight."

 EFH_henrique_gouveia: "Henrique Gouveia e Melo"
 EFH_henrique_gouveia_desc: "Portuguese Admiral. His experience with submarine doctrine in the Atlantic has translated directly into the contested coastal corridors the Federation relies on."

 EFH_clara_font: "Clara Font i Arnau"
 EFH_clara_font_desc: "Catalan air general who made her name in contested-airspace operations over the Mediterranean. Has a particular talent for establishing and maintaining air superiority in environments with no clean front line."

 EFH_friedrich_haas_desc: "A senior Federation administrator who concluded, sometime around the third year of the parasite war, that consensus government was a luxury no one could afford. His emergency powers framework was well-designed. He never gave them back."

 EFH_giulia_russo_desc: "Organised the Federation's first general strike in forty years. Was arrested twice, formed two parties, and outlasted both of the governments that jailed her. Believes the war has made her argument for her."

 EFH_edvard_lindstrom_desc: "A former judge who rose through crisis administration and never left. Manages the Federation as a problem of logistics and public order. Does not especially care what people think of him, which is, he says, why things work."

 EFH_party_politics: "Federal Parliament"
 EFH_party_politics_desc: "[GetEFHPartyCurrentGovernment]\n§YAstra Europa:§! [?EFH_party_astra|0]%\n§YVolt Europa:§! [?EFH_party_volt|0]%\n§YAve Europa:§! [?EFH_party_ave|0]%\n§YFederal Continuity Coalition:§! [?EFH_party_continuity|0]%\n§YSocial-Green Compact:§! [?EFH_party_social_green|0]%\n§YSovereigntist Restoration Front:§! [?EFH_party_sovereigntist|0]%\n\n§RSeparatist Pressure:§! [?EFH_separatist_pressure|0]"
 EFH_first_federal_election_mission: "Next Federal Election"
 EFH_first_federal_election_mission_desc: "The first federal election under the new parliamentary party system. The mission timer is the election countdown."
 EFH_regular_federal_election_mission: "Next Federal Election"
 EFH_regular_federal_election_mission_desc: "The next scheduled federal election. The mission timer is the election countdown."
 EFH_party_current_government_astra: "§YCurrent Government:§! Astra Europa\n"
 EFH_party_current_government_volt: "§YCurrent Government:§! Volt Europa\n"
 EFH_party_current_government_ave: "§YCurrent Government:§! Ave Europa\n"
 EFH_party_current_government_continuity: "§YCurrent Government:§! Federal Continuity Coalition\n"
 EFH_party_current_government_social_green: "§YCurrent Government:§! Social-Green Compact\n"
 EFH_party_current_government_sovereigntist: "§YCurrent Government:§! Sovereigntist Restoration Front\n"
 EFH_party_current_government_unknown: "§YCurrent Government:§! Unseated caretaker administration\n"

 efh_party.1.t: "Federal Election Resolver"
 efh_party.1.d: "Votes are being counted across the Federation."
 EFH_campaign_for_astra: "Boost Astra Europa"
 EFH_campaign_for_astra_desc: "Give Astra Europa airtime, organisers, and access to federal policy platforms."
 EFH_campaign_for_volt: "Boost Volt Europa"
 EFH_campaign_for_volt_desc: "Back Volt's technocratic federalist campaign across the metropolitan networks."
 EFH_campaign_for_ave: "Boost Ave Europa"
 EFH_campaign_for_ave_desc: "Support Ave Europa's campaign for a stronger, sovereign, civilisational federation."
 EFH_campaign_for_continuity: "Boost the Continuity Coalition"
 EFH_campaign_for_continuity_desc: "Steady the establishment coalition that has governed the Federation through the long peace."
 EFH_campaign_for_social_green: "Boost the Social-Green Compact"
 EFH_campaign_for_social_green_desc: "Organise social-democratic, green, and left federalists into a governing bloc."
 EFH_campaign_for_sovereigntists: "Boost the Sovereigntists"
 EFH_campaign_for_sovereigntists_desc: "Let the Restoration Front campaign on returning power to Europe's old nations. This will raise separatist pressure."
 EFH_reassure_member_nations: "Reassure Member Nations"
 EFH_reassure_member_nations_desc: "Offer concrete guarantees that federal authority will respect national institutions and local traditions."
 EFH_convene_constitutional_convention: "Convene a Constitutional Convention"
 EFH_convene_constitutional_convention_desc: "Bring federal and national leaders together to re-legitimise the Federation before the crisis escapes parliament."
 EFH_authorize_restoration_referenda: "Authorise Restoration Referenda"
 EFH_authorize_restoration_referenda_desc: "Permit the old nations to test whether the federal mandate still exists. This may push the Federation past the point of no return."

 EFH_party_astra_mandate: "Astra Europa Mandate"
 EFH_party_astra_mandate_desc: "Astra Europa governs on reform faster than the ministries can absorb. The pace unsettles slower institutions."
 EFH_party_volt_mandate: "Volt Europa Mandate"
 EFH_party_volt_mandate_desc: "Volt Europa has formed a progressive technocratic government. Brussels hums with clean dashboards, civic platforms, and policy pilots. The military wing finds the mood too gentle."
 EFH_party_ave_mandate: "Ave Europa Mandate"
 EFH_party_ave_mandate_desc: "Ave Europa governs as a hard-edged federalist movement built on defence spending and a single European identity. Nobody in the cabinet is relaxed."
 EFH_party_continuity_mandate: "Continuity Coalition Mandate"
 EFH_party_continuity_mandate_desc: "The old parliamentary families have held the centre. The Federation moves at the speed its committees move at, which its challengers keep saying out loud."
 EFH_party_social_green_mandate: "Social-Green Compact Mandate"
 EFH_party_social_green_mandate_desc: "A broad left-federalist bloc governs on welfare and the energy transition. The war ministries are not where decisions get made this term."
 EFH_party_sovereigntist_mandate: "Sovereigntist Restoration Mandate"
 EFH_party_sovereigntist_mandate_desc: "The Restoration Front has entered government promising to return power to Europe's old nations. Federal institutions still function, but every cabinet meeting now has an exit sign."
 EFH_separatist_unrest: "Separatist Unrest"
 EFH_separatist_unrest_desc: "Movements for national restoration have left the margins and entered the streets, parliaments, and barracks."
 EFH_restoration_referendum_crisis: "Restoration Referendum Crisis"
 EFH_restoration_referendum_crisis_desc: "The argument over reform is finished. The open question is whether the member nations still consent to be governed from Brussels."

 efh_party.2.t: "Astra Europa Wins the Federal Election"
 efh_party.2.d: "Astra Europa has assembled a federal majority on promises of technological acceleration, democratic federation, and a Europe brave enough to build upward rather than merely hold together."
 efh_party.2.a: "Per Europam ad astra."
 efh_party.3.t: "Volt Europa Wins the Federal Election"
 efh_party.3.d: "Volt Europa has converted its pan-European organising model into a governing mandate. The new parliament speaks in evidence, platforms, and civic trust."
 efh_party.3.a: "A pragmatic revolution."
 efh_party.4.t: "Ave Europa Wins the Federal Election"
 efh_party.4.d: "Ave Europa has taken the federal government on a programme of sovereignty, defence, and cultural cohesion. Its supporters call it seriousness. Its opponents call it a warning."
 efh_party.4.a: "Europe will act."
 efh_party.5.t: "The Continuity Coalition Holds"
 efh_party.5.d: "The established parliamentary families have retained government. They promise competent stewardship, institutional balance, and no unnecessary experiments."
 efh_party.5.a: "The centre holds."
 efh_party.6.t: "The Social-Green Compact Wins the Federal Election"
 efh_party.6.d: "The Social-Green Compact has won on a promise to make the Federation humane, resilient, and civilian-first. Europe will be defended, they say, by making it worth defending."
 efh_party.6.a: "A softer mandate can still hold."
 efh_party.7.t: "The Sovereigntists Win the Federal Election"
 efh_party.7.d: "The Sovereigntist Restoration Front has entered government with a mandate to return powers to the old nations. Every capital in Europe is already testing how much of that promise was rhetoric."
 efh_party.7.a: "The Federation has voted against itself."
 efh_party.20.t: "National Restoration Movements Mobilise"
 efh_party.20.d: "What began as parliamentary theatre has become an organised continental movement. Demonstrations call for old flags, old capitals, and new referenda."
 efh_party.20.a: "This needs containment."
 efh_party.21.t: "Restoration Referenda Demanded"
 efh_party.21.d: "Regional assemblies and national committees now demand formal votes on restored statehood. The federal government has scheduled nothing and refused nothing."
 efh_party.21.a: "The crisis is constitutional now."
 efh_party.22.t: "The Movements Subside"
 efh_party.22.d: "The demonstrations thin out and the committees lose their quorum. The federal answer, patient where it could have been heavy-handed, has taken the heat out of the restoration cause for now. The old flags go back into the cupboards and the argument goes back into the committee rooms."
 efh_party.22.a: "The centre has steadied."
 efh_party.23.t: "The Referendum Question Recedes"
 efh_party.23.d: "With the pressure off, the regional assemblies quietly drop their demands for votes on restored statehood. What was a constitutional crisis becomes, again, a parliamentary grievance the Federation knows how to live with. The federal government has bought itself room, if not a settlement."
 efh_party.23.a: "A crisis deferred is a crisis survived."
 efh_party.30.t: "The Dissolution Congress"
 efh_party.30.d: "The Restoration Front has forced the final question into the chamber: will the Federation concede the return of the old nations, or suppress the restoration movement by force?"
 efh_party.30.a: "Concede the secessions."
 efh_party.30.b: "Suppress the restorations."

