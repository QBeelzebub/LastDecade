 EFH_panama_pressure: "The Panama Question"
 EFH_panama_pressure_desc: "The summit failed. What it left behind is a very specific question: who controls the Panama Canal, and on whose terms. The Federation opens a diplomatic channel."

 EFH_panama_deals: "Canal Zone Economic Footprint"
 EFH_panama_deals_desc: "Trade agreements, port access and a few infrastructure contracts in the Canal Zone. None of them is large. Together they give the Federation a real stake in the region."

 EFH_panama_cores: "Canal Zone: Territorial Claim"
 EFH_panama_cores_desc: "The Federation formally asserts a historical and strategic claim on the Panama Canal Zone. A legal position is established. A negotiated outcome is preferred. A military one remains available."

 EFH_panama_resistance: "Operation: Pressure Valve"
 EFH_panama_resistance_desc: "Federation intelligence assets are activated in the Canal Zone. Civilian resistance to American administration is quietly encouraged. Nothing traceable leads back to Amsterdam."


 EFH_panama_cores_tt: "Asserts the Federation's claim to the Canal Zone and stokes the resistance against American rule."
 EFH_panama_resistance_tt: "Activates resistance operations in American-held Panama Canal Zone states."


 EFH_kaltkrieg_opening_posture: "Finish the kaltkrieg"
 EFH_kaltkrieg_opening_posture_desc: "The European Federation's competitive posture toward the United States survived the peace and hardened into doctrine. Reaffirm it now, before the summit makes any of it awkward to say aloud."

 EFH_summit_position: "The Summit Initiative"
 EFH_summit_position_desc: "A multilateral summit with Washington is being proposed. The Federation must decide how to enter it. Pulling back the sharper rhetoric is the minimum price of a seat at the table."

 EFH_summit_failure_response: "Reassessment"
 EFH_summit_failure_response_desc: "The summit failed. The Federation draws its conclusions. The posture that was softened for diplomacy is restored. Intelligence operations against American interests are approved."

 EFH_northern_theater_preparation: "The Northern Theatre"
 EFH_northern_theater_preparation_desc: "Quebec and Newfoundland remain contested. Regular army formations move to the northern frontier, and supplying them across the Atlantic is expensive."

 EFH_northern_supply_groundwork: "Groundwork"
 EFH_northern_supply_groundwork_desc: "The northern frontier has one road worth the name and no depots behind it. Newfoundland's port is enlarged into a theatre terminal, rail is run west to Southern Ontario, and forward supply is dug in at Ottawa and Toronto."

 EFH_northern_war_authorization: "Northern Escalation Authorisation"
 EFH_northern_war_authorization_desc: "The second summit is over. The diplomatic track is no longer available. Authorisation to engage American forces in the northern theatre is issued."

 EFH_northern_air_campaign: "Northern Air Exercises"
 EFH_northern_air_campaign_desc: "A significant portion of Federation air strength is committed to the Canadian theatre. Sortie rates are high. Air dominance over the northern approaches is the operational priority."

 EFH_northern_air_doctrine: "Atlantic Naval Exercises"
 EFH_northern_air_doctrine_desc: "Air wings and the fleet exercise together over the Atlantic approaches. The interim procedures written after Boston are replaced with ones that have actually been tested."

 EFH_kaltkrieg_doctrine_reform: "Kaltkrieg Military Doctrine"
 EFH_kaltkrieg_doctrine_reform_desc: "Federation ground force doctrine is formally revised for a peer-competitor conflict with the United States. The adjustments are methodical. They have been overdue for years."

 EFH_nuclear_deterrence_posture: "Nuclear Deterrence Posture"
 EFH_nuclear_deterrence_posture_desc: "The Federation's nuclear arsenal exists. Its doctrine now needs clearer signalling, updated delivery systems, and revised targeting parameters."

 EFH_sphere_retention_japan: "Japan: Anchor of the Pacific"
 EFH_sphere_retention_japan_desc: "Japan's continued alignment with the Federation is not guaranteed. American pressure is consistent. The Federation commits the diplomatic and economic capital necessary to hold it."

 EFH_trade_bloc_offensive: "Trade Bloc Offensive"
 EFH_trade_bloc_offensive_desc: "The Federation pushes South American and Chinese trade further onto European routes. The more of it runs through Europe, the harder it is for Washington to pull back."

 EFH_economic_pressure_campaign: "Stock Market Pressure"
 EFH_economic_pressure_campaign_desc: "European markets are closed to American financial instruments for two years. Amsterdam describes it as a policy preference."

 EFH_africa_resources: "The African Question"
 EFH_africa_resources_desc: "The Congo basin holds significant fissile material deposits. Both the Federation and the United States are aware of this. The Federation is moving first."





 EFH_usa_market_exclusion: "European Market Exclusion"
 EFH_usa_market_exclusion_desc: "American financial instruments have been barred from European markets. The economic pressure is sustained and targeted."

 EFH_economic_pressure_tt: "Applies market exclusion to the United States for 730 days."
 EFH_africa_resources_tt: "Initiates Federation resource competition with the United States in the African uranium zone. Congolese uranium begins moving to Federation stockpiles."

 EFH_congo_fissile_concessions: "Secure Congo Fissile Concessions"
 EFH_congo_fissile_concessions_desc: "European negotiators use the Federation's head start in the Congo basin to lock in fissile shipments before Washington can make a counter-offer."
 EFH_congo_fissile_concessions_tt: "Increases fissile material production at the capital by 3 for 180 days."


 EFH_second_space_race: "The Second Space Race"
 EFH_second_space_race_desc: "American orbital activity has expanded sharply since the summit collapsed. The Federation's review board confirms a widening capability gap. A competitive orbital programme is authorised."

 EFH_runway_to_orbit_feasibility: "Commission Laytheo"
 EFH_runway_to_orbit_feasibility_desc: "A study into a reusable spaceplane that takes off and lands on a runway. The question is whether each flight can be made cheap enough to launch satellites every week."

 EFH_laytheo_prototype_authorization: "Laytheo: Prototype Authorisation"
 EFH_laytheo_prototype_authorization_desc: "The feasibility study returned a positive result. A contractor has been selected. Prototype construction is authorised."

 EFH_laytheo_first_flight: "Laytheo: First Flight"
 EFH_laytheo_first_flight_desc: "First successful runway-to-orbit-to-runway cycle completed. Payload deployment confirmed at the planned orbital altitude. Reentry nominal. Recovery crew reports the vehicle is structurally sound."

 EFH_laytheo_surveillance_network: "Laytheo Surveillance Constellation"
 EFH_laytheo_surveillance_network_desc: "Cheap orbital access means cheap satellite deployment. Intelligence assets are placed into low Earth orbit in numbers that would have been economically impossible under expendable-launch doctrine."

 EFH_laytheo_orbital_logistics: "Laytheo: Orbital Logistics"
 EFH_laytheo_orbital_logistics_desc: "Laytheo flies as a reusable single-stage spaceplane, delivering satellites to orbit for a fraction of expendable-launch cost. Communications, observation, and the heavy lift the lunar programme needs all become routine."


 EFH_kaltkrieg_posture: "Kaltkrieg Posture"
 EFH_kaltkrieg_posture_desc: "The Federation's competitive orientation toward the United States is written doctrine. Trade friction and military awareness are maintained as deliberate policy."

 EFH_kaltkrieg_posture_subdued: "Summit Posture"
 EFH_kaltkrieg_posture_subdued_desc: "The sharper edges of Federation policy have been pulled back for the duration of the summit track. The posture itself was never part of the negotiation."



 EFH_boston_air_doctrine_review: "Boston Air Doctrine Review"
 EFH_boston_air_doctrine_review_desc: "The Boston engagement imposed losses that demand formal review. Air units are operating under interim revised procedures while the board works."


 EFH_krakow_commitment: "Krakow Operational Commitment"
 EFH_krakow_commitment_desc: "Federation ground forces are committed fully to the Krakow front. Supply, command, and operational authority are consolidated."

 EFH_kaltkrieg_concluded: "Kaltkrieg Concluded"
 EFH_kaltkrieg_concluded_desc: "The war is over. The threat framing that held Federation public support together for forty years has dissolved. Stability improves while war support evaporates."

 EFH_kaltkrieg_legacy: "Kaltkrieg Legacy"
 EFH_kaltkrieg_legacy_desc: "The institutions and doctrine built over four decades of rivalry are still standing, and ending it has earned the government a great deal of political capital."

 EFH_panama_access: "Panama Canal Access"
 EFH_panama_access_desc: "Unencumbered Federation naval transit through the Canal is now settled."

 EFH_canada_reclamation: "Canadian Reclamation"
 EFH_canada_reclamation_desc: "Canadian territory is being brought back under Federation administration. Manpower from newly recovered states is feeding the army. Supply lines from here to the front are stretched."



 EFH_spaceplane_feasibility_study: "Spaceplane Feasibility Study (Active)"
 EFH_spaceplane_feasibility_study_desc: "The runway-to-orbit feasibility study is underway. A contractor selection process has been initiated in parallel."

 EFH_laytheo_in_development: "Laytheo In Development"
 EFH_laytheo_in_development_desc: "The Laytheo prototype is under construction. First flight is targeted within the programme timeline."





 EFH_haa_aerospace_contract: "H&A Aerospace Contract"
 EFH_haa_aerospace_contract_desc: "H&A Aerospace leads the Laytheo programme. Nobody else in Europe has the engineering depth, which gives H&A a say in how Europe reaches orbit."

 EFH_haa_timeline_compression: "H&A Timeline Compression"
 EFH_haa_timeline_compression_desc: "H&A's existing supply chain and engineering depth are pulling the prototype build ahead of the programme schedule."

 EFH_airbus_contract: "Airbus Consortium Contract"
 EFH_airbus_contract_desc: "The established consortium is managing the Laytheo build. Known workforce. Known supply chains."

 EFH_esa_contract: "ESA Directorate Contract"
 EFH_esa_contract_desc: "The ESA Directorate leads the Laytheo programme. It keeps the programme in federal hands and takes longer to do it."

 EFH_esa_timeline_penalty: "ESA Programme Schedule"
 EFH_esa_timeline_penalty_desc: "ESA's institutional procurement processes are proceeding at their own pace. The programme will not be rushed."


 EFH_spaceplane: "Laytheo Programme"
 EFH_spaceplane_desc: "Decisions related to the Laytheo reusable spaceplane programme."

 EFH_laytheo_contractor_selection: "Laytheo Programme: Select Contractor"
 EFH_laytheo_contractor_selection_desc: "The feasibility study has concluded. The review board has identified three viable contractors. A selection must be made before prototype construction can be authorised."


 efh.1.t: "Laytheo Programme: Contractor Selection"
 efh.1.d: "The review board has three viable contractors for Laytheo: H&A Aerospace, the Airbus Consortium and the ESA Directorate. They differ on cost, speed and who ends up owning the programme."
 efh.1.a: "H&A Aerospace. It has already proven itself in the 1st space race."
 efh.1.b: "The Airbus Consortium. Expertise in atmospheric flight, lacking in spaceflight."
 efh.1.c: "The ESA. The programme belongs to the Federation, not to a contractor."


 efh.2.t: "Laytheo: Prototype Construction Authorised"
 efh.2.d: "The selected contractor has taken delivery of the programme documentation and initial material allocations. Ground is broken on the prototype assembly facility. The timeline has formally begun."
 efh.2.a: "Noted."


 efh.3.t: "Laytheo: First Flight Confirmed"
 efh.3.d: "First runway departure at 06:14. Orbital insertion confirmed at T+14 minutes. Payload separated. Reentry burn nominal. Runway recovery at 09:41. The vehicle is intact. The programme has succeeded."
 efh.3.a: "Outstanding."


 efh.4.t: "The Second Canadian Summit"
 efh.4.d: "The second Canadian summit on the disputed eastern territories is ready to convene. How it goes depends on how far the rivalry with Washington has already run."
 efh.4.a: "Convene the summit."
 efh.4.b: "Not yet. Hold on the frontier."


 efh.5.t: "The Panama Approach"
 efh.5.d: "Federation naval planners have presented options for securing Canal access. The outcome of the Kaltkrieg has improved the Federation's negotiating position considerably."
 efh.5.a: "Proceed."


 efh.6.t: "The Canadian Reclamation"
 efh.6.d: "The Kaltkrieg's resolution has opened the way to recovering full Canadian territories. A clearance campaign is required alongside the political settlement."
 efh.6.a: "Begin the reclamation."


 efh.20.t: "The Second Canadian Summit"
 efh.20.d: "The second Canadian summit convened on 15 November to discuss the Eastern territories. The Federation proposed a referendum in both halves of Canada on which power they belong to.\n\nThe American delegation refused to table it. Six hours in, the agenda has not moved past the first item, and the Federation delegation has stopped pretending it expects it to."
 efh.20.a: "§RThen somebody in the room fires.§!"


 efh.23.t: "The Battle of Boston"
 efh.23.d: "The strike package went in against the Boston approaches at 04:10 local. American interceptors were already at altitude, in numbers the pre-strike assessment had ruled out, and the escort came apart inside four minutes.\n\nEleven aircraft did not come back. Four more were written off on the ground at Goose Bay. The Air Staff has grounded the package and convened a doctrine board. Until it reports, the wings fly interim procedures that nobody has trained on."
 efh.23.a: "Convene the board."


 EFH_summit_decision_unlocked_tt: "Summit diplomatic decisions are now available."
 EFH_intel_ops_unlocked_tt: "Intelligence operations against American interests are now authorised."
 EFH_canadian_divisions_deploy_tt: "Deploy Federation ground divisions to the Quebec and Newfoundland frontier."
 EFH_air_deploy_tt: "Commit Federation air wings to Canadian theatre operations."
 EFH_laytheo_beckon_detection_tt: "Laytheo satellites feed the intelligence picture: +20% Intel Network Gain through Operation Laytheo, and Beckon growth is detected in states bordering the Federation."
 EFH_laytheo_orbital_logistics_tt: "Cheap reusable launch capability. Unlocks the lunar programme and supports satellite-assisted research."
 EFH_war_deferred_tt: "Operations are held. The order can be issued later."
 EFH_canada_clearance_chain_tt: "Beckon clearance operation decisions for infested Canadian states will become available."
 EFH_esa_fissile_reduction_tt: "ESA programme management reduces fissile material costs on Laytheo-related decisions by 15."


 EFH_summit: "Summit Diplomacy"
 EFH_summit_desc: "Decisions relating to the Federation-American summit process."

 EFH_summit_convene: "Convene the Summit"
 EFH_summit_convene_desc: "The Federation has signalled its intent to negotiate. Formally convening the summit commits diplomatic capital and starts the clock."

 efh.10.t: "The Summit Convenes"
 efh.10.d: "Federation and American delegations have arrived. The agenda runs to forty items, and neither side has agreed on the order."
 efh.10.a: "Watch what develops."

 efh.11.t: "The Summit Has Failed"
 efh.11.d: "The delegations have departed without an agreement. The Federation's position was not accepted. The American position was not accepted. The talks are over."
 efh.11.a: "Then we draw our conclusions."


 EFH_eter_completion: "ETER Commissioning"
 EFH_eter_completion_desc: "The European Thermonuclear Energy Reactor, Europe's answer to the international fusion programme, enters commercial operation at its primary facility near Amsterdam."

 EFH_industrial_surge: "Industrial Mobilisation"
 EFH_industrial_surge_desc: "Cheap fusion power lets the core industrial regions in France, Germany and the Rhineland expand their factories faster."

 EFH_construction_acceleration: "Construction Priority Programme"
 EFH_construction_acceleration_desc: "Procurement for capital construction is handled centrally instead of by each member state, and new infrastructure comes online ahead of schedule."

 EFH_defense_conversion: "Dual-Use Industrial Capacity"
 EFH_defense_conversion_desc: "Several civilian manufacturing complexes in France and Germany are upgraded to dual-use status, enabling rapid conversion to defence production when required."

 EFH_fusion_licensing_act: "Commercial Fusion Licensing Act"
 EFH_fusion_licensing_act_desc: "With ETER online, the Federation writes the regulatory framework for commercial fusion and, in the same act, clears the way for private and state utilities to build and operate their own reactors, years ahead of the rest of the world."

 EFH_research_coordination: "European Research Framework"
 EFH_research_coordination_desc: "The Federation consolidates its research funding under a unified European Research Council mandate, accelerating collaborative projects in electronics and advanced computing."

 EFH_industrial_rnd: "Industrial R&D Programme"
 EFH_industrial_rnd_desc: "Targeted grants to the Federation's manufacturing sector fund applied research into production efficiency and industrial automation."

 EFH_doctrine_investment: "Doctrine Review Board"
 EFH_doctrine_investment_desc: "A cross-service review board examines lessons from recent joint exercises and updates Federation land forces doctrine, incorporating advances in combined-arms coordination."

 EFH_parasite_early_research: "Anomalous Biology Programme"
 EFH_parasite_early_research_desc: "A few European research institutes open formal studies of the outbreak in sub-Saharan Africa, working from samples and field reports."

 EFH_joint_training_command: "Joint Defence Academy Network"
 EFH_joint_training_command_desc: "The Doctrine Review Board's recommendations become permanent. Member states share their military academies and teach one doctrine at officer level."

 EFH_xenobiology_directorate: "Federal Xenobiology Directorate"
 EFH_xenobiology_directorate_desc: "The Anomalous Biology Programme is nationalised and expanded. Amsterdam does not like what the universities have been finding. The Directorate is given classified clearance, federal funding, and a mandate to understand what is spreading across the continent."

 EFH_federal_research_institute: "Federal Research Institute"
 EFH_federal_research_institute_desc: "The Federation formalises its wartime science programme. An agency answering to the Council of Ministers coordinates research across member states and handles security clearances. A third research division opens."



 EFH_federal_mandate: "Federal Governing Mandate"
 EFH_federal_mandate_desc: "The government renews its mandate with a package of administrative reforms, and Amsterdam gets more say over member-state budgets."

 EFH_centralize_emergency_powers: "Centralise Emergency Powers"
 EFH_centralize_emergency_powers_desc: "Amsterdam invokes its emergency coordination authority and overrides the member states to mobilise the Federation as one body. The periphery resents it."

 EFH_member_state_compact: "Member-State Compact"
 EFH_member_state_compact_desc: "Member states write the terms of federal coordination alongside Amsterdam, so they have less reason to fight it. It takes longer."

 EFH_parliamentary_consolidation: "Parliamentary Consolidation"
 EFH_parliamentary_consolidation_desc: "The Federal Parliament writes the new arrangement into procedure, so the executive can act without asking twice."

 EFH_arsenal_of_regulation: "Arsenal of Regulation"
 EFH_arsenal_of_regulation_desc: "The Federal Parliament adopts a unified compliance framework consolidating thirty-one separate national regulatory codes into a single harmonised standard, covering everything from industrial emissions to the permissible curvature of agricultural produce. Implementation across member state ministries is expected to proceed steadily, pending review."

 EFH_modernization_program: "Armed Forces Modernisation"
 EFH_modernization_program_desc: "A five-year plan for the European Defence Force: common training, common equipment, and national contingents under one command."







 EFH_parasite_threat_assessment: "Anomaly Assessment Programme"
 EFH_parasite_threat_assessment_desc: "Reports of contaminated soil and unfamiliar organisms are coming in from three continents. Federation intelligence is tasked with putting them in one place and working out what is spreading where."

 EFH_continental_monitoring_network: "Continental Monitoring Network"
 EFH_continental_monitoring_network_desc: "A joint signals and ground observation network spanning Federation territory. Designed for early warning of infestation spread."

 EFH_federal_emergency_protocols: "Federal Emergency Protocols"
 EFH_federal_emergency_protocols_desc: "Parliament passes emergency legislation giving the federal government wider authority over the civilian response."

 EFH_joint_anti_parasite_command: "Joint Anti-Parasite Command"
 EFH_joint_anti_parasite_command_desc: "A unified command structure for all military assets engaged in parasite response. Doctrine and logistics are standardised across Federation member states for the first time."




 EFH_joint_parasite_command_standing: "Federal Parasite Response Directorate"
 EFH_joint_parasite_command_standing_desc: "Assessment, monitoring, the emergency mandate and joint command are merged into one permanent directorate in Amsterdam."

 EFH_threat_briefing_data: "Continental Threat Briefing"
 EFH_threat_briefing_data_desc: "The latest monitoring case data is circulating through the laboratories and the intelligence directorates."

 EFH_joint_command_ready: "Joint Command Readiness"
 EFH_joint_command_ready_desc: "Recent multi-state exercises have left Federation forces rehearsed and coordinated against the current threat picture."

 EFH_naval_modernization: "Naval Modernisation"
 EFH_naval_modernization_desc: "The fleet is refitted for Atlantic work: newer escorts, longer patrols, and ports that can service both."

 EFH_blue_water_doctrine: "Blue-Water Doctrine"
 EFH_blue_water_doctrine_desc: "The Federation builds toward a blue-water fleet of its own. Doctrine is rewritten for long-range operations, submarines and contaminated shipping lanes."

 EFH_ha_naval_integration: "H&A Naval Integration"
 EFH_ha_naval_integration_desc: "The Federation hands naval procurement to H&A instead of expanding the state yards. H&A's shipbuilders move faster, and H&A gains more leverage over the state."



 EFH_air_force_modernization: "Air Force Modernisation"
 EFH_air_force_modernization_desc: "New airbases across France and Germany bring Federation tactical air within range of any prospective front."

 EFH_ha_aerospace_integration: "H&A Aerospace Integration"
 EFH_ha_aerospace_integration_desc: "The Federation contracts H&A's aerospace division to lead air procurement. Development accelerates on corporate terms, deepening H&A's hold over the Federation's military supply."

 EFH_strategic_air_doctrine: "Strategic Air Doctrine"
 EFH_strategic_air_doctrine_desc: "Strategic bombing doctrine is rewritten for stealth profiles and longer range."



 EFH_industrial_core_expansion: "Industrial Core Expansion"
 EFH_industrial_core_expansion_desc: "The ETER-powered industrial core expands outward from Holland. France and Belgium receive the first round of new plant construction, backed by fusion-grid power."

 EFH_fissile_foundation: "Fissile Foundation"
 EFH_fissile_foundation_desc: "Building slots are prepared across Holland and Germany for the next phase of industrial investment, whether that means fissile production or expanded civilian capacity."

 EFH_fissile_plant_program: "Fissile Plant Programme"
 EFH_fissile_plant_program_desc: "Fissile extraction plants are built next to the ETER sites in Holland and the Rhineland, giving the Federation a steady supply of its own."

 EFH_civil_expansion: "Civil Industrial Expansion"
 EFH_civil_expansion_desc: "Prioritizing the economy of our biggest internal nations, in lieu of a single material. Seems like a much better use of administrative time."

 EFH_nuclear_fuel_cycle: "Nuclear Fuel Cycle"
 EFH_nuclear_fuel_cycle_desc: "A closed fissile fuel cycle is completed, maximising extraction yield from existing sites."

 EFH_reconstruction_bureau: "Reconstruction Bureau"
 EFH_reconstruction_bureau_desc: "A federal reconstruction bureau coordinates construction investment across Benelux and the Rhineland."

 EFH_industrial_core_surge: "ETER Industrial Surge"
 EFH_industrial_core_surge_desc: "Fusion-grid power drives a temporary but significant boost to construction throughput and factory output."





 EFH_end_of_long_peace: "End of the Long Peace"
 EFH_end_of_long_peace_desc: "The Federation enters its fourth decade as the settled power of the Atlantic. Washington restless as usual, but the public has stopped paying attention to it. Federal planners are asked to prepare for the worst."

 EFH_federal_state_of_the_union: "State of the Federation"
 EFH_federal_state_of_the_union_desc: "A formal accounting before the federal parliament: budgets, member-state grievances, the standing of the parties, and the condition of the armed forces. Routine work, for now."

 EFH_consolidate_federal_authority: "Consolidate Federal Authority"
 EFH_consolidate_federal_authority_desc: "Quiet pressure through the federal machinery to strengthen the governing coalition and the technocratic centre at the expense of the sovereigntist bloc. Amsterdam prefers its federation governed from the middle, and the parliament is reminded of it."

 EFH_member_state_accord: "Member-State Accord"
 EFH_member_state_accord_desc: "A negotiated settlement with the old capitals in Paris, Berlin, Rome, Madrid and Warsaw. They get more local autonomy and recommit to the federal compact in return. Warsaw asked for the most and got most of it."

 EFH_industrial_procurement_strategy: "Industrial Procurement Strategy"
 EFH_industrial_procurement_strategy_desc: "A structured procurement arrangement with H&A: the Federation brings the budget, H&A brings the infrastructure and expertise. H&A will have opinions about how the budget is spent."

 EFH_ha_research_consortium: "H&A Research Consortium"
 EFH_ha_research_consortium_desc: "A formal research partnership with H&A's scientific divisions. It costs political capital and gives H&A a say in what the Federation researches."

 EFH_ha_supply_dominance: "H&A Supply Dominance"
 EFH_ha_supply_dominance_desc: "The Federation takes control of H&A's supply networks and leaves the research to H&A. Logistics and procurement answer to the state, and industrial allocation stays a federal decision."

 EFH_market_resource_agreements: "Market Resource Agreements"
 EFH_market_resource_agreements_desc: "Long-term resource contracts through H&A's supplier networks. Markets are volatile, and a contract signed early is cheaper than one signed in a hurry."
 EFH_market_resource_agreements_tt: "Secures +100 £resources_strip|5, +50 £resources_strip|6, and +50 £resources_strip|2 from locked-in supplier contracts."


 EFH_long_peace_dividend: "The Long Peace Dividend"
 EFH_long_peace_dividend_desc: "Decades without a continental war have left the Federation wealthy and its factories pointed at civilian work. While the peace lasts, that surplus can be put to productive use."

 EFH_continental_defense_review: "Continental Defence Review"
 EFH_continental_defense_review_desc: "A peacetime audit of the Federation's combined forces. No mobilisation, no alarm, just a measurement of the distance between the army the Federation has and the army its planners quietly assume it will need."

 EFH_standing_force_reform: "Standing Force Reform"
 EFH_standing_force_reform_desc: "Professionalise the standing army through the long peace: better training pipelines, harmonised doctrine across the member-state contingents, and a faster path from recruit to deployable formation."

 EFH_alignment_initiative: "Alignment Initiative"
 EFH_alignment_initiative_desc: "A coordinated diplomatic effort to draw undecided powers toward the Federation and away from Washington, mostly through trade and technical cooperation."

 EFH_eastern_outreach: "Eastern Outreach"
 EFH_eastern_outreach_desc: "Trade missions into the South American Confederation's markets, and a discreet line to Beijing. Both suit the Federation, and both annoy Washington."
 EFH_eastern_outreach_tt: "Opens early contact with the South American Confederation and China, and deepens technical cooperation."

 EFH_atlantic_rivalry_doctrine: "Atlantic Rivalry Doctrine"
 EFH_atlantic_rivalry_doctrine_desc: "Codify what every federal planner already assumes: the United States is the Federation's main strategic rival."

 EFH_northern_intelligence_posture: "Northern Intelligence Posture"
 EFH_northern_intelligence_posture_desc: "Intelligence groundwork along the northern approaches and the Canadian frontier, where the Federation and the United States already share a disputed border."
 EFH_northern_intelligence_posture_tt: "Establishes federal intelligence groundwork on the northern frontier."

 EFH_canal_zone_watch: "Canal Zone Watch"
 EFH_canal_zone_watch_desc: "Federal attention turns to the Panama Canal, the maritime chokepoint that any Atlantic contest with the United States would eventually run through. Contacts are opened, traffic is studied, and options are kept open."
 EFH_canal_zone_watch_tt: "Opens federal contacts in the Panama Canal Zone."






 EFH_the_federal_question: "The Federal Question"
 EFH_the_federal_question_desc: "The coming federal contest decides, again, how much power sits in Amsterdam and how much in the old national capitals."

 EFH_federalist_coalition: "A Federalist Mandate"
 EFH_federalist_coalition_desc: "Throw the Federation's weight behind the technocratic-federalist bloc. A stronger centre, and the sovereigntist argument pushed back to the margins where Amsterdam prefers it."

 EFH_sovereigntist_bloc: "The Nations Reassert"
 EFH_sovereigntist_bloc_desc: "Let the sovereigntist-nationalist wing carry the contest. Power flows back toward the old capitals and their flags. It plays well in Paris and Warsaw, and it raises the pressure the Federation was built to contain."

 EFH_govern_the_federation: "Govern the Federation"
 EFH_govern_the_federation_desc: "The new coalition takes its seats and gets on with holding twenty-odd nations together."

 EFH_force_structure_debate: "The Force Structure Debate"
 EFH_force_structure_debate_desc: "The defence review forces a question the long peace let the Federation defer: what kind of army a continental federation actually needs. The general staff is divided, and a decision can no longer be postponed."

 EFH_professional_army: "A Professional Army"
 EFH_professional_army_desc: "Build a smaller, highly trained professional federal force. Quality over mass: better-led, better-drilled formations that can be relied on without calling up a generation."

 EFH_mass_mobilization_base: "Mass Mobilisation Base"
 EFH_mass_mobilization_base_desc: "Build the reserves, depots and call-up machinery for an army that can grow quickly. Peacetime polish is traded for numbers."

 EFH_modern_federal_army: "A Modern Federal Army"
 EFH_modern_federal_army_desc: "The Federation's land forces come out of the debate on current equipment, with a command structure built for this decade."

 EFH_combined_arms_command: "Combined Arms Command"
 EFH_combined_arms_command_desc: "Stand up a unified combined-arms command to bind the member-state contingents into something that fights as one army rather than several."

 EFH_the_standoff: "The Standoff"
 EFH_the_standoff_desc: "Federation and American forces watch each other across the Atlantic and the pole. The Federation writes down how it intends to hold that standoff."

 EFH_nuclear_brinkmanship: "Nuclear Brinkmanship"
 EFH_nuclear_brinkmanship_desc: "Make the deterrent the centrepiece of the standoff: warheads, delivery systems, and a doctrine that says when they would be used."

 EFH_conventional_primacy: "Conventional Primacy"
 EFH_conventional_primacy_desc: "Build the conventional forces to win the contest without the warheads. If it comes to a fight, the Federation intends to bring the larger and better-prepared army to the field."

 EFH_brinkmanship_posture: "Brinkmanship Posture"
 EFH_brinkmanship_posture_desc: "The Federation settles into a fixed posture toward the United States and can hold it there as long as it likes."

 EFH_war_readiness_directive: "War Readiness Directive"
 EFH_war_readiness_directive_desc: "Stockpiles, mobilisation plans and command exercises for a war with the United States, kept low-key enough not to make the news."

 EFH_tokyo_dialogue: "The Tokyo Dialogue"
 EFH_tokyo_dialogue_desc: "Open and formalise the conversation with Tokyo in one step. Japan is the Federation's natural partner across the Pacific rivalry, and both governments would rather build the relationship before they need it."
 EFH_tokyo_dialogue_tt: "Opens early diplomatic contact with Japan."

 EFH_pacific_security_cooperation: "Pacific Security Cooperation"
 EFH_pacific_security_cooperation_desc: "Deepen the partnership into the military domain: joint exercises, basing arrangements, and shared intelligence. Washington will read it as encirclement, which is not entirely wrong."

 EFH_techno_industrial_compact: "Techno-Industrial Compact"
 EFH_techno_industrial_compact_desc: "Tie the Federation and Japan together through shared research and integrated supply chains instead of arms."

 EFH_efh_japan_axis: "The Pacific Axis"
 EFH_efh_japan_axis_desc: "The Federation and Japan formalise a standing partnership. Japan becomes Europe's closest ally on the far side of the world."
 EFH_efh_japan_axis_tt: "Establishes the formal EF-Japan partnership."

 EFH_groundwork_japan_axis_tt: "The pre-crisis EF-Japan axis makes this a formality: +25 Political Power."
 EFH_groundwork_japan_contact_tt: "Early diplomatic contact with Tokyo pays off: +20 Political Power."
 EFH_groundwork_pacific_framework_tt: "The Pacific framework signed before the crisis carries the pact: +25 Political Power, +3% War Support."
 EFH_groundwork_sac_tt: "Early economic contact with the Confederation pays off: +20 Political Power."
 EFH_groundwork_china_tt: "Early diplomatic contact with Beijing pays off: +20 Political Power."
 EFH_groundwork_canal_tt: "Federal contacts in the Canal Zone are already in place: +15 Political Power, +10 Navy Experience."
 EFH_groundwork_war_plan_tt: "The continental war plan drawn before the crisis guides the deployment: +25 Army Experience, +3% War Support."
 EFH_groundwork_federation_tt: "The consolidated federation answers with one voice: +25 Political Power, +2% Stability."
 EFH_groundwork_civil_society_tt: "The home front braced in peacetime absorbs the shock: a further reduction in public panic and +3% Stability."
 EFH_groundwork_procurement_tt: "The standing procurement framework gives H&A's reorientation a running start: H&A Logistics MIO funding."
 EFH_groundwork_procurement_ha_tt: "Built around the H&A consortium, the framework pays double: further H&A Logistics MIO funding and +25 Political Power."
 EFH_groundwork_doctrine_professional_tt: "The professional-army build deploys a sharper cadre to the northern theatre: +25 Army Experience and a lasting organisation and morale edge."
 EFH_groundwork_doctrine_mass_tt: "The mass-mobilisation base puts more trained bodies in the northern theatre: +20,000 Manpower."
 EFH_groundwork_standoff_nuclear_tt: "The nuclear-centred standoff gives the deterrence posture a warhead-programme head start: further H&A Thermonuclear MIO funding."
 EFH_groundwork_standoff_conventional_tt: "The conventional standoff hands the posture hardened command and readiness instead: +50 Command Power and +20 Army Experience."
 EFH_groundwork_japan_security_tt: "The early security-led partnership matures into a hardened military pact: +25 Navy and +25 Air Experience."
 EFH_groundwork_japan_techno_tt: "The early techno-industrial partnership matures into shared R&D: an electronics research bonus."
 EFH_later_doctrine_professional_tt: "§YLater§!: §YThe Northern Theatre§! adds +25 Army Experience and a lasting organisation and morale edge on this path."
 EFH_later_doctrine_mass_tt: "§YLater§!: §YThe Northern Theatre§! adds +20,000 Manpower on this path."
 EFH_later_standoff_nuclear_tt: "§YLater§!: §YNuclear Deterrence Posture§! adds H&A Thermonuclear MIO funding on this path."
 EFH_later_standoff_conventional_tt: "§YLater§!: §YNuclear Deterrence Posture§! adds +50 Command Power and +20 Army Experience on this path."
 EFH_later_japan_security_tt: "§YLater§!: §YPacific Defence Pact§! adds +25 Navy and +25 Air Experience on this path."
 EFH_later_japan_techno_tt: "§YLater§!: §YPacific Defence Pact§! adds an electronics research bonus on this path."
 EFH_later_civic_demos_tt: "§YLater§!: §YA Society on the Eve§! adds +3% War Support on this path."
 EFH_later_civic_homelands_tt: "§YLater§!: §YA Society on the Eve§! adds +3% Stability on this path."
 EFH_later_procurement_framework_tt: "§YLater§!: §YThe Board Reorients§! adds H&A Logistics MIO funding."
 EFH_later_procurement_ha_tt: "§YLater§!: if the §YStanding Procurement Framework§! is in place, §YThe Board Reorients§! pays its H&A Logistics MIO funding twice and adds +25 Political Power."
 EFH_later_cordon_tt: "§YLater§!: §YContinental Containment Exercise§! adds §G+2%§! Stability on this path."
 EFH_later_contracted_tt: "§YLater§!: §YContinental Containment Exercise§! adds H&A land division MIO funding on this path."
 EFH_later_biosecurity_tt: "§YLater§!: §YContinental Monitoring Network§! adds +25 Political Power and a parasite research bonus, and the 2019 contamination scare is caught on the second day instead of the forty-third."









 efh.60.t: "End of the Long Peace"
 efh.60.d: "For most of a generation the worst thing the Federation had to fear was the United States. The maps have not changed and neither have the briefings. The planners asked to prepare for the worst have not been told what the worst is."
 efh.60.a: "Business as usual."
 efh.50.t: "The Federal Question"
 efh.50.d: "The Federation goes into a federal election about the usual thing: how much power sits in Amsterdam and how much in the old capitals. By the standards of the century it is a quiet campaign."
 efh.50.a: "Let the contest decide."

 efh.51.t: "A Federalist Mandate"
 efh.51.d: "The technocratic-federalist bloc wins. The centre gets stronger, and the sovereigntists go quiet for now."
 efh.51.a: "The centre holds."

 efh.52.t: "The Nations Reassert"
 efh.52.d: "The sovereigntist wing wins its case and power tilts back toward the old capitals. The old flags come out in Paris and Warsaw."
 efh.52.a: "The nations have spoken."

 efh.53.t: "Nuclear Close Call"
 efh.53.d: "A misread exercise and a tracking error sent a warning further up both chains of command than anyone meant it to go. For about three hours the Atlantic standoff was closer to a launch than ever. Then someone checked the tracking data again."
 efh.53.a: "We held our nerve."
 efh.53.b: "The deterrent did its work."

 efh.54.t: "The Pacific Axis"
 efh.54.d: "In a signing both governments keep deliberately modest, the European Federation and Japan formalise a standing partnership. The point of it is that Japan sits on the other side of the United States."
 efh.54.a: "An ally worth keeping."

 EFH_federation_on_the_eve: "The Federation on the Eve"
 EFH_federation_on_the_eve_desc: "The Federation enters the new decade about as consolidated as it is going to get."

 EFH_federal_war_college: "The Federal War College"
 EFH_federal_war_college_desc: "Codify what the modernised army has learned into doctrine and pass it on. The Federation enters the decade with a professional officer corps and a way of fighting it can actually teach."

 EFH_continental_war_plan: "The Continental War Plan"
 EFH_continental_war_plan_desc: "The general staff finishes its plan for a war with the United States across the northern approaches. It is filed and rehearsed."

 EFH_pacific_framework: "The Pacific Framework"
 EFH_pacific_framework_desc: "Set the partnership with Japan on a standing institutional footing that will outlast any single government."



 EFH_continental_war_plan_spirit: "Continental War Plan"
 EFH_continental_war_plan_spirit_desc: "A rehearsed plan for war with the United States: better organisation and a combat edge against American forces."


 EFH_the_brittle_hegemon: "The Brittle Hegemon"
 EFH_the_brittle_hegemon_desc: "On paper the Federation is the closest thing the world has to a hegemon. Up close it is a stack of compromises between old nations, leaning a little harder each year on the firms that keep the lights on."
 EFH_a_continental_demos: "A Continental Demos"
 EFH_a_continental_demos_desc: "Treat the Federation as one people instead of a treaty between capitals: a shared civic identity, taught and funded from the centre. It cuts hardest into separatist pressure and lifts the federalist parties."
 EFH_a_union_of_homelands: "A Union of Homelands"
 EFH_a_union_of_homelands_desc: "Govern the Federation as a union of homelands that keep their own languages, capitals and pride, and consent to be governed because consent is cheaper than coercion. It eases the periphery without forcing the question, and the old parliamentary families approve."
 EFH_the_prosperity_dividend: "The Prosperity Dividend"
 EFH_the_prosperity_dividend_desc: "Decades without a great war have left the Federation rich in the unglamorous ways: efficient supply, full shelves, quiet streets. Spend some of it on the civilian base and put real industry into the continental core."
 EFH_public_institutions_first: "Public Institutions First"
 EFH_public_institutions_first_desc: "Schools, clinics, transit and public records stay federal, even where a contractor could run them cheaper. It costs money, and it keeps them answerable to voters."
 EFH_the_corporate_commons: "The Corporate Commons"
 EFH_the_corporate_commons_desc: "H&A logistics moves the freight, H&A networks carry the data, H&A labs do the science. The Federation gets capability it could not build alone, and people stop noticing which services are public."
 EFH_a_society_on_the_eve: "A Society on the Eve"
 EFH_a_society_on_the_eve_desc: "Take stock of the home front and shore up where it is thin, without alarming anyone."

 EFH_civic_echo_demos_tt: "One continental people braces as a single will: +3% War Support."
 EFH_civic_echo_homelands_tt: "A union held together by consent braces as a durable settlement: +3% Stability."

 efh.55.t: "The State of the Union"
 efh.55.d: "The State of the Federation address is sober by design: growth is fine, the borders are quiet. The reviews behind it found reserves that only exist on paper and a civil defence plan last updated in 2004."
 efh.55.a: "Get to work on the list."
 efh.56.t: "One People"
 efh.56.d: "The new civic programme asks the nations to belong to something larger first, and lets them keep everything else. It is taught in the schools and printed on the documents and, slowly, it takes. For the first time in a generation the separatist argument is the one having to explain itself."
 efh.56.a: "One Federation, one people."
 efh.57.t: "A Union of Homelands"
 efh.57.d: "Amsterdam stops pretending the capitals are an administrative inconvenience. The languages, the holidays, the old pride are written into how the Federation governs rather than around it, and the periphery, asked rather than told, mostly says yes."
 efh.57.a: "Held together by consent."
 efh.58.t: "The Corporate Commons"
 efh.58.d: "It happens without a single decisive vote. A transit authority renews with an H&A subsidiary. A regional health network moves to H&A systems. A ministry finds the corporate lab simply faster. Each step is reasonable on its own, and nobody in Amsterdam was asked to add them up."
 efh.58.a: "Whatever works."
 efh.59.t: "A Society on the Eve"
 efh.59.d: "The home-front reviews are done. Most of the gaps they found have a budget line now. The rest have a working group."
 efh.59.a: "Good enough for now."
 efh.59.b: "Tell them we're ready."

 EFH_standing_procurement_framework: "Standing Procurement Framework"
 EFH_standing_procurement_framework_desc: "Make the procurement arrangement permanent, so the firms, the ministries and the member states can all plan around it."
 EFH_procurement_framework_ha_tt: "Built around the H&A consortium, the framework deepens the corporation's hold on the federal supply chain."
 EFH_procurement_framework_ef_tt: "Kept in federal hands, the framework anchors procurement to the state rather than the firms."
 efh.61.t: "The Firms Come Calling"
 efh.61.d: "The Federation lets it be known that it is ready to talk about long-term supply, and the conglomerates answer before the ink is dry. H&A arrives best prepared, as it always does, with the studies already done and the numbers already favourable. The question facing Amsterdam is how much of the work to hand them."
 efh.61.a: "Hear the offers."
 efh.62.t: "The Consortium"
 efh.62.d: "The Federation buys into a joint research consortium on H&A's terms. It is expensive in political capital, and it gets the corporation a seat at tables it had never sat at before. The laboratories it opens are real, and so is the talent they pull in."
 efh.62.a: "Worth what it costs."
 efh.63.t: "Federal Hands on the Supply"
 efh.63.d: "Amsterdam keeps procurement for itself. The firms still build, bid and profit, but the contracts are written in the federal interest. It is slower and more expensive, and the Federation ends up owning the thing it depends on."
 efh.63.a: "The state keeps the keys."
 efh.64.t: "The Resource Compacts"
 efh.64.d: "A run of quiet bilateral agreements secures metals and feedstock on long contracts. None of it makes the news."
 efh.64.a: "Stockpile while it is cheap."
 efh.65.t: "A Standing Arrangement"
 efh.65.d: "The framework is signed and becomes, simply, how the Federation procures. The question left is whose hands it answers to."
 efh.65.a: "H&A built the spine of it."
 efh.65.b: "The Federation kept the spine of it."

 efh.66.t: "The Atlantic Rivalry"
 efh.66.d: "The European Federation and the United States have been rivals for two generations. The new doctrine puts in writing what every officer already assumes: the contest with Washington comes first, and everything else is arranged around it."
 efh.66.a: "Name the rival."
 efh.67.t: "Primacy by Other Means"
 efh.67.d: "The Federation takes the conventional route: more divisions, better doctrine and a bigger industrial base, so a war with the United States could be won without warheads."
 efh.67.a: "Win it on the ground."
 efh.68.t: "The War Footing"
 efh.68.d: "The directive is signed. From this point the Federation is scheduling a conflict with the United States and calling it readiness. Mobilisation timetables, requisition authorities, the legal scaffolding of a war economy all move quietly from the contingency drawer to the active file. The only open question is how much of this the public is told."
 efh.68.a: "Tell the people plainly."
 efh.68.b: "Keep the directive quiet."

 efh.69.t: "The Alignment Initiative"
 efh.69.d: "The Federation starts running its diplomacy as one campaign instead of separate deals. The aim is to pull the powers that matter toward Europe before Washington does. First on the list is Tokyo."
 efh.69.a: "Play the board."
 efh.70.t: "Tokyo Answers"
 efh.70.d: "Tokyo's reply is warmer than protocol requires. Japan has watched the United States across an ocean for as long as the Federation has, and it would rather partner with Europe than depend on Washington."
 efh.70.a: "The most important door opens."
 efh.71.t: "The Eastern Lane"
 efh.71.d: "The Federation opens quieter channels to the South American Confederation and to Beijing. Neither is a partnership like Japan's. They are options, kept open in case the Federation needs them."
 efh.71.a: "Keep every line open."

 efh.72.t: "The Force-Structure Debate"
 efh.72.d: "The general staff splits. One school wants a lean professional force, expensively trained and always ready. The other wants a broad mobilisation base, millions who can be called up and equipped. The Federation can afford one of them."
 efh.72.a: "Settle the doctrine."
 efh.73.t: "One Army, One Command"
 efh.73.d: "The member-state contingents are folded under one federal command, one doctrine and one chain of orders that does not stop at a national border. It answers to Amsterdam."
 efh.73.a: "The Federation has an army."

 efh.74.t: "The Second Space Race"
 efh.74.d: "The Federation enters a second space race, this time for the orbits themselves: surveillance, relay, and eventually launch. H&A already has a reusable spaceplane on the drawing board. Amsterdam supplies the money and the flag, H&A supplies the vehicle and, quietly, the lead."
 efh.74.a: "To orbit, on H&A's wings."
 efh.75.t: "Eyes Above the Weather"
 efh.75.d: "The surveillance constellation comes online. Movements that used to vanish under cloud cover no longer do, and anomalies are flagged as they form instead of reported late."
 efh.75.a: "Keep watching."
 efh.76.t: "A Road to Orbit"
 efh.76.d: "Reusable launch turns orbit into a flight schedule. Satellites, supply runs and eventually the lunar programme become a question of throughput. The Federation built the road to orbit, and H&A owns the trucks."
 efh.76.a: "Orbit is open for business."

 efh.77.t: "The Government Governs"
 efh.77.d: "The winning bloc now has to govern. The coalition holds, the budgets pass, and the member states grumble and comply."
 efh.77.a: "Do the work."
 efh.78.t: "The Federation on the Eve"
 efh.78.d: "The consolidation is done. The member states are bound in as tightly as the constitution allows, and the federal settlement should survive the next election."
 efh.78.a: "Overdue housekeeping"

 efh.79.t: "The Federal War College"
 efh.79.d: "The Federation opens one staff college for the whole federal army, and the next generation of officers learns one doctrine instead of five national ones."
 efh.79.a: "Teach them to think as one."
 efh.80.t: "The Plan in the Safe"
 efh.80.d: "Internally we have a complete, current war plan against the United States, kept in a safe and updated every quarter. Washington almost certainly keeps the same thing about us, and updates it more often."
 efh.80.a: "Keep it current."
 efh.81.t: "The Pacific Framework"
 efh.81.d: "The understanding with Japan becomes an institution: shared standards, joint planning cells and an economic framework tying the two industrial bases together."
 efh.81.a: "Build it to last."

 efh.82.t: "Listening to the North"
 efh.82.d: "The Federation sets up listening posts along the northern approaches, where the American hemisphere comes closest. Mostly antennas and analysts, and a few people who would rather not be cultivated."
 efh.82.a: "Set the antennas listening."
 efh.83.t: "Watching the Canal"
 efh.83.d: "The Federation puts eyes on Panama. Canal traffic says a lot about American intentions: which hulls move, which way, how fast. The watch goes up without a single declaration."
 efh.83.a: "Watch the water."

 efh.84.t: "The Kaltkrieg Begins"
 efh.84.d: "The Federation's posture toward the United States stops being a document and becomes what every ministry plans around. There is no declaration."
 efh.84.a: "Into the cold, then."

 efh.85.t: "The Trade Bloc as a Weapon"
 efh.85.d: "The Federation starts using its common market as leverage. Tariff schedules and standards are set so that access favours the countries leaning its way. Washington calls it coercion. Amsterdam calls it the price of admission."
 efh.85.a: "Make access a privilege."
 efh.86.t: "Squeezing the Market"
 efh.86.d: "The Federation shuts American firms out of European-aligned markets they had treated as their own. The damage shows up in quarterly reports and idled plants, and Washington files every grievance."
 efh.86.a: "Let them feel the cost."

 efh.87.t: "Into the Backyard"
 efh.87.d: "The Federation courts the South American Confederation with money, infrastructure and warm communiques, in the hemisphere Washington considers its own. Every road the Federation funds there is one the United States did not."
 efh.87.a: "Money talks loudest here."
 efh.88.t: "The Beijing Channel"
 efh.88.d: "The Federation opens a serious channel to Beijing, careful and unsentimental on both sides. China is a counterweight, a market, and a problem the Federation would rather have leaning its way than the other. The talks are conducted by people who trust each other exactly as far as the interests align, which, for now, is far enough."
 efh.88.a: "Useful is enough."

 efh.89.t: "The Isthmus Claimed"
 efh.89.d: "The Federation makes its presence on the isthmus permanent. What began as economic pressure and basing rights is now federal soil, and the canal the United States held for a century has a European hand on it. Washington will send the bill."
 efh.89.a: "The canal is ours now."
 efh.90.t: "Holding the Canal"
 efh.90.d: "Occupation is easier to declare than to keep. The isthmus does not want the Federation, and Washington is happy to supply anyone who agrees. The local resistance is organised and armed from the north. The Federation has to decide how it intends to hold Panama."
 efh.90.a: "An iron grip."
 efh.90.b: "Win the isthmus over."

 EFH_federal_health_security: "Federal Health Security"
 EFH_federal_health_security_desc: "The Federation merges its tangle of national health ministries into a single federal directorate."
 EFH_continental_disease_surveillance: "Continental Disease Surveillance"
 EFH_continental_disease_surveillance_desc: "A standing early-warning network for outbreaks: sentinel laboratories and shared reporting across the continent. It is built for influenza, the next coronavirus and the food-borne scare."
 EFH_strategic_biocontainment: "Strategic Biocontainment"
 EFH_strategic_biocontainment_desc: "Quarantine law, stockpiles, isolation capacity, and a containment doctrine the Federation hopes never to use at scale. Written with a bad flu season in mind."

 EFH_groundwork_biosecurity_tt: "The pre-crisis disease-surveillance network was already watching, and folds straight into parasite monitoring: +25 Political Power and a parasite-research bonus."

 efh.91.t: "Federal Health Security"
 efh.91.d: "The new health directorate opens to almost no notice. Budgets are signed, laboratories are linked, and a corner of the federal government starts working quietly."
 efh.91.a: "Let them do their work unnoticed."
 efh.92.t: "The Network Goes Live"
 efh.92.d: "The surveillance network goes live. An unusual cluster of illness anywhere in the Federation now reaches a federal office within days, often within hours."
 efh.92.a: "Keep the watch."
 efh.93.t: "Containment as Doctrine"
 efh.93.d: "The Federation writes down how it would seal off a region, hold a quarantine line, and keep the rest of the continent running. The authors are planning for a pandemic."
 efh.93.a: "Hope never to use it."

 efh.94.t: "The Fleet Goes Corporate"
 efh.94.d: "The Federation hands naval modernisation to H&A. The corporation builds faster and cheaper than any federal yard, so the Federation's warships will be H&A hulls on H&A maintenance contracts."
 efh.94.a: "Let the corporation build it."
 efh.95.t: "The Air Arm Goes Corporate"
 efh.95.d: "The air force goes the same way as the navy. H&A is ahead in engines, avionics and keeping aircraft flying, and the federal air arm becomes a corporate fleet in everything but the flag on the tail."
 efh.95.a: "Capability over control."

 efh.96.t: "The Assessment"
 efh.96.d: "The assessment reaches the right desks. The outbreak is real, it is spreading, and nothing in the Federation's emergency planning was built for it."
 efh.96.a: "Begin from the truth."
 efh.97.t: "The Federal Emergency"
 efh.97.d: "The Federation declares a federal emergency. Emergency authorities move from the statute books into the operations rooms, and people are told enough to cooperate."
 efh.97.a: "Hold the line at home."
 efh.98.t: "One Command Against It"
 efh.98.d: "Army, civil defence, the health directorate, the contractors and the intelligence cells all answer to one command. The turf wars are suspended for the duration, which everyone understands means forever."
 efh.98.a: "One command, one fight."

 efh.99.t: "The Board Becomes the State"
 efh.99.d: "It is done by emergency memorandum. Federal governance is suspended for the duration of the crisis, and the crisis has no end date. Decisions now get made where the logistics and the science sit, in an H&A boardroom. No flag comes down. No anthem changes. The European Federation still exists on every document and in every ceremony. It simply no longer governs itself."
 efh.99.a: "Whatever it takes to last."

 efh.100.t: "A Weapon for the Enemy"
 efh.100.d: "Nothing in the Federation's arsenal was built for this enemy. H&A's weapons division designs a round around the one thing the organisms cannot shrug off, and uses its nuclear expertise to make it carry. The first field reports say it works."
 efh.100.a: "Put it into production."
 efh.101.t: "Lines That Hold"
 efh.101.d: "The doctrine of meeting the enemy everywhere at once is retired. It cost too much ground. The army now picks the lines it can hold, fortifies them in depth, and makes the enemy pay for the rest."
 efh.101.a: "Hold what can be held."

 efh.102.t: "The Quiet Years"
 efh.102.d: "The Federation is prosperous and at peace. Its biggest arguments are about budgets, and the worst headline of the week is a dull one."
 efh.102.a: "Make the most of the calm."

 efh.103.t: "The Summit Collapses"
 efh.103.d: "The summit is over. Every room soured slowly until there was nothing left to sign. Both delegations go home and tell the same story with the names reversed."
 efh.103.a: "Back to the cold, and ready this time."

 EFH_long_peace_public_works: "Long Peace Public Works"
 EFH_long_peace_public_works_desc: "While the peace holds, the Federation can spend political capital on the unglamorous work of building. A new industrial complex in the capital region, and a little public goodwill with it."
 EFH_reservist_readiness_drill: "Reservist Readiness Drill"
 EFH_reservist_readiness_drill_desc: "Call up the reserves for a season of exercises. It costs political capital and a few headlines about the cost, and it keeps the mobilisation base sharp."

 EFH_containment_operations: "Containment Operations"
 EFH_containment_operations_desc: "The institutions the Federation built against the parasite ecology, put to work. Assessments, exercises, and the industrial reach that keeps the response funded."
 EFH_standing_threat_estimate: "Commission a Standing Threat Estimate"
 EFH_standing_threat_estimate_desc: "The first continental assessment is already out of date. Commission a revision: collation of field reports, updated distribution maps, and a classified annex on what the organisms did differently this season. The labs work faster when someone tells them where to look."
 EFH_joint_command_exercises: "Joint Command Field Exercises"
 EFH_joint_command_exercises_desc: "The joint anti-parasite command runs its formations through containment drills: cordon rotation, burn discipline, withdrawal under contact. The after-action reports are unflattering and useful."
 EFH_sac_industrial_dividend: "Draw on the Southern Portfolio"
 EFH_sac_industrial_dividend_desc: "The factories the Federation financed across South America are running. Call in a share of their output for European supply chains. The arrangement is legal, and it has been noted with irritation in Washington."
 EFH_sac_dividend_hemispheric_tt: "The hemispheric claim gives the Federation preferential contract terms: §Y+20 Political Power§!"
 EFH_threat_estimate_current: "Current Threat Estimate"
 EFH_threat_estimate_current_desc: "The research directorates are working from this season's data instead of last year's. It shows in the pace of the work."
 EFH_joint_exercise_readiness: "Exercise-Validated Readiness"
 EFH_joint_exercise_readiness_desc: "Formations that have drilled the containment playbook dig faster and hold together longer. The effect fades as postings rotate."

 EFH_federal_cordon_doctrine: "Federal Cordon Doctrine"
 EFH_federal_cordon_doctrine_desc: "Hold the line with federal troops and federal rules: cordon a contaminated zone, dig in behind it, and do not move until the ground is clean. It is slow and manpower-heavy, and people can see federal soldiers standing between them and the infestation."
 EFH_contracted_field_response: "Contracted Field Response"
 EFH_contracted_field_response_desc: "H&A already has the equipment, the specialists, and the willingness to go where federal troops will not. Contracted teams take the forward clearance work and the army keeps the lines. It is faster, and the teams answer to H&A's board."
 EFH_continental_containment_exercise: "Continental Containment Exercise"
 EFH_continental_containment_exercise_desc: "Neither doctrine has been run at scale. Authorise a full continental exercise: live organisms, real terrain, and the whole command chain from field team to joint headquarters."
 EFH_containment_exercise_unlock_tt: "Unlocks the repeatable §YRun a Live Containment Exercise§! decision in Containment Operations."
 EFH_exercise_cordon_echo_tt: "The cordon doctrine steadies the home front: §G+0.02 Stability§!."
 EFH_exercise_contracted_echo_tt: "The contracted teams bill for the exercise: H&A land division gains funds."
 EFH_containment_exercise_risk_tt: "A live exercise usually validates the doctrine in public view. Sometimes it fails in public view instead."
 EFH_specimen_studies_risk_tt: "An accelerated study cycle usually delivers. Sometimes containment does not hold."
 EFH_run_containment_exercise: "Run a Live Containment Exercise"
 EFH_run_containment_exercise_desc: "Order a full-scale exercise under real conditions. If it goes well the Federation gets a sharper army and a public demonstration of competence. If it goes badly it does so where everyone can see."
 EFH_accelerated_specimen_studies: "Accelerate the Specimen Programme"
 EFH_accelerated_specimen_studies_desc: "Push the live-specimen directorate through a compressed ninety-day cycle. The payoff is real research at speed. The risk is that speed and live organisms in the same building have a way of finding each other. Ties up industry for the duration."

 efh.108.t: "The Line Is Ours to Hold"
 efh.108.d: "The doctrine is written and the first cordons go up: federal troops, federal engineers, a federal seal on the checkpoint. The zones behind the wire hold their edges, and the newspapers can print a photograph of a soldier standing where the ecology stops. The general staff would have preferred something faster."
 efh.108.a: "Hold the line and let them see it."
 efh.109.t: "The People Who Will Go"
 efh.109.d: "The contract is signed quietly. H&A field teams take the forward zones the army was reluctant to enter, and they are good at it, unsettlingly good, arriving with equipment the federal inventory does not list and clearing ground on a schedule the army could not match. A deputy minister asks who exactly these people answer to and is told, accurately, that the matter is addressed in annex four. Nobody has read annex four."
 efh.109.a: "Sign it. We will read the annex later."

 efh.110.t: "The Exercise Holds"
 efh.110.d: "The exercise runs clean. Cordons close on schedule, the clearance teams meet their timelines, and the footage is cleared for release. For one news cycle the Federation looks like it knows what it is doing."
 efh.110.a: "Log it and do it again next quarter."
 efh.111.t: "In Front of Everyone"
 efh.111.d: "It goes wrong in front of the observers. A cordon opens where it should have closed, and a clearance team retreats through a checkpoint that was supposed to be behind it. Nobody is hurt, and all of it is filmed. The ministries have to decide whether to publish it."
 efh.111.a: "Publish it. The army learns."
 efh.111.b: "Bury it. Not this week."

 efh.112.t: "The Cycle Delivers"
 efh.112.d: "The accelerated cycle closes on time with nothing escaped. The directorate hands up a year's worth of results and asks for the next cycle before this one is written up."
 efh.112.a: "Approve the findings. Keep the pace."
 efh.113.t: "A Cell Block Fails"
 efh.113.d: "A containment cell failed during the accelerated cycle. The site went into lockdown and the response teams contained it inside the perimeter. The news got out anyway."
 efh.113.a: "Reinforce the cells and carry on."
 efh.113.b: "Suspend the block."

 EFH_gate_escalation_rivalry_tt: "The standoff with the United States has hardened into open rivalry. EF-US Escalation: [?EFH_USA_escalation|0] / 100, requires 50+"
 EFH_gate_escalation_coldwar_tt: "Relations with the United States have reached the cold war footing. EF-US Escalation: [?EFH_USA_escalation|0] / 100, requires 65+"
 EFH_gate_panic_elevated_tt: "Public confidence has fallen far enough that Parliament will consider it. Public Panic: [?ROOT.public_panic|0] / 1000, requires 150+"
 EFH_gate_panic_high_tt: "The public no longer believes ordinary government is sufficient. Public Panic: [?ROOT.public_panic|0] / 1000, requires 200+"
 EFH_military_focus: "European Military Focus"
 EFH_military_focus_desc: "The accumulated weight of every reform, exercise and mobilisation order the Federation has put its army through. No single measure did much."
 EFH_military_focus_tt: "§GEuropean Military Focus improves§!"
 EFH_industrial_base: "Federal Industrial Base"
 EFH_industrial_base_desc: "Construction capacity, factory throughput and the trade arrangements that keep both fed. Built up one appropriation at a time across the member states."
 EFH_industrial_base_tt: "§GFederal Industrial Base improves§!"
 EFH_federal_authority: "Federal Authority"
 EFH_federal_authority_desc: "How much the Federation can ask of its member states before they argue. Every compact signed, every emergency power taken and every partner reassured adds to it."
 EFH_federal_authority_tt: "§GFederal Authority improves§!"
 EFH_nuclear_program: "Federal Nuclear Programme"
 EFH_nuclear_program_desc: "Fissile extraction, warhead assembly and the posture built around them. Maintained through the long peace on the argument that it would be needed eventually, by people who did not expect to be right."
 EFH_nuclear_program_tt: "§GFederal Nuclear Programme advances§!"
 EFH_air_command: "Federal Air Command"
 EFH_air_command_desc: "Doctrine, aircrew and the standing argument over what air power is for. Superiority first, then whatever is left over for the ground."
 EFH_air_command_tt: "§GFederal Air Command improves§!"
 EFH_naval_command: "Federal Naval Command"
 EFH_naval_command_desc: "Fleet reach, submarine work and the patrol lines that hold the Atlantic approaches. A navy sized for policing that keeps being asked to do more."
 EFH_naval_command_tt: "§GFederal Naval Command improves§!"
 EFH_laytheo_program: "Operation Laytheo"
 EFH_laytheo_program_desc: "Cheap launches, standing orbital coverage, and the intelligence picture that comes with looking down at everything all the time. The programme that paid for itself the week it was switched on."
 EFH_laytheo_program_tt: "§GOperation Laytheo advances§!"
 EFH_research_directorate: "Research Directorate"
 EFH_research_directorate_desc: "The standing research and collection apparatus. Specimen work, monitoring stations, and the exchanges with partners who have their own reasons for sharing."
 EFH_research_directorate_tt: "§GResearch Directorate improves§!"
 EFH_parasite_warfare_tt: "§GAnti-Parasite Doctrine advances a tier§!"
 EFH_parasite_warfare_1: "Anti-Parasite Doctrine (1/7)"
 EFH_parasite_warfare_1_desc: "First written guidance on fighting an enemy that does not hold ground, does not resupply, and does not stop. Most of it is wrong. Some of it is not."
 EFH_parasite_warfare_2: "Anti-Parasite Doctrine (2/7)"
 EFH_parasite_warfare_2_desc: "Revised after contact. The parts that got people killed are struck out, the parts that worked are now standing orders."
 EFH_parasite_warfare_3: "Anti-Parasite Doctrine (3/7)"
 EFH_parasite_warfare_3_desc: "Cordon procedure, burn discipline and the engagement ranges that keep a line intact. Taught to every unit rotating to the front."
 EFH_parasite_warfare_4: "Anti-Parasite Doctrine (4/7)"
 EFH_parasite_warfare_4_desc: "The doctrine stops being a pamphlet and becomes how the army trains. Officers who learned it in the field are now the ones writing it."
 EFH_parasite_warfare_5: "Anti-Parasite Doctrine (5/7)"
 EFH_parasite_warfare_5_desc: "Biological findings feed back into tactics rather than sitting in a directorate report. What the laboratory learns on Monday is in an order by Friday."
 EFH_parasite_warfare_6: "Anti-Parasite Doctrine (6/7)"
 EFH_parasite_warfare_6_desc: "A settled body of practice. The Federation no longer improvises against Beckons. It applies a procedure and expects it to hold."
 EFH_parasite_warfare_7: "Anti-Parasite Doctrine (7/7)"
 EFH_parasite_warfare_7_desc: "Everything the Federation has learned about killing the Iris's organisms, written down and drilled. It makes each engagement survivable rather than the war winnable, which is the only thing on offer."

 EFH_board_reorientation: "The Board Reorients"
 EFH_board_reorientation_desc: "On Day 60 the board convenes to authorise work already in preparation. The executives are reading three-year-old internal projections that describe the present in detail. Standard corporate governance is suspended for the duration."
 EFH_thermonuclear_priority: "Thermonuclear Designated Priority-1"
 EFH_thermonuclear_priority_desc: "The Thermonuclear division moves to the top of every queue. Warheads, delivery platforms, and the radioactive material that feeds both become the first call on resources. The reasoning is not shared below board level."
 EFH_logistics_militarization: "Militarise the Supply Chain"
 EFH_logistics_militarization_desc: "H&A Logistics is the backbone nobody photographs. Trains and container ships, always escorted. Routes are redrawn around projected loss zones before those zones are publicly acknowledged."
 EFH_governance_suspension: "Board suspension"
 EFH_governance_suspension_desc: "H&A has stopped being a company in the regular sense. There are no board meetings anymore. Laws are ignored and no one is willing to enforce them because they know what the alternative is. The name and logo have been kept for marketing."
 EFH_rtg_penetrator_program: "RTG Penetrator Rounds"
 EFH_rtg_penetrator_program_desc: "The Beckon membrane is a non-Newtonian gel. It rigidifies on impact and deforms conventional rounds. The RTG penetrator directs thermal energy into the membrane microseconds before contact, preventing the gel from setting. Above Rupter tier, nothing else works."
 EFH_integration_agreement: "The Integration Agreement"
 EFH_integration_agreement_desc: "By Day 812 the Federation can no longer fund the parasite war and the war with America on its own procurement. The Agreement transfers operational authority to a joint H&A-EF command. The civilian government stays in place, with less to do."

 EFH_board_reorientation_spirit: "The Board Reorients"
 EFH_board_reorientation_spirit_desc: "The board authorises what was already underway. Capability rises. The legitimacy of the federal state stays where it was."
 EFH_integration_agreement_full: "Integration Agreement (Full)"
 EFH_integration_agreement_full_desc: "Operational authority held by joint H&A-EF command, openly. Research and logistics improve. Political power drains as the federal state is delegitimised."
 EFH_integration_agreement_oversight: "Integration Agreement (Oversight)"
 EFH_integration_agreement_oversight_desc: "Operational authority shared, with the federal government retained in name and in some real measure. The gains are smaller, and the federal state keeps more of its authority."

 efh.31.t: "The Board Reorients"
 efh.31.d: "Day 60. The Thermonuclear division is designated Priority-1. Hyperbiology is fast-tracked. Standard corporate governance is suspended. None of these are proposals. The board is authorising work that began the week the Iris was confirmed biological. The projections on the table are three years old and accurate."
 efh.31.a: "Authorise the standing programmes."

 efh.30.t: "The Integration Agreement"
 efh.30.d: "The Federation cannot fund the parasite war, the war with the United States, and its own civilian state at once. H&A can run two of the three. The Agreement transfers operational authority to joint H&A-EF command. The civilian government stays on paper. Signed openly, it costs the Federation what remains of its independence. Signed quietly, it costs the same and pretends otherwise."
 efh.30.a: "Sign it in full, openly."
 efh.30.b: "Retain nominal federal oversight."

 EFH_dispatcher_identified: "The First Dispatcher"
 EFH_dispatcher_identified_desc: "A stationary two-part organism is identified: a flower that receives, an underground network that listens. It picks up radio and learns from it. Every unencrypted long-distance transmission in its range is already compromised, and attempts to encrypt only give it more to study."
 EFH_root_network_revision: "Sixty-Eight Hours"
 EFH_root_network_revision_desc: "Cleared zones reinfest within roughly sixty-eight hours. Nobody had accounted for the root systems, which extend metres underground and survive surface clearance. The doctrine that worked last year is rewritten: clear the surface, then burn the roots, or do not bother clearing at all."
 EFH_defensible_lines: "Defensible Lines"
 EFH_defensible_lines_desc: "Not every position can be held with the personnel that remain. The Federation consolidates onto terrain it can defend and supply, and gives up the rest on purpose."

 EFH_first_beckon_confidence: "Fire Works"
 EFH_first_beckon_confidence_desc: "The 2021 organisms burn. Soldiers learn to trust fire. They are right, for now."

 efh.32.t: "The Dispatcher"
 efh.32.d: "A new organism is catalogued: a chrysanthemum-like flower above ground, a network of tentacles below. It receives radio and, over weeks, learns the languages spoken across it. Where one is active, encrypting a message only teaches it more about how humans hide things. Communications doctrine has to change."
 efh.32.a: "Encrypt everything and hope."
 efh.32.b: "Go dark. Couriers and hard lines only."

 efh.33.t: "Sixty-Eight Hours"
 efh.33.d: "A cleared sector is declared secure on a Tuesday. By Friday it is reinfested. The Beckons grow back from root systems metres underground, and surface clearance does nothing to them. The doctrine is revised."
 efh.33.a: "Burn the roots."

 EFH_terms_of_appointment: "Terms of Appointment"
 EFH_terms_of_appointment_desc: "Hyperbiology's leadership has stopped being a staffing question. The division's output rests on one researcher who does not write anything down and one director who has spent four years keeping her off the agenda. Put both of them on the Federation's advisory strength and strike the clause that allows either to be dismissed. The arrangement is stable, and it is no longer anybody's to adjust."
 EFH_terms_of_appointment_tt: "Seats Reinhard Voss beside Ashley Woods as a political advisor. Leave a political advisor seat open for him before taking this. Neither can be dismissed afterwards, and the traits of the pair change on their own roughly every two years."

 EFH_reinhard_voss: "Reinhard Voss"
 EFH_reinhard_voss_desc: "Director of H&A Hyperbiology at Frankfurt. Pulled Woods onto the Vagrant liaison programme in the fourth year and has been absorbing the consequences since. His last performance review of her recommended waiving every developmental objective and departing from standard practice, on the record, in writing, where anyone can find it."

 EFH_ha_institutional_shield: "Institutional Shield"
 EFH_ha_institutional_shield_desc: "Intercepts the paperwork that would otherwise reach the people he reports to. It is the only register he is fluent in, and he is very good at it."

 EFH_ha_ashley_unimpeded: "Unimpeded Access"
 EFH_ha_ashley_unimpeded_desc: "Nobody is currently asking her what she is doing. The work moves faster than the committee minutes suggest it should, and the reports coming out of it still clear rooms."
 EFH_ha_voss_covering: "Covering For Her"
 EFH_ha_voss_covering_desc: "Every request that would slow her down gets answered by him instead, at a cost in standing he does not itemise."

 EFH_ha_ashley_under_audit: "Under Audit"
 EFH_ha_ashley_under_audit_desc: "Answering exactly what is asked and volunteering nothing. The auditors record this as cooperation. The quarter's output records it as lost time."
 EFH_ha_voss_overruled: "Overruled"
 EFH_ha_voss_overruled_desc: "The objection was noted and the schedule stands. There is no further channel, and he has already used the one he had."

 EFH_ha_ashley_sole_custody: "Sole Custody"
 EFH_ha_ashley_sole_custody_desc: "The programme exists only where she keeps it. The documentation is comprehensive and useless to anyone else, which was never a decision she announced."
 EFH_ha_voss_entrenched: "Signs Off On Everything"
 EFH_ha_voss_entrenched_desc: "The directorate approves its own scope. Requests that would change that reach his desk and are not forwarded."

 EFH_carsten_breuer: "Carsten Breuer"
 EFH_carsten_breuer_desc: "German general and head of the Federation's crisis staff. Shelters, evacuation timetables and emergency logistics report to one office, and the office answers its phone."
 EFH_crisis_staff_general: "Crisis Staff General"
 EFH_crisis_staff_general_desc: "Treats a continental emergency as a staffing problem with a schedule. So far the schedule has held."

 EFH_christian_drosten: "Christian Drosten"
 EFH_christian_drosten_desc: "Berlin virologist who spent his career on outbreaks nobody else was watching. The Federation has asked him to brief the cabinet on this one with considerably less to go on."
 EFH_outbreak_virologist: "Outbreak Virologist"
 EFH_outbreak_virologist_desc: "Publishes the preliminary numbers along with how uncertain they are. The cabinet would prefer the numbers on their own."

 EFH_kaja_kallas: "Kaja Kallas"
 EFH_kaja_kallas_desc: "Estonian, and the loudest voice for defence spending in every room she has sat in. The rooms agree with her now."
 EFH_baltic_hawk: "Baltic Hawk"
 EFH_baltic_hawk_desc: "Argued for rearmament for a decade before anyone needed it. Nobody asks her to argue any more."

 EFH_mark_rutte: "Mark Rutte"
 EFH_mark_rutte_desc: "Dutch, and a fixture of Amsterdam politics who outlasted every scandal of his career by turning up to the next meeting. The Federation has asked him to keep turning up."
 EFH_teflon: "Teflon"
 EFH_teflon_desc: "Nothing sticks. The Federation's stability figures have started to borrow the quality."

 EFH_olaf_scholz: "Olaf Scholz"
 EFH_olaf_scholz_desc: "Hamburg's contribution to federal politics, brought into the cabinet when public panic stopped responding to anything else. His briefings contain no information, and people leave them calmer."
 EFH_scholzomat: "Scholzomat"
 EFH_scholzomat_desc: "Answers every question with the same three sentences. It works on the public and on nobody in the cabinet."

 EFH_christine_lagarde: "Christine Lagarde"
 EFH_christine_lagarde_desc: "Head of the Federation's central bank, seconded to run the war economy. Monetary policy now includes how many shells a month the continent can afford."

 EFH_boris_johnson: "Boris Johnson"
 EFH_boris_johnson_desc: "The Federation's best-known sovereigntist, who spent a career arguing that London should answer to London. He now sits in Amsterdam for the part of Britain still standing, and describes the situation as eminently manageable."
 LD_blustering_optimist: "Blustering Optimist"
 LD_blustering_optimist_desc: "Morale rises in every room he enters. Nobody can quite account for where the stability went."

 EFH_matthias_kroger: "Matthias Kröger"
 EFH_matthias_kroger_desc: "H&A's liaison to the federal cabinet, seated once Hyperbiology's work grew too large to brief from outside the room. He minutes the meetings H&A needs minuted."
 EFH_ha_liaison: "Corporate Liaison"
 EFH_ha_liaison_desc: "Brings H&A's research into the cabinet, and H&A's priorities with it."

 EFH_tomasz_wrona: "Tomasz Wrona"
 EFH_tomasz_wrona_desc: "Polish Army engineer and author of the Federation's cordon doctrine: dig first, hold the line, give up nothing that would have to be retaken. It has held everywhere it was built in time."

 EFH_mikkel_aasen: "Mikkel Aasen"
 EFH_mikkel_aasen_desc: "Norwegian general appointed to run a war of positions. His staff report progress in kilometres of trench completed per week."

 EFH_pieter_janssens: "Pieter Janssens"
 EFH_pieter_janssens_desc: "Belgian vice admiral, appointed after the Atlantic showed how exposed the Federation's shipping was. Every convoy now sails with an escort, and every escort commander has his direct line."
 EFH_convoy_escort_chief: "Convoy Escort Chief"
 EFH_convoy_escort_chief_desc: "Measures the navy by how many cargo ships arrive. The figure is up this quarter."

 EFH_rob_bauer: "Rob Bauer"
 EFH_rob_bauer_desc: "Dutch admiral and the Federation's senior military coordinator. He keeps the member states' high commands working to one plan, which mostly means getting them into the same room."

 EFH_liz_truss: "Liz Truss"
 EFH_liz_truss_desc: "Runs the Federation's growth programme off a plan that fits on one page. Nobody has costed the page."
 EFH_bold_fiscal_vision: "Bold Fiscal Vision"
 EFH_bold_fiscal_vision_desc: "Output rises at once and the bill comes later. Someone has put a lettuce on her desk to see which lasts longer."
 EFH_market_confidence_collapse: "Market Confidence Collapse"
 EFH_market_confidence_collapse_desc: "Lenders have stopped taking the Federation's word on its own budget. It will take months to win it back."
 efh_advisor.1.t: "Forty-Nine Days"
 efh_advisor.1.d: "The author of the growth programme has resigned after forty-nine days. The programme stays on the books, and so do the bills it ran up. The lettuce is still fresh."
 efh_advisor.1.a: "Show her out."

 EFH_larry_the_cat: "Larry"
 EFH_larry_the_cat_desc: "Chief Mouser to the Cabinet. He has watched every one of them leave and has not moved from the doorstep."
 LD_chief_mouser: "Chief Mouser"
 LD_chief_mouser_desc: "Keeps the cabinet office mostly free of mice. His tenure is the most stable thing in the government."
 efh_advisor.2.t: "The Cat Stays"
 efh_advisor.2.d: "With London back in Federation hands, staff returning to the old cabinet office found a cat on the doorstep, well fed and unbothered. He was there under the last three ministers as well. He is on the payroll now."
 efh_advisor.2.a: "Somebody feed him."

 EFH_palmerston_the_cat: "Palmerston"
 EFH_palmerston_the_cat_desc: "The foreign ministry's cat, and Larry's neighbour. The two have not been on speaking terms for years."
 LD_foreign_office_mouser: "Diplomatic Mouser"
 LD_foreign_office_mouser_desc: "Visiting delegations like him. Larry does not."
 EFH_cat_feud: "The Cats Are Fighting"
 EFH_cat_feud_desc: "Both cats sit in the cabinet now. Meetings get interrupted."

 EFH_emmanuel_macron: "Emmanuel Macron"
 EFH_emmanuel_macron_desc: "French, and the cabinet's chosen voice for the war. His addresses run long and move the public every time."
 EFH_jupiter: "Jupiter"
 EFH_jupiter_desc: "Governs from above and explains it at length. The speeches work, and they take up most of the cabinet's week."

 EFH_karl_lauterbach: "Karl Lauterbach"
 EFH_karl_lauterbach_desc: "German epidemiologist, brought into the cabinet once panic started climbing. He is on television most nights, warning about the next thing."
 EFH_perpetual_warning: "Perpetual Warning"
 EFH_perpetual_warning_desc: "People report infestation sooner when he is on the air, and sleep worse. Public panic cannot fall as far while he sits in the cabinet."

 EFH_david_attenborough: "David Attenborough"
 EFH_david_attenborough_desc: "Naturalist, recruited to explain the parasites on the Federation's broadcasts. He describes them the way he has described everything else, and people find they can listen."
 EFH_calm_narrator: "Calm Narrator"
 EFH_calm_narrator_desc: "Public panic rises more slowly while he is on the air."

 EFH_jeremy_clarkson: "Jeremy Clarkson"
 EFH_jeremy_clarkson_desc: "Farmer, of a kind, put in charge of the Federation's food supply. Output is up. Nobody in the ministry can say by how much."
 EFH_agricultural_commissioner: "Agricultural Commissioner"
 EFH_agricultural_commissioner_desc: "The food keeps arriving. So do the repair bills for the machinery."
 EFH_tractor_incident: "Tractor Incident"
 EFH_tractor_incident_desc: "A ministry building is being repaired. Again."
 efh_advisor.3.t: "A Tractor Incident"
 efh_advisor.3.d: "The Agricultural Commissioner has driven a tractor into a building again, this time one the ministry needed. He says the tractor did it. Repairs will take about a month."
 efh_advisor.3.a: "Take his keys away."

 EFH_viktor_orban: "Viktor Orbán"
 EFH_viktor_orban_desc: "Hungarian, and the cabinet's most reliable veto. Nothing passes without his signature and his signature always costs something. His own region never seems to come out behind."
 EFH_serial_vetoer: "Serial Vetoer"
 EFH_serial_vetoer_desc: "Slows everything down and charges for it. The factories under his watch somehow run better than anyone else's."

 EFH_gunther_fehlinger_jahn: "Gunther Fehlinger-Jahn"
 EFH_gunther_fehlinger_jahn_desc: "Austrian, and a fixture of the Federation's foreign policy debates. Posts a new map of Russia divided into smaller countries most mornings."
 EFH_dissolve_russia: "Dissolve Russia"
 EFH_dissolve_russia_desc: "Always has a case for war ready. It is usually the same case."

 efh_directorate.1.t: "Terms of Appointment"
 efh_directorate.1.d: "The paperwork is thin for something this permanent. Two names, two seats, and a clause specifying that neither appointment is subject to the ordinary review process. Voss drafted it himself, which is the only register he has ever been good in, and filed it before anyone upstairs could ask what problem it was meant to solve. Woods was informed afterwards. She read it, said it did not change anything, and went back to work. She is not wrong. The Federation has written down what was already true: there is no version of the Hyperbiology programme that continues without her, and no successor who could be handed it, because almost none of it exists outside her head."
 efh_directorate.1.a: "File it."

 efh_directorate.2.t: "Directorate Review"
 efh_directorate.2.d.protected: "The review closes without findings. Voss's submission runs to forty pages and answers questions nobody asked, which is the technique: bury the paragraph that matters somewhere a committee will not reach. The directorate keeps its budget, its classification, and its distance. Woods is never told the review happened. Somebody in Frankfurt decides she does not need to know, and for once that decision goes in her favour."
 efh_directorate.2.d.review: "Frankfurt sends auditors. They are not hostile, and that is the difficulty. They are thorough, they have a schedule, and every hour of it comes out of the work. Voss objects through the correct channel and is told the objection has been noted. Woods complies exactly, answers exactly what is asked, volunteers nothing, and is recorded as cooperative. The quarter's output is what it is. The organisms do not pause for the audit."
 efh_directorate.2.d.entrenched: "Somebody tries to move them and finds out they cannot. There is no confrontation and no memo. The attempt simply stops partway along, the way a request stops when it reaches a desk that does not forward it. After that the directorate signs off on its own scope. It is efficient. It is also the last point at which anyone outside the building could have said no, and it went past without being marked."
 efh_directorate.2.a: "Noted."

 EFH_expand_hyperbiology: "Expand Hyperbiology"
 EFH_expand_hyperbiology_desc: "The division has outgrown its founding remit. What began as a lawsuit annex is now the only body in the Federation getting usable results on the organisms. Fold the loose research groups into one directorate and fund it properly."
 EFH_expand_hyperbiology_tt: "Unlocks the enhanced Hyperbiology funding cycle. Payoff scales with the terms of the 2022 Integration Agreement."
 EFH_hyperbiology_facilities: "Facilities and Staffing"
 EFH_hyperbiology_facilities_desc: "Laboratory space, containment cells, and a hiring surge across three campuses. The division stops borrowing capacity from other H&A branches and stands up its own."
 EFH_live_specimen_acquisition: "Live Specimen Acquisition"
 EFH_live_specimen_acquisition_desc: "Field teams stop burning what they find and start bringing it back intact. Containment is expensive, and the loss rate among handlers is not published."
 EFH_declare_on_the_hive: "War on the Hive"
 EFH_declare_on_the_hive_desc: "Hyperbiology's specimen reports reach the Council with a single recommendation attached. The organisms in Africa are not a regional outbreak and will not stop at a coastline. The Federation formally enters the war against the hive, and asks its partners to do the same."
 EFH_branch_parasite_study: "Branch Parasite Study"
 EFH_branch_parasite_study_desc: "The newer field organisms are not the primitive Beckon growths of 2021. They arrive already shaped against the tactics used on the last ones, so the division starts rotating doctrine on a schedule."


 EFH_fund_hyperbiology_major: "Fund Hyperbiology Directorate"
 EFH_fund_hyperbiology_major_desc: "Commit a major share of industrial output to a full research cycle at the expanded directorate. Larger than the founding grant, and it shows in the results."

 efh.104.t: "The Directorate"
 efh.104.d: "Hyperbiology now reports as its own directorate, and the founding lawsuit is a footnote in its charter. It has a budget line, a security classification, and a waiting list of questions from every other H&A division."
 efh.104.a: "Give them what they need."
 efh.105.t: "Three Campuses"
 efh.105.d: "Containment cells, cold storage, and a hiring surge. The division stops borrowing microscopes from the aerospace labs and stands up its own. Staff are told the work is important and not told much else."
 efh.105.a: "Approved."
 efh.106.t: "Bring It Back Intact"
 efh.106.d: "The order goes out to the field teams: stop burning specimens, start capturing them. Handlers get containment gear and a procedure. The loss rate is not in the briefing."
 efh.106.a: "The data justifies it."
 efh.107.t: "A Shelf Life"
 efh.107.d: "The organisms now arriving at the front are shaped against the tactics used on the last generation. Whatever coordinates them is watching how the Federation fights. A countermeasure works for a season, so the directorate recommends rotating doctrine on a schedule."
 efh.107.a: "Rotate ahead of the loss."

 efh.22.t: "The Summit Holds"
 efh.22.d: "The second Canadian summit ends the way the first did. The Americans will not put the Eastern territories to a referendum, and the Federation will not concede them. The delegations leave with a communique, a photograph, and nothing settled."
 efh.22.a: "A cold peace will do."
 efh.22.b: "This is not over."

 efh.40.t: "The Canal Liberated"
 efh.40.d: "The Canal Zone has slipped American control. Federation advisors, and the resistance they armed, hold the locks now. In Amsterdam it is called a liberation. In Washington it is called theft. Both are correct."
 efh.40.a: "The canal answers to Europe now."
 EFH_bolster_panama_resistance: "Bolster the Canal Zone Resistance"
 EFH_bolster_panama_resistance_desc: "Arm and fund the resistance to American rule in the Canal Zone. The state's own resistance climbs. When it boils over, the Federation moves to liberate Panama."
 USA_suppress_panama_resistance: "Suppress the Canal Zone"
 USA_suppress_panama_resistance_desc: "Crack down on the unrest in the Canal Zone to keep the locks in American hands. The methods are ugly, and Europe is watching."

 EFH_Ryland: "Conscript Ryland into Laytheo"
 EFH_HNA_independence: "H&A Independence"
 EFH_HNA_independence_desc: "H&A has grown beyond a simple contractor. Granting the company room to operate on its own terms opens doors the Federation government could never open directly."
 EFH_HNA_independence_tt: "H&A begins acting on its own authority. Their first independent initiative will conclude shortly."
 EFH_HNA_autonomous_placeholder: "H&A: Lunar Architecture Office"
 EFH_HNA_autonomous_placeholder_desc: "H&A's first autonomous office begins designing the industrial, legal, and launch framework for a sustained lunar programme."
 EFH_HNA_ORIGINATOR: "H&A"
 EFH_HNA_working_on_focus_tt: "§YH&A§! is working on this focus.\nProgress: §Y$FLAG_DAYS$§!/[?temp_focus_days] days"
 EFH_HNA_focus_not_started_tt: "This initiative belongs to H&A. Grant them independence first."
 EFH_HNA_lunar_programme_approved_tt: "Unlocks the §YMoon Base Programme§! once Laytheo has completed its first flight."
 EFH_HNA_lunar_policy_public_tt: "H&A adopts a supervised public mandate for lunar work."
 EFH_HNA_lunar_policy_corporate_tt: "H&A adopts an aggressive corporate acceleration model for lunar work."
 EFH_HNA_lunar_policy_procurement_tt: "H&A creates a deniable procurement office. Several launch vehicles should consider becoming less unattended."
 EFH_northern_establishment: "Northern Establishment"
 EFH_northern_establishment_desc: "Federation doctrine was written for the ground it holds. Cold weather equipment is standard issue to the line, and the northern garrisons rotate through winter exercises regardless of the threat picture. The same formations acclimatise poorly below the Mediterranean."
 EFH_fusion_economy: "Commercial Fusion Power"
 EFH_fusion_economy_desc: "The first grid-scale tokamak facilities went online in 2017. Energy scarcity is effectively solved. Industrial output decoupled from fossil fuel supply chains."
 EFH_RTG_ideas: "Parasite Countertechnology"
 EFH_RTG_ideas_desc: "Early development of technologies to counter the Parasite threat. Detection systems, incendiary compounds, and containment protocols, in that order of urgency."
 EFH_TAD_idea: "Total American Death"
 EFH_TAD_idea_desc: "The United States has been the primary source of anti-EF propaganda and subversion. The Federation has committed itself to the complete eradication of the United States as a geopolitical entity."
 EFH_first_vagrant_info: "Knox County Research"
 EFH_first_vagrant_info_desc: "Classified files on Vagrant and parasite biology, with notes on the American military. Written by the 1st Vagrant."


 EFH_global_positioning: "Global Positioning"
 EFH_global_positioning_desc: "The European Federation wants to be more than a regional power. The Pacific, East Asia and South America are all in play."

 EFH_pacific_partnership: "Pacific Partnership"
 EFH_pacific_partnership_desc: "Japan has long sat in the Federation's sphere of influence. Now the Federation formalises that relationship, deepening economic and strategic ties against American encroachment."

 EFH_japan_tech_exchange: "Japan Technology Exchange"
 EFH_japan_tech_exchange_desc: "The Federation and Japan open a joint technology corridor."

 EFH_pacific_defense_pact: "Pacific Defence Pact"
 EFH_pacific_defense_pact_desc: "The Federation formally guarantees Japan's security, in public, where Washington has to respond to it."

 EFH_south_american_outreach: "South American Outreach"
 EFH_south_american_outreach_desc: "The Federation begins a quiet economic campaign in South America. Infrastructure investment, trade credits, and diplomatic personnel establish a foothold in what the United States considers its backyard."

 EFH_SAC_infrastructure_program: "South American Infrastructure Programme"
 EFH_SAC_infrastructure_program_desc: "The Federation's construction contracts in the South American Confederation become impossible to hide, and Washington notices."

 EFH_hemispheric_challenge: "Hemispheric Challenge"
 EFH_hemispheric_challenge_desc: "The Federation formally asserts an interest in the Western Hemisphere's stability. The Monroe Doctrine has a challenger for the first time in a century."

 EFH_beijing_channel: "Beijing Back-Channel"
 EFH_beijing_channel_desc: "Away from public scrutiny, the Federation opens a diplomatic channel with Beijing. Both sides have reasons to want a counterweight to Washington's global presence."

 EFH_trade_normalization: "Trade Normalisation"
 EFH_trade_normalization_desc: "The Federation and China normalise trade relations. New contracts flow through European ports. The United States takes note with considerable displeasure."

 EFH_eurasian_buffer_doctrine: "Eurasian Buffer Doctrine"
 EFH_eurasian_buffer_doctrine_desc: "The Federation signals that China is a natural buffer against American influence in Eurasia. The question is whether Beijing agrees, and how far it is willing to lean."



 EFH_japan_sphere_tt: "Japan is drawn deeper into the Federation's security and economic sphere."










 EFH_sino_efh_partnership: "Sino-European Partnership"
 EFH_sino_efh_partnership_desc: "Beijing has agreed to the buffer doctrine. Trade runs both ways, research is shared, and both sides are in it for as long as it pays."

 EFH_sino_research_exchange_active: "Sino-European Research Exchange"
 EFH_sino_research_exchange_active_desc: "Joint laboratories and shared findings on parasite biology and containment. The exchange is temporary by design, renewed only while both governments find it useful."


 EFH_eurasian_coordination: "Eurasian Coordination"

 EFH_sino_logistics_corridor: "Open a Sino-European Logistics Corridor"
 EFH_sino_logistics_corridor_desc: "Route Chinese industrial output through the partnership to reinforce European production. Renewable while the corridor stays open."
 EFH_sino_logistics_corridor_tt: "Adds steel to the capital region for 180 days."
 EFH_sino_trade_groundwork_tt: "Trade normalisation keeps the corridor cheap to run: additional political power."

 EFH_sino_research_exchange: "Convene a Sino-European Research Exchange"
 EFH_sino_research_exchange_desc: "Stand up joint laboratories on parasite biology and containment. Grants a temporary research bonus while the exchange runs."

 EFH_sino_eastern_intelligence: "Share the Eastern Infestation Picture"
 EFH_sino_eastern_intelligence_desc: "Pool what Beijing and Amsterdam each know about the parasite advance across the Asian landmass. A one-time intelligence hand-off on the Iris."
 EFH_sino_contact_groundwork_tt: "The Beijing back-channel makes the first hand-off larger: additional intelligence on the Iris."


 EFH_establish_atlantic_network: "Establish the Atlantic Network"
 EFH_establish_atlantic_network_desc: "Intelligence operations against American interests are authorised. A permanent collection network inside the United States requires money, patience, and people willing to disappear into American life for years. The federal services have all three."
 EFH_atlantic_network_groundwork_tt: "The pre-crisis northern intelligence groundwork shortens the build-up: 25 Political Power recovered and additional intelligence on American forces."

 EFH_intel_procurement_espionage: "Procurement Espionage"
 EFH_intel_procurement_espionage_desc: "American defence procurement leaks like any other bureaucracy. Contract documents, test data, and supplier specifications can be bought, copied, or photographed. Each operation carries a risk of exposure."
 EFH_procurement_espionage_risk_tt: "75% chance of clean extraction (+10 Political Power). 25% chance of exposure (EF-US escalation rises, American war support rises)."

 EFH_intel_canadian_listening_posts: "Canadian Listening Posts"
 EFH_intel_canadian_listening_posts_desc: "The intelligence groundwork laid on the northern frontier before the crisis makes a permanent signals presence possible. Listening stations along the Canadian border watch American military traffic around the clock. Washington will eventually notice."
 EFH_canadian_listening_posts_idea: "Canadian Listening Posts"
 EFH_canadian_listening_posts_idea_desc: "Signals stations on the northern frontier track American military traffic."
