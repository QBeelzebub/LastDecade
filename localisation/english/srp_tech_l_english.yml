 srp_exoskeleton_loadout: "Exoskeleton Loadout"
 srp_exoskeleton_loadout_desc: "Unlocks the 2024 infantry kit. Powered load frames and heavier plate, so a rifleman carries what a mule used to."
 srp_rtg_contact_kit: "RTG Contact Kit"
 srp_rtg_contact_kit_desc: "Unlocks the second RTG infantry tier. Same thermal round, a better seal on the generator, and a fissile bill per company that nobody enjoys reading."
 srp_hardened_perimeter_1: "Hardened Perimeter"
 srp_hardened_perimeter_1_desc: "Unlocks land forts to level 5 and coastal forts to level 4, and every level holds better. Concrete is the one material the parasites have not found a use for."
 srp_hardened_perimeter_2: "Deep Perimeter"
 srp_hardened_perimeter_2_desc: "Unlocks land forts to level 10 and coastal forts to level 8."
 srp_marine_battalions: "Marine Battalions"
 srp_marine_battalions_desc: "Unlocks marine battalions, infantry trained and equipped for opposed landings."
 srp_wheeled_recon: "Wheeled Reconnaissance"
 srp_wheeled_recon_desc: "Unlocks armoured car equipment and the armoured recon company. Cheaper than a helicopter, and it does not need an airfield that still exists."
 srp_quarantine_engineers: "Quarantine Engineers"
 srp_quarantine_engineers_desc: "Unlocks the quarantine company, cordon crews trained alongside the field hospitals. They dig, they tape, they suppress, and they hand the state back with a stamp on it."
 srp_burn_teams: "Burn Teams"
 srp_burn_teams_desc: "Unlocks the burn company, flamethrower sappers on the engineer establishment. Clearburn worked for about ninety days, and this is the unit that was holding the nozzle."
 srp_root_burning_kits: "Root Burning Kits"
 srp_root_burning_kits_desc: "Unlocks the regimental burn section and issues Clearburn Mk.2 to the burn company. The roots still go deeper than the fuel does."
 srp_gendarmerie: "Gendarmerie"
 srp_gendarmerie_desc: "Unlocks the military police company. Garrison duty on infested ground is mostly telling people they cannot go home yet."
 srp_radar_station_2: "Radar Station Network"
 srp_radar_station_2_desc: "Unlocks radar stations to level 4. Coverage overlaps for the first time, so a flight of something is seen by two operators instead of argued about by one."
 srp_synthetic_fuel: "Synthetic Fuel Plants"
 srp_synthetic_fuel_desc: "Unlocks synthetic refineries to level 3 and raises fuel gain. The oil states are among the first eaten, and the tanks do not care why."
 srp_point_defence_laser: "Point Defence Lasers"
 srp_point_defence_laser_desc: "Unlocks the third anti-air tier and static air defence to level 5. Solid-state lasers on the site perimeter, cheap per shot once the plant that feeds them is built."
 srp_thermobaric_rockets: "Thermobaric Rockets"
 srp_thermobaric_rockets_desc: "Unlocks motorised rocket launchers and the motorised rocket brigade. A thermobaric salvo empties a growth field of air, which is the part the growth needs."
 srp_dozer_blade_tech: "Dozer Blades"
 srp_dozer_blade_tech_desc: "Unlocks the dozer blade tank module. A tank that can bury itself, and cut a lane through biomass that a bulldozer crew would not survive clearing."
 srp_flame_projector_tech: "Flame Projector"
 srp_flame_projector_tech_desc: "Unlocks the flame projector as a main armament. Trades the gun for a fuel tank and a nozzle."
 srp_rws_tech: "Remote Weapon Station"
 srp_rws_tech_desc: "Unlocks the remote weapon station module. A stabilised roof gun fired from inside, for the small things that climb the hull."
 srp_sealed_compartment_tech: "Sealed Crew Compartment"
 srp_sealed_compartment_tech_desc: "Unlocks the sealed crew compartment module. Overpressure, filters and a liner, so the crew breathes the air they brought rather than the air over a growth field."
 srp_apc_tech: "Armoured Personnel Carrier"
 srp_apc_tech_desc: "Unlocks a cheap carrier variant on the tracked IFV line. Less armour, no gun to speak of, and twice as many of them for the same steel."
 srp_transport_2: "Tiltrotor Airlift"
 srp_transport_2_desc: "Unlocks the second transport aircraft tier. Rotors up to land in a car park, rotors forward to leave it, which matters once the airfields are inside the cordon."
 srp_littoral_patrol: "Littoral Patrol Craft"
 srp_littoral_patrol_desc: "Unlocks the littoral hull, a short-legged corvette on the destroyer line. Half the strength, half the range, and a third of the yard time, for a coast that needs hulls this year."
 srp_asw_drones: "Escort Drones"
 srp_asw_drones_desc: "Unlocks the anti-submarine drone module for escorts. An unmanned hull that goes looking for a Devourer so the ship that launched it does not have to."
 parasite_rail_swarm_2: "Rail Swarm Columns"
 parasite_rail_swarm_2_desc: "Unlocks the second Rail Swarm tier. Denser membrane and longer columns, and the lines they laid carry more of us than they ever carried of them."
 parasite_dispatcher_fields: "Dispatcher Fields"
 parasite_dispatcher_fields_desc: "Unlocks up to three Dispatchers per state. Three flowers listening instead of one, and the vibration map fills in along with the vocabulary."
 srp_burn_company: "Burn Company"
 srp_burn_company_desc: "Flamethrower sappers attached at division level. Attack bonuses in forest, jungle, marsh, towns and fortifications, where the growth is thickest and the fuel goes furthest."
 srp_burn_regimental: "Regimental Burn Section"
 srp_burn_regimental_desc: "A burn detachment attached at regiment level. Smaller nozzles, the same fuel, and every regiment carries some."
 srp_quarantine_company: "Quarantine Company"
 srp_quarantine_company_desc: "Cordon engineers attached at division level. Entrenchment and suppression, so a division holds infested ground without bleeding into it."
 srp_ucav: "Strike Drone"
 srp_ucav_desc: "Unmanned close air support wing. Loiters over the target for hours and goes home with nobody in it."
 infantry_equipment3: "Infantry Equipment (2024)"
 infantry_equipment3_desc: "Powered load frames, heavier plate and a squad weapon sized for what the squad now meets. The first kit issued on the assumption that the war is not ending."
 srp_rtg_infantry_equipment_2: "RTG Contact Kit"
 srp_rtg_infantry_equipment_2_desc: "Second RTG tier. Better generator seals and a hotter penetrator, at a fissile ration per company."
 srp_ifv_equipment_apc: "Armoured Personnel Carrier"
 srp_ifv_equipment_apc_desc: "A stripped tracked carrier on the IFV chassis. Thin armour, a machine gun, and a production line that does not stall on chromium."
 artillery_equipment_srp_incendiary: "Incendiary Shells"
 artillery_equipment_srp_incendiary_desc: "155mm cases filled with the Clearburn catalyst. High soft attack, next to nothing against armour, and a burn that keeps going after the barrage stops."
 srp_ucav_equipment: "Strike Drone"
 srp_ucav_equipment_desc: "Unmanned strike aircraft. Cheap, slow and expendable."
 srp_ucav_equipment_1: "Strike Drone Mk.I"
 srp_ucav_equipment_1_desc: "First-generation UCAV. Twelve hundred kilometres of range, a modest bomb load, and a ground station somewhere with coffee."
 srp_destroyer_hull_littoral: "Littoral Patrol Craft"
 srp_destroyer_hull_littoral_desc: "A short-legged corvette on the destroyer line. Half the strength and range of a destroyer, one open slot, and a fraction of the yard time."
 parasite_bio_rail_2: "Rail Swarm Column"
 parasite_bio_rail_2_desc: "Longer synchronised columns with denser membrane. The rails carry more and the swarm loses less to whatever is still shooting at it."
 srp_dozer_blade: "Dozer Blade"
 srp_dozer_blade_desc: "A hydraulic blade on the glacis. Entrenchment and breakthrough up, speed slightly down, and a lane through biomass that nobody has to dig by hand."
 srp_flame_projector: "Flame Projector"
 srp_flame_projector_desc: "Pressurised fuel and a nozzle in place of the gun. High soft attack, little to say to armour, and a reliability penalty from carrying the fuel inside."
 srp_remote_weapon_station: "Remote Weapon Station"
 srp_remote_weapon_station_desc: "Stabilised roof gun fired from under armour. Defence, a little soft attack, and something to point at whatever is on the hull."
 srp_sealed_crew_compartment: "Sealed Crew Compartment"
 srp_sealed_crew_compartment_desc: "Overpressure, filtration and a liner around the crew. Reliability up, and the tank stays crewed in air that infantry cannot stand in."
 srp_asw_drone: "Anti-Submarine Drone"
 srp_asw_drone_desc: "An unmanned surface hull carried by an escort. Sub attack and sub detection up, and the drone takes the first bite instead of the ship."

 train_equipment: "Train"
 train_equipment_desc: "Trains transport supplies from the Supply Capital to Supply Hubs connected by rail. Without them, front-line forces go critically undersupplied."
 train_equipment_1: "Civilian Train"
 train_equipment_1_desc: "Requisitioned civilian freight rolling stock. Cheap to produce and easy to replace, but unarmoured and vulnerable to attack."
 train_equipment_2: "Military Train"
 train_equipment_2_desc: "Reinforced rolling stock built for wartime logistics. Armoured bodywork and hardened couplings make it far more survivable than requisitioned civilian equipment."

 ld_civilian_train: "Civilian Requisition"
 ld_civilian_train_desc: "Nationalises civilian freight infrastructure for military logistics. Cheap trains, fast to produce. The baseline for keeping armies supplied across rail networks."
 ld_military_train: "Military Train Programme"
 ld_military_train_desc: "Dedicated military rolling stock with armoured construction. Substantially more survivable than requisitioned civilian trains, at higher production cost."
