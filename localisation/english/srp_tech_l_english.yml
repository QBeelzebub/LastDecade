l_english:
 infantry_equipment: "Infantry Equipment"
 infantry_equipment_desc: "Standard individual combat equipment. Small arms, ammunition, body armour, and communications kit issued to all infantry."
 infantry_equipment0: "Infantry Equipment (2015)"
 infantry_equipment0_desc: "Baseline modern small arms, protective equipment, communications kit, and squad support tools issued before the crisis buildup."
 infantry_equipment1: "Infantry Equipment (2020)"
 infantry_equipment1_desc: "Updated frontline infantry kit with improved optics, body armor, and communications hardware for modern combined-arms operations."
 infantry_equipment2: "Infantry Equipment (2022)"
 infantry_equipment2_desc: "Crisis-era infantry kit adapted for contaminated environments, persistent drone observation, and sustained contact with biological threats."
 support_equipment: "Support Equipment"
 support_equipment_desc: "Logistical and engineering equipment for support and motorized roles. Vehicles, tools, and communications hardware issued to non-combat support elements."
 support_equipment_1: "Support Equipment"

 srp_mbt_1: "4th-Generation MBT"
 srp_mbt_1_desc: "Leopard 2A7 / Leclerc / Challenger 2 tier. Standard 4th-generation armored platform across major frontline armies entering 2020."
 srp_mbt_2: "Active Protection Systems"
 srp_mbt_2_desc: "Hardkill and softkill APS retrofit packages. Substantially reduces shaped-charge penetration at range."
 srp_mbt_3: "Next-Generation MBT"
 srp_mbt_3_desc: "MGCS-class successor. Composite turret, hybrid drive, distributed aperture sensor integration."
 srp_ifv_1: "Modern IFV"
 srp_ifv_1_desc: "Puma / CV90 / VBCI class. Standard mechanized infantry carrier across 2020 frontline armies."
 srp_ifv_2: "IFV Upgrade Package"
 srp_ifv_2_desc: "Active protection, modular armor, drone interface systems. Operator neural link preparation."
 srp_infantry_eq_1: "Modern Infantry Equipment"
 srp_infantry_eq_1_desc: "G36-successor platform, IVAS integrated sighting, advanced body armor. Standard frontline infantry kit entering 2020."
 srp_infantry_eq_2: "Enhanced Infantry Kit"
 srp_infantry_eq_2_desc: "Exoskeletal load assist, networked sighting, individual fire control systems. Reduces cognitive load significantly."
 srp_arty_1: "Modern Self-Propelled Artillery"
 srp_arty_1_desc: "PzH 2000 / Caesar class. Precision-guided munitions integration, automated fire control."
 srp_rocket_arty_1: "Multiple Launch Rocket Systems"
 srp_rocket_arty_1_desc: "MLRS / HIMARS tier. Extended range, precision guided munitions. Later adapted as Beckon Cluster delivery platform."

 srp_fighter_gen4: "4th-Generation Fighter"
 srp_fighter_gen4_desc: "Eurofighter Typhoon / Rafale class. AESA-equipped and BVR-capable. Standard 4th-generation fighter across major air forces entering 2020."
 srp_fighter_gen45: "4.5th-Generation Upgrade"
 srp_fighter_gen45_desc: "Enhanced AESA suite, supercruise envelope extension, Meteor BVR integration, conformal fuel tanks."
 srp_tandem_wing: "EF Tandem Wing Fighter"
 srp_tandem_wing_desc: "Canard-delta with tandem secondary wing, distributed aperture sensors, and fusion power plant enabling extended supercruise. First airframe purpose-built around fusion propulsion."
 srp_fighter_gen5: "5th-Generation Fighter"
 srp_fighter_gen5_desc: "Supercruise-capable multirole platform with low radar cross-section and internal payload carriage. The most capable air-superiority design available by mid-decade."
 srp_cas_1: "Modern Strike Aircraft"
 srp_cas_1_desc: "Tornado GR4 successor class. Precision ground attack, dedicated close air support doctrine."
 srp_cas_drone: "Unmanned Strike Platform"
 srp_cas_drone_desc: "UCAV doctrine replacing manned CAS. Persistent loiter, swarm coordination. Substantially reduces pilot attrition."
 srp_bomber_1: "Strategic Bomber"
 srp_bomber_1_desc: "Next-generation strategic strike platform. Stealth features, standoff munitions, and extended operational range."
 srp_transport_1: "Heavy Transport Aircraft"
 srp_transport_1_desc: "A400M / C-17 class. Strategic airlift enabling rapid response deployment at intercontinental range."

 srp_fusion_economy: "Commercial Fusion Power"
 srp_fusion_economy_desc: "First grid-scale tokamak facilities went online 2017. Energy scarcity is effectively solved. Industrial output decoupled from fossil fuel supply chains."
 srp_advanced_construction: "Advanced Construction Methods"
 srp_advanced_construction_desc: "Modular prefabrication, automated site management. Fusion power enables 24-hour construction cycles without fuel cost penalty."
 srp_modular_industry: "Modular Industrial Systems"
 srp_modular_industry_desc: "Factory-as-a-service architecture. Rapid reconfiguration between civilian and military production. Critical for wartime adaptation."
 srp_precision_mfg: "Precision Manufacturing"
 srp_precision_mfg_desc: "CNC automation, additive manufacturing integration. Tolerance improvements across all equipment lines."
 srp_automated_mfg: "Automated Manufacturing"
 srp_automated_mfg_desc: "Robotic assembly, AI-driven quality control. Labour input minimised. Output scales with energy input, not workforce availability."
 srp_logistics_1: "Modern Logistics Systems"
 srp_logistics_1_desc: "Just-in-time supply chain management, predictive distribution networks, real-time consumption monitoring."

 srp_comms_1: "Integrated Communications"
 srp_comms_1_desc: "5G military mesh network with satellite communication redundancy. Unified command picture across all connected formations."
 srp_comms_2: "Next-Generation Communications"
 srp_comms_2_desc: "Quantum key distribution and hardened signal architecture. Designed to remain secure against advanced electronic warfare environments."
 srp_radar_1: "Modern Radar Systems"
 srp_radar_1_desc: "AESA ground and airborne systems with space-based ISR integration. Baseline modern air defence architecture."
 srp_radar_2: "Advanced Sensor Fusion"
 srp_radar_2_desc: "Multi-domain operational picture compilation. Ground radar, airborne, space, and networked sensors fused into unified display."
 srp_cyber_1: "Cyber Warfare Capabilities"
 srp_cyber_1_desc: "Offensive and defensive cyber operations at national scale. Infrastructure targeting, communications disruption, and network penetration capability."
 srp_cyber_2: "Advanced Cyber Operations"
 srp_cyber_2_desc: "Infrastructure disruption at scale. Preliminary signal analysis frameworks with early potential for characterising anomalous electromagnetic emissions from Beckon-associated root activity."
 srp_compute_1: "High-Performance Computing"
 srp_compute_1_desc: "Consolidated server estates and GPU clusters. Unlocks the Data Centre building, accelerating national research and codebreaking."
 srp_compute_2: "Accelerated Computing"
 srp_compute_2_desc: "Dedicated accelerators and large-scale parallel training. Data analysis pipelines feed national intelligence work directly."
 srp_compute_3: "Hyperscale Compute"
 srp_compute_3_desc: "Fusion-powered training campuses running continuous large-model workloads. Unlocks the AI Training Cluster. Requires fusion-grade baseload power to operate."
 srp_compute_4: "Frontier Model Infrastructure"
 srp_compute_4_desc: "Multi-campus training fabrics with automated analysis of intercepted signal and biomass-survey datasets at a scale no human staff could match."
 srp_compute_5: "Strategic Compute Supremacy"
 srp_compute_5_desc: "Endgame model scale. Autonomous analysis across the full intelligence picture. Conventional encryption offers little resistance."

 srp_incendiary1: "Clearburn Mk.1"
 srp_incendiary1_desc: "First-generation incendiary compounds. Effective against surface-level Buglin and Rupter organisms. Penetration into root network structures limited."
 srp_incendiary2: "Clearburn Mk.2"
 srp_incendiary2_desc: "Advanced incendiary systems with thermite-catalyst penetrators and deeper burn performance against early-stage root establishment."

 srp_incendiary: "Basic general-use incendiary weapons."
 srp_incendiary_desc: "Early general use incendiary compounds. Effective against surface-level Buglin and Rupter organisms. Penetration into root network structures limited. Iris adaptation observed within 90 days of deployment."
 srp_infrared: "Basic SF6 detection."
 srp_infrared_desc: "Early detection systems utilising Sulfur Hexafluoride gas sensors. Capable of identifying early-stage Beckon Cluster root growth in soil. Limited range and susceptibility to false positives from industrial emissions."

 srp_fighter_airframe: "Fighter Airframe"
 srp_fighter_airframe_desc: "Baseline fighter airframe. Canard-delta configuration optimised for agility and supercruise performance. Modular design allows integration of various avionics and weapon systems."
 srp_fighter_gen4_airframe: "Gen 4 Fighter Airframe"
 srp_fighter_gen4_airframe_desc: "4th-generation fighter airframe. Enhanced aerodynamics for improved maneuverability and supercruise capability. Integrated sensor suite with modular weapon hardpoints."
 srp_fighter_gen45_airframe: "Gen 4.5 Fighter Airframe"
 srp_fighter_gen45_airframe_desc: "Supersonic upgrade bridging 4th and 5th generation designs. Refined avionics and a stronger powerplant raise top-end performance, without the full low-observable shaping of a clean 5th-generation airframe."
 srp_fighter_gen5_airframe: "Gen-5 Fighter Airframe"
 srp_fighter_gen5_airframe_desc: "Fully integrated 5th-generation platform. Designed for contested airspace with parasite ground-strike requirements factored into baseline mission envelope. Internal bays maintain reduced radar cross-section at combat loadout."
 srp_lraam: "Long-Range AAM Suite"
 srp_lraam_desc: "Beyond-visual-range air-to-air missile integration. Substantially extends engagement envelope versus both conventional and anomalous aerial targets."
 srp_internal_bay_weapon: "Internal Weapons Bay"
 srp_internal_bay_weapon_desc: "Enclosed internal carriage for mixed air-to-air and air-to-ground stores. Maintains reduced radar cross-section at combat loadout."
 srp_thrust_vectoring: "Thrust Vectoring Nozzle"
 srp_thrust_vectoring_desc: "Post-combustion thrust deflection system. Substantially improves high-angle maneuverability at marginal supersonic efficiency cost."
 srp_fusion_microcore: "Fusion Microcore Engine"
 srp_fusion_microcore_desc: "Compact fusion-cycle engine. Delivers exceptional thrust-to-weight ratio with extended operational range at controlled fuel cost."
 srp_distributed_aperture: "Distributed Aperture System"
 srp_distributed_aperture_desc: "360-degree infrared sensor array fused into a unified situational picture. Eliminates blind-spot vulnerabilities and substantially reduces night combat penalty."

 srp_prop_engine: "Turboprop Engine"
 srp_prop_engine_desc: "Single turboprop powerplant. Reliable and fuel-efficient at low altitude. Not suited to high-performance combat roles."
 srp_twin_prop: "Twin Turboprop"
 srp_twin_prop_desc: "Paired turboprop configuration. Improves payload capacity and sustained cruise endurance on patrol and transport missions."
 srp_twin_jet: "Twin Turbofan"
 srp_twin_jet_desc: "Dual turbofan installation. Delivers substantially greater total thrust and improved single-engine handling at the cost of additional weight and fuel draw."
 srp_rocket_engine: "Rocket Motor"
 srp_rocket_engine_desc: "Short-burn rocket propulsion stage. Extreme speed and climb performance for intercept scenarios. Operational range is severely limited."
 srp_torpedo: "Torpedo Mounting"
 srp_torpedo_desc: "External torpedo carriage for anti-ship operations. Capable against surface combatants and port infrastructure at the cost of drag and agility."
 srp_anti_ship_missile: "Anti-Ship Missile"
 srp_anti_ship_missile_desc: "Guided sea-skimming missile optimised for standoff naval engagement. Substantially greater range and terminal velocity than conventional torpedoes."
 srp_kamikaze_charge: "Kamikaze Charge"
 srp_kamikaze_charge_desc: "Fixed explosive payload for terminal impact detonation. No recovery is planned or possible. Reserved for drone airframes or desperate circumstances."
 srp_recon_camera: "Reconnaissance Camera"
 srp_recon_camera_desc: "High-resolution optical and multispectral imaging system. Enables dedicated reconnaissance sorties over denied territory."
 srp_mine_pod: "Mine Dispenser Pod"
 srp_mine_pod_desc: "Airdropped naval mine deployment system. Used for area denial in straits, approaches, and contested littoral zones."
 srp_radio_navigation: "GPS Navigation Suite"
 srp_radio_navigation_desc: "Integrated satellite navigation and terrain-following system. Improves all-weather strike accuracy and reduces mission abort rates at night."
 srp_defense_turret: "Defensive Gun Pod"
 srp_defense_turret_desc: "Remotely operated cannon pod covering the rear arc. Provides some protection against pursuit and close-in interception on strike and patrol missions."

 srp_ifv_equipment: "Infantry Fighting Vehicle"
 srp_ifv_equipment_desc: "Modern wheeled and tracked infantry fighting vehicles. Replaces Cold War-era APCs across all ground forces."
 srp_ifv_equipment_1: "IFV Mk.I"
 srp_ifv_equipment_2: "IFV Mk.II"

 motorized: "Motorized Infantry"
 motorized_desc: "Wheeled IFV-mounted infantry. Fast and flexible, weaker armour than tracked equivalents."
 mechanized: "Mechanized Infantry"
 mechanized_desc: "Tracked IFV infantry. Better protected than motorized, optimised for combined-arms operations."

 srp_atgm_equipment: "Anti-Tank Guided Missile"
 srp_atgm_equipment_desc: "Third and fourth-generation ATGM systems. Fire-and-forget capable against all known armour classes."
 srp_atgm_equipment_1: "ATGM Gen.III"
 srp_atgm_equipment_2: "ATGM Gen.IV"

 srp_atgm_brigade: "ATGM Team"
 srp_atgm_brigade_desc: "Specialist anti-armour teams equipped with man-portable guided missiles. Lethal against tanks, limited against soft targets."
 srp_atgm_support: "ATGM Support Company"
 srp_atgm_support_desc: "Divisional anti-tank guided missile support element, attached to provide organic armour-defeating capability."

 srp_spg_brigade: "Self-Propelled Gun"
 srp_spg_brigade_desc: "MBT chassis converted to indirect fire role. Design the chassis with the howitzer module in the equipment designer."

 srp_ifv_chassis_tech: "IFV Chassis"
 srp_ifv_chassis_tech_desc: "Modern infantry fighting vehicle platforms enter service, replacing legacy armoured personnel carriers in line and mechanised roles."
 srp_ifv_chassis_tech_2: "IFV Chassis Mk.II"
 srp_ifv_chassis_tech_2_desc: "Second-generation IFV hull with improved survivability, active protection integration, and broader amphibious capability."
 srp_howitzer_module: "Howitzer Conversion"
 srp_howitzer_module_desc: "MBT chassis adapted for indirect fire. Field howitzer superstructure replaces the main gun, converting armour into organic artillery."
 srp_atgm_1: "ATGM Doctrine"
 srp_atgm_1_desc: "Standardised anti-tank guided missile teams integrated into combined-arms doctrine. HEAT warheads effective against all current main battle tank armour."
 srp_atgm_2: "Advanced ATGM"
 srp_atgm_2_desc: "Top-attack and fire-and-forget capable missiles enter service. Effective against active protection systems and reactive armour packages."

 srp_laser_turret_tech: "Parasite Targeting Turret"
 srp_laser_turret_tech_desc: "A fixed laser-based defence emplacement calibrated to exploit parasite anatomical weak points. Hardens a state's defensive perimeter and increases attacker attrition."
 srp_laser_turret: "Parasite Targeting Turret"
 srp_laser_turret_desc: "A fixed laser-based defence emplacement calibrated to exploit parasite anatomical weak points. Hardens a state's defensive perimeter and increases attacker attrition."
 srp_weakpoint_targeting_idea: "Weak-Point Targeting Software"
 srp_weakpoint_targeting_idea_desc: "Analysis algorithms derived from the parasite weak-point research programme are distributed army-wide. Combat units identify and exploit structural vulnerabilities in parasite anatomy in real time."
 srp_turret_deployment: "Turret Deployment"
 srp_turret_deployment_desc: "Deploy parasite targeting turrets to states under threat of infestation."
 SRP_deploy_laser_turret: "Deploy Targeting Turret"
 SRP_deploy_laser_turret_desc: "Install a parasite targeting turret in this state. The emplacement will reinforce local defences and increase attrition against attacking forces."

 srp_mbt_chassis1: "MBT Mk.I"
 srp_mbt_chassis1_desc: "The 2020 baseline chassis. Composite armor, digital fire control, third-generation stabilised optics."

 srp_mbt_chassis: "MBT Platform"
 srp_mbt_chassis_desc: "Unlocks the baseline 2020 main battle tank chassis and the tank designer."
 srp_mbt_chassis2: "Next-Generation MBT Chassis"
 srp_mbt_chassis2_desc: "The 2022-generation chassis upgrade. Revised composite armor and improved engine reliability. Required for NBC sealing compatibility."
 srp_nbc_sealing: "NBC Sealing Systems"
 srp_nbc_sealing_desc: "Sealed crew compartments, filtered air intakes, and biohazard-rated hull coatings developed in response to documented parasite infestation vectors. Significantly reduces crew exposure to spore dispersal."
 srp_mbt_chassis3: "Post-Doctrine MBT Chassis"
 srp_mbt_chassis3_desc: "The 2025 chassis designed with parasite-response doctrine from the start. Faster and better protected than the Mk.II."
 srp_mbt_chassis4: "Crisis-Era MBT Chassis"
 srp_mbt_chassis4_desc: "The 2028 endgame chassis. Produced in small numbers under collapsing industrial conditions. Represents the peak of what human tank design can achieve."

 tank_nbc_sealing: "NBC Sealing Kit"
 tank_nbc_sealing_desc: "Sealed hatches, filtered air systems, and biohazard hull liner. Makes the crew compartment survivable in contaminated environments. Increases effective hardness against soft-weapon threats."

 srp_drivetrain_tech: "Drivetrain Modernisation"
 srp_drivetrain_tech_desc: "Gas turbine engine and hydropneumatic suspension packages developed for the 2020 battlefield. Faster, more responsive chassis at the cost of increased maintenance."
 srp_hybrid_drive_tech: "Hybrid Drive System"
 srp_hybrid_drive_tech_desc: "Series hybrid electric drivetrain. Electric motors handle torque delivery while the turbine operates at a fixed efficient RPM. Quieter, more fuel-stable, and more reliable than pure turbine configurations."
 srp_adv_drivetrain_tech: "Advanced Drivetrain"
 srp_adv_drivetrain_tech_desc: "High-output next-generation turbine with adaptive thermal management and computer-controlled active suspension. Peak mobility, requires premium maintenance infrastructure."

 srp_advanced_materials: "Advanced Armor Materials"
 srp_advanced_materials_desc: "Quench-hardened homogeneous welded steel production. Cheaper and lighter than conventional cast armor with comparable ballistic protection."
 srp_composite_armor_tech: "Composite Armor Systems"
 srp_composite_armor_tech_desc: "Chobham-derived multi-layer composite. Ceramic strike faces bonded to steel and polymer backing provide significantly better kinetic penetrator resistance than monolithic steel."
 srp_spaced_composite_tech: "Spaced Composite Arrays"
 srp_spaced_composite_tech_desc: "Layered composite arrays with void channels and advanced ceramic inserts. Maximum conventional armor protection. Heavy and resource-intensive."

 srp_modern_armament: "Modern Tank Armament"
 srp_modern_armament_desc: "120mm smoothbore cannon and hardened MBT turret programmes. NATO-standard weapons integrated with 2020-era fire control and composite cheek armor."
 srp_next_gen_armament: "Next-Generation Armament"
 srp_next_gen_armament_desc: "125mm autoloaded smoothbore and unmanned turret platform. Higher rate of fire and reduced crew exposure, at the cost of increased mechanical complexity."
 srp_adv_armament: "Advanced Cannon Systems"
 srp_adv_armament_desc: "130mm high-velocity smoothbore. Next-generation European cannon programme offering decisive anti-armor superiority over all known armor configurations at combat range."

 srp_gas_turbine: "Gas Turbine Engine"
 srp_gas_turbine_desc: "Multi-fuel gas turbine. High power-to-weight and faster acceleration. Requires more maintenance than diesel configurations."
 srp_hybrid_drive: "Hybrid Drive"
 srp_hybrid_drive_desc: "Series hybrid drivetrain with electric motor and turbine generator. More reliable than pure turbine. Quieter under low-load conditions."
 srp_high_output_turbine: "High-Output Turbine"
 srp_high_output_turbine_desc: "Next-generation adaptive turbine. Peak speed and acceleration. Demands high-grade maintenance infrastructure and specialist crews."

 srp_welded_steel: "Welded Steel Armor"
 srp_welded_steel_desc: "Quench-hardened homogeneous steel. Lighter and cheaper than cast. Modest ballistic protection. Good base for add-on systems."
 srp_composite_armor: "Composite Armor"
 srp_composite_armor_desc: "Chobham-derivative layered composite. Ceramic and polymer backing behind a hardened steel face. Substantially better AP resistance than steel."
 srp_spaced_composite: "Spaced Composite Armor"
 srp_spaced_composite_desc: "Multi-layer spaced composite with void channels. Maximum conventional protection. Heavy. Requires chromium for advanced ceramic matrix production."
 srp_nanocomposite: "Nanocomposite Armor"
 srp_nanocomposite_desc: "Engineered nanostructure composite. Theoretical ceiling of conventional armor technology. Extreme cost, chromium-intensive."

 srp_hydropneumatic: "Hydropneumatic Suspension"
 srp_hydropneumatic_desc: "Variable-clearance hydropneumatic struts. Better cross-country stability and gun depression. Standard on most post-2000 MBT designs."
 srp_active_suspension: "Active Suspension"
 srp_active_suspension_desc: "Computer-controlled adaptive damping. Virtually eliminates hull motion during firing. Improves moving-fire accuracy significantly."

 srp_armored_mbt_turret: "Armored MBT Turret"
 srp_armored_mbt_turret_desc: "Hardened turret with composite cheek armor and integrated crew protection. Better survivability than the baseline modern turret."
 srp_unmanned_turret: "Unmanned Turret"
 srp_unmanned_turret_desc: "Autoloaded unmanned turret. Crew isolated in a protected hull capsule. Lower profile and lighter weight. More vulnerable to mechanical failure under sustained combat."
 srp_parasite_interface_turret: "Parasite Interface Turret"
 srp_parasite_interface_turret_desc: "Turret sensor cluster and targeting array tuned to exploit behavioral weak points identified by the weakpoint algorithm. Designed to work against known parasite unit types."

 srp_120mm_smoothbore: "120mm Smoothbore"
 srp_120mm_smoothbore_desc: "Standard L44/L55-class smoothbore. NATO doctrine baseline. Good all-round anti-armor and anti-infantry performance."
 srp_125mm_autoloaded: "125mm Autoloaded Cannon"
 srp_125mm_autoloaded_desc: "Eastern-doctrine 125mm smoothbore designed around a carousel autoloader. Higher AP penetration and better sustained rate of fire than manually loaded guns."
 srp_130mm_hv_cannon: "130mm High-Velocity Cannon"
 srp_130mm_hv_cannon_desc: "Next-generation European cannon programme. Defeats all known armor at combat ranges. Longer barrel, requires turret reinforcement."
 srp_railgun_prototype: "Electromagnetic Railgun"
 srp_railgun_prototype_desc: "Projectile velocity renders conventional armor irrelevant. Low rate of fire. Power systems are large and sensitive to battle damage. The result is a field prototype with limited production value."

 srp_autoloader_module: "Autoloader System"
 srp_autoloader_module_desc: "Mechanical autoloader replaces the human loader crew position. Increases sustained rate of fire but adds maintenance complexity and reduces tolerance for ammunition feed faults."

 srp_era_plating: "ERA Plating"
 srp_era_plating_desc: "Explosive reactive armor bonded to the hull exterior. Disrupts incoming shaped charges. Significantly improves armor protection, slight defence bonus."
 srp_aps: "Active Protection System"
 srp_aps_desc: "Intercept system for incoming missile threats. Improves effective hardness and crew survivability. Marginally reduces assault capability due to bulk."
 srp_advanced_optics: "Advanced Optics Package"
 srp_advanced_optics_desc: "High-generation thermal sights and AI fire correction. Crews engage more decisively at all ranges, improving breakthrough rate."
 srp_autoloader: "Autoloader"
 srp_autoloader_desc: "Automated loading mechanism. Higher rate of fire improves both soft and hard attack, while the added maintenance burden reduces reliability."
 srp_modern_howitzer: "Modern Howitzer"
 srp_modern_howitzer_desc: "Indirect-fire howitzer mounted in place of the main gun. Reclassifies the vehicle as artillery and delivers heavy soft attack, at the cost of anti-armor performance, protection, and speed."

 srp_artillery_1: "Modern Artillery Systems"
 srp_artillery_1_desc: "Baseline 2020 field artillery doctrine. Encompasses towed howitzers, self-propelled guns, and fire-control integration in service across all major military powers."
 srp_artillery_2: "Improved Artillery Fire Control"
 srp_artillery_2_desc: "Upgraded ballistic computers and target acquisition systems. Better coordination between forward observers and battery commanders improves first-round hit probability."
 srp_artillery_3: "Advanced Precision Munitions"
 srp_artillery_3_desc: "GPS-guided shells and improved propellant technologies extend effective range and accuracy, reducing the number of rounds needed to suppress or destroy a target."
 srp_artillery_4: "Next-Generation Artillery Doctrine"
 srp_artillery_4_desc: "Fully networked fire missions, automated loading systems, and hardened command links. The most capable conventional artillery platform achievable under current conditions."
 srp_nuclear_artillery: "Tactical Nuclear Artillery"
 srp_nuclear_artillery_desc: "Artillery-delivered nuclear warheads. Renders conventional force concentration irrelevant. Still under development."

 srp_aa_1: "Modern Air Defence Systems"
 srp_aa_1_desc: "Baseline 2020 ground-based air defence. Covers short-range SAM batteries, autocannon vehicles, and radar-linked fire control already in service worldwide."
 srp_aa_2: "Advanced SAM Platforms"
 srp_aa_2_desc: "Medium-range surface-to-air missiles with improved radar acquisition and multi-target engagement. Substantially raises the cost of low-altitude air operations."
 srp_aa_3: "Integrated Air Defence Networks"
 srp_aa_3_desc: "Layered radar coverage, networked command systems, and coordinated multi-tier missile engagement. Creates no-fly zones that fixed-wing aircraft cannot penetrate without severe attrition."

 srp_rocket_1: "Multiple Launch Rocket Systems"
 srp_rocket_1_desc: "Baseline 2020 MLRS capability. Area saturation systems capable of delivering large volumes of rockets across a wide kill zone within seconds."
 srp_rocket_2: "Precision MLRS"
 srp_rocket_2_desc: "GPS-guided rocket munitions shift the doctrine from area suppression to precision strike. Greatly reduces ammunition expenditure and resupply burden per mission."
 srp_rocket_3: "Long-Range Rocket Barrage"
 srp_rocket_3_desc: "Extended-range rockets and improved propellant reach well beyond conventional artillery range, giving commanders deep-fire options without fixed launch infrastructure."

 EQ_MOD_CAT_tank_stbn_main_armament_TITLE: "STBN Armament"

 srp_destroyer_hull: "Destroyer Hull"
 srp_destroyer_hull_desc: "Modern guided-missile destroyer platform. Fast surface combatant optimised for escort duty and anti-submarine warfare."
 srp_destroyer_hull_1: "Destroyer Hull (2020)"
 srp_destroyer_hull_1_desc: "2020-baseline destroyer. Equivalent to Arleigh Burke Flight III or Horizon-class standards. Phased-array radar, VLS cells, modern ASW suite."
 srp_destroyer_hull_2: "Destroyer Hull (2023)"
 srp_destroyer_hull_2_desc: "Mid-decade upgrade hull. Enlarged sensor arrays, improved power generation, additional weapons bays. Fielded as the parasite threat began demanding rapid surface response capability."
 srp_destroyer_hull_3: "Destroyer Hull (2027)"
 srp_destroyer_hull_3_desc: "Late-decade destroyer. Three-slot weapons configuration, next-generation stealth shaping. One of the last new hull designs commissioned before shipbuilding collapses."

 srp_destroyer_hull_tech_1: "Modern Destroyer Hull"
 srp_destroyer_hull_tech_1_desc: "Unlocks the 2020-generation destroyer hull and modern surface warfare modules."
 srp_destroyer_hull_tech_2: "Improved Destroyer Hull"
 srp_destroyer_hull_tech_2_desc: "Unlocks the 2023-generation destroyer with improved sensor and weapons bays."
 srp_destroyer_hull_tech_3: "Late-Generation Destroyer Hull"
 srp_destroyer_hull_tech_3_desc: "Unlocks the 2027 destroyer. One of the final major destroyer designs before production constraints set in."

 srp_carrier_hull: "Carrier Hull"
 srp_carrier_hull_desc: "Nuclear-powered fleet carrier. Main instrument of long-range naval power projection."
 srp_carrier_hull_1: "Fleet Carrier (2020)"
 srp_carrier_hull_1_desc: "2020-baseline nuclear carrier. Nimitz or Queen Elizabeth class equivalent. Large air wing, near-unlimited range, heavily defended."
 srp_carrier_hull_2: "Fleet Carrier (2023)"
 srp_carrier_hull_2_desc: "Mid-decade carrier upgrade. Additional custom slots allow for expanded deck configuration or heavier secondary armament."
 srp_carrier_hull_3: "Fleet Carrier (2027)"
 srp_carrier_hull_3_desc: "Late-decade carrier. The largest and best-defended surface combatant still being built. Represents an enormous industrial commitment at a point when civilisation is under severe strain."

 srp_carrier_hull_tech_1: "Modern Fleet Carrier"
 srp_carrier_hull_tech_1_desc: "Unlocks the 2020-generation nuclear carrier hull and carrier module suite."
 srp_carrier_hull_tech_2: "Improved Fleet Carrier"
 srp_carrier_hull_tech_2_desc: "Unlocks the 2023 carrier with additional module capacity."
 srp_carrier_hull_tech_3: "Late-Generation Fleet Carrier"
 srp_carrier_hull_tech_3_desc: "Unlocks the 2027 carrier. Final major carrier design before shipbuilding capacity degrades."

 srp_submarine_hull: "Submarine Hull"
 srp_submarine_hull_desc: "Nuclear attack submarine platform. Silent, long-range, optimised for anti-ship and anti-submarine warfare."
 srp_submarine_hull_1: "Attack Submarine (2020)"
 srp_submarine_hull_1_desc: "2020-baseline nuclear attack submarine. Virginia or Astute class equivalent. Extremely quiet, long-range, armed with modern heavyweight torpedoes."
 srp_submarine_hull_2: "Attack Submarine (2023)"
 srp_submarine_hull_2_desc: "Mid-decade submarine with improved acoustic signature reduction and expanded weapons options."
 srp_submarine_hull_3: "Attack Submarine (2027)"
 srp_submarine_hull_3_desc: "Late-decade submarine. Near-undetectable at patrol depth, four-slot weapons configuration, extended endurance. The final major submarine class commissioned."

 srp_submarine_hull_tech_1: "Modern Attack Submarine"
 srp_submarine_hull_tech_1_desc: "Unlocks the 2020 nuclear attack submarine hull and modern submarine module suite."
 srp_submarine_hull_tech_2: "Improved Attack Submarine"
 srp_submarine_hull_tech_2_desc: "Unlocks the 2023 submarine with additional stealth and weapons options."
 srp_submarine_hull_tech_3: "Late-Generation Attack Submarine"
 srp_submarine_hull_tech_3_desc: "Unlocks the 2027 submarine. Quietest hull ever built. One of the last designed before infrastructure begins to collapse."

 srp_asw_1: "Modern ASW Suite"
 srp_asw_1_desc: "Towed sonar arrays, helicopter integration, and P-8 maritime patrol coordination. The 2020 baseline for finding submarines before they fire. Covers both conventional adversary and Devourer-type threat detection frameworks."
 srp_asw_2: "Advanced ASW Networks"
 srp_asw_2_desc: "AUV hunter arrays, AI-assisted sonar processing, and distributed undersea sensor fields. Detection range and reaction time improve substantially. Submarines operating in defended sea lanes face a very different calculus."

 srp_naval_missiles_1: "Modern Anti-Ship Missiles"
 srp_naval_missiles_1_desc: "Baseline 2020 sea-skimming anti-ship missiles. Harpoon and Exocet successors with active radar homing, low-altitude flight profiles, and sufficient range to engage well outside gun range."
 srp_naval_missiles_2: "Long-Range Anti-Ship Systems"
 srp_naval_missiles_2_desc: "Extended-range seekers, over-horizon targeting via datalink, and salvo coordination allow surface groups to threaten enemy ships they cannot see directly. Theater-scale anti-surface capability."
 srp_naval_missiles_3: "Hypersonic Anti-Ship Weapons"
 srp_naval_missiles_3_desc: "Mach 8+ sea-skimming terminal phase with evasive final approach. Existing close-in weapon systems do not have the engagement window to defeat them. Point defence is no longer a meaningful guarantee."

 srp_naval_ew_1: "Shipboard Electronic Warfare"
 srp_naval_ew_1_desc: "Radar spoofing, chaff and flare dispensers, towed decoys, and active jamming suites across the fleet. Missile guidance is degraded and targeting solutions are less reliable against EW-equipped hulls."
 srp_naval_ew_2: "Integrated Naval EW"
 srp_naval_ew_2_desc: "Full-spectrum shipboard EW, hard-kill CIWS integration, and Dispatcher-resistant fleet communications. Provides meaningful resistance against coordinated missile salvos and signals-based coordination attacks."

 srp_mine_warfare_1: "Smart Naval Mines"
 srp_mine_warfare_1_desc: "Influence mines with programmable pressure, acoustic, and magnetic signature triggers. Mines can be told what to wait for. Channels and approaches can be selectively denied based on hull type."
 srp_mine_warfare_2: "Autonomous Mine Deployment"
 srp_mine_warfare_2_desc: "AUV and drone minelayers place fields in positions surface ships cannot safely reach. The threat envelope expands significantly. Any water where an AUV can operate is potential minefield territory."

 srp_battleship_hull: "Battleship Hull"
 srp_battleship_hull_desc: "Heavily armed and armoured surface capital ship. Primarily a shore bombardment platform, its naval guns can deliver sustained fire against coastal positions that no other asset can match. Less capable than carriers in fleet engagements."
 srp_battleship_hull_1: "Battleship Hull (2020)"
 srp_battleship_hull_1_desc: "2020-era heavy surface combatant. Conventional propulsion, triple-axis gun arrangement, thick belt armor. Slower than a destroyer by a wide margin, but it goes where it wants and does not ask permission."
 srp_battleship_hull_2: "Battleship Hull (2024)"
 srp_battleship_hull_2_desc: "Mid-decade upgrade hull. Improved fire control and thicker composite belt sections. Slightly faster drive system. Shore bombardment accuracy is substantially improved."
 srp_battleship_hull_3: "Battleship Hull (2028)"
 srp_battleship_hull_3_desc: "Late-decade heavy hull. Third centre slot added. The heaviest conventional surface combatant still being commissioned. Built for a world where coastal battles outnumber open-water engagements."

 srp_battleship_hull_tech_1: "Heavy Surface Combatant"
 srp_battleship_hull_tech_1_desc: "Unlocks the 2020-generation battleship hull. Heavy guns, thick armor, and significant shore bombardment capability."
 srp_battleship_hull_tech_2: "Improved Battleship Hull"
 srp_battleship_hull_tech_2_desc: "2024-generation heavy hull upgrades. Better fire control and drive system."
 srp_battleship_hull_tech_3: "Advanced Battleship Hull"
 srp_battleship_hull_tech_3_desc: "2028-generation heavy hull. Three-slot centre configuration, peak conventional surface armament."

 srp_surface_missile_launcher: "Surface Missile Launcher"
 srp_surface_missile_launcher_desc: "Vertical launch cells for anti-ship cruise missiles. Longer ranged and harder to intercept than torpedo tubes. Standard weapons fit on mid-decade destroyers and above."

 srp_naval_sam_sr: "Point-Defence SAM"
 srp_naval_sam_sr_desc: "Short-range surface-to-air missiles for close-in defence. Intercepts low-altitude threats and cruise missiles inside 20km. Replaces the vintage 40mm bofors role."
 srp_naval_sam_md: "Area Defence SAM"
 srp_naval_sam_md_desc: "Medium-range SAM battery for task group air defence out to 50km. Engages aircraft, anti-ship missiles, and cruise missiles before they reach effective range."
 srp_naval_sam_lr: "Theatre Defence SAM"
 srp_naval_sam_lr_desc: "Long-range high-altitude SAM. Engages ballistic missiles, high-altitude aircraft, and hypersonic threats out to 150km+. The most capable conventional air defence a ship can carry."

 srp_nuclear_naval_battery: "Nuclear Naval Battery"
 srp_nuclear_naval_battery_desc: "Nuclear-tipped heavy naval gun system. Fires sub-kiloton shells from bores larger than anything land artillery can mount. Shore bombardment from this weapon is categorically different from conventional gunfire. Expensive in every sense. Consumes fissile material."

 srp_naval_gun_155mm: "155mm Naval Gun"
 srp_naval_gun_155mm_desc: "155mm AGS-class deck gun with extended-range guided munitions. Designed around shore bombardment as its primary role. Lighter and faster-cycling than conventional heavy naval guns."
 srp_naval_railgun_203mm: "203mm Naval Railgun"
 srp_naval_railgun_203mm_desc: "Electromagnetic launch system. Mach 6 projectile velocity at combat ranges. Conventional armor is essentially irrelevant at this speed. High maintenance burden. Not a mature technology."

 srp_naval_ciws: "CIWS Suite"
 srp_naval_ciws_desc: "Phalanx or Goalkeeper close-in gun paired with RAM point-defence missiles. Last-layer defence against incoming missiles and aircraft. Modest surface threat."
 srp_naval_sam_vls: "SAM VLS Block"
 srp_naval_sam_vls_desc: "Mark 41-class vertical launch cells loaded with surface-to-air missiles. Area air defence covering the task group. No surface threat capability."

 srp_containment: "Containment Protocols"
 srp_containment_desc: "H&A Security and Containment field manual. Defensive perimeter construction, soil monitoring arrays, Beckon early-detection sensor deployment. Personnel decontamination procedures. Psychological preparation for first-contact scenarios."
 srp_containment1: "Advanced Containment Doctrine"
 srp_containment1_desc: "Evacuation frameworks for contaminated zones, hardened forward positions, and full decontamination procedures for units cycling through infested areas. Beckon cluster identification and reporting integrated into standard field operations."
 srp_containment2: "Integrated Containment Operations"
 srp_containment2_desc: "Rapid-response containment protocols and integrated civilian evacuation. Units are trained to hold a perimeter against biological pressure while coordinating with H&A Logistics on extraction and resupply under sustained infestation."

 srp_bio_analysis: "Parasite Classification"
 srp_bio_analysis_desc: "Initial systematic classification of Beckon organisms. H&A Hyperbiology establishes baseline species identification frameworks. Understanding what you're fighting is the first step."
 srp_bio_analysis_1: "Vulnerability Mapping"
 srp_bio_analysis_1_desc: "Documented weaknesses across known parasite forms. Behavioral pattern analysis identifies predictable attack sequences and movement signatures. Field units can exploit this against specific organism types."
 srp_bio_analysis_2: "Adaptive Countermeasures"
 srp_bio_analysis_2_desc: "Integrated biological threat response with field doctrine updated continuously as Iris-directed adaptation is detected. The understanding no longer lags behind the organisms it is trying to describe."

 srp_ap_suppression: "H&A Containment Teams"
 srp_ap_suppression_desc: "Dedicated suppression units drawn from H&A Security and Containment and integrated into standard military formations. Specialised equipment, pre-deployment conditioning, and clear rules of engagement for biological contact."
 srp_ap_suppression_1: "Advanced Suppression Operations"
 srp_ap_suppression_1_desc: "H&A Containment Corps expanded and fully integrated into theater command. Suppression teams can operate independently in front of conventional lines, clearing root infrastructure and holding contact positions."

 tech_signal_company: "Tactical Communications Network"
 tech_signal_company_desc: "Dedicated signals companies maintain secure communications, coordinate indirect fire, and manage the digital command picture across a division. Critical infrastructure as Dispatcher interference increases."
 tech_field_hospital: "Forward Medical Assets"
 tech_field_hospital_desc: "Forward surgical teams and CASEVAC infrastructure integrated into divisional structure. Reduces attrition from wounds and exposure. Increasingly important as parasite contact casualties differ from conventional wound patterns."
 tech_logistics_company: "Divisional Logistics Company"
 tech_logistics_company_desc: "Dedicated logistics elements embedded at division level for supply throughput, ammunition management, and equipment maintenance. The baseline for keeping a modern formation operational."

 srp_smart_weapons: "Precision Anti-Armor Systems"
 srp_smart_weapons_desc: "Baseline 2020 guided anti-tank munitions, including Javelin, Spike, and Brimstone-class systems. Top-attack capable. Fire-and-forget. Infantry can now reliably destroy main battle tanks at range without exposing themselves."
 srp_smart_weapons_1: "Advanced Guided Munitions"
 srp_smart_weapons_1_desc: "Multi-spectral seekers, miniaturised warheads, and loitering engagement envelopes. Infantry anti-armor capability expands well beyond line-of-sight. Stand-off kills against vehicles, emplacements, and hardened positions."
 srp_smart_weapons_2: "Micro-Munitions Integration"
 srp_smart_weapons_2_desc: "Submunition dispensers, AI-guided effectors, and man-portable loitering systems at section level. The distinction between infantry and precision fires begins to collapse."

 srp_drone_infantry: "Squad-Level UAS"
 srp_drone_infantry_desc: "Personal reconnaissance drones assigned at squad level. Ground units have persistent eyes over the next ridge, behind the next wall, ahead of any advance. Contact is no longer a surprise."
 srp_drone_infantry_1: "Armed Organic UAS"
 srp_drone_infantry_1_desc: "Switchblade-class loitering munitions become standard issue. Every squad carries a limited organic strike capability. Direct fire is no longer the only way a section engages a target."

 srp_ew_hardening: "Infantry EW Countermeasures"
 srp_ew_hardening_desc: "Personal communications are hardened against jamming and interception. Drone countermeasure systems are integrated into section-level kit. Units can operate in degraded signal environments without losing cohesion."
 srp_ew_hardening_1: "Full-Spectrum Signal Hardening"
 srp_ew_hardening_1_desc: "Dispatcher-resistant communication architecture distributed to platoon level. Battlefield coordination survives active electronic warfare. Units maintain planning and targeting discipline even in compromised signal environments."

 srp_drone_support: "FPV Drone Company"
 srp_drone_support_desc: "A support company of first-person-view strike drone operators. Provides battlefield reconnaissance and precision strike capability against soft targets and light vehicles. Small teams, high lethality."

 srp_drone_regimental: "Regimental Drone Team"
 srp_drone_regimental_desc: "A small FPV strike and scouting team attached at regiment level. Lighter than the divisional drone company, but every regiment can field one for organic reconnaissance and short-range precision strikes."
 srp_atgm_regimental: "Regimental ATGM Section"
 srp_atgm_regimental_desc: "A light anti-tank guided missile section embedded in the regiment, giving each line formation its own armour-defeating teeth without tying up a divisional support slot."
 srp_sapper_regimental: "Regimental Sapper Section"
 srp_sapper_regimental_desc: "Combat engineers attached at regiment level. They dig in the line faster and steady it across broken terrain, forest, marsh, and river crossings."

 srp_fpv_drone_equipment: "FPV Strike Drone"
 srp_fpv_drone_equipment_desc: "First-person-view strike drone platform. Commercial-derived systems repurposed for military precision strike."
 srp_fpv_drone_equipment_1: "FPV Strike Drone Mk.1"
 srp_fpv_drone_equipment_1_desc: "Commercial-derived first-person-view drones modified for military strike roles. Represents Mavic-class reconnaissance platforms and Lancet-class loitering munitions in widespread use from 2023 onward."
 srp_fpv_drone_equipment_2: "FPV Strike Drone Mk.2"
 srp_fpv_drone_equipment_2_desc: "Next-generation FPV strike systems with AI-assisted targeting and extended operational range. Hardened against electronic warfare countermeasures."

 srp_drone_support_tech: "FPV Drone Support Companies"
 srp_drone_support_tech_desc: "Formalisation of FPV drone operator teams as dedicated division support elements. Enables the FPV Drone Company support battalion and procurement of Mk.1 strike systems."
 srp_drone_support_tech_2: "Advanced FPV Systems"
 srp_drone_support_tech_2_desc: "Second-generation FPV platforms with improved payload capacity, AI-guided terminal phase, and resistance to jamming. Unlocks the Mk.2 FPV Strike Drone."

 EFH_aerorozvidka_mio: "Aerorozvidka"
 EFH_aerorozvidka_mio_desc: "A Ukrainian volunteer drone unit turned defence contractor, famous for developing the R18 octocopter during the 2022 conflict. Aerorozvidka brings asymmetric drone expertise, rapid prototyping, and battle-proven strike doctrine to the European Federation's arsenals."
 EFH_aero_initial: "Volunteer Origins"
 EFH_aero_root: "Decentralised Networks"
 EFH_aero_root_desc: "Aerorozvidka's operational model relies on dispersed, self-sufficient operator cells. Research proceeds faster and production ramps up quickly."
 EFH_aero_t2a: "R18 Strike Package"
 EFH_aero_t2a_desc: "Integration of the R18 octocopter's precision drop-strike methodology. Significantly improves the offensive punch of deployed drone systems."
 EFH_aero_t2b: "ISR Integration"
 EFH_aero_t2b_desc: "Standardised ISR data links between drone operators and divisional command. Improves production efficiency through better battlefield feedback loops."
 EFH_aero_t3a: "Swarm Tactics"
 EFH_aero_t3a_desc: "Coordinated multi-drone strike packages overwhelm point defences. Higher sortie density and improved operator survivability."
 EFH_aero_t3b: "AI Targeting"
 EFH_aero_t3b_desc: "Machine-learning assisted terminal guidance reduces operator workload and improves hit probability. Drives down unit costs through reduced waste."
 EFH_aero_t4: "Total Battlefield Awareness"
 EFH_aero_t4_desc: "Full integration of strike and ISR roles into a unified drone operations doctrine. Aerorozvidka's combined-effect platform represents the definitive FPV combat system."

 srp_generic_drone_mio: "Commercial Drone Systems"
 srp_generic_drone_mio_desc: "A civilian-origin drone manufacturer that has adapted commercial FPV platforms for military strike roles. Reliable production, modest performance gains."
 srp_drone_initial: "Commercial Base"
 srp_drone_root: "Mass Production Pipeline"
 srp_drone_root_desc: "Streamlined manufacturing from commercial supply chains. Faster production ramp-up and reduced unit cost."
 srp_drone_t2a: "Strike Payload Upgrade"
 srp_drone_t2a_desc: "Heavier warhead integration and improved terminal targeting. Increases the offensive effectiveness of deployed systems."
 srp_drone_t2b: "Extended Endurance"
 srp_drone_t2b_desc: "Improved battery and airframe reliability. Operator teams spend less time on maintenance and more on the mission."

 srp_rtg_infantry_equipment: "RTG Equipment"
 srp_rtg_infantry_equipment_desc: "Radioisotope-powered combat equipment designed for close-quarters engagement against parasite organisms. Not compatible with standard infantry weapons platforms."
 srp_rtg_infantry_equipment_1: "RTG Equipment (Mk I)"
 srp_rtg_infantry_equipment_1_desc: "First-generation RTG equipment package. High armour-piercing capability against parasite exostructures, at significant fissile material cost."
 srp_rtg_rounds: "RTG Infantry Doctrine"
 srp_rtg_rounds_desc: "Field radioisotope-powered combat equipment as a distinct infantry class, purpose-built for engagement against Beckon-class parasite organisms."
 srp_rtg_doctrine_idea: "RTG Combat Doctrine"
 srp_rtg_doctrine_idea_desc: "RTG-equipped infantry gain a decisive edge against parasite organisms, exploiting structural vulnerabilities that conventional weapons cannot reach."
 srp_rtg_infantry: "RTG Infantry"
 srp_rtg_infantry_desc: "Infantry outfitted with radioisotope-powered combat equipment. A distinct class from conventional infantry, optimised for anti-parasite engagements."

 srp_infantry_eq_3: "Crisis Infantry Kit"
 srp_infantry_eq_3_desc: "NBC-sealed equipment integration and parasite-hardened optics. Designed for extended operations in contaminated environments."
 srp_infantry_eq_4: "Wartime Standardisation"
 srp_infantry_eq_4_desc: "Mass-produced, simplified to maximise output under wartime conditions. Complexity sacrificed for reliability and field repairability."
 srp_infantry_eq_5: "Survivor Infantry Kit"
 srp_infantry_eq_5_desc: "Modular field-maintainable equipment for long-range independent operations. Designed to remain functional without a supply chain."
 srp_infantry_eq_6: "Endgame Infantry Kit"
 srp_infantry_eq_6_desc: "Maximum anti-parasite output at minimum resource cost. The culmination of human infantry doctrine under terminal crisis conditions."

 srp_ifv_3: "Mid-War IFV Overhaul"
 srp_ifv_3_desc: "Unmanned turret option and active protection suite integrated across the fleet. Reduces crew casualties during parasite contact engagements."
 srp_ifv_4: "Late-War IFV"
 srp_ifv_4_desc: "Hybrid-electric drive and AI-assisted targeting. Quieter, faster, and more decisive in contact than any predecessor."
 srp_ifv_5: "Endgame IFV"
 srp_ifv_5_desc: "Fully modernised tracked IFV with integrated parasite-hardening. The most capable mechanized platform produced under crisis conditions."

 srp_motorized_1: "Modern Military Vehicle Fleet"
 srp_motorized_1_desc: "MRAP, JLTV, and Boxer-class wheeled vehicles in service across all ground forces. Fast, protected mobility at lower cost than tracked systems."
 srp_wheeled_ifv_1: "Wheeled IFV Doctrine"
 srp_wheeled_ifv_1_desc: "Wheeled infantry fighting vehicles enter widespread service. Faster and cheaper to produce than tracked IFVs at some cost to protection."
 srp_wheeled_ifv_2: "Wheeled IFV Mk.II"
 srp_wheeled_ifv_2_desc: "Upgraded wheeled platform with improved protection and firepower. Retains the strategic mobility advantage over tracked equivalents."
 srp_wheeled_ifv_3: "Wheeled IFV Mk.III"
 srp_wheeled_ifv_3_desc: "AI-assisted targeting and active protection bring this platform to parity with early tracked designs in most contact scenarios."
 srp_wheeled_ifv_4: "Wheeled IFV Mk.IV"
 srp_wheeled_ifv_4_desc: "Endgame wheeled IFV. Maximum output from the wheeled architecture. Cheaper to produce than tracked equivalents as industrial capacity degrades."

 srp_logistics_transport_1: "Motorized Logistics Integration"
 srp_logistics_transport_1_desc: "Military-specification trucks replace civilian and commercial vehicles in divisional transport roles. Improved protected payload capacity and off-road mobility. Reduces consumption and improves operational endurance."
 srp_logistics_transport_2: "Advanced Transport Networks"
 srp_logistics_transport_2_desc: "Optimised convoy routing and predictive supply systems. Units in the field draw supplies with less delay and lower attrition."
 srp_logistics_transport_3: "Independent Supply Doctrine"
 srp_logistics_transport_3_desc: "Formations sustain themselves for extended periods without central hub resupply. Designed for environments where supply lines cannot be guaranteed."

 srp_truck_equipment: "Logistics Truck"
 srp_truck_equipment_desc: "Motorized transport forming the backbone of divisional supply. Without trucks, armies cannot move."
 srp_truck_equipment_1: "Civilian Fleet Truck"
 srp_truck_equipment_2: "Military Logistics Truck"

 srp_wheeled_ifv_equipment: "Wheeled IFV"
 srp_wheeled_ifv_equipment_desc: "Wheeled infantry fighting vehicle. Faster and lighter than tracked IFVs, optimised for rapid deployment and counter-parasite patrol operations."
 srp_wheeled_ifv_equipment_1: "Wheeled IFV Mk.I"
 srp_wheeled_ifv_equipment_2: "Wheeled IFV Mk.II"
 srp_wheeled_ifv_equipment_3: "Wheeled IFV Mk.III"
 srp_wheeled_ifv_equipment_4: "Wheeled IFV Mk.IV"

 srp_rtg_program: "RTG Weapons Programme"
 srp_rtg_program_desc: "Military application of radioisotope thermoelectric generator technology to infantry-scale weapons. Classified under EF Joint Special Projects. Fissile material constraints limit availability."

 srp_dispersed_industry: "Dispersed Industrial Networks"
 srp_dispersed_industry_desc: "Production distributed across hardened smaller facilities as urban centres are abandoned or contested. Tolerates significant infrastructure degradation."
 srp_underground_mfg: "Underground Manufacturing"
 srp_underground_mfg_desc: "Fully enclosed industrial complexes immune to Beckon surface saturation. Energy-intensive but secure against all known infestation vectors."
 srp_crisis_construction: "Crisis Construction Doctrine"
 srp_crisis_construction_desc: "Rapid prefabricated facility deployment. Build speed maximised for conditions where permanence is secondary to output."
 srp_full_automation: "Full Factory Automation"
 srp_full_automation_desc: "Human oversight reduced to near-zero. Fusion-powered lines running near-continuous output. The key enabler for military production surge."
 srp_crisis_automation: "Crisis Automation Protocols"
 srp_crisis_automation_desc: "Adaptive production reconfiguration without manual restart. Automated lines retool for priority outputs as the situation demands."
 srp_logistics_2: "Crisis Logistics"
 srp_logistics_2_desc: "Resilient supply chains adapted for contested and degraded theatres. Units remain supplied in conditions that would have paralyzed earlier doctrine."
 srp_logistics_3: "Decentralised Logistics"
 srp_logistics_3_desc: "Node-to-node resupply without central hub dependency. Formations draw from any nearby supply point without waiting for the hub."
 srp_logistics_4: "Autonomous Logistics"
 srp_logistics_4_desc: "AI-coordinated supply routing through denied areas. Unmanned convoys and automated distribution reach forward units conventional logistics cannot."
 srp_fissile_extraction_1: "Improved Fissile Extraction"
 srp_fissile_extraction_1_desc: "Optimised centrifuge cascades and improved ore-processing yield. Fissile material is the sole limiting factor for RTG weapons, nuclear munitions, and advanced modules."
 srp_fissile_extraction_2: "Advanced Fissile Extraction"
 srp_fissile_extraction_2_desc: "High-throughput separation and waste-stream reduction. Substantially increases material output for priority weapons programmes."
 srp_fissile_extraction_3: "Maximum-Yield Extraction"
 srp_fissile_extraction_3_desc: "Near-complete ore utilisation. The theoretical ceiling of pre-fusion enrichment technology."

 srp_fusion_reactor_1: "Commercial Fusion Power"
 srp_fusion_reactor_1_desc: "The first grid-scale fusion reactors enter commercial service, offering a successor to fission-based power generation with no fuel scarcity concerns."
 srp_fusion_reactor_2: "Fusion Reactor Refinement"
 srp_fusion_reactor_2_desc: "Improved containment and energy extraction efficiency, drawing on lessons from the fissile extraction programmes to push fusion output further."
 srp_fusion_reactor_3: "High-Output Fusion Cycles"
 srp_fusion_reactor_3_desc: "Sustained high-output fusion cycles, maximising the energy and industrial yield of every reactor complex brought online."

 modifier_production_speed_srp_fusion_reactor_factor: "Fusion Reactor construction speed"

 srp_comms_3: "Crisis Communications"
 srp_comms_3_desc: "Hardened against Beckon electromagnetic interference. Mesh redundancy enables command coordination in heavily saturated operational zones."
 srp_comms_4: "Distributed Mesh Network"
 srp_comms_4_desc: "Fully decentralised command communications without any central relay infrastructure. No single point of failure."
 srp_comms_5: "Self-Healing Signal Architecture"
 srp_comms_5_desc: "Endgame encrypted mesh. Impervious to conventional jamming and all known Beckon signal disruption methods."
 srp_radar_3: "Biomass Signature Detection"
 srp_radar_3_desc: "Sensor arrays calibrated to Beckon electromagnetic and thermal signatures. Provides early warning for infestation spread across wide areas."
 srp_radar_4: "Integrated Battlespace Sensing"
 srp_radar_4_desc: "Ground, air, and orbital ISR fused with tactical data distribution in near-real-time. Commanders see the battlefield as it happens."
 srp_radar_5: "Persistent Surveillance Network"
 srp_radar_5_desc: "Continuous full-spectrum coverage. No parasite organism concentration moves within range without detection."
 srp_cyber_3: "Integrated Cyber Warfare"
 srp_cyber_3_desc: "The separate cyber commands are folded into one structure and hardened against parasite-adjacent signal interference."
 srp_cyber_4: "Autonomous Cyber Operations"
 srp_cyber_4_desc: "AI-driven persistent threat response with self-reconfiguring defensive architecture and continuous offensive probing of adversary networks."

 tech_support_equipment_2: "Advanced Support Equipment"
 tech_support_equipment_2_desc: "Second-generation logistical and engineering hardware issued across every support role. Better reliability, less time in the workshop."
 support_equipment_2: "Advanced Support Equipment"
 support_equipment_2_desc: "Second-generation logistical and engineering hardware. Improved reliability and reduced maintenance burden across all support roles."

 tech_signal_company_2: "Hardened Signal Relay"
 tech_signal_company_2_desc: "Quantum key distribution and Dispatcher-hardened signal architecture. Coordination losses from jamming and interference are sharply reduced."
 tech_signal_company_3: "Distributed Signal Mesh"
 tech_signal_company_3_desc: "Fully decentralised command communications resilient to Beckon electromagnetic saturation. Enables planning and coordination in heavily contested zones."

 tech_field_hospital_2: "Crisis Trauma Protocols"
 tech_field_hospital_2_desc: "Streamlined treatment doctrine prioritising rapid stabilisation and return-to-duty. Reinforce rates improve and experience loss from casualties is reduced."
 tech_field_hospital_3: "Integrated Medical Command"
 tech_field_hospital_3_desc: "Medical assets fully embedded within combat units. Near-frontline treatment capability reduces attrition and sustains unit cohesion through prolonged engagements."

 tech_logistics_company_2: "Crisis Supply Doctrine"
 tech_logistics_company_2_desc: "Resilient supply chains redesigned for contested and degraded theatres. Reduces consumption and limits the penalty of operating without full supply."
 tech_logistics_company_3: "Independent Logistics Doctrine"
 tech_logistics_company_3_desc: "Node-to-node resupply without central hub dependency. Units sustain operations deep in denied territory with minimal attrition from supply shortfall."

 tech_recon_company: "Reconnaissance Company"
 tech_recon_company_desc: "A dedicated scouting element attached at divisional level. Someone has to go and look, and the ones who do it professionally come back more often."
 tech_recon_company_2: "Integrated Reconnaissance"
 tech_recon_company_2_desc: "Multi-source ISR fusion delivers actionable intelligence to combat commanders. Recon data directly improves attack coordination and target selection."
 tech_recon_company_3: "Deep Area Reconnaissance"
 tech_recon_company_3_desc: "Long-range persistent surveillance integrating ground, air, and sensor data. Provides battle-space awareness well beyond the frontline."

 tech_engineer_company: "Engineer Company"
 tech_engineer_company_desc: "Field engineers attached at divisional level. Bridging, demolition, obstacle clearance, and the digging that decides whether a position holds."
 tech_engineer_company_2: "Advanced Combat Engineering"
 tech_engineer_company_2_desc: "Rapid fortification and obstacle clearance techniques. Improved dig-in rates and defensive positioning give units a persistent advantage in prepared positions."
 tech_engineer_company_3: "Crisis Engineering Doctrine"
 tech_engineer_company_3_desc: "Anti-parasite barrier construction and hardened fortification techniques. Engineered positions provide substantially improved protection against organism ingress."

 tech_maintenance_company_2: "Field Recovery Systems"
 tech_maintenance_company_2_desc: "Standardised in-field repair procedures and cannibalization protocols. Equipment is recovered faster and units retain more combat experience through attrition."
 tech_maintenance_company_3: "Crisis Maintenance Doctrine"
 tech_maintenance_company_3_desc: "Autonomous repair cycles and predictive failure management. Keeps equipment operational well beyond standard service intervals in resource-constrained environments."

 parasite_autonomic_sustenance: "Autonomic Sustenance"
 parasite_autonomic_sustenance_desc: "The organism develops distributed sustenance networks that reduce dependence on established territory. Parasite units can operate in contested and partially-infested regions longer before supply shortfall sets in."

 srp_helicopter_1: "Rotorcraft Operations"
 srp_helicopter_1_desc: "Legacy rotary-wing fleets still carrying the load: AH-64D, Mi-24, UH-60, SH-60 and their kin. Battlefield close support, anti-armour, light transport and naval patrol from a single airframe family."
 srp_helicopter_2: "Modern Rotorcraft"
 srp_helicopter_2_desc: "Current-generation rotorcraft with glass cockpits, mast-mounted fire control and guided anti-armour munitions. AH-64E Guardian, Ka-52, NH90 and MH-60R class."
 srp_helicopter_3: "Tiltrotor Aviation"
 srp_helicopter_3_desc: "Next-generation tiltrotor platforms. Fly-by-wire proprotors deliver fixed-wing cruise speed and range with full vertical lift. FARA and FLRAA class: V-280 Valor and Bell 360 Invictus."

 srp_helicopter_airframe: "Rotorcraft Airframe"
 srp_helicopter_legacy_airframe: "Legacy Rotorcraft"
 srp_helicopter_modern_airframe: "Modern Rotorcraft"
 srp_helicopter_tiltrotor_airframe: "Tiltrotor"
 helicopter: "Helicopter"

 EQ_MOD_CAT_srp_helicopter_engine_TITLE: "Turboshaft Engine"
 EQ_MOD_CAT_srp_rotor_configuration_TITLE: "Rotor Configuration"
 EQ_MOD_CAT_srp_helo_transport_TITLE: "Cargo Bay"
 EQ_MOD_CAT_srp_helo_special_TITLE: "Avionics and Survivability"

 srp_turboshaft_1: "Turboshaft Engine"
 srp_turboshaft_1_desc: "T700 class turboshaft. Reliable powerplant for the legacy rotorcraft fleet."
 srp_turboshaft_2: "Improved Turboshaft"
 srp_turboshaft_2_desc: "T901 / ITEP class engine. More power and range for current-generation airframes."
 srp_tiltrotor_engine: "Tiltrotor Powerplant"
 srp_tiltrotor_engine_desc: "FLRAA class engine driving tilting proprotors. Large speed and range gains over conventional rotorcraft."
 srp_rotor_single: "Single Main Rotor"
 srp_rotor_single_desc: "Conventional single main rotor with tail rotor. Cheap and proven."
 srp_rotor_coaxial: "Coaxial Rotors"
 srp_rotor_coaxial_desc: "Counter-rotating coaxial rotors. Better agility and survivability, in the Ka-52 mould."
 srp_rotor_tiltrotor: "Tilting Proprotors"
 srp_rotor_tiltrotor_desc: "Tilting proprotors trade low-speed agility for cruise speed and range. Tiltrotor airframes only."
 srp_helo_chaingun: "Chin Autocannon"
 srp_helo_chaingun_desc: "Chin-mounted 30mm autocannon (M230 class). Reliable close support against soft targets."
 srp_helo_rocket_pods: "Rocket Pods"
 srp_helo_rocket_pods_desc: "Unguided rocket pods (Hydra 70 class) for saturation close support."
 srp_helo_atgm: "Guided Anti-Tank Missiles"
 srp_helo_atgm_desc: "Hellfire / JAGM class guided missiles. Precision anti-armour strike from standoff range."
 srp_helo_dipping_sonar: "Dipping Sonar"
 srp_helo_dipping_sonar_desc: "Dipping sonar and sonobuoy suite for anti-submarine patrol and detection."
 srp_helo_lw_torpedo: "Lightweight Torpedo"
 srp_helo_lw_torpedo_desc: "Mk54 class lightweight ASW torpedo for prosecuting submarine contacts."
 srp_helo_recon_pod: "Reconnaissance Pod"
 srp_helo_recon_pod_desc: "Mast-mounted FLIR and sensor pod for light reconnaissance."
 srp_helo_troop_bay: "Troop and Cargo Bay"
 srp_helo_troop_bay_desc: "Internal bay for troop lift and cargo. Configures the airframe as an air transport."
 srp_helo_longbow_radar: "Fire-Control Radar"
 srp_helo_longbow_radar_desc: "Mast-mounted fire-control radar (Longbow class). Improves night close support and target acquisition."
 srp_helo_dircm: "Infrared Countermeasures"
 srp_helo_dircm_desc: "Directional infrared countermeasures and flare dispensers. Improved survivability against guided threats."
 srp_helo_armor_plating: "Armour Plating"
 srp_helo_armor_plating_desc: "Cockpit and engine armour plating. Better survivability at a small speed cost."
 srp_helo_aux_tank: "Auxiliary Fuel Tank"
 srp_helo_aux_tank_desc: "Internal or external auxiliary fuel for extended range."

 primitive_yelloweye_tech: "Yelloweye Emergence"
 primitive_yelloweye_tech_desc: "An aerial branch parasite. The yelloweye lofts on membrane wings and strikes ground positions with corrosive spray. Air-to-air capability is incidental: a swarm can pull down a helicopter, nothing faster."
 adapted_yelloweye_tech: "Adapted Yelloweye"
 adapted_yelloweye_tech_desc: "The yelloweye genome is directed. Acid composition sharpens, wing membrane thickens, range extends. The swarm now reaches targets it could not before."
 skymaw_genesis: "Skymaw Genesis"
 skymaw_genesis_desc: "A larger flying organism grown from the aerial substrate. Heavy, armoured, and expensive to manifest. It does not swarm. It arrives."

 srp_yelloweye_airframe: "Yelloweye"
 srp_yelloweye_airframe_1: "Primitive Yelloweye"
 srp_yelloweye_airframe_2: "Adapted Yelloweye"
 srp_skymaw_airframe: "Skymaw"
 srp_skymaw_airframe_1: "Skymaw"
 yelloweye_swarm: "Yelloweye Swarm"
 skymaw_wing: "Skymaw Flight"

 EQ_MOD_CAT_srp_yelloweye_propulsion_TITLE: "Propulsion Organ"
 EQ_MOD_CAT_srp_yelloweye_wing_TITLE: "Wing Membrane"
 EQ_MOD_CAT_srp_yelloweye_offense_TITLE: "Offensive Organ"
 EQ_MOD_CAT_srp_yelloweye_special_TITLE: "Mutation"

 srp_yelloweye_propulsion_1: "Beating Membrane"
 srp_yelloweye_propulsion_1_desc: "Primitive flight musculature. Enough lift to carry the organism and its payload."
 srp_yelloweye_propulsion_2: "Reinforced Flight Muscle"
 srp_yelloweye_propulsion_2_desc: "Denser muscle fibre and improved oxygen exchange. More speed and range."
 srp_yelloweye_wing_membrane_1: "Thin Wing Membrane"
 srp_yelloweye_wing_membrane_1_desc: "Light membrane wings. Agile, fragile."
 srp_yelloweye_wing_membrane_2: "Layered Wing Membrane"
 srp_yelloweye_wing_membrane_2_desc: "Thicker, multi-layered coated membrane. Deflects low calibre RTG rounds."
 srp_yelloweye_bile_spitter: "Bile Spitter"
 srp_yelloweye_bile_spitter_desc: "A simple corrosive gland. Sprays acid over ground positions on a pass."
 srp_yelloweye_spine_volley: "Spine Volley"
 srp_yelloweye_spine_volley_desc: "Barbed projectile organs fire a burst of bone spines into massed targets."
 srp_yelloweye_corrosive_spit: "Corrosive Spit"
 srp_yelloweye_corrosive_spit_desc: "Refined acid that eats through plate."
 srp_yelloweye_acid_glands: "Acid Reserve Glands"
 srp_yelloweye_acid_glands_desc: "Additional corrosive reserve carried into the strike. Heavier payload delivery."
 srp_yelloweye_thick_hide: "Dense Membrane"
 srp_yelloweye_thick_hide_desc: "Thickened membrane over the dorsal mass. Better survivability against ground fire."
 srp_yelloweye_eye_cluster: "Eye Cluster"
 srp_yelloweye_eye_cluster_desc: "The namesake organ. A dense cluster of light-sensitive eyes for targeting and night acuity."
 srp_yelloweye_regrowth_tissue: "Regrowth Tissue"
 srp_yelloweye_regrowth_tissue_desc: "Self-repairing tissue closes wounds between sorties. Improved reliability and survivability."
 srp_yelloweye_calibration_node: "Calibration Node"
 srp_yelloweye_calibration_node_desc: "A refined sensory cluster grown from genome calibration data. Sharpens the organism's strike accuracy mid-dive."
 srp_skymaw_great_maw: "Great Maw"
 srp_skymaw_great_maw_desc: "An enormous distending jaw. It descends, bites, and climbs, taking soft targets apart."
 srp_skymaw_plasma_bile: "Caustic Deluge"
 srp_skymaw_plasma_bile_desc: "A supercharged corrosive jet. The heaviest acid payload the aerial line produces."
 srp_skymaw_storm_wings: "Storm Wings"
 srp_skymaw_storm_wings_desc: "A vast membrane wingspan. Carries the apex frame far across the front."
 srp_skymaw_dense_carapace: "Dense Membrane"
 srp_skymaw_dense_carapace_desc: "Heavy membrane layered across the body. Survivability at the cost of speed."
 srp_skymaw_regenerative_hide: "Regenerative Membrane"
 srp_skymaw_regenerative_hide_desc: "Constant tissue regrowth. The organism returns from sorties that would ground a smaller form."
 srp_skymaw_sensory_crown: "Sensory Crown"
 srp_skymaw_sensory_crown_desc: "A crown of eyes ringing the skull. Precise targeting in any light."

 srp_yelloweye_mio: "Aerial Brood"
 srp_yelloweye_mio_desc: "The growth structure that produces flying organisms. Its genome diverges from the ground and aquatic lineages, refining lift, acid delivery, and the aerial frame."
 srp_yelloweye_initial: "Aerial Genome"
 srp_yelloweye_genome_core: "Yelloweye Foundation"
 srp_yelloweye_genome_core_desc: "The first stable expression of the aerial genome in active production. Flying organisms now have a defined battlefield role."
 srp_yelloweye_swarm_instinct: "Swarm Instinct"
 srp_yelloweye_swarm_instinct_desc: "Pack coordination tightens. The swarm concentrates fire and overwhelms isolated targets, including low aircraft."
 srp_yelloweye_high_altitude: "High Altitude Adaptation"
 srp_yelloweye_high_altitude_desc: "Denser membrane and larger wings let the brood operate higher and farther, harder to bring down."
 srp_yelloweye_apex_swarm: "Apex Swarm"
 srp_yelloweye_apex_swarm_desc: "Mass production of refined attack organisms. Cheaper, deadlier, fielded in greater numbers."
 srp_yelloweye_storm_mastery: "Storm Mastery"
 srp_yelloweye_storm_mastery_desc: "Total command of the aerial frame. Range, speed, and survivability all extend."
 srp_yelloweye_apex_genesis: "Apex Genesis"
 srp_yelloweye_apex_genesis_desc: "The brood grows something larger. The Skymaw genome is unlocked."

 pure_aerial_parasites: "Light Bomber Strain"
 pure_aerial_parasites_desc: "The aerial line grows a bombardier form. Flying organisms now carry payload sacs that crater positions and saturate ground with viral and corrosive loads."
 preeminent_aerial_parasites: "Stealth Flier Strains"
 preeminent_aerial_parasites_desc: "Two refined airborne forms. The Bogle swoops from concealment with explosive sacs. The Wraith contests the sky itself, the first parasite bred to fight other aircraft."
 heavy_aerial_parasites: "Heavy Bomber Strain"
 heavy_aerial_parasites_desc: "A flying tank. The Heavy Bomber releases brood bombs that crater a position and seed warforms into the wreckage they leave behind."
 draconite_genesis: "Draconite Genesis"
 draconite_genesis_desc: "The apex flier of the deep-vent lineage. Explosive saliva, sky barrages, and projections that absorb incoming fire. The Plutonic genome's final expression."
 hibernal_genesis: "Hibernal Genesis"
 hibernal_genesis_desc: "The apex of the cold-climate lineage. A heat-retaining membrane and a heat-sink gland built for endurance, not frost. The Boreic genome's final expression."
 cordon_genesis: "Cordon Genesis"
 cordon_genesis_desc: "The apex of the urban lineage. A relay node for tight coordination in built environments and a breach gland that erodes fortifications over time. The Sinic genome's final expression."
 ancient_overlord_genesis: "Ancient Overlord Genesis"
 ancient_overlord_genesis_desc: "The apex of the heat-adapted lineage. A furnace gland and a crushing limb built for raw aggression alone. The Alclidic genome's final expression."
 deterrent_parasites: "Deterrent Forms"
 deterrent_parasites_desc: "Anchoring organisms plated in bolster membrane. The Seizer holds whatever closes with it and does not let go, walling off a sector at the cost of all mobility."
 pure_overseer_parasites: "Coordination Forms"
 pure_overseer_parasites_desc: "Command organisms grown around a refined relay node. The Overseer directs surrounding broods without hive latency and summons reinforcement through biomass projection."

