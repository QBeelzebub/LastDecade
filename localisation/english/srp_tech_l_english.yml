 srp_spore_bomb_sacs: "Spore Bomb Sacs"
 srp_spore_bomb_sacs_desc: "Clusters of viral bomb sacs released over enemy positions. Cheap area bombardment."
 srp_caustic_payload_sacs: "Caustic Payload Sacs"
 srp_caustic_payload_sacs_desc: "Concentrated acid loads tuned for direct support. Less area coverage, far heavier per-target damage."
 srp_bogle_burst_sacs: "Burst Sacs"
 srp_bogle_burst_sacs_desc: "Pressurized sacs of volatile biomass, ruptured on impact during a swooping pass."
 srp_wraith_nade_gland: "Nade Gland"
 srp_wraith_nade_gland_desc: "Burst-fired explosive nodules. The Wraith's airspace-denial organ, effective against other fliers."
 srp_wraith_contact_aura: "Contact Aura"
 srp_wraith_contact_aura_desc: "A close-range damaging aura pressed into ramming passes. Trades durability for raw intercept power."
 srp_brood_bomb_sacs: "Brood Bomb Sacs"
 srp_brood_bomb_sacs_desc: "Cratering bombardment loads grown around dormant spawn cores. Heavy strategic payload."
 srp_broodling_payload: "Broodling Payload"
 srp_broodling_payload_desc: "Bombs that seed warforms into the wreckage they make. Less raw bombing, lasting infestation."
 srp_draconite_saliva_jet: "Explosive Saliva Jet"
 srp_draconite_saliva_jet_desc: "Explosive saliva projected in contact-detonating streams."
 srp_draconite_sky_barrage: "Sky Barrage"
 srp_draconite_sky_barrage_desc: "Saliva masses called down from altitude across a wide area. Maximum saturation, slower delivery."
 srp_bogle_shimmer_hide: "Shimmer Membrane"
 srp_bogle_shimmer_hide_desc: "A light-bending membrane. Confuses laser guided AA missiles."
 srp_succor_brood_pouch: "Succor Brood Pouch"
 srp_succor_brood_pouch_desc: "Carried succors intercept incoming fire and anchor recovery. Improved survivability and reliability."
 srp_draconite_projection_shroud: "Projection Shroud"
 srp_draconite_projection_shroud_desc: "Dark projections of the organism absorb incoming hits before they land. Heavy defensive screen."
 srp_wraith_phase_membrane: "Phase Membrane"
 srp_wraith_phase_membrane_desc: "A light-bending membrane that fades the organism from fire control mid-flight. It is what lets the Wraith beat aircraft that outclass it."

 srp_bolster_membrane: "Bolster Membrane"
 srp_bolster_membrane_1: "Bolster Membrane"
