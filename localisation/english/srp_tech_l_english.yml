 srp_carapace_plating_1: "Membrane Layering I"
 srp_carapace_plating_1_desc: "A second layer of membrane grown over the first. Modest protection at low biomass cost."
 srp_carapace_plating_2: "Membrane Layering II"
 srp_carapace_plating_2_desc: "Denser membrane with mineral content worked through it, grown over a longer maturation cycle. Heavier protection."
 srp_adapted_limb_cluster_1: "Adapted Limb Cluster I"
 srp_adapted_limb_cluster_1_desc: "Repurposed ancestral limbs, reinforced for sustained heavy-frame locomotion."
 srp_adapted_limb_cluster_2: "Adapted Limb Cluster II"
 srp_adapted_limb_cluster_2_desc: "Further-grafted limb clusters with denser muscle bundles, trading some reliability for speed."
 srp_pure_propulsion_mass_1: "Pure Propulsion Mass I"
 srp_pure_propulsion_mass_1_desc: "Purpose-grown propulsion tissue with no vestigial structures, built directly into the frame."
 srp_pure_propulsion_mass_2: "Pure Propulsion Mass II"
 srp_pure_propulsion_mass_2_desc: "An enlarged propulsion mass with reinforced anchoring, at some cost to reliability."
 srp_apex_locomotion_1: "Apex Locomotion I"
 srp_apex_locomotion_1_desc: "Powerful musculature grown for apex-tier organisms, trading reliability for raw speed."
 srp_apex_locomotion_2: "Apex Locomotion II"
 srp_apex_locomotion_2_desc: "Hyper-developed apex musculature pushing speed further still, at further cost to reliability."
 srp_parasite_support_node_1: "Support Node"
 srp_parasite_support_node_1_desc: "Auxiliary nerve cluster providing minor self-stabilisation and defence."
 srp_bolster_signal_node_1: "Signal Node"
 srp_bolster_signal_node_1_desc: "Resonance organ that hardens and accelerates the local swarm's coordination."
 srp_burrower_mandible_strike: "Mandible Strike"
 srp_burrower_mandible_strike_desc: "Massive mandibles built for one strike on surfacing, before anything can turn to face it."
 srp_burrower_venom_spike: "Venom Spike"
 srp_burrower_venom_spike_desc: "A hollow piercing spike delivering a corrosive venom payload directly into armoured hulls."
 srp_burrower_tunneling_claws_1: "Tunneling Claws I"
 srp_burrower_tunneling_claws_1_desc: "Reinforced digging claws doubling as a fast subterranean propulsion system."
 srp_burrower_tunneling_claws_2: "Tunneling Claws II"
 srp_burrower_tunneling_claws_2_desc: "Lengthened claw-limbs granting a notable burst of speed when surfacing."
 srp_burrower_shell_regrowth: "Membrane Regrowth"
 srp_burrower_shell_regrowth_desc: "Rapid membrane regrowth, mitigating the organism's vulnerability after surfacing."
 srp_burrower_camouflage_membrane: "Camouflage Membrane"
 srp_burrower_camouflage_membrane_desc: "A mottled membrane that breaks up the organism's outline against disturbed earth."
 srp_bolster_crushing_limbs: "Crushing Limbs"
 srp_bolster_crushing_limbs_desc: "Massive crushing limbs built for sustained close-range brawling."
 srp_bolster_resonant_maul: "Resonant Maul"
 srp_bolster_resonant_maul_desc: "A limb-mounted maul that channels the bolster's resonance into its blows. Built for breaking through a line."
 srp_bolster_resonance_membrane_1: "Resonance Membrane I"
 srp_bolster_resonance_membrane_1_desc: "A vibrating membrane that disrupts incoming fire and softens the bolster's footing."
 srp_bolster_resonance_membrane_2: "Resonance Membrane II"
 srp_bolster_resonance_membrane_2_desc: "A thickened resonance membrane, further dampening incoming impacts at some cost to reliability."
 srp_warden_impact_spike: "Impact Spike"
 srp_warden_impact_spike_desc: "Bone-hardened impact spike delivering a concussive shockwave on contact."
 srp_warden_siege_maw: "Siege Maw"
 srp_warden_siege_maw_desc: "A wide, grinding maw built to tear through fortified lines and clear breakthrough lanes."
 srp_warden_siege_glands: "Siege Glands"
 srp_warden_siege_glands_desc: "Corrosive secretion glands tuned to break down fortified positions."
 srp_warden_corrosive_mist: "Corrosive Mist"
 srp_warden_corrosive_mist_desc: "An expanded gland cluster that vents a wider corrosive mist, eating through defensive works."
 srp_summoner_call_organ: "Call Organ"
 srp_summoner_call_organ_desc: "Pheromone-call organ summoning small reinforcing broods to exploit a breakthrough."
 srp_summoner_relay_organ: "Relay Organ"
 srp_summoner_relay_organ_desc: "An extended pheromone relay, coordinating reinforcing broods across a wider stretch of the line."
 srp_summoner_brood_satchel_1: "Brood Satchel I"
 srp_summoner_brood_satchel_1_desc: "A carried satchel of dormant broodlings, released to screen the summoner from harm."
 srp_summoner_brood_satchel_2: "Brood Satchel II"
 srp_summoner_brood_satchel_2_desc: "An enlarged brood satchel, providing a thicker screen of broodlings."
 srp_colony_carrier_mandible_claws: "Mandible Claws"
 srp_colony_carrier_mandible_claws_desc: "Enormous mandibles and forelimb claws."
 srp_colony_carrier_crushing_thorax: "Crushing Thorax"
 srp_colony_carrier_crushing_thorax_desc: "A reinforced thorax that allows the carrier to body-slam and crush armoured formations outright."
 srp_colony_spawner_node_1: "Spawner Node I"
 srp_colony_spawner_node_1_desc: "Living spawner mass trailing the carrier, continuously generating reinforcement biomass."
 srp_colony_spawner_node_2: "Spawner Node II"
 srp_colony_spawner_node_2_desc: "An enlarged spawner mass behind a thickened membrane, at some cost to reliability."
 srp_dreadnaut_impact_organ: "Impact Organ"
 srp_dreadnaut_impact_organ_desc: "Razor-edged forelimb organ. It strikes faster than a formation can reset between blows."
 srp_dreadnaut_rending_talons: "Rending Talons"
 srp_dreadnaut_rending_talons_desc: "Elongated talons that rend through armour plating in a single overhead strike."
 srp_dreadnaut_night_glands: "Night Glands"
 srp_dreadnaut_night_glands_desc: "Photosensitive gland clusters granting improved low-light hunting."
 srp_dreadnaut_predator_instinct: "Predator Instinct"
 srp_dreadnaut_predator_instinct_desc: "Heightened predatory senses that let the dreadnaut close on prey faster and react before contact."
 srp_overlord_crushing_organ: "Crushing Organ"
 srp_overlord_crushing_organ_desc: "Crushing organ capable of shattering armoured formations."
 srp_overlord_dominion_spike: "Dominion Spike"
 srp_overlord_dominion_spike_desc: "A reinforced piercing spike that punches through the heaviest armour the overlord encounters."
 srp_overlord_command_node_1: "Command Node I"
 srp_overlord_command_node_1_desc: "Relays the Dispatcher's signal to the organisms around it, tightening the radius they coordinate across."
 srp_overlord_command_node_2: "Command Node II"
 srp_overlord_command_node_2_desc: "An expanded command node, relaying the Dispatcher's signal across a wider operational area."

 carrier_brood: "Carrier"
 carrier_brood_desc: "Inborn-tier infestation propagator. A walking hold full of infectors that keeps ground saturated. Cheap, plentiful, weak in a straight fight."
 overseer_caller: "Overseer"
 overseer_caller_desc: "Pure-tier coordination organism. Coordinates surrounding broods through its relay node and pulls fresh reinforcements out of projected biomass."

 IRS_plutonic_mio: "Plutonic Beckon"
 IRS_plutonic_mio_desc: "The deep-vent genome drawn up from volcanic rift systems. Its lineage burns hot and flies high. The Draconite is its final expression."
 IRS_plutonic_initial: "Deep-Vent Genome"
 IRS_plutonic_genome_core: "Plutonic Foundation"
 IRS_plutonic_genome_core_desc: "First stable expression of the Plutonic genome in active production. The deep-fire aerial lineage has a defined battlefield role."
 IRS_plutonic_vent_adaptation: "Vent Adaptation"
 IRS_plutonic_vent_adaptation_desc: "Heat-hardened tissue and resilient flight organs. The lineage endures conditions that would ground any other flier."
 IRS_plutonic_sky_terror: "Sky Terror"
 IRS_plutonic_sky_terror_desc: "Refined offensive organs. The apex fliers strike harder against ground and air alike."
 IRS_plutonic_deep_furnace: "Deep Furnace"
 IRS_plutonic_deep_furnace_desc: "Reactor-grade metabolism deep in the rift. Greater range, durability, and cheaper manifestation."
 IRS_plutonic_saliva_calibration: "Saliva Calibration"
 IRS_plutonic_saliva_calibration_desc: "Tuned explosive saliva delivery. Maximum payload precision on every pass."
 IRS_plutonic_draconite_genesis: "Draconite Genesis"
 IRS_plutonic_draconite_genesis_desc: "The lineage produces its apex. The Draconite genome is unlocked."

 IRS_discover_plutonic: "Locate the Plutonic Root Beckon"
 IRS_discover_plutonic_desc: "Drive root systems into the volcanic rift to express the deep-vent genome. Requires a fully consumed Iceland."

 parasite_industry_folder: "Nexus Technologies"
 parasite_industry_folder_tab: "Nexus Technologies"
 parasite_industry_folder_desc: "Technologies related to nexus parasites and production."

 parasite_industry_basics: "Biological Industrial Base"
 parasite_industry_basics_desc: "The swarm grows wherever it spreads, and mostly by instinct. A biological industrial base directs that growth: cultivation and production planned across infested territory instead of left to whichever cluster got there first."

 biological_construction_methods: "Organic Construction Methods"
 biological_construction_methods_desc: "How fast the swarm expands depends on how fast it can raise structures. Refining construction organisms brings that build time down."

 advanced_biological_construction: "Advanced Biological Construction"
 advanced_biological_construction_desc: "Further mastery of construction grows parasite clusters and pools in a fraction of the time they used to take. New territory turns productive before the fighting for it is finished."

 biomass_processing: "Biomass Processing"
 biomass_processing_desc: "Raw biomass harvested from infested states contains far more usable material than current extraction recovers. Refining the extraction process increases the effective yield from every state the collective controls."

 advanced_biomass_synthesis: "Advanced Biomass Synthesis"
 advanced_biomass_synthesis_desc: "The biochemical pathways behind biomass production are mapped and exploited. Nearly nothing viable is left in infested ground after extraction."

 biomass_pool_expansion: "Expanded Biomass Pools"
 biomass_pool_expansion_desc: "Refined cultivation of the existing biomass pools. A denser pool structure grows faster and draws greater quantities of parasite biomass from the same infested ground."

 parasite_production_efficiency: "Parasite Production Efficiency"
 parasite_production_efficiency_desc: "Parasite production lines are biological, and they answer to coordination the way mechanical ones do. Tightening the signalling chains between production organisms cuts downtime and moves equipment to the front faster."

 nexus_industrial_coordination: "Nexus Industrial Coordination"
 nexus_industrial_coordination_desc: "The nexus hive network is tied directly into production planning. Every line runs close to peak at once, without the ramp-up delays that used to stall new work."

 devourer_submarine: "Devourer"
 devourer_submarine_desc: "A parasite naval organism adapted for submerged raiding."
 abyssant_submarine: "Abyssant"
 abyssant_submarine_desc: "A larger parasite naval organism adapted for deep-water hunting."
 modifier_experience_gain_devourer_submarine_training_factor: "Devourer Training Experience Gain"
