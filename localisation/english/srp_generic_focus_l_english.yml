l_english:

 JAP_mobilize_the_nation: "Mobilise the Nation"
 JAP_mobilize_the_nation_desc: "With the worsening outlook of the world, we have no choice but to prepare our nation for conflict, whatever it is."

 JAP_crisis_governance: "Crisis Governance"
 JAP_crisis_governance_desc: "There is always a crisis somewhere in the country, and emergency administration handles it faster. Which crisis depends on who you ask."

 JAP_popular_mandate: "Popular Mandate"
 JAP_popular_mandate_desc: "We ask the public to accept what is coming and to keep believing we can manage it. So far they have."

 JAP_wartime_mandate: "Wartime Mandate"
 JAP_wartime_mandate_desc: "The emergency powers get written into law. Unclear end date."

 JAP_industrial_base: "Expand the Industrial Base"
 JAP_industrial_base_desc: "Civilian factory construction accelerates."

 JAP_arms_manufacture: "Arms Manufacture"
 JAP_arms_manufacture_desc: "New military plants, lest we fall behind."

 JAP_war_economy: "War Economy"
 JAP_war_economy_desc: "The economy converts to war production in full. Supposedly temporary."

 JAP_infrastructure_push: "Infrastructure Push"
 JAP_infrastructure_push_desc: "Infrastructure is a requirement for any national growth, and we want national growth."

 JAP_resource_extraction: "Resource Extraction"
 JAP_resource_extraction_desc: "Our natural riches lie unexploited. We could use a little push for our economy."

 JAP_logistics_network: "Logistics Network"
 JAP_logistics_network_desc: "Depots, rail sidings and trucks. An army only goes as far as its supply does."

 JAP_university_funding: "University Funding"
 JAP_university_funding_desc: "An educated population is a productive population. We should partake in the rapid expansion of human knowledge."

 JAP_applied_sciences: "Applied Sciences"
 JAP_applied_sciences_desc: "While maths, hypotheses and theories are all well and good, we need to put them to use."

 JAP_tech_acceleration: "Technology Acceleration"
 JAP_tech_acceleration_desc: "A massive round of funding towards our scientific bodies, staffed by the brightest in our nation."


