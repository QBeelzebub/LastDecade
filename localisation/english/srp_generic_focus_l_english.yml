 liberty_ethos_focus_desc: "Civil institutions hold their shape under pressure. Harder to push the country somewhere it does not want to go, and easier to spend political capital when it counts."
 militarism_focus_desc: "The armed forces are treated as an instrument of policy rather than a last resort. Wars are justified faster and provoke less alarm abroad."
 volunteer_corps_focus_desc: "A standing framework for sending troops to other people's wars, and a lower bar for doing it."
 foreign_expeditions_focus_desc: "Expeditionary deployments are treated as training. Larger contingents go out, and the army learns from what happens to them."
 why_we_fight_focus_desc: "The public has been told what the war is for, in terms it accepts. The country absorbs losses that would otherwise end it."
 military_youth_focus_desc: "Military instruction begins before conscription age. Recruits arrive already knowing the basics, and there are more of them."
 paramilitarism_focus_desc: "Armed organisations outside the regular chain of command. Useful manpower, and formations that hold together under strain."
 political_commissars_focus_desc: "Political officers attached to units. Morale is maintained and the home front stays quiet, by whichever means the posting requires."
 ideological_fanaticism_focus_desc: "Belief substituted for calculation. The country will keep fighting well past the point where it should have stopped."
