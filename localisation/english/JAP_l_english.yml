l_english:
 JAP_the_pacific_treaty: "The Pacific Treaty"
 JAP_the_pacific_treaty_desc: "Signed in 1953. The Federation holds its arsenal over Japan so that Japan never builds one of its own, and the Federation's navy uses our ports. Sixty-five years on the treaty comes up for review again, and nobody expects the review to change anything."
 JAP_the_china_trade: "The China Trade"
 JAP_the_china_trade_desc: "Beijing buys our machine tools and sells us nearly everything else. Neither government has forgotten the war that ended in 1945, and neither raises it at the trade talks, which run long anyway."
 JAP_federal_port_rights: "Federal Port Rights"
 JAP_federal_port_rights_desc: "The treaty opens our ports to the Federation's navy. Yokosuka and Sasebo get longer berthing schedules and a Federation liaison office, which has already asked for a bigger room."
 JAP_consultation_clause: "The Consultation Clause"
 JAP_consultation_clause_desc: "We ask Amsterdam for one amendment: no Federation weapon is used on or near Japanese soil without Tokyo's agreement. It costs the Federation nothing to sign while there is nothing to use one on."
 JAP_consultation_clause_tt: "The amendment goes to Amsterdam for signature."
 JAP_joint_planning_cells: "Joint Planning Cells"
 JAP_joint_planning_cells_desc: "Officers from both navies share a building in Yokohama and plan for the same war from opposite ends of the world. The main point of friction so far is the coffee."
 JAP_joint_planning_framework_tt: "The Federation's Pacific framework is already in place: §G+25 Navy Experience§!."
 JAP_pacific_trade_licences: "Pacific Trade Licences"
 JAP_pacific_trade_licences_desc: "Trade with the United States runs on licences issued in both capitals. We apply for more of them, in more sectors, and Washington approves most without comment."
 JAP_a_line_to_honolulu: "A Line to Honolulu"
 JAP_a_line_to_honolulu_desc: "The US Pacific Fleet sits across every sea lane we use. A standing line to its command in Honolulu costs very little, and a misread radar contact now gets a phone call first."
 JAP_dollar_credit: "Dollar Credit"
 JAP_dollar_credit_desc: "American banks lend to Japanese industry at rates Amsterdam does not match. The terms are good and the contracts are in English, which the Federation notices."
 JAP_lean_on_amsterdam: "Lean on Amsterdam"
 JAP_lean_on_amsterdam_desc: "The treaty has held for sixty-five years. We stay where it puts us, closer to the Federation than to the navy across the water."
 JAP_lean_on_washington: "Lean on Washington"
 JAP_lean_on_washington_desc: "The Federation is on the other side of the world and the US Navy is not. We keep the treaty and keep Washington closer, and Amsterdam is told this is not a change of policy."
 JAP_a_fleet_in_being: "A Fleet in Being"
 JAP_a_fleet_in_being_desc: "In the 1940s our fleet held forty percent of the US Navy in the Pacific without ever firing on it. The plan is to do that again."
 JAP_the_asian_front: "The Asian Front"
 JAP_the_asian_front_desc: "We are at war with China over a war being fought in Canada. The front is the Korean border and the East China Sea."
 JAP_old_enemies_one_side: "Old Enemies, One Side"
 JAP_old_enemies_one_side_desc: "We are fighting the same enemy as China. The two general staffs open a channel and exchange liaison officers, which is the most either has offered the other in eighty years."
 JAP_the_merchant_marine: "The Merchant Marine"
 JAP_the_merchant_marine_desc: "Most of what Japan eats and burns arrives by ship, and we own a large share of the ships it arrives on. Osaka's yards get the orders for more."
 JAP_tonnage_reports: "Tonnage Reports"
 JAP_tonnage_reports_desc: "A weekly count of every Japanese-flagged hull at sea: where it is, what it carries, whether it arrived. It started as a statistics exercise."
 JAP_state_war_risk_cover: "State War-Risk Cover"
 JAP_state_war_risk_cover_desc: "If the underwriters will not cover the ships, the state will. Every sinking is now a line in the national budget, and the navy escorts whatever the budget covers."
 JAP_the_ha_logistics_contract: "The H&A Logistics Contract"
 JAP_the_ha_logistics_contract_desc: "H&A Logistics insures its own ships and the Federation's navy escorts them. They will carry our food and fuel too, on H&A's schedule and at H&A's prices."
 JAP_escort_doctrine: "Escort Doctrine"
 JAP_escort_doctrine_desc: "The navy is rebuilt around the convoy. Destroyer captains trained to fight a fleet now spend most of their watches looking at the water behind a tanker."
 JAP_the_malacca_run: "The Malacca Run"
 JAP_the_malacca_run_desc: "Our oil and gas come from the Gulf, through the Strait of Malacca, which has the highest losses on the tonnage reports. Ninety days of fuel go into tanks beside every refinery."
 JAP_the_rice_reserve: "The Rice Reserve"
 JAP_the_rice_reserve_desc: "The government rice reserve is topped up to a full year of consumption. Farmers are paid above market for it, and the farm lobby has never liked a cabinet more."
 JAP_civil_defence_districts: "Civil Defence Districts"
 JAP_civil_defence_districts_desc: "Every prefecture gets a civil defence district, a siren schedule and an evacuation route. Most of the routes run inland. Coastal batteries go up where they start."
 JAP_ration_books: "Ration Books"
 JAP_ration_books_desc: "Fuel, cooking oil and imported grain go on the ration from next month. The ration books come off the same presses as the election ballots."
 JAP_test_the_recoveries: "Test the Recoveries"
 JAP_test_the_recoveries_desc: "Hospitals must test any patient who recovers unexpectedly from a serious illness for COTH before discharge. We have more elderly patients per head than any country on earth, and the labs are hiring."
 JAP_peninsular_industry: "Peninsular Industry"
 JAP_peninsular_industry_desc: "Korea's steelworks and shipyards get the same investment programme as the home islands. Seoul and Busan both bid for most of it."
 JAP_the_busan_ferry: "The Busan Ferry"
 JAP_the_busan_ferry_desc: "The ferry from Busan to Shimonoseki is the freight link between our railways and the mainland's. It gets deeper berths and a rail spur that runs onto the quay."
 JAP_southern_islands_survey: "Southern Islands Survey"
 JAP_southern_islands_survey_desc: "Palau, the Carolines and the Marshalls sit almost on the equator. A survey ship visits each of them twice a year and files the same report, that nothing has changed."
 JAP_okinawa_garrison: "Okinawa Garrison"
 JAP_okinawa_garrison_desc: "Okinawa is the southern end of the home islands and the first stop for anything coming up from the south. The garrison gets coastal batteries and a second airfield."
 JAP_the_reactor_fleet: "The Reactor Fleet"
 JAP_the_reactor_fleet_desc: "Japan runs more reactors than most countries, under a treaty that lets them make electricity and nothing else. The fuel cycle is due an upgrade."
 JAP_rokkasho_reprocessing: "Rokkasho Reprocessing"
 JAP_rokkasho_reprocessing_desc: "The plant at Rokkasho separates plutonium from spent fuel, more of it than our reactors will ever burn. Federation inspectors count it every quarter."

 JAP_pacific_treaty_idea: "The Pacific Treaty"
 JAP_pacific_treaty_idea_desc: "The Federation guarantees Japan with its nuclear arsenal and uses Japanese ports. Japan builds no bomb of its own."
 JAP_island_economy: "An Island Economy"
 JAP_island_economy_desc: "Most of Japan's food, fuel and ore arrives by sea. Cheap, while the ships run."
 JAP_uninsured_sea: "Uninsured Sea Lanes"
 JAP_uninsured_sea_desc: "The underwriters have withdrawn war-risk cover across the Pacific and Indian Oceans. Cargo without cover does not sail."
 JAP_sovereign_convoys: "Sovereign Convoys"
 JAP_sovereign_convoys_desc: "The state insures Japanese shipping and the navy escorts it. Slower and dearer than before."
 JAP_contracted_shipping: "Contracted Shipping"
 JAP_contracted_shipping_desc: "H&A Logistics carries Japan's food and fuel under Federation escort, on H&A's timetable."
 JAP_rationing: "Rationing"
 JAP_rationing_desc: "Fuel, cooking oil and imported grain are on the ration."
 JAP_strategic_fuel_reserve: "Strategic Fuel Reserve"
 JAP_strategic_fuel_reserve_desc: "Ninety days of fuel in tanks beside every refinery."
 JAP_federal_umbrella: "The Federal Umbrella"
 JAP_federal_umbrella_desc: "Japan stays as close to the Federation as the treaty puts it."
 JAP_washington_line: "The Washington Line"
 JAP_washington_line_desc: "Japan keeps the treaty and keeps Washington closer."
 JAP_fleet_in_being: "A Fleet in Being"
 JAP_fleet_in_being_desc: "The fleet stays concentrated in home waters, where every other navy has to plan around it."
 JAP_armed_neutrality: "Armed Neutrality"
 JAP_armed_neutrality_desc: "Japan stays out of the war between the Federation and the United States, with its fleet at sea."
 JAP_asian_front: "The Asian Front"
 JAP_asian_front_desc: "At war with China over a war in Canada."

 JAP_CHN_old_war: "The War of 1937"
 JAP_CHN_trade: "The China Trade"
 JAP_CHN_common_cause: "Common Cause"
 JAP_treaty_partner: "Pacific Treaty Partner"
 JAP_pacific_trade: "Pacific Trade Licences"
 JAP_honolulu_channel: "The Honolulu Line"
 JAP_federal_shipping: "Ships Under Federal Escort"
 JAP_clause_refused: "Clause Declined"

 jap.1.t: "The Underwriters Withdraw"
 jap.1.d: "The marine insurance syndicates have withdrawn war-risk cover for shipping across the Pacific and Indian Oceans, after losses nobody could price. Our tankers and grain ships are waiting in port for cover that is not coming. The ship owners want to know who pays now."
 jap.1.a: "Ration the fuel first."
 jap.2.t: "Europe and America at War"
 jap.2.d: "The Federation and the United States are at war. The Pacific Treaty binds the Federation to defend Japan. It says nothing about Japan fighting for the Federation, and the US Pacific Fleet sits across every route our ships use. The cabinet has to say where Japan stands."
 jap.2.a: "Stand with Washington."
 jap.2.b: "Honour the treaty."
 jap.2.c: "Keep the fleet at home."
 jap.9.t: "The Atlantic War Resumes"
 jap.9.d: "The armed truce between the Federation and the United States is over, and they are at war again. We answered this question once already. Both capitals expect the same answer, and both have said so in writing."
 jap.3.t: "The Asian Theatre"
 jap.3.d: "China and Japan are on opposite sides of the war between the Federation and the United States. Chinese and Japanese warships already share the East China Sea, and Korea shares a border with China. The cabinet wants a decision before the navy makes one."
 jap.3.a: "Then China as well."
 jap.3.b: "Not China."
 jap.4.t: "The Asian Front Goes Quiet"
 jap.4.d: "Neither of us is fighting the other's ally any more, which was the only reason given for the war with China. Both governments agree to stop where the lines are and to keep disagreeing about how it started."
 jap.4.a: "Stop where the lines are."
 jap.5.t: "Old Enemies, One Side"
 jap.5.d: "China and Japan are at war with the same enemy. The foreign ministries open a liaison office in Shanghai, and its first memo asks staff not to raise 1937."
 jap.5.a: "Keep it to the present."
 jap.6.t: "The Truce Reaches the Pacific"
 jap.6.d: "Washington and Amsterdam have agreed an armed truce. Our part in their war ends with theirs, on the same terms, which is to say none."
 jap.6.a: "Bring the fleet home."
 jap.7.t: "Tokyo Asks for a Clause"
 jap.7.d: "Japan requests one amendment to the Pacific Treaty: no Federation weapon is to be used on or near Japanese soil without Tokyo's agreement. The foreign ministry sees no cost in it. Defence planning has asked for a minute recording that the treaty exists for situations Tokyo might not agree to."
 jap.7.a: "Sign the amendment."
 jap.7.b: "Decline, politely."
 jap.8.t: "The Clause Is Signed"
 jap.8.d: "Amsterdam has signed the consultation clause without changing a word. The Foreign Ministry had set aside a week for the meetings."
 jap.8.a: "File it."
 jap.10.t: "Amsterdam Declines"
 jap.10.d: "The Federation has declined the consultation clause, politely and at some length. The treaty stands as it was."
 jap.10.a: "Noted."
