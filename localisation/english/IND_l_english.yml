l_english:
 IND: "India"
 IND_DEF: "India"
 IND_ADJ: "Indian"
 IND_democratic: "Republic of India"
 IND_democratic_DEF: "The Republic of India"
 IND_democratic_ADJ: "Indian"
 IND_neutrality: "Union of India"
 IND_neutrality_DEF: "The Union of India"
 IND_neutrality_ADJ: "Indian"
 IND_communism: "People's Republic of India"
 IND_communism_DEF: "The People's Republic of India"
 IND_communism_ADJ: "Indian"
 IND_fascism: "Indian State"
 IND_fascism_DEF: "The Indian State"
 IND_fascism_ADJ: "Indian"
 IND_LAST_DECADE_DESC: "One government from Peshawar to Chittagong, a seventh of the world's people, and a navy that still fits in one harbour. India buys most of what it cannot make from China and keeps the army facing north."
 IND_Leader_DESC: "Prime Minister of India. Her coalition holds a working majority in the Lok Sabha and a narrower one on most mornings."

 IND_meera_raghavan_token: "Meera Raghavan"
 IND_meera_raghavan_token_desc: "Runs the industry ministry out of Bombay, where the factories are."
 IND_harish_menon_token: "Harish Menon"
 IND_harish_menon_token_desc: "Chief of the Army Staff. Spent most of his career on the northern passes."

 IND_one_india: "One India"
 IND_one_india_desc: "Delhi governs Punjab, Bengal, the Deccan and Sind as one country. The ministries are large and slow, and every budget needs agreement from more state capitals than most countries have provinces."
 IND_one_india_2: "One India"
 IND_one_india_2_desc: "The union works better than its critics expected. The ministries are still large."
 IND_the_karakoram_ledger: "The Karakoram Ledger"
 IND_the_karakoram_ledger_desc: "Chinese machine tools, chips and steel come in over the passes and through Calcutta. Delhi pays on time and keeps the customs officers it trusts on the border posts."
 IND_the_coast_watch: "The Coast Watch"
 IND_the_coast_watch_desc: "Every port from Karachi to Chittagong reports unusual water, fish kills and lost boats to a single office in Bombay."

 IND_tariff_round: "Tariff Round"
 IND_tariff_round_desc: "A new tariff schedule with China. Cheaper machine parts for six months, until the next round of talks."

 IND_affairs: "Affairs of the Union"
 IND_affairs_desc: "Trade rounds with China and the defence of the northern passes."
 IND_renew_the_tariff_schedule: "Renew the Tariff Schedule"
 IND_renew_the_tariff_schedule_desc: "The commerce ministry sits down with Beijing's trade delegation for the annual schedule. Both sides bring the same complaints as last year."
 IND_reinforce_the_passes: "Reinforce the Passes"
 IND_reinforce_the_passes_desc: "A second line of posts on the Khyber, in Kashmir and at Quetta."

 IND_the_delhi_cabinet: "The Delhi Cabinet"
 IND_the_delhi_cabinet_desc: "The new cabinet sits for the first time with twenty-nine ministries, eleven coalition partners and one budget."
 IND_the_five_year_plan: "The Five-Year Plan"
 IND_the_five_year_plan_desc: "The Planning Commission publishes the fourteenth plan. It is mostly power stations and roads, like the thirteen before it."
 IND_bombay_and_calcutta: "Bombay and Calcutta"
 IND_bombay_and_calcutta_desc: "The two old port cities get the new industrial zones, because that is where the workers, the rail and the harbours already are."
 IND_the_grand_trunk_road: "The Grand Trunk Road"
 IND_the_grand_trunk_road_desc: "The road from Peshawar to Calcutta is widened to six lanes along most of its length. The rest is in court."
 IND_the_steel_belt: "The Steel Belt"
 IND_the_steel_belt_desc: "Bihar has the ore, the coal and the river. The new mills at Jamshedpur take the army's orders first."
 IND_power_for_the_plains: "Power for the Plains"
 IND_power_for_the_plains_desc: "New grid lines across the United Provinces and Bengal, the two most crowded states in the union. Factories follow the power."
 IND_the_union_works: "The Union Works"
 IND_the_union_works_desc: "The plan meets most of its targets, which no plan has done since the second one."
 IND_machine_tools_from_beijing: "Machine Tools from Beijing"
 IND_machine_tools_from_beijing_desc: "China sells us the lathes and the fabrication lines and takes payment in rice, cotton and rupees. Its engineers stay for the installation and leave when it is done."
 IND_no_bases_for_anyone: "No Bases for Anyone"
 IND_no_bases_for_anyone_desc: "Beijing asks for a naval supply station at Chittagong. Delhi says no, and says the same to Amsterdam the following week to keep it even."
 IND_the_northern_command: "The Northern Command"
 IND_the_northern_command_desc: "Most of the army stands between the Punjab and the Chinese border, where it has stood for seventy years. The command is reorganised and the doctrine rewritten."
 IND_mountain_divisions: "Mountain Divisions"
 IND_mountain_divisions_desc: "Kashmir, the Khyber and the eastern passes get permanent fortified posts and divisions trained to hold them."
 IND_the_artillery_board: "The Artillery Board"
 IND_the_artillery_board_desc: "Guns that can be taken apart, carried up a pass and put back together."
 IND_the_air_arm: "The Air Arm"
 IND_the_air_arm_desc: "Delhi orders a second fighter wing and a new airfield outside the capital."
 IND_the_western_fleet: "The Western Fleet"
 IND_the_western_fleet_desc: "The navy is three destroyers and two submarines in Bombay. A new slip at the dockyard is the first step to more."
 IND_reserve_lists: "Reserve Lists"
 IND_reserve_lists_desc: "Every district office updates its reserve list for the first time since the 1990s. Many of the names on the old lists have moved, retired or died."
 IND_the_africa_reports: "The Africa Reports"
 IND_the_africa_reports_desc: "The ministry of external affairs collects every report from West Africa it can find and circulates a summary to the cabinet. It is two pages long and most of it is unconfirmed."
 IND_quarantine_the_ports: "Quarantine the Ports"
 IND_quarantine_the_ports_desc: "Ships arriving from African and Indonesian waters are held and inspected before they berth. The shipping lines complain about the delays."
 IND_the_java_watch: "The Java Watch"
 IND_the_java_watch_desc: "Something has come ashore on Java. Our consulate in Jakarta files daily, and the navy moves its patrol line south."
 IND_the_bengal_coast: "The Bengal Coast"
 IND_the_bengal_coast_desc: "The Bay of Bengal is the nearest sea to Java. Coastal guns and air defence go up along it."
 IND_letters_to_amsterdam: "Letters to Amsterdam"
 IND_letters_to_amsterdam_desc: "A regular correspondence with the Federation's foreign office, at ambassador level and no higher."
 IND_the_colombo_question: "The Colombo Question"
 IND_the_colombo_question_desc: "The Federation holds Ceylon and its harbour twenty miles off our coast. Delhi raises it once a year, and the reply is always polite."

 ind.1.t: "The Hive on the Gulf"
 ind.1.d: "The parasites have crossed the canal and are at war with the Arab Union. Baghdad has asked every government it trades with for rifles, and asked Delhi for more than that. Our generals point out that the Gulf is three days from Karachi by sea."
 ind.1.a: "We fight with the Union."
 ind.1.b: "Ship rifles, nothing more."
