 train_equipment: "Train"
 train_equipment_desc: "Trains transport supplies from the Supply Capital to Supply Hubs connected by rail. Without them, front-line forces go critically undersupplied."
 train_equipment_1: "Civilian Train"
 train_equipment_1_desc: "Requisitioned civilian freight rolling stock. Cheap to produce and easy to replace, but unarmored and vulnerable to attack."
 train_equipment_2: "Military Train"
 train_equipment_2_desc: "Reinforced rolling stock built for wartime logistics. Armored bodywork and hardened couplings make it far more survivable than requisitioned civilian equipment."

 ld_civilian_train: "Civilian Requisition"
 ld_civilian_train_desc: "Nationalises civilian freight infrastructure for military logistics. Cheap trains, fast to produce. The baseline for keeping armies supplied across rail networks."
 ld_military_train: "Military Train Programme"
 ld_military_train_desc: "Dedicated military rolling stock with armored construction. Substantially more survivable than requisitioned civilian trains, at higher production cost."

 STATE_CATEGORY_srp_megaregion: "Megaregion"
 srp_megaregion: "Megaregion"


 SRP_western_alliance_name: "Western Alliance"
 SRP_european_pact_name: "European Pact"
 SRP_parasite_hive_name: "The Hive"


 geo_volunteers.1.t: "Africa Falls Under Assault"
 geo_volunteers.1.d: "The Iris parasite faction has declared war on the African Confederation. Our forces are watching. The question is whether we commit."
 geo_volunteers.1.a: "Send what we can. Africa must hold."
 geo_volunteers.1.b: "We cannot afford to get involved right now."

 SRP_volunteers_to_africa_idea: "Volunteers to Africa"
 SRP_volunteers_to_africa_idea_desc: "Our forces have joined the African front against the parasite assault. The commitment has hardened national resolve."


 EFH_global_positioning: "Global Positioning"
 EFH_global_positioning_desc: "The European Federation is not content to remain a regional power. The Pacific, East Asia and South America are all in play."

 EFH_pacific_partnership: "Pacific Partnership"
 EFH_pacific_partnership_desc: "Japan has long sat in the Federation's sphere of influence. Now the Federation formalises that relationship, deepening economic and strategic ties against American encroachment."

 EFH_japan_tech_exchange: "Japan Technology Exchange"
 EFH_japan_tech_exchange_desc: "The Federation and Japan open a joint technology corridor."

 EFH_pacific_defense_pact: "Pacific Defence Pact"
 EFH_pacific_defense_pact_desc: "The Federation formally guarantees Japan's security. The pact is announced publicly, drawing a line the United States cannot ignore. The Pacific balance has shifted."

 EFH_south_american_outreach: "South American Outreach"
 EFH_south_american_outreach_desc: "The Federation begins a quiet economic campaign in South America. Infrastructure investment, trade credits, and diplomatic personnel establish a foothold in what the United States considers its backyard."

 EFH_SAC_infrastructure_program: "SAC Infrastructure Programme"
 EFH_SAC_infrastructure_program_desc: "The Federation construction contracts in the South American Confederation become impossible to hide. Washington notices. The era of quiet competition is ending."

 EFH_hemispheric_challenge: "Hemispheric Challenge"
 EFH_hemispheric_challenge_desc: "The Federation formally asserts an interest in the Western Hemisphere's stability. The Monroe Doctrine has a challenger for the first time in a century."

 EFH_beijing_channel: "Beijing Back-Channel"
 EFH_beijing_channel_desc: "Away from public scrutiny, the Federation opens a diplomatic channel with Beijing. Both sides have reasons to want a counterweight to Washington's global presence."

 EFH_trade_normalization: "Trade Normalisation"
 EFH_trade_normalization_desc: "The Federation and China normalise trade relations. New contracts flow through European ports. The United States takes note with considerable displeasure."

 EFH_eurasian_buffer_doctrine: "Eurasian Buffer Doctrine"
 EFH_eurasian_buffer_doctrine_desc: "The Federation signals that China is a natural buffer against American influence in Eurasia. The question is whether Beijing agrees, and how far it is willing to lean."



 EFH_japan_sphere_tt: "Japan is drawn deeper into the Federation's security and economic sphere."










 EFH_sino_efh_partnership: "Sino-European Partnership"
 EFH_sino_efh_partnership_desc: "Beijing has answered the buffer doctrine in the only language that matters: agreement. Trade runs both ways, research is shared, and the two continental powers coordinate against a threat neither can face alone. The relationship is pragmatic on both sides, and the more durable for it."

 EFH_sino_research_exchange_active: "Sino-European Research Exchange"
 EFH_sino_research_exchange_active_desc: "Joint laboratories and shared findings on parasite biology and containment. The exchange is temporary by design, renewed only while both governments find it useful."

 CHN_efh_partnership: "European Partnership"
 CHN_efh_partnership_desc: "China has tilted toward the European Federation rather than wait out the decade in isolation. The arrangement steadies Beijing's institutions and opens European markets, for as long as the partnership serves Chinese interests."

 EFH_eurasian_coordination: "Eurasian Coordination"

 EFH_sino_logistics_corridor: "Open a Sino-European Logistics Corridor"
 EFH_sino_logistics_corridor_desc: "Route Chinese industrial output through the partnership to reinforce European production. Renewable while the corridor stays open."
 EFH_sino_logistics_corridor_tt: "Adds steel to the capital region for 180 days."
 EFH_sino_trade_groundwork_tt: "Trade normalisation keeps the corridor cheap to run: additional political power."

 EFH_sino_research_exchange: "Convene a Sino-European Research Exchange"
 EFH_sino_research_exchange_desc: "Stand up joint laboratories on parasite biology and containment. Grants a temporary research bonus while the exchange runs."

 EFH_sino_eastern_intelligence: "Share the Eastern Infestation Picture"
 EFH_sino_eastern_intelligence_desc: "Pool what Beijing and Brussels each know about the parasite advance across the Asian landmass. A one-time intelligence hand-off on the Iris."
 EFH_sino_contact_groundwork_tt: "The Beijing back-channel makes the first hand-off larger: additional intelligence on the Iris."


 USA_great_power_doctrine: "Great Power Doctrine"
 USA_great_power_doctrine_desc: "The United States reaffirms itself as the world's leading power. The Federation's growing ambitions will not go unanswered."

 USA_monroe_doctrine_reassertion: "Monroe Doctrine Reassertion"
 USA_monroe_doctrine_reassertion_desc: "The Federation has moved into the Western Hemisphere. The United States formally reasserts the Monroe Doctrine: the Americas are not a stage for European power games."

 USA_expel_EFH_influence: "Expel EFH Influence"
 USA_expel_EFH_influence_desc: "American economic pressure targets Federation markets. Trade barriers go up across the Western Hemisphere. Federation contracts in South America are declared unwelcome."

 USA_western_hemisphere_bloc: "Western Hemisphere Bloc"
 USA_western_hemisphere_bloc_desc: "The United States formalises its hemispheric alliance. If the Federation will not back down from the Americas, America will not back down either. The standoff has found its fault line."

 USA_pacific_containment: "Pacific Containment"
 USA_pacific_containment_desc: "The United States reinforces its Pacific security guarantees. Japan, South Korea, and the broader Pacific rim are placed firmly within the American umbrella."

 USA_beijing_confrontation: "Beijing Confrontation"
 USA_beijing_confrontation_desc: "Washington signals to Beijing that its relationship with the Federation will have consequences. Trade restrictions are tightened, the pressure is on."

 USA_pacific_war_authorization: "Pacific War Authorisation"
 USA_pacific_war_authorization_desc: "With Federation entrenched in Japan and the Pacific containment line drawn, the United States authorises military action if necessary. The cold war is becoming something else."





 USA_efh_market_exclusion: "American Market Exclusion"
 USA_efh_market_exclusion_desc: "The United States has shut American markets to EFH."




 USA_pacific_containment_tt: "The USA secures the Pacific rim against Federation expansion."


 efh_geo.1.t: "The Pacific Pact is Signed"
 efh_geo.1.d: "Japan has formally aligned with the European Federation. The defence pact is public, the terms are binding, and Washington has received its copy. The Pacific balance has shifted in a way that will be difficult to reverse."
 efh_geo.1.a: "A new era in European-Pacific relations begins."
 efh_geo_japan_pact_tt: "USA is informed of the Japan-Federation defence pact."

 efh_geo.2.t: "Beijing Considers Its Position"
 efh_geo.2.d: "The Federation's Eurasian buffer doctrine has placed China at a decision point. Beijing can lean toward the European partnership, or it can maintain the careful neutrality that has served it well. The choice is Beijing's to make."
 efh_geo.2.a: "China leans toward EFH. The Eurasian buffer doctrine holds."
 efh_geo.2.b: "China remains neutral. Better to wait and see."
 efh_geo_china_efh_tt: "China formally tilts toward the Federation's diplomatic position."
 efh_geo_china_neutral_tt: "China chooses strategic neutrality for now."

 efh_geo.3.t: "EFH Claims Hemispheric Interest"
 efh_geo.3.d: "The Federation has formally declared a stake in Western Hemisphere stability. Washington is reading the communique with fury. The Monroe Doctrine has a challenger."
 efh_geo.3.a: "The Federation is in the Americas. Let Washington respond."
 efh_geo_hemispheric_tt: "USA receives news of the Federation's hemispheric challenge."

 usa_efh_war.1.t: "EFH Moves Into the Americas"
 usa_efh_war.1.d: "Intelligence confirms what was suspected: the Federation is establishing a real economic and strategic presence in South America, in sectors and at a scale that no commercial case explains."
 usa_efh_war.1.a: "Issue a formal protest. The Monroe Doctrine applies."
 usa_efh_war.1.b: "Monitor the situation. No reason to escalate yet."

 usa_efh_war.2.t: "EFH Has Japan"
 usa_efh_war.2.d: "The Pacific Defence Pact is confirmed. Japan, which Washington considered a reliable partner, has signed a formal security arrangement with the European Federation. The Pacific strategic map has changed."
 usa_efh_war.2.a: "Demand Japan reconsider. This will not stand."
 usa_efh_war.2.b: "Accelerate Pacific containment. We need to reinforce our own position."

 usa_efh_war.3.t: "The Ultimatum"
 usa_efh_war.3.d: "The diplomatic standoff has reached its end. Both the United States and the European Federation have drawn lines neither is willing to abandon. Someone must blink. Or someone must fire."
 usa_efh_war.3.a: "Issue the ultimatum. If they do not withdraw, we will make them."
 usa_efh_war.3.b: "We cannot fight this war. Stand down and find another path."


 SRP_political_interference_category: "Political Operations"
 SRP_political_interference_category_desc: "Quiet operations to shape the rival power's internal politics, without moving forces or firing shots."

 USA_stoke_ef_separatism: "Back EF Separatist Movements"
 USA_stoke_ef_separatism_desc: "American intelligence channels can quietly fund and amplify movements inside Federation that want stronger regional autonomy from H&A's grip. It won't fracture Europe overnight, but it makes Brussels harder to govern."
 USA_stoke_ef_separatism_tt: "Increases Federation separatist pressure and Sovereigntist party vote share."
 USA_groundwork_separatism_tt: "The pre-crisis Atlantic intelligence groundwork deepens the operation: additional separatist pressure and Sovereigntist support."

 USA_fund_ha_lobbying_external: "Fund H&A Lobbying Networks"
 USA_fund_ha_lobbying_external_desc: "Washington has always preferred a corporate-run Europe to a statist one. H&A's pro-market agenda aligns with American interests, and their parliamentary contacts don't ask too many questions about where the money comes from."
 USA_fund_ha_lobbying_external_tt: "Shifts the Federation's internal balance of power toward H&A Corporation."

 EFH_back_us_credibility: "Endorse American Crisis Leadership"
 EFH_back_us_credibility_desc: "A public statement of confidence in Washington's parasite response costs Federation little but gives the American government political breathing room. A stable United States is a more predictable partner."
 EFH_back_us_credibility_tt: "Improves USA public trust in federal institutions."

 EFH_undermine_us_narrative: "Leak American Crisis Failures"
 EFH_undermine_us_narrative_desc: "European intelligence has documented American mishandling of the parasite situation in exquisite detail. The files are embarrassing. Releasing them to international press would make Washington's job considerably harder."
 EFH_undermine_us_narrative_tt: "Damages USA public trust in federal institutions."


 EFH_establish_atlantic_network: "Establish the Atlantic Network"
 EFH_establish_atlantic_network_desc: "Intelligence operations against American interests are authorised. A permanent collection network inside the United States requires money, patience, and people willing to disappear into American life for years. The federal services have all three."
 EFH_atlantic_network_groundwork_tt: "The pre-crisis northern intelligence groundwork shortens the build-up: 25 Political Power recovered and additional intelligence on American forces."

 EFH_intel_procurement_espionage: "Procurement Espionage"
 EFH_intel_procurement_espionage_desc: "American defence procurement leaks like any other bureaucracy. Contract documents, test data, and supplier specifications can be bought, copied, or photographed. Each operation carries a risk of exposure."
 EFH_procurement_espionage_risk_tt: "75% chance of clean extraction (+10 Political Power). 25% chance of exposure (EF-US escalation rises, American war support rises)."

 EFH_intel_canadian_listening_posts: "Canadian Listening Posts"
 EFH_intel_canadian_listening_posts_desc: "The intelligence groundwork laid on the northern frontier before the crisis makes a permanent signals presence possible. Listening stations along the Canadian border watch American military traffic around the clock. Washington will eventually notice."
 EFH_canadian_listening_posts_idea: "Canadian Listening Posts"
 EFH_canadian_listening_posts_idea_desc: "Signals stations on the northern frontier track American military traffic."


 EFH_propose_research_accord: "Propose Anti-Parasite Research Accord"
 EFH_propose_research_accord_desc: "A research-sharing arrangement with Washington. The Federation wants American bioanalysis data, Washington wants European field containment data, and neither side has said yet whether that is a trade."
 EFH_propose_research_accord_tt: "The Federation immediately begins consolidated research. USA receives a proposal event and may accept or decline."

 efh_geo.4.t: "EFH Proposes a Research Accord"
 efh_geo.4.d: "Brussels is reaching out. The European Federation has proposed a formal exchange of parasite research data, consolidating American bioanalysis findings with European field containment records. The science case is sound. The political case is more complicated."
 efh_geo.4.a: "Accept. This is bigger than our rivalry."
 efh_geo.4.b: "Decline. We are not ready to share this data with Europe."

 efh_geo.5.t: "Washington Has Replied"
 efh_geo.5.d: "The United States has responded to our research accord proposal."
 efh_geo.5.a: "Understood. We continue with what we have."
 efh_geo_accord_accepted_tt: "The United States accepted the accord. Both parties gain consolidated research access."
 efh_geo_accord_declined_tt: "The United States declined. The Federation's own research programme proceeds independently."


 EFH_joint_research_accord: "Joint Research Accord"
 EFH_joint_research_accord_desc: "The Federation and the United States have agreed to pool parasite research data. Shared containment protocols and bioanalysis records are accelerating the scientific effort on both fronts."

 USA_joint_research_accord: "Joint Research Accord"
 USA_joint_research_accord_desc: "The United States has agreed to share parasite research data with EFH. European field containment records are filling gaps in American bioanalysis programmes."

