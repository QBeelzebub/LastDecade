 group_parasite_title: "Parasite Battalions"
 LAST_DECADE_DESC: "The year is 2020. H&A has introduced the first commercial fusion reactor, and the Iris has taken up orbit around the sun. A bacterial presence has been spotted in West Africa."
 WRONG_BOOKMARK: "Wrong Bookmark"
 WRONG_BOOKMARK_DESC: "This is an identical placeholder bookmark used to stop Hearts of Iron IV from trapping the country select back button. Use Last Decade."
 BEFORE_THE_STORM: "Before the Storm"
 BEFORE_THE_STORM_DESC: "The year is 2018. The world stands at the edge of an era it does not yet know is ending. Two years remain before the bacterial presence in West Africa becomes undeniable. Use this start for a fuller geopolitical experience before the crisis."
 IRS_BTS_DESC: "The Iris drifts in orbit, unseen. Its seed colony rests on a remote Atlantic island, incubating. In two years it will be ready to emerge."
 EFH_LAST_DECADE_DESC: "The European Federation is almost the sole world hegemon, forged in the heat of WW2 and its victory. The seventy years since have been the most productive in European history."
 USA_LAST_DECADE_DESC: "America remains the dominant power outside the European sphere. Its military is unmatched, its economy vast, and its institutions untested by anything like what is coming."
 IRS_LAST_DECADE_DESC: "The Iris is a living planet, and every parasite on Earth came from it. Three worlds have already been consumed. Earth is the fourth."
 JAP_LAST_DECADE_DESC: "Japan has bound itself closely to the European Federation, trading sovereignty for stability. A prosperous island nation on a planet that is about to stop being stable."
 SWR_LAST_DECADE_DESC: "Sweramoa rose from the ruins of Russia's eastern collapse: a communist state carved from the Siberian interior, vast in territory, thin in resources, and governed by people who believe they have something left to prove."
 RSF_LAST_DECADE_DESC: "The Russian Federation entered the decade already hollow. An economy administered for the benefit of a dozen men, a military larger on the establishment tables than in the field, and an eastern half that Moscow stopped counting years ago. Every decision left to it is a decision about who gets the pieces."
 SAC_LAST_DECADE_DESC: "The South American Confederation is a democratic alliance of several Latin American nations."
 OCE_LAST_DECADE_DESC: "The Pacific nations formed Oceania out of necessity rather than ambition. Remote, dispersed, and easily overlooked. In a few years that will look like an advantage."

 label_parasite_factions: "Parasite Factions\n\nPlay as the Iris (IRS) or the Knox County Anomaly (KNX), the parasite nations consuming Earth from within."
 label_human_nations: "Human Nations\n\nPlay as one of the human nations responding to the rising parasite threat."

