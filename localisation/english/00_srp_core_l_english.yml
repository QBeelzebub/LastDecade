 FE_DIFFICULTY_VERY_EASY: "Containment"
 FE_DIFFICULTY_VERY_EASY_TOOLTIP: "Quarantine lines hold. The network is contained, and humanity's institutions still function at near full capacity."
 FE_DIFFICULTY_EASY: "Breach"
 FE_DIFFICULTY_EASY_TOOLTIP: "Containment is failing in isolated sectors. Resistance still holds the advantage, but cracks are showing."
