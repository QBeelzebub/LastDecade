 beckon_cluster: "Beckon Cluster"
 beckon_cluster_desc: "Dense root network structure associated with Iris infestation. Rapid growth observed in contaminated zones. Primary target for containment and eradication efforts."
 dispatcher: "The Dispatcher"
 dispatcher_desc: "Mobile command and control organism for Beckon Cluster operations. Capable of coordinating multiple Beckon Clusters simultaneously. Highly resilient to conventional countermeasures."
 energy_infrastructure: "Energy Infrastructure"
 energy_infrastructure_desc: "Basic Energy Infrastructure."
 industrial_infrastructure: "Industrial Infrastructure"
 industrial_infrastructure_desc: "Basic Industrial Infrastructure."
 srp_fissile_extractor: "Fissile Plant"
 srp_fissile_extractor_desc: "A facility designed to extract and process fissile materials for use in combat nuclear applications.\nProvides +3 £resources_strip|8"
 srp_fissile_extractor_plural: "Fissile Plants"
 srp_fusion_reactor: "Fusion Reactor"
 srp_fusion_reactor_desc: "A grid-scale fusion power facility, providing abundant energy to the surrounding industrial base while its excess output is harnessed directly for production, functioning as additional factories."
 srp_fusion_reactor_plural: "Fusion Reactors"
 srp_containment_node: "Containment & Recovery Node"
 srp_containment_node_desc: "A network of decontamination stations and field clinics for populations in formerly infested zones, accelerating residual Iris die-off while supporting the recovery of the local workforce."
 srp_containment_node_plural: "Containment & Recovery Nodes"
 srp_genome_archive: "Genome Archive"
 srp_genome_archive_desc: "A cultivation and storage facility for catalogued genome lines, allowing Military Industrial Organisations to draw on a far broader base of biological data for research."
 srp_genome_archive_plural: "Genome Archives"
 srp_distribution_hub: "Automated Distribution Hub"
 srp_distribution_hub_desc: "A logistics complex coordinating supply convoys and reinforcement flows through automated routing systems."
 srp_distribution_hub_plural: "Automated Distribution Hubs"
 srp_fabrication_yard: "Modular Fabrication Yard"
 srp_fabrication_yard_desc: "A modular production facility built from prefabricated components, capable of rapid reconfiguration between civilian and military output."
 srp_fabrication_yard_plural: "Modular Fabrication Yards"
 srp_data_center: "Data Centre"
 srp_data_center_desc: "Consolidated high-performance computing estate: dense server halls, GPU clusters, and the cooling and power plant to keep them running. Accelerates national research and hardens the country's signals and counter-intelligence posture. Draws heavily on the grid."
 srp_data_center_plural: "Data Centres"
 srp_data_center_2: "AI Training Cluster"
 srp_data_center_2_desc: "Hyperscale compute campus built around continuous large-model training, only viable on fusion-grade baseload power. Delivers a decisive edge in research and signals analysis at a steep energy cost."
 srp_data_center_2_plural: "AI Training Clusters"

 iris_focus: "Iris Focus Tree"
 EFH_focus: "European Federation Focus Tree"
 USA_focus: "United States Focus Tree"
 EFH_Ryland: "Conscript Ryland into Laytheo"
 EFH_HNA_independence: "H&A Independence"
 EFH_HNA_independence_desc: "H&A has grown beyond a simple contractor. Granting the company room to operate on its own terms opens doors the Federation government could never open directly."
 EFH_HNA_independence_tt: "H&A begins acting on its own authority. Their first independent initiative will conclude shortly."
 EFH_HNA_autonomous_placeholder: "H&A: Lunar Architecture Office"
 EFH_HNA_autonomous_placeholder_desc: "H&A's first autonomous office begins designing the industrial, legal, and launch framework for a sustained lunar programme."
 EFH_HNA_ORIGINATOR: "H&A"
 EFH_HNA_working_on_focus_tt: "§YH&A§! is working on this focus.\nProgress: §Y$FLAG_DAYS$§!/[?temp_focus_days] days"
 EFH_HNA_focus_not_started_tt: "This initiative belongs to H&A. Grant them independence first."
 EFH_HNA_lunar_programme_approved_tt: "Unlocks the §YMoon Base Programme§! once Laytheo has completed its first flight."
 EFH_HNA_lunar_policy_public_tt: "H&A adopts a supervised public mandate for lunar work."
 EFH_HNA_lunar_policy_corporate_tt: "H&A adopts an aggressive corporate acceleration model for lunar work."
 EFH_HNA_lunar_policy_procurement_tt: "H&A creates a deniable procurement office. Several launch vehicles should consider becoming less unattended."

 EFH_fusion_economy: "Commercial Fusion Power"
 EFH_fusion_economy_desc: "First grid-scale tokamak facilities went online 2017. Energy scarcity is effectively solved. Industrial output decoupled from fossil fuel supply chains."
 EFH_RTG_ideas: "Iris Countertechnology"
 EFH_RTG_ideas_desc: "Early development of technologies to counter the Iris threat. Detection systems, incendiary compounds, and containment protocols, in that order of urgency."
 EFH_TAD_idea: "Total American Death"
 EFH_TAD_idea_desc: "The United States has been the primary source of anti-EF propaganda and subversion. The Federation has committed itself to the complete eradication of the United States as a geopolitical entity."
 USA_fire_protocol_confidence: "Fire Protocol Confidence"
 USA_fire_protocol_confidence_desc: "Initial field reports show that fire works against early organisms. The conclusion is reassuring. The confidence drawn from it is premature."
 EFH_first_vagrant_info: "Knox county research"
 EFH_first_vagrant_info_desc: "A series of classified files about vagrant and parasite biology. As well as notes on the American military. Written by the 1st vagrant."

 PRODUCTION_MATERIALS_FISSILE_MATERIAL: "Fissile Material"
 fissile_material_desc: "Fissile material used in advanced energy systems and nuclear weaponry. Critical for industrial and military applications. Obtained through mining, enrichment, or trade."



 CHN_mobilize_the_nation: "Mobilise the Nation"
 CHN_mobilize_the_nation_desc: "With the quickly worsening state of the world, we have no choice but to prepare our nation for conflict."

 CHN_crisis_governance: "Crisis Governance"
 CHN_crisis_governance_desc: "Emergency administration moves the decisions into a smaller room. Fewer people have to be convinced of anything now."

 CHN_popular_mandate: "Popular Mandate"
 CHN_popular_mandate_desc: "We ask the public to accept what is coming and to keep believing we can manage it. So far they have."

 CHN_wartime_mandate: "Wartime Mandate"
 CHN_wartime_mandate_desc: "The emergency powers get written into law, with an end date nobody expects to honour."

 CHN_industrial_base: "Expand the Industrial Base"
 CHN_industrial_base_desc: "Civilian factory construction accelerates. The programme is costed through 2027."

 CHN_arms_manufacture: "Arms Manufacture"
 CHN_arms_manufacture_desc: "New military plants, sited inland where the maps still say inland is safe."

 CHN_war_economy: "War Economy"
 CHN_war_economy_desc: "The economy converts to war production in full. The paperwork calls it temporary."

 CHN_infrastructure_push: "Infrastructure Push"
 CHN_infrastructure_push_desc: "Roads and rail get rebuilt on the routes we still control. The rest of the map is left off the plan."

 CHN_resource_extraction: "Resource Extraction"
 CHN_resource_extraction_desc: "Mining and extraction expand to whatever we can reach without an escort. Imports are no longer something to plan around."

 CHN_logistics_network: "Logistics Network"
 CHN_logistics_network_desc: "Supply runs deeper into our own territory than it used to, because that is where the fronts are now."

 CHN_university_funding: "University Funding"
 CHN_university_funding_desc: "Research funding goes up. The universities that are still open take it and do not ask how long it lasts."

 CHN_applied_sciences: "Applied Sciences"
 CHN_applied_sciences_desc: "Funding moves to whatever can be built this year. The longer programmes are quietly wound down."

 CHN_tech_acceleration: "Technology Acceleration"
 CHN_tech_acceleration_desc: "A dedicated research division is stood up, staffed by whoever could be spared from the work already running."


