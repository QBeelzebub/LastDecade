 AFR_mobilize_the_nation_desc: "With the quickly worsening state of the world, we have no choice but to prepare our nation for conflict."

 AFR_crisis_governance: "Crisis Governance"
 AFR_crisis_governance_desc: "Emergency administration moves the decisions into a smaller room. Fewer people have to be convinced of anything now."

 AFR_popular_mandate: "Popular Mandate"
 AFR_popular_mandate_desc: "We ask the public to accept what is coming and to keep believing we can manage it. So far they have."

 AFR_wartime_mandate: "Wartime Mandate"
 AFR_wartime_mandate_desc: "The emergency powers get written into law, with an end date nobody expects to honour."

 AFR_industrial_base: "Expand the Industrial Base"
 AFR_industrial_base_desc: "Civilian factory construction accelerates. The programme is costed through 2027."

 AFR_arms_manufacture: "Arms Manufacture"
 AFR_arms_manufacture_desc: "New military plants, sited inland where the maps still say inland is safe."

 AFR_war_economy: "War Economy"
 AFR_war_economy_desc: "The economy converts to war production in full. The paperwork calls it temporary."

 AFR_infrastructure_push: "Infrastructure Push"
 AFR_infrastructure_push_desc: "Roads and rail get rebuilt on the routes we still control. The rest of the map is left off the plan."

 AFR_resource_extraction: "Resource Extraction"
 AFR_resource_extraction_desc: "Mining and extraction expand to whatever we can reach without an escort. Imports are no longer something to plan around."

 AFR_logistics_network: "Logistics Network"
 AFR_logistics_network_desc: "Supply runs deeper into our own territory than it used to, because that is where the fronts are now."

 AFR_university_funding: "University Funding"
 AFR_university_funding_desc: "Research funding goes up. The universities that are still open take it and do not ask how long it lasts."

 AFR_applied_sciences: "Applied Sciences"
 AFR_applied_sciences_desc: "Funding moves to whatever can be built this year. The longer programmes are quietly wound down."

 AFR_tech_acceleration: "Technology Acceleration"
 AFR_tech_acceleration_desc: "A dedicated research division is stood up, staffed by whoever could be spared from the work already running."

 liberty_ethos_focus_desc: "Civil institutions hold their shape under pressure. Harder to push the country somewhere it does not want to go, and easier to spend political capital when it counts."
 militarism_focus_desc: "The armed forces are treated as an instrument of policy rather than a last resort. Wars are justified faster and provoke less alarm abroad."
 volunteer_corps_focus_desc: "A standing framework for sending troops to other people's wars, and a lower bar for doing it."
 foreign_expeditions_focus_desc: "Expeditionary deployments are treated as training. Larger contingents go out, and the army learns from what happens to them."
 why_we_fight_focus_desc: "The public has been told what the war is for, in terms it accepts. The country absorbs losses that would otherwise end it."
 military_youth_focus_desc: "Military instruction begins before conscription age. Recruits arrive already knowing the basics, and there are more of them."
 paramilitarism_focus_desc: "Armed organisations outside the regular chain of command. Useful manpower, and formations that hold together under strain."
 political_commissars_focus_desc: "Political officers attached to units. Morale is maintained and the home front stays quiet, by whichever means the posting requires."
 ideological_fanaticism_focus_desc: "Belief substituted for calculation. The country will keep fighting well past the point where it should have stopped."





 srp_last_decade_t1_parasite: "Contained Growth"
 srp_last_decade_t1_parasite_desc: "Containment efforts have disrupted the luxsynthesis cycle across much of the network. Biomass conversion runs below capacity, and the Dispatcher network struggles to relay coordination signals through damaged territory."
 srp_last_decade_t1_human: "Coordinated Response"
 srp_last_decade_t1_human_desc: "Surviving institutions remain intact and well coordinated. Nothing has yet been asked of them that they were not already built to do."

 srp_last_decade_t2_parasite: "Early Setbacks"
 srp_last_decade_t2_parasite_desc: "Pockets of the network remain cut off from the wider luxsynthesis cycle, slowing biomass conversion and Dispatcher coordination in affected territory."
 srp_last_decade_t2_human: "Holding the Line"
 srp_last_decade_t2_human_desc: "Institutions are under strain and still largely functional. The disruption is measurable and nobody has had to explain it publicly yet."

 srp_last_decade_t4_parasite: "Spreading Network"
 srp_last_decade_t4_parasite_desc: "The network has reclaimed lost ground. Luxsynthesis output and Dispatcher coordination both run ahead of baseline across the expanding territory."
 srp_last_decade_t4_human: "Strained Resources"
 srp_last_decade_t4_human_desc: "Supply lines and research programmes are increasingly disrupted. Political institutions struggle to keep pace with the deteriorating situation."

 srp_last_decade_t5_parasite: "Network Ascendant"
 srp_last_decade_t5_parasite_desc: "The network operates at its highest recorded efficiency. Nothing in it is waiting on anything else."
 srp_last_decade_t5_human: "Last Decade: Diminished Capacity"
 srp_last_decade_t5_human_desc: "The world's remaining institutions are buckling under the weight of a war that should have ended years ago. Ministries are triaging which of their statutory duties to stop performing."


 IRS_last_decade_threshold_difficulty_tt: "Only available on the Elite difficulty, The Last Decade."

