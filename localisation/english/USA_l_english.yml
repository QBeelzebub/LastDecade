l_english:

 USA_continental_sovereignty: "Continental Sovereignty"
 USA_continental_sovereignty_desc: "A new decade is upon us. But that doesn't mean we need a new approach."

 USA_summit_skepticism: "Summit Skepticism"
 USA_summit_skepticism_desc: "The European Federation wants a summit. We will go, with our files in order and very little faith that Amsterdam came to negotiate."

 USA_summit_acceptance: "Accept the Summit Track"
 USA_summit_acceptance_desc: "The object in solar orbit is bigger than our quarrel with Europe. For now we treat the summit as real, and take the heat for it at home."

 USA_domestic_stability: "Continuity Directives"
 USA_domestic_stability_desc: "Every federal agency rewrites its continuity plan: who takes over, where they relocate, how they keep talking. For once nobody in Congress asks what it is for."

 USA_cold_war_extension: "Extend the Cold War"
 USA_cold_war_extension_desc: "Nothing said at the summit changes the facts. Europe is still our main competitor, and we will deal with the new crisis without handing Amsterdam a single concession for it."

 USA_fire_protocol_adoption: "Adopt the Fire Protocol"
 USA_fire_protocol_adoption_desc: "The early organisms burn. Every training circular and procurement order is rewritten around fire, and the first field successes go to Congress as proof the problem is containable."

 USA_incendiary_stockpile_program: "Incendiary Stockpile Program"
 USA_incendiary_stockpile_program_desc: "We stockpile incendiary munitions, fuel and the manuals for both, so a local outbreak never has to wait on a supply order."

 USA_continental_incident_reporting: "Continental Incident Reporting"
 USA_continental_incident_reporting_desc: "Reports from Tennessee and other interior zones are consolidated under domestic security review. The incidents are biological, local, and not yet understood as strategic."

 USA_joint_containment_boards: "Joint Containment Boards"
 USA_joint_containment_boards_desc: "The agencies disagree on terms, jurisdiction, and risk. The board exists so the disagreement at least happens in the same room."

 USA_canadian_theater_pre_positioning: "Canadian Theater Pre-Positioning"
 USA_canadian_theater_pre_positioning_desc: "Supplies, airframes, and ready formations move north under defensive language. If the frontier becomes active, the United States will not arrive late."

 USA_northern_logistics_command: "Northern Logistics Command"
 USA_northern_logistics_command_desc: "The northern routes are mapped, staffed, and stocked before anyone admits how likely it is that they will be used."

 USA_canadian_theater_future_tt: "Hardens American planning for the future Canadian theater."
 USA_anomalous_infestation_tt: "Begins tracking interior biological incidents as anomalous local infestations. This does not identify their source."
 USA_canadian_theater_preposition_tt: "Pre-positions American forces for a future Canadian theater conflict."


 USA_victor_harlan_desc: "Rose through a state governorship on a platform of security and order. His response to every emergency in his state was effective. His response to the political opposition was also effective."

 USA_rosa_delgado_desc: "Labor organizer from Chicago who spent twenty years arguing that the system would break under its own weight. She is currently watching it break under its own weight."

 USA_james_thornton_desc: "A retired senator who believes the United States has spent a century fighting other people's wars. He may be right. He is certainly consistent."

 USA_janet_yellen: "Janet Yellen"
 USA_janet_yellen_desc: "Economist who has run the Federal Reserve. Has managed more crises than most economists have modeled, and runs on coffee and institutional memory."

 USA_kamala_harris: "Kamala Harris"
 USA_kamala_harris_desc: "Vice President. Comfortable in front of a camera and in a room where nobody wants her there. Both skills have proven useful."
 USA_boris_johnson: "Boris Johnson"
 USA_boris_johnson_desc: "Britain's best-known sovereigntist, who left the European Federation for Washington the week the parasites arrived. He is advising a government very glad to have a European who agrees with it, and describes the situation as eminently manageable."
 USA_anthony_fauci: "Anthony Fauci"
 USA_anthony_fauci_desc: "Director of the national infectious disease institute for longer than most of Congress has held office. Testifies with the numbers he has, and says plainly which ones he does not have."
 USA_institutional_scientist: "Institutional Scientist"
 USA_institutional_scientist_desc: "Forty years inside the federal health system. He knows which agency to call, and which one will call back."
 USA_alex_jones: "Alex Jones"
 USA_alex_jones_desc: "Talk radio host who called the parasites years before anyone else did, along with a great many other things. Half the country trusts him more than the government. The other half does not."
 USA_frogs_were_right: "Was Right About the Frogs"
 USA_frogs_were_right_desc: "Technically. Public trust in the government swings every month he is on the payroll."

 USA_nancy_pelosi: "Nancy Pelosi"
 USA_nancy_pelosi_desc: "Knows where every vote is, who owes what, and how long they have to decide. The most dangerous person in any building she walks into is usually her."

 USA_pete_buttigieg: "Pete Buttigieg"
 USA_pete_buttigieg_desc: "Secretary of Transportation. Makes complex policy sound reasonable and unreasonable policy sound inevitable. Has not yet decided if this is a talent or a problem."

 USA_marco_rubio: "Marco Rubio"
 USA_marco_rubio_desc: "Has spent his career arguing that America's adversaries abroad are the main threat to American stability. Every new crisis proves his point, to him."

 USA_elon_musk: "Elon Musk"
 USA_elon_musk_desc: "Runs more companies than any one person should. In a crisis, industrial scale matters more than anyone wants to admit, which is the only reason anyone returns his calls."

 USA_bernie_sanders: "Bernie Sanders"
 USA_bernie_sanders_desc: "Has been saying the same things for fifty years. Most of them turned out to be correct. He finds no comfort in this."

 USA_john_bolton: "John Bolton"
 USA_john_bolton_desc: "Believes that most problems have a military solution and the rest have a more aggressive military solution. Has been wrong about some things. Has not updated his priors."

 USA_lloyd_austin: "Lloyd Austin"
 USA_lloyd_austin_desc: "Secretary of Defense. Spent thirty years running operations and now runs budgets. The transition has not softened his view of what it takes to field an army."

 USA_mark_milley: "Mark Milley"
 USA_mark_milley_desc: "Chairman of the Joint Chiefs. Has briefed presidents on things none of them wanted to hear. Believes a military that cannot adapt its doctrine mid-war has already lost."

 USA_cq_brown: "CQ Brown"
 USA_cq_brown_desc: "Air Force Chief of Staff. Came up as a fighter pilot and never lost the pilot's habit of thinking about the terrain under him. His air doctrine accounts for a world where the ground is contested."

 USA_michael_gilday: "Michael Gilday"
 USA_michael_gilday_desc: "Chief of Naval Operations. Wants more hulls, more yards and more crews, in that order, and has the spreadsheets to show Congress why."

 USA_paul_lacamera: "Paul LaCamera"
 USA_paul_lacamera_desc: "Has spent his career in the Pacific, usually in the places where the situation was described as manageable. He specializes in making it so."

 USA_christopher_cavoli: "Christopher Cavoli"
 USA_christopher_cavoli_desc: "Has spent his career studying the Federation's army: its rail timetables, its reserve call-ups, how fast it can cross the Atlantic. His troop rotation schedules are works of logistical art."

 USA_michael_kurilla: "Michael Kurilla"
 USA_michael_kurilla_desc: "Commands the forces that go wherever the map runs out of American bases. Nobody has ever told him a situation was simple, and he would not believe them."

 USA_james_foggo: "James Foggo"
 USA_james_foggo_desc: "Atlantic hand. Spent his career working out what happens when the Federation's navy controls the sea lanes America assumed were its own."

 USA_daryl_caudle: "Daryl Caudle"
 USA_daryl_caudle_desc: "SUBLANT commander. Submarines are the force that shapes a conflict before anyone admits a conflict has started. He has made this argument to every committee that will listen."

 USA_david_allvin: "David Allvin"
 USA_david_allvin_desc: "Air Force Chief of Staff. His doctrine puts air power into ground operations earlier and more completely than any of his predecessors would have. The Army has mostly stopped complaining."

 USA_james_hecker: "James Hecker"
 USA_james_hecker_desc: "Fighter commander. Trains his wings to fly from roads, fields and half-built strips, on the assumption that the runways will be the first thing anyone hits."

 USA_james_mcconville: "James McConville"
 USA_james_mcconville_desc: "Army Chief of Staff. Has spent years arguing that infantry is not obsolete, usually to people buying aircraft."

 USA_austin_scott_miller: "Austin Scott Miller"
 USA_austin_scott_miller_desc: "Ran small wars in bad terrain for longer than anyone expected anyone to. Learned things about armor in broken ground that are not in any manual."

 USA_john_richardson: "John Richardson"
 USA_john_richardson_desc: "Former CNO. Spent his career in submarines, which means he spent it thinking about what the enemy does not know."

 USA_kenneth_wilsbach: "Kenneth Wilsbach"
 USA_kenneth_wilsbach_desc: "PACAF commander. Runs air operations across the largest theater on earth with the fewest forward bases, which makes every airframe a budget decision."

 USA_lockheed_f35_wing_upgrade: "F-35 Low-Observable Wing"

 USA_lockheed_f35_lo_wing: "F-35 Low-Observable Wing"
 USA_lockheed_f35_lo_wing_desc: "Lockheed Martin's signature stealth-optimized wing. The compound-swept low-observable geometry improves survivability and agility at the cost of a heavier, more expensive airframe."

 USA_lockheed_mio: "Lockheed Martin"
 USA_lockheed_mio_desc: "The world's largest defense contractor, Lockheed Martin dominates the stealth fighter and multi-role platform markets. Their F-35 program is the backbone of American air power."
 USA_lockheed_initial: "Advanced Composite Fabrication"
 USA_lockheed_initial_desc: "Shared composite fabrication standards across every Lockheed contract. Reduces baseline production cost and improves reliability."
 USA_lockheed_root: "Skunk Works Program"
 USA_lockheed_root_desc: "Lockheed's advanced projects division consolidates its fighter work under a single contract. Early investment improves research throughput and air-superiority performance while lowering unit cost."
 USA_lockheed_t2a: "Air Superiority Division"
 USA_lockheed_t2a_desc: "Refinements to flight controls and avionics tighten dogfight performance and survivability for fighter airframes."
 USA_lockheed_t2b: "Strike Systems Division"
 USA_lockheed_t2b_desc: "Adapts the multirole platform for the strike role, improving air-to-ground and anti-ship attack."
 USA_lockheed_t3a: "Stealth Integration"
 USA_lockheed_t3a_desc: "Low-observable shaping and sensor fusion sharpen the air-superiority edge, improving both engagement and agility."
 USA_lockheed_t3c: "Airframe Efficiency Program"
 USA_lockheed_t3c_desc: "Production-line refinements cut airframe cost, raise reliability, and accelerate factory efficiency gains."
 USA_lockheed_t3b: "Precision Strike Package"
 USA_lockheed_t3b_desc: "Precision munitions integration and extended reach for deep strike, improving ground attack and range."
 USA_lockheed_t4: "Fifth Generation Integration"
 USA_lockheed_t4_desc: "Unifies stealth, sensor fusion, and strike capability into a single fifth-generation standard with balanced gains across the air mission set."
 USA_lockheed_t4b: "F-35 Full Rate Production"
 USA_lockheed_t4b_desc: "Full-rate F-35 manufacturing raises sustained output and improves range, reliability, and speed across the fleet."

 USA_boeing_mio: "Boeing Defense & Space"
 USA_boeing_mio_desc: "Boeing's defense division fields the full spectrum of large airframes, from tactical strike platforms to long-range patrol aircraft. Nobody else can build large airframes at that rate, and everybody's logistics plan assumes they will."
 USA_boeing_initial: "Modular Airframe Standards"
 USA_boeing_initial_desc: "Common modular standards across Boeing's large airframes. Reduces production cost and improves reliability."
 USA_boeing_root: "Integrated Defense Systems"
 USA_boeing_root_desc: "Boeing's defense division consolidates its large-platform work, improving research throughput and bombing baseline while lowering unit cost."
 USA_boeing_t2a: "Tactical Strike Division"
 USA_boeing_t2a_desc: "Optimizes large airframes for the tactical strike role, improving ground attack and bombing."
 USA_boeing_t2b: "Extended Range Operations"
 USA_boeing_t2b_desc: "Long-endurance airframes for sustained patrol and strike, improving range and reliability."
 USA_boeing_t3a: "Strategic Bombing Doctrine"
 USA_boeing_t3a_desc: "Heavy-payload doctrine maximizes area bombing, with a secondary gain to ground attack."
 USA_boeing_t3b: "Maritime Patrol & Strike"
 USA_boeing_t3b_desc: "Maritime patrol airframes equipped for anti-ship work over long distances, improving naval strike and range."
 USA_boeing_t4: "Integrated Air Power Platform"
 USA_boeing_t4_desc: "Combines strike, range, and maritime capability into a single platform standard, with a higher production efficiency ceiling."

 USA_northrop_mio: "Northrop Grumman"
 USA_northrop_mio_desc: "Northrop Grumman builds America's stealth bombers, and the nuclear deterrent is planned around what they can reach."
 USA_northrop_initial: "Low-Observable Fabrication"
 USA_northrop_initial_desc: "Stealth fabrication methods applied across the bomber line. Improves bombing baseline and reduces production cost."
 USA_northrop_root: "Global Strike Architecture"
 USA_northrop_root_desc: "Northrop's deep-strike program improves research throughput and bombing baseline while lowering airframe cost."
 USA_northrop_t2a: "Stealth Penetration Systems"
 USA_northrop_t2a_desc: "Low-observable systems for survivable deep penetration, improving defense and range."
 USA_northrop_t2b: "Strategic Payload Capacity"
 USA_northrop_t2b_desc: "Heavier ordnance loads and faster transit, improving bombing and top speed."
 USA_northrop_t3a: "B-21 Raider Program"
 USA_northrop_t3a_desc: "Next-generation stealth bomber with intercontinental reach and high survivability, improving range and defense."
 USA_northrop_t3b: "Penetrating Strike Doctrine"
 USA_northrop_t3b_desc: "Doctrine for high-confidence strikes deep in contested airspace, improving bombing and reliability."
 USA_northrop_t4: "Global Strike Command Integration"
 USA_northrop_t4_desc: "Networks the strategic bomber fleet for global reach, with balanced gains and a higher production efficiency ceiling."

 USA_raytheon_mio: "Raytheon Technologies"
 USA_raytheon_mio_desc: "Raytheon Technologies is the premier supplier of air defense systems, guided munitions, and precision anti-armor weapons. The Patriot battery and Javelin missile are their signature products."
 USA_raytheon_initial: "Precision Manufacturing Standards"
 USA_raytheon_initial_desc: "Precision manufacturing standards across the munitions line reduce production cost."
 USA_raytheon_root: "Fire Control Technology"
 USA_raytheon_root_desc: "Raytheon's targeting backbone improves research throughput and reliability while lowering production cost."
 USA_raytheon_t2a: "Air Defense Systems"
 USA_raytheon_t2a_desc: "Ground-based air defense batteries, improving anti-air attack and defensive performance."
 USA_raytheon_t2b: "Precision Guided Munitions"
 USA_raytheon_t2b_desc: "Guided anti-armor munitions, improving armor penetration and hard attack."
 USA_raytheon_t3a: "Patriot Battery Upgrade"
 USA_raytheon_t3a_desc: "Upgraded interceptor batteries for high-altitude defense, improving anti-air attack and reliability."
 USA_raytheon_t3b: "Javelin Program"
 USA_raytheon_t3b_desc: "Fire-and-forget top-attack anti-armor missiles, improving penetration, defense, and breakthrough."
 USA_raytheon_t4: "Integrated Fire Control Network"
 USA_raytheon_t4_desc: "Networks air defense and precision fires under unified control, with balanced gains and a higher production efficiency ceiling."

 USA_general_dynamics_mio: "General Dynamics Land Systems"
 USA_general_dynamics_mio_desc: "General Dynamics Land Systems builds the M1 Abrams and keeps it in production. When the Army fights on tracks, it is mostly fighting in their hulls."
 USA_general_dynamics_initial: "Abrams Production Baseline"
 USA_general_dynamics_initial_desc: "Established Abrams tooling and supply lines reduce armor production cost."
 USA_general_dynamics_root: "Platform Integration Division"
 USA_general_dynamics_root_desc: "Ground platform integration improves research throughput and reliability while lowering production cost."
 USA_general_dynamics_t2a: "Abrams Armor Initiative"
 USA_general_dynamics_t2a_desc: "Heavy frontal protection for main battle tanks, improving armor and defense."
 USA_general_dynamics_t2b: "Powertrain & Mobility"
 USA_general_dynamics_t2b_desc: "Improved drivetrain for mobility and exploitation, raising speed and breakthrough."
 USA_general_dynamics_t3a: "Composite Armor Program"
 USA_general_dynamics_t3a_desc: "Layered composite protection, improving armor, defense, and hardness."
 USA_general_dynamics_t3b: "High-Velocity Gun System"
 USA_general_dynamics_t3b_desc: "High-velocity main gun for anti-armor work, improving hard attack, penetration, and breakthrough."
 USA_general_dynamics_t4: "M1A3 Platform Integration"
 USA_general_dynamics_t4_desc: "Integrates protection, firepower, and mobility into a single MBT standard, with a higher production efficiency ceiling."

 USA_hii_mio: "Huntington Ingalls Industries"
 USA_hii_mio_desc: "Huntington Ingalls is America's largest military shipbuilder, responsible for every nuclear-powered carrier and the majority of its attack submarines. Their Newport News and Ingalls yards are irreplaceable."
 USA_hii_initial: "Modular Naval Construction"
 USA_hii_initial_desc: "Modular shipbuilding techniques improve hull reliability across the yards."
 USA_hii_root: "Naval Architecture Division"
 USA_hii_root_desc: "HII's design backbone improves research throughput, hull reliability, and speed while lowering construction cost."
 USA_hii_t2a: "Carrier Strike Group Development"
 USA_hii_t2a_desc: "Durable, fast surface combatants and carriers, improving hull strength and speed."
 USA_hii_t2b: "Submarine Warfare Program"
 USA_hii_t2b_desc: "Quieter, more reliable attack submarines, lowering surfaced visibility and improving reliability."
 USA_hii_t3a: "Ford-Class Carrier Integration"
 USA_hii_t3a_desc: "Next-generation supercarrier with stronger hulls and integral air defense, improving strength, anti-air, and speed."
 USA_hii_t3b: "Virginia-Class Submarine"
 USA_hii_t3b_desc: "Stealthy attack submarines with heavy torpedo armament, lowering visibility and improving torpedo attack."
 USA_hii_t4: "Naval Supremacy Platform"
 USA_hii_t4_desc: "A fleet-wide standard combining survivability, reliability, and speed, with a higher production efficiency ceiling."



 USA_public_trust: "Public Trust"
 USA_government_distrust_side: "Government Distrust"
 USA_public_confidence_side: "Public Confidence"

 USA_trust_neutral_range: "Strained Normal"
 USA_trust_strain_range: "Growing Skepticism"
 USA_trust_crisis_range: "Crisis of Legitimacy"
 USA_trust_collapse_range: "Government in Freefall"
 USA_trust_stable_range: "Stable Ground"
 USA_trust_confident_range: "Public Confidence"
 USA_trust_national_unity_range: "National Unity"


 USA_trust_strain_idea: "Growing Skepticism"
 USA_trust_strain_idea_desc: "Public confidence in the federal government is slipping. Missteps and mixed messaging have left citizens uncertain about who is in charge."

 USA_trust_crisis_idea: "Crisis of Legitimacy"
 USA_trust_crisis_idea_desc: "A large part of the country no longer trusts federal institutions to handle the crisis. Governors have stopped waiting for Washington's instructions."

 USA_trust_collapse_idea: "Government in Freefall"
 USA_trust_collapse_idea_desc: "Federal authority has effectively collapsed. The government cannot enforce policy, raise armies, or direct resources without open defiance from states and citizens alike."

 USA_trust_stable_idea: "Stable Ground"
 USA_trust_stable_idea_desc: "The public broadly accepts federal leadership, if not enthusiastically. Enough trust remains to keep institutions functional."

 USA_trust_confident_idea: "Public Confidence"
 USA_trust_confident_idea_desc: "Americans are rallying behind federal leadership. Orders from Washington get followed without a court challenge first."

 USA_trust_national_unity_idea: "National Unity"
 USA_trust_national_unity_idea_desc: "The country is behind its government in a way it has not been in living memory. Even cable news has run out of things to argue about."


 USA_public_trust_category: "Public Trust"
 USA_public_trust_category_desc: "Manage the relationship between the federal government and the American public. Trust is earned through competent crisis response and lost through failure, scandal, or mishandling."


 USA_federal_address: "Address the Nation"
 USA_federal_address_desc: "Prime time, all networks, twenty minutes. The office still commands the airwaves even when it commands very little else."

 USA_emergency_relief_appropriation: "Emergency Relief Appropriation"
 USA_emergency_relief_appropriation_desc: "Direct funding to the affected states: housing, food, medical, replacement of what the response destroyed. The money leaves the civilian economy immediately and the public does not notice for a season."

 USA_congressional_oversight: "Submit to Congressional Oversight"
 USA_congressional_oversight_desc: "Open the files. Testify under oath. Let the committee run as long as it wants and answer what it asks. The administration will lose authority it cannot spare and several careers will not survive the transcript, and it is still the fastest way back from a legitimacy crisis that anyone has found."

 USA_manage_the_reporting: "Manage the Reporting"
 USA_manage_the_reporting_desc: "Classify the assessments, brief the friendly outlets, and let the casualty figures come out in pieces small enough to absorb. It buys confidence now against a larger correction later, when the full numbers surface and the gap between them and the briefings is the story. Take it if the next two hundred days matter more than the two hundred after that."


 usa.1.t: "The Federal Government Has Lost All Credibility"
 usa.1.d: "Years of broken promises and visible failure against the parasites have burned through what was left of public trust. Power is already slipping out of Washington's hands, and the military, the private sector and the political fringe are each moving to claim it."

 usa.1.a: "Let Harlan restore order."
 usa.1.b: "The military must take the helm."
 usa.1.c: "We hold. Whatever it costs."


 USA_fossil_fuel_expansion: "Energy Extraction Act"
 USA_fossil_fuel_expansion_desc: "The administration signs the Energy Extraction and Independence Act, opening new federal land to oil and gas development and fast-tracking permits for Gulf of Mexico operations."

 USA_wartime_mobilization: "Wartime Mobilization"
 USA_wartime_mobilization_desc: "The administration puts the economy on a war footing: arms plants run extra shifts and civilian goods take second place. Production soars, and so do prices."

 USA_civilian_resilience: "Civilian Resilience"
 USA_civilian_resilience_desc: "We put the money into everyday industry and civic capacity. The country arms slower, and nobody at home starts hoarding."

 USA_federal_research_grants: "Federal Research Initiative"
 USA_federal_research_grants_desc: "The National Science Foundation and partner agencies receive expanded funding mandates, with particular emphasis on electronics, computing, and applied sciences."

 USA_darpa_programs: "Advanced Weapons Research"
 USA_darpa_programs_desc: "DARPA expands its armor and vehicle programs. Half of them will fail, which is what DARPA is for."

 USA_cyber_dominance: "Cyber Command Expansion"
 USA_cyber_dominance_desc: "The NSA and Cyber Command get more authority and more money, for operations in both directions. Congress is briefed on the budget, not the targets."

 USA_incendiary_doctrine: "Incendiary Systems Investment"
 USA_incendiary_doctrine_desc: "Army research programs into advanced incendiary munitions and delivery systems receive a significant funding boost, driven by early threat assessments from Africa. Most of the relevant reports are still classified."

 USA_deregulation_act: "Deregulation Act"
 USA_deregulation_act_desc: "The administration pushes through a sweeping deregulation package, reducing federal oversight of industry, finance, and energy in the name of economic freedom. It is the largest rollback of business regulation in thirty years."

 USA_populist_economics: "Economic Nationalism"
 USA_populist_economics_desc: "Tariffs, buy-American mandates, and protection for domestic labor. If the populists hold the country, it is exactly what the base wanted. If they do not, Washington reads it as a betrayal of principle."

 USA_market_liberalization: "Market Liberalization"
 USA_market_liberalization_desc: "Open markets, lower taxes, and minimal interference. If the establishment holds the country, it is sound and expected governance. If it does not, it lands as a gift to the donor class."

 USA_economic_freedom_mandate: "Economic Freedom Mandate"
 USA_economic_freedom_mandate_desc: "A run of executive orders makes deregulation standing policy. Undoing it would now take an act of Congress, and Congress is busy."

 USA_defense_budget_expansion: "Defense Budget Expansion"
 USA_defense_budget_expansion_desc: "The Pentagon budget receives its largest single-year increase in decades. Exercises increase in frequency and ambition. Contractors begin building ahead of procurement."







 USA_fissile_energy_program: "Fissile Energy Program"
 USA_fissile_energy_program_desc: "New Mexico and Tennessee host the first purpose-built fissile extraction facilities. Fissile material becomes something the country produces on purpose, and in quantity."


 USA_manufacturing_surge: "Manufacturing Surge"
 USA_manufacturing_surge_desc: "A government-directed production surge drives output across arms manufacturers. The effect is temporary but the infrastructure remains."


 USA_american_century: "The American Century"
 USA_american_century_desc: "The Cold War with the European Federation never ended, and the United States entered the decade as it entered the last: the strongest power on Earth and certain of it. The administration takes stock of an order it assumes will hold."

 USA_atlantic_vigilance: "Atlantic Vigilance"
 USA_atlantic_vigilance_desc: "The Federation sits across the Atlantic as it always has: a rival the United States never defeated and never trusted. The standing watch on Europe is renewed, funded, and taken for granted."

 USA_the_european_question: "The European Question"
 USA_the_european_question_desc: "Washington has never settled what to do about a federated Europe it could not break. We reopen the question, and the generals get to answer first."

 USA_nuclear_superiority: "Nuclear Superiority"
 USA_nuclear_superiority_desc: "Make the strategic arsenal the foundation of the standoff. The United States intends to hold a margin over the Federation that leaves no doubt, and to be seen holding it."

 USA_conventional_overmatch: "Conventional Overmatch"
 USA_conventional_overmatch_desc: "Win the standoff with conventional weight instead of warheads. If the Atlantic rivalry turns hot, the United States means to field the heavier hand."

 USA_containment_posture: "Containment Posture"
 USA_containment_posture_desc: "Settle into a stable containment of the Federation: pressure short of war, maintained for as long as Washington chooses to maintain it."

 USA_atlantic_intelligence: "Atlantic Intelligence"
 USA_atlantic_intelligence_desc: "Stand up the intelligence apparatus aimed across the Atlantic. The Federation keeps its secrets well. We intend to read them anyway, and to stop Amsterdam reading ours."

 USA_strategic_readiness: "Strategic Readiness"
 USA_strategic_readiness_desc: "Raise the readiness of the forces that would fight any Atlantic war. Nobody announces it, and the units notice before the newspapers do."

 USA_cold_war_footing: "Cold War Footing"
 USA_cold_war_footing_desc: "The United States places itself, deliberately, on a long-war footing toward the Federation. Nobody intends to start it and everybody is now prepared to fight it."

 USA_state_of_the_union: "State of the Union"
 USA_state_of_the_union_desc: "The annual accounting before Congress and the country: the economy, the armed forces, the rivalry abroad, and the temper of a public that is more restless than the confident speeches admit."

 USA_the_national_mood: "The National Mood"
 USA_the_national_mood_desc: "Beneath the superpower's confidence the country is arguing with itself about who it is for. The administration can ride that argument or try to settle it."

 USA_populist_surge: "The Populist Surge"
 USA_populist_surge_desc: "Ride the nationalist-populist wave rising through the country. It fills rallies and hardens resolve, and it brings figures like Harlan closer to the center of power than the establishment finds comfortable."

 USA_establishment_consensus: "The Establishment Consensus"
 USA_establishment_consensus_desc: "Hold the line with the governing establishment: the institutions, the lifelong professionals, the consensus that has run the republic through the long Cold War. Steady, credible, and increasingly resented."

 USA_govern_the_union: "Govern the Union"
 USA_govern_the_union_desc: "Whatever the country decided about itself, it must still be governed. The administration takes its mandate and gets on with running a continental republic."

 USA_federal_authority: "Federal Authority"
 USA_federal_authority_desc: "Consolidate the authority of the federal government over a sprawling and contentious union. The reach of Washington grows, as it always does in a country that believes itself at risk."

 USA_domestic_agenda: "The Domestic Agenda"
 USA_domestic_agenda_desc: "Turn the administration's attention to the home front: the economy, the states, and the long list of things a confident superpower assumes it has time to fix."

 USA_pentagon_review: "Pentagon Posture Review"
 USA_pentagon_review_desc: "A full review of the United States military posture. The world's largest defense establishment looks itself over and, predictably, concludes that it needs more."

 USA_defense_appropriations: "Defense Appropriations"
 USA_defense_appropriations_desc: "The appropriations bill moves through Congress with the usual amendments attached. The defense budget grows."

 USA_procurement_debate: "The Procurement Debate"
 USA_procurement_debate_desc: "The Pentagon and its contractors divide over what the next decade of American arms should look like: a smaller force built around a technological edge, or the mass industrial base the country has always fallen back on."

 USA_technological_edge: "Technological Edge"
 USA_technological_edge_desc: "Bet on technology: precision, electronics, and the research establishment that keeps American arms a generation ahead. Fewer systems, each one harder to match."

 USA_arsenal_of_democracy: "Arsenal of Democracy"
 USA_arsenal_of_democracy_desc: "Bet on mass: the industrial base that out-produced every rival the country ever had. If quality will not decide it, quantity will, and America can still make more of almost everything."

 USA_modern_us_military: "A Modern Military"
 USA_modern_us_military_desc: "Whichever way the procurement fight broke, the United States brings its land forces up to a modern standard: current doctrine, current equipment, and the command to use them."

 USA_force_projection_command: "Force Projection Command"
 USA_force_projection_command_desc: "Stand up the command structure for projecting American power wherever Washington decides it is needed, which is, historically, almost everywhere."

 USA_peace_dividend: "The Peace Dividend"
 USA_peace_dividend_desc: "Decades of cold war without a shot fired across the Atlantic have left the United States rich and its industry pointed at consumption. While the long peace holds, the surplus can be spent on the country itself."

 USA_homeland_exercise_program: "Homeland Exercise Program"
 USA_homeland_exercise_program_desc: "A season of large domestic exercises: the National Guard, the reserves, and the agencies that would manage a continental emergency none of the planners actually expect. The drills go well. The reports are filed."

 USA_national_war_college: "The War College Class of 2019"
 USA_national_war_college_desc: "The war colleges turn out the officers who will run the next decade. Their coursework assumes the enemy is the European Federation, and every wargame ends somewhere in Quebec."

 USA_war_plan_north: "War Plan North"
 USA_war_plan_north_desc: "The contingency planning staffs complete a full revision of the war plan for a northern conflict with the Federation: Canadian geography, Atlantic approaches, mobilization tables. The staff are proud of it, and it goes in a safe."

 USA_union_on_the_eve: "The Union on the Eve"
 USA_union_on_the_eve_desc: "However the political argument settled, the republic enters the new decade solvent and governed. The budget for next year assumes the one after it looks the same."










 USA_war_plan_north_spirit: "War Plan North"
 USA_war_plan_north_spirit_desc: "A standing, current war plan for the northern theater: better organization and an edge against Federation forces."


 USA_groundwork_war_plan_tt: "War Plan North guides the deployment: +25 Army Experience, +3% War Support."
 USA_groundwork_union_tt: "The union was consolidated before the crisis: +25 Political Power, +2% Stability."

 usa.50.t: "The National Mood"
 usa.50.d: "The polling tells two stories at once: a public proud of its country's strength and deeply unsure it is being governed for them. The administration reads the same numbers the rivals abroad are reading, and likes them less."
 usa.50.a: "The country is restless."

 usa.51.t: "The Populist Surge"
 usa.51.d: "The rallies are bigger than the establishment wants to admit, and the names rising through them care less every month for the old consensus. The networks have started covering them live."
 usa.51.a: "Let it run."

 usa.52.t: "The Establishment Holds"
 usa.52.d: "The institutions absorb the shock, as they were built to. The professionals keep their desks, the consensus keeps its grip, and the republic carries on much as before. The people who lost the argument are still registered to vote."
 usa.52.a: "Steady as she goes."

 usa.53.t: "Nuclear Close Call"
 usa.53.d: "A flight of bombers misrouted, a radar return misread, an exercise that ran closer to the line than either capital meant it to. The moment passed inside a few hours and was filed away in records the public will never see."
 usa.53.a: "We blinked first, and lived."
 usa.53.b: "They blinked. Let them remember it."

 usa.54.t: "The American Century"
 usa.54.d: "The phrase is older than anyone using it, and Washington says it the way a man says a thing he is no longer quite sure of: loudly. By most measures it still holds, with the largest economy and the longest reach on Earth. The briefings admit that a federation of old European rivals has grown into a peer, and leave it out of the speeches."
 usa.54.a: "The century is still ours."
 usa.55.t: "The Atlantic Vigil"
 usa.55.d: "Washington says out loud what its analysts have written for years: the European Federation is a peer. Analysts move to the Europe desks, and the budget follows them."
 usa.55.a: "Watch the old world."
 usa.56.t: "Overmatch"
 usa.56.d: "The United States chooses to win the standoff the American way: with more of everything. More divisions, more tonnage, more of the industrial weight that carried the country through the last war with Europe. Detroit gets the first contracts."
 usa.56.a: "Out-build them all."
 usa.57.t: "Cold War Footing"
 usa.57.d: "The United States settles into the long confrontation like a country that knows how to do this. Cold war is familiar ground: a known game with known moves, against a rival that can be out-spent and out-waited. The Pentagon pulls its old planning documents and finds most of them still apply."
 usa.57.a: "We know this game."

 usa.58.t: "The Union Governs"
 usa.58.d: "Whichever way the national mood broke, someone now has to run the country. The coalition holds, the appropriations pass, and the cable channels keep score."
 usa.58.a: "Make the system work."
 usa.59.t: "The Union on the Eve"
 usa.59.d: "The domestic settlement is as firm as American politics ever gets, which is to say firm enough and not a day longer. The country is prosperous, armed and sure of itself, and the midterms are about taxes."
 usa.59.a: "We are ready for anything."
 usa.60.t: "The Procurement Debate"
 usa.60.d: "The Pentagon argues, as it always does, between the silicon and the steel: the high-technology edge against the mass industrial arsenal. It is a good argument between two correct answers, and the United States is rich enough to be wrong about it."
 usa.60.a: "Buy the future we expect."
 usa.61.t: "Force Projection"
 usa.61.d: "The reforms add up to the instrument the United States has spent a century perfecting: a military that can put decisive force anywhere on Earth at short notice. Carrier groups, airlift, and a supply tail that reaches every ocean."
 usa.61.a: "Reach anywhere, win anywhere."
 usa.62.t: "The National War College"
 usa.62.d: "The war colleges gather the country's best officers to think about the next war. Every wargame has a European flag on the other side, and every scenario assumes an adversary that can be deterred, negotiated with or defeated. The curriculum is excellent."
 usa.62.a: "Teach the next war."
 usa.63.t: "War Plan North"
 usa.63.d: "The plan is drawn for the war Washington considers most likely: a continental campaign northward, against the Federation's reach into the Americas, fought over the cold ground between the great powers. It is thorough, professional, and updated on schedule."
 usa.63.a: "Plan for the likely war."

 usa.64.t: "Burn It"
 usa.64.d: "Faced with something it does not understand, the United States reaches for the answer it has never once doubted: overwhelming force, applied with fire. The Federation's careful institutionalists would call the fire protocol reckless. The men who wrote it call it decisive, and so far the field reports agree with them."
 usa.64.a: "When in doubt, burn it down."

 usa.61.desc: ""
 usa.62.desc: ""
 usa.63.desc: ""
 usa.64.desc: ""
 USA_invest_in_state_infrastructure: "Invest in State Infrastructure"
 USA_congress_invest_in_state_infrastructure_tt: "An additional level of infrastructure has been constructed."
 USA_congress_invest_in_state_factory_tt: "An additional Civilian Factory has been constructed."
 USA_congress_invest_in_state_arms_factory_tt: "An additional Military Factory has been constructed."
 USA_invest_in_state_factory: "Invest in a State Economy"
 USA_invest_in_state_arms_factory: "Build a New Munitions Plant"
 USA_invest_in_state_dockyard: "Invest in State Shipbuilding"
 USA_congress_invest_in_dockyard_tooltip: "An additional Dockyard has been constructed."
 USA_build_infrastructure_tt: "You will be expected to invest in a state's infrastructure."
 usa.65.t: "A Security Incident"
 usa.65.d: "The crisis is real, and the United States files it under a heading it can manage. Outbreaks become security incidents and containment becomes a law-enforcement matter, split across enough agencies that none of them has to say what it is facing."
 usa.65.a: "Keep it contained, keep it quiet."

 usa.66.t: "No Deal"
 usa.66.d: "The Federation extends a hand across the table and the United States, after a decent interval of pretending to consider it, declines. The reasons are recited well: trust must be earned, the rival's motives are suspect, a superpower does not need permission. Nobody in Washington can picture the country as the junior partner, and nobody tries."
 usa.66.a: "We deal from strength or not at all."
 usa.67.t: "A Wary Handshake"
 usa.67.d: "Against the instincts of half its government, the United States takes the Federation's hand. At home it reads as weakness to everyone who measures strength in defiance. The men who signed it have read the same classified pages the Federation has, and they are not explaining themselves on television."
 usa.67.a: "Just this once, together."

 usa.68.t: "Guns Over Butter"
 usa.68.d: "The United States puts the economy on a war footing and asks the public to feel the difference. Factories that made cars make other things now. The shelves thin in places they have not thinned in living memory. The word sacrifice reappears in speeches after a long absence. The arsenal grows."
 usa.68.a: "The war comes first."
 usa.69.t: "Butter Over Guns"
 usa.69.d: "The United States bets that a country with the lights on and the shelves full fights better in the long run than one bled white for the front. The money goes into the dull civilian capacity that lets a society take a blow and keep working. The generals call it softness, in writing."
 usa.69.a: "A nation worth defending."

 usa.70.t: "The Northern Front"
 usa.70.d: "American forces move quietly into position across the Canadian theater, the long cold border that would be the front line of any war with the Federation. The logistics are laid in, the staffs rehearse, the war that War Plan North imagined begins to acquire roads and depots and timetables. It is competent, deliberate, and aimed with total precision at the wrong enemy."
 usa.70.a: "Hold the northern line."

 usa.71.t: "The Cyber Edge"
 usa.71.d: "The United States bets on the war of the unseen: networks, code, the quiet sabotage of an enemy's nervous system before a shot is fired. It is the most American kind of advantage, decisive results delivered from a chair in Maryland. Against a rival state it is formidable."
 usa.71.a: "Win it in the wires."
 usa.72.t: "Fire Doctrine"
 usa.72.d: "The United States doubles down on what it already trusts: fire, in quantity, delivered with industrial efficiency. The doctrine becomes a whole science of burning. The joke in the briefing rooms is that the most advanced military on Earth has rediscovered the flamethrower and found it to be its best idea in years."
 usa.72.a: "Burn it, and keep burning."

 usa.73.t: "Economic Nationalism"
 usa.73.d: "The administration plants its flag on the factory floor: tariffs, buy-American mandates, and the promise that the country's wealth is made by and for the people who live in it. It is popular where it is meant to be and infuriating where it is meant to be. The plants start coming home."
 usa.73.a: "Build it here, keep it here."
 usa.74.t: "The Open Market"
 usa.74.d: "The administration bets on openness: free trade, light regulation and the old faith that a market left alone grows faster than one fenced in. The efficiency comes from long, lean, global supply chains with no slack anywhere in them. The markets are happy and the growth is real."
 usa.74.a: "Let the market run."

 USA_groundwork_standoff_nuclear_tt: "The nuclear-superiority posture carries into the footing as deterrent confidence: +3% War Support and +50 Command Power."
 USA_groundwork_standoff_conventional_tt: "The conventional-overmatch posture carries into the footing as a readier, harder-drilled force: +25 Army Experience."
 USA_groundwork_procurement_tech_tt: "The technology-edge procurement choice projects as a smarter force: an electronics research bonus."
 USA_groundwork_procurement_mass_tt: "The mass-arsenal procurement choice projects as a deeper force: +20,000 Manpower."

 usa.75.t: "The Peace Dividend"
 usa.75.d: "The long absence of a real war has made the country rich and comfortable and a little soft, and the United States enjoys the dividend without examining it too closely. The economy hums, the malls are full, and the military is a thing that happens to other people in other countries."
 usa.75.a: "Enjoy the good years."

 usa.76.t: "Continental Sovereignty"
 usa.76.d: "Whatever the summit was, it is behind us now. We reaffirm the principle we never set aside: this hemisphere is American, the decisions that shape it are made in Washington, and no transatlantic federation gets a vote in the affairs of the New World."
 usa.76.a: "This hemisphere is ours."

 USA_stand_up_containment_command: "Stand Up the Containment Command"
 USA_stand_up_containment_command_desc: "The Joint Containment Boards have argued their way into a working structure. Give it a mandate, a budget and a chain of command, and make it permanent. The incidents keep happening, and now they have a form to fill in."
 USA_continental_containment_sweep: "Coordinated Containment Sweep"
 USA_continental_containment_sweep_desc: "Task the Containment Command with a full domestic sweep: shared reporting, agreed jurisdiction, quiet cordons where the interior incidents cluster. The standing institution already does this work, so it calms the public for less than a broadcast or a legislative push. Reduces panic by 140."
 USA_northern_perimeter_rotation: "Rotate the Northern Perimeter"
 USA_northern_perimeter_rotation_desc: "Cycle fresh formations through the Northern Logistics Command, exercising the routes that were mapped and stocked before anyone would say out loud why. The units come back knowing the ground. Grants army experience and a period of improved defensive readiness in the northern theater."
 USA_expand_incident_network: "Widen the Incident Network"
 USA_expand_incident_network_desc: "Extend the anomalous-incident reporting network into counties that were not filing before. More eyes means earlier reports, and earlier reports mean the researchers get data while it is still useful. Grants political power and a period of faster research."

 USA_continental_containment_command: "Continental Containment Command"
 USA_continental_containment_command_desc: "A standing federal institution for domestic biological containment. It coordinates the boards, the reporting network, and the response chains that used to be assembled from scratch every time."
 USA_northern_perimeter_ready: "Northern Perimeter Ready"
 USA_northern_perimeter_ready_desc: "Fresh formations have cycled through the northern routes and know the ground. Defensive readiness in the theater is high while the rotation holds."
 USA_field_reporting_data: "Field Reporting Data"
 USA_field_reporting_data_desc: "The widened incident network is feeding structured field data to the research establishment. The work moves faster with real cases to study."
 USA_gate_escalation_rivalry_tt: "The standoff with the European Federation has hardened into open rivalry. EF-US Escalation: [?EFH_USA_escalation|0] / 100, requires 50+"
 USA_armed_forces: "United States Armed Forces"
 USA_armed_forces_desc: "The condition of the standing army: how it trains, how it holds a line, and how quickly it can be brought up to strength."
 USA_armed_forces_tt: "§GUnited States Armed Forces improve§!"
 USA_industrial_might: "American Industrial Might"
 USA_industrial_might_desc: "Factory floor, oil, and the fissile and warhead work running on top of both. The one advantage the United States has never had to argue for."
 USA_industrial_might_tt: "§GAmerican Industrial Might grows§!"
 USA_domestic_order: "Domestic Order"
 USA_domestic_order_desc: "How much government the country will accept, and how much of it there is. Every emergency power taken, every consensus held together, every argument settled by an appeal to the situation."
 USA_domestic_order_tt: "§GDomestic Order shifts§!"
 USA_hemispheric_posture: "Hemispheric Posture"
 USA_hemispheric_posture_desc: "The Monroe line, the Pacific commitments and the running argument in Washington over what the hemisphere is owed and who is allowed to be in it."
 USA_hemispheric_posture_tt: "§GHemispheric Posture hardens§!"
 USA_technical_directorate: "Technical Directorate"
 USA_technical_directorate_desc: "Research programs and the collection apparatus behind them, including a careful record of what it still cannot see."
 USA_technical_directorate_tt: "§GTechnical Directorate improves§!"

 USA_hemispheric_primacy: "Hemispheric Primacy"
 USA_hemispheric_primacy_desc: "The United States enters the decade dominant in the Americas, formidable in the Pacific, and on speaking terms with Europe only when it has to be. Secure the hemisphere, hold the rivalry with the Federation, and let the rest of the world manage its own contamination."
 USA_secure_the_approaches: "Secure the Approaches"
 USA_secure_the_approaches_desc: "Northern border, Caribbean basin, Pacific approaches. The forces that would have deployed against the parasite ecology are positioned against the European Federation instead. Both commitments are described as continental defense."
 USA_pan_american_pressure: "Pan-American Pressure"
 USA_pan_american_pressure_desc: "The South American Confederation is courted and pressured in the same memoranda. Washington would take a hemisphere that defers to it over one that survives well."
 USA_domestic_containment_doctrine: "Anomalous Infestation Protocol"
 USA_domestic_containment_doctrine_desc: "Domestic parasite activity is logged as anomalous local infestation and handled by civil authority. The framing keeps the public calm and the budgets intact."
 USA_federal_quarantine_authority: "Federal Quarantine Authority"
 USA_federal_quarantine_authority_desc: "Where local containment fails, federal quarantine authority steps in. Exclusion zones are drawn, supplied, and not discussed."
 USA_continental_defense_command: "Continental Defense Command"
 USA_continental_defense_command_desc: "The hemispheric and domestic programs are folded into one command. On paper it is the most capable continental defense apparatus on Earth. Most of it faces the Atlantic."

 USA_approaches_secured_tt: "Forces redeploy to the northern and maritime approaches."


 usa.3.t: "The Hemisphere First"
 usa.3.d: "The arrival of the Iris produced six weeks of cooperation with the European Federation and then a return to form. The United States is dominant in the Americas, formidable in the Pacific, and done pretending the Federation is a partner. The hemisphere is the priority. The rest of the world will manage."
 usa.3.a: "The hemisphere is the priority."

 usa.2.t: "Anomalous Contamination Reports"
 usa.2.d: "Soil sampling along several coastlines returns bacterial anomalies that match no catalogued organism. The reports are filed as industrial contamination and routed to the relevant state authorities. The samples are not flagged for federal review."
 usa.2.a: "File them locally."

 USA_doctrine_reckoning: "The Organisms Adapted"
 USA_doctrine_reckoning_desc: "The parasite activity logged through 2021 as anomalous and manageable is neither any more. Across the continental theaters the organisms now counter the tactics that worked last year. The Fire Protocol still helps, and the doctrine is rebuilt around what it cannot do."
 USA_own_the_failure: "Own the Failure"
 USA_own_the_failure_desc: "The administration goes public: the 2021 doctrine was wrong, the early optimism was misplaced, and people died for it. The admission costs confidence in the short term, but it lets the doctrine be rebuilt honestly and stands up a dedicated threat-intelligence office in the open."

 USA_bury_the_findings: "Bury the Findings"
 USA_bury_the_findings_desc: "The failure is managed rather than confronted. Reports are reclassified, the narrative held steady, and the public spared a scandal. Confidence holds for now, but the doctrine is rebuilt on half-truths and never quite catches up."
 USA_root_clearance_doctrine: "Burn the Roots"
 USA_root_clearance_doctrine_desc: "Clearance doctrine is rewritten around the root systems. Incendiary stockpiles built for the Fire Protocol find their real use. Sectors are not declared secure until the ground beneath them is dead."

 USA_root_clearance_doctrine_spirit: "Root Clearance"
 USA_root_clearance_doctrine_spirit_desc: "Sectors are not secure until the ground beneath them is dead."

 usa.4.t: "The Organisms Adapted"
 usa.4.d: "The infestations logged as local incidents through 2021 were weak and predictable. They are neither now. The reports converging on Washington describe organisms that counter fire and fortification alike. Calling it local has stopped working, and the budget was written for local."
 usa.4.a: "Rebuild the doctrine."


 USA_establish_transatlantic_desk: "Stand Up the Transatlantic Desk"
 USA_establish_transatlantic_desk_desc: "A permanent collection section aimed at the European Federation, staffed out of existing budget lines so it does not require a public authorization. Grants standing civilian and army intelligence on the Federation and opens the sweep program."
 USA_transatlantic_desk_protest_tt: "§YThe formal protest already put a file on every relevant desk. The section opens with a head start.§!"

 USA_answer_the_hemispheric_claim: "Answer the Hemispheric Claim"
 USA_answer_the_hemispheric_claim_desc: "Amsterdam has put its own security guarantee over the southern half of the Americas. Washington restates the older one in writing, in the same week, with force posture attached. The public reads it as the government doing its job."
 USA_hemispheric_answer_sovereignty_tt: "§YContinental sovereignty was already reaffirmed, so the language is on file and the drafting takes an afternoon.§!"

 USA_pacific_counterweight: "Pacific Counterweight"
 USA_pacific_counterweight_desc: "The Federation's pact with Tokyo is answered with basing, patrol schedules and a collection effort aimed at Federation naval and air movements. Nothing in it is announced."
 USA_pacific_counterweight_pressure_tt: "§YTokyo has already been leaned on once. The naval staff know what they are asking for this time.§!"

 USA_eastern_corridor_tariffs: "Tariff the Eastern Corridor"
 USA_eastern_corridor_tariffs_desc: "Federation trade running east is taxed at the American end. The measure is defended as protecting domestic production. Consumers pay part of it and are told so in small print."
 USA_eastern_corridor_narrow_tt: "§YChina stayed out of the Federation's orbit, so the corridor is narrow and the measure stays quiet.§!"
 USA_eastern_corridor_wide_tt: "§RChina leaned toward Amsterdam. The corridor is worth closing properly, and the Federation will feel it.§!"

 USA_counterintelligence_sweep: "Run a Counterintelligence Sweep"
 USA_counterintelligence_sweep_desc: "The desk is run against Federation research and procurement programs. Material comes back useful. Sometimes the operation comes back visible."
 USA_counterintel_sweep_risk_tt: "§RRisk of exposure. A blown sweep hardens the standoff and hands Amsterdam a domestic argument.§!"

 USA_hemispheric_answer_idea: "Hemispheric Answer"
 USA_hemispheric_answer_idea_desc: "The Federation's claim on the southern hemisphere was answered in public and in force posture. The defense budget passes committee in a week."
 USA_pacific_counterweight_idea: "Pacific Counterweight"
 USA_pacific_counterweight_idea_desc: "Basing, patrol schedules and a standing collection effort against Federation movements in the Pacific. The picture of what Amsterdam has out there is much better than it was."
 USA_eastern_corridor_tariffs_idea: "Eastern Corridor Tariffs"
 USA_eastern_corridor_tariffs_idea_desc: "Federation trade running east is taxed at the American end. Domestic construction benefits, trading partners take note, and the shelves cost a little more."

 USA_knox_county_response: "The Knox County Problem"
 USA_knox_county_response_desc: "Knox County is no longer deniable. Something is building in eastern Kentucky that answers to no one in Washington, holds ground it was never ceded, and grows toward the states around it. It has only ever moved in one direction, and that direction is inward. There will be no recognition and no negotiation. The question is how the ground gets taken back."
 USA_knox_owned_record_tt: "Because the doctrine failures were owned publicly, the government meets Knox with credibility intact."
 USA_knox_buried_record_tt: "Because the doctrine failures were buried, Knox proves the coverup wrong in public. The government pays for it."
 USA_appalachian_cordon: "The Appalachian Cordon"
 USA_appalachian_cordon_desc: "Ring the county. Roads, ridgelines, and river crossings, held by rotating formations dug in for a long stay. The cordon pins the ground in place and buys the time the clearance operations need. Knox is patient and well sited, so the cordon is built to outlast it."
 USA_knox_backchannel: "A Quiet Word (Non-Canon)"
 USA_knox_backchannel_desc: "Someone in Knox County has been trying to talk. An alternate line where Washington takes the call instead of the county, and Knox enters the Western Alliance rather than being burned out of it. It contradicts the historical record. Choose it only to explore the road not taken."
 USA_incendiary_clearance_push: "Incendiary Clearance"
 USA_incendiary_clearance_push_desc: "Fire still works where nothing else does, and the clearance teams are told to use it without restraint inside the cordon. It is slow, it is expensive in materiel, and it does not always hold. But every acre burned is an acre Knox has to grow back before it can grow forward."
 USA_burn_knox_county: "Burn Knox County"
 USA_burn_knox_county_desc: "The cordon holds and the clearance teams have proven the ground can be taken. Now take all of it. This is a declared war of eradication against the Knox County hive, and the planners know what the planners always know: Knox is dug in, sited to be held, and favored on every defensive metric that matters. The order goes out anyway. There is no version of this where Knox is left standing."

 USA_incendiary_clearance_spirit: "Incendiary Clearance Doctrine"
 USA_incendiary_clearance_spirit_desc: "Fire used without restraint inside the cordon. A harder edge against Knox organisms."
 USA_knox_offensive_doctrine: "War of Eradication"
 USA_knox_offensive_doctrine_desc: "A declared campaign to burn the Knox County hive out of existence. Strong bonuses against Knox, which will still not come easily."

 USA_knox_clearance_category: "Knox County Clearance"
 USA_knox_clearance_category_desc: "State-targeted operations against Knox-controlled ground."
 USA_knox_containment_strike: "Containment Strike: [FROM.GetName] ([FROM.GetBeckonStageLabel])"
 USA_knox_containment_strike_desc: "§YInfestation in [FROM.GetName]:§! [FROM.GetBeckonStageLabel], [?FROM.iris_infestation_level|0] / 100\n\nBurn back the infestation on a Knox-controlled state. Takes the target down by 8."
 USA_knox_incendiary_raid: "Incendiary Raid: [FROM.GetName] ([FROM.GetBeckonStageLabel])"
 USA_knox_incendiary_raid_desc: "§YInfestation in [FROM.GetName]:§! [FROM.GetBeckonStageLabel], [?FROM.iris_infestation_level|0] / 100\n\nA heavier clearance raid, available once the cordon is established. Takes the target down by 16 and damages a Beckon cluster."

 usa.77.t: "Eastern Kentucky"
 usa.77.d: "The reports stop being anomalies and start being a map. Knox County and the ground around it no longer answer to the state government, the National Guard units sent in do not report back, and the perimeter is expanding on a schedule. Whatever is running it is deliberate and unhurried. Washington stops calling it a containment incident. It is a hostile power on American soil, and it started here to grow outward."
 usa.77.a: "Draw the line at the cordon."
 usa.78.t: "The Call (Non-Canon)"
 usa.78.d: "In the record, this call was never taken. Here it is. Someone speaks for Knox County, asks for a specific person, and offers terms instead of expansion. It is not what happened, and everyone in the room knows it. But the Western Alliance has an empty chair, and for once the thing across the table is willing to sit in it."
 usa.78.a: "Take the call."
 usa.79.t: "Ridgelines and River Crossings"
 usa.79.d: "The cordon goes up. Roads blocked, crossings held, formations dug into the ridgelines for a stay measured in seasons. It does not push inward, not yet. It holds the shape of the problem in place so the clearance teams can work, and it waits out an enemy that was built to wait."
 usa.79.a: "Hold the ring."
 usa.80.t: "Inside the Wire"
 usa.80.d: "The clearance teams move in under the cordon. Fire leads, because fire is the only thing that reliably works, and restraint is not in the orders. Progress is measured in acres and paid for in materiel. Knox grows it back slower than it is burned, which is the entire theory of the operation, and the theory holds as long as the fire does."
 usa.80.a: "Keep burning."
 usa.81.t: "No Version Where It Stands"
 usa.81.d: "The cordon held. The clearance held. The planners deliver the assessment they have delivered since the first briefing: Knox County is dug in, sited to be defended, and favored on every metric that decides a ground campaign. It will cost more than it should and it may not be enough. The order is signed anyway. Whatever else this decade becomes, it does not include a standing Knox County hive."
 usa.81.a: "Give the order."


 USA_fire_protocol_bonus: "Fire Protocol Adoption"
 USA_incendiary_stockpile_bonus: "Incendiary Stockpile Program"

 USA_fire_protocol_confidence: "Fire Protocol Confidence"
 USA_fire_protocol_confidence_desc: "Initial field reports show that fire works against early organisms. Every unit that has used it wants more of it."


 USA_great_power_doctrine: "Great Power Doctrine"
 USA_great_power_doctrine_desc: "The United States reaffirms itself as the world's leading power. The Federation's growing ambitions will not go unanswered."

 USA_monroe_doctrine_reassertion: "Monroe Doctrine Reassertion"
 USA_monroe_doctrine_reassertion_desc: "The Federation has moved into the Western Hemisphere. The United States formally reasserts the Monroe Doctrine: the Americas are not a stage for European power games."

 USA_expel_EFH_influence: "Expel European Influence"
 USA_expel_EFH_influence_desc: "American economic pressure targets Federation markets. Trade barriers go up across the Western Hemisphere. Federation contracts in South America are declared unwelcome."

 USA_western_hemisphere_bloc: "Western Hemisphere Bloc"
 USA_western_hemisphere_bloc_desc: "The United States formalizes its hemispheric alliance. If the Federation will not back down from the Americas, America will not back down either."

 USA_pacific_containment: "Pacific Containment"
 USA_pacific_containment_desc: "The United States reinforces its Pacific security guarantees. Japan and the broader Pacific rim are placed firmly within the American umbrella."

 USA_beijing_confrontation: "Beijing Confrontation"
 USA_beijing_confrontation_desc: "Washington signals to Beijing that its relationship with the Federation will have consequences, and tightens trade restrictions to prove it."

 USA_pacific_war_authorization: "Pacific War Authorization"
 USA_pacific_war_authorization_desc: "With the Federation entrenched in Japan and the Pacific containment line drawn, the United States authorizes military action if necessary."





 USA_efh_market_exclusion: "American Market Exclusion"
 USA_efh_market_exclusion_desc: "The United States has shut American markets to the European Federation."




 USA_pacific_containment_tt: "The United States secures the Pacific rim against Federation expansion."
