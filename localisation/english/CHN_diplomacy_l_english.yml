l_english:
 chn_diplomacy.1.t: "China Requests a Partnership"
 chn_diplomacy.1.d: "Beijing proposes a strategic partnership with the European Federation. A Federation guarantee would cover Chinese independence; supply contracts require separate negotiations. Faction membership remains a separate matter. The agreement requires federal approval."
 chn_diplomacy.1.a: "Approve the agreement."
 chn_diplomacy.1.b: "Keep the existing arrangements."
 chn_diplomacy.2.t: "China Requests American Backing"
 chn_diplomacy.2.d: "China has requested a strategic partnership with the United States. American backing would include a guarantee of Chinese independence, without requiring China to join our faction. We must decide whether to take on that commitment."
 chn_diplomacy.2.a: "We will back China."
 chn_diplomacy.2.b: "Keep our commitments unchanged."
 chn_diplomacy.3.t: "China Requests Fusion Licensing"
 chn_diplomacy.3.d: "China has requested a licence for the European Federation's fusion reactor technology. Approval would permit Chinese construction using the Federation's existing design. The export requires federal authorisation."
 chn_diplomacy.3.a: "Authorise the licence."
 chn_diplomacy.3.b: "Withhold the design."
 chn_diplomacy.4.t: "Chinese Supply Contracts"
 chn_diplomacy.4.d: "Beijing has submitted supply contracts backed by expanded Chinese extraction capacity. The European Federation can accept regular deliveries under the proposed terms. Any joint action over Panama requires a separate decision."
 chn_diplomacy.4.a: "Approve the trade terms."
 chn_diplomacy.4.b: "Retain the present arrangements."
 chn_diplomacy.5.t: "Partnership Talks Conclude"
 chn_diplomacy.5.efh: "The European Federation has accepted a strategic partnership with China. The agreement guarantees Chinese independence. Supply contracts require separate negotiations. China's faction membership is unchanged."
 chn_diplomacy.5.usa: "The United States has accepted a strategic partnership with China and issued a guarantee of Chinese independence. China's faction membership is unchanged."
 chn_diplomacy.5.no: "China's request has not produced a strategic agreement. Beijing can approach the other power or renew negotiations after the waiting period. Only an accepted partnership commits China to a partner."
 chn_diplomacy.5.a: "Record the answer."
 chn_diplomacy.6.t: "Fusion Licensing Answer"
 chn_diplomacy.6.yes: "The European Federation has authorised China's use of its fusion reactor design. Construction can proceed under the licence."
 chn_diplomacy.6.no: "The fusion licence has not been issued. Part of the negotiating allocation has been returned, and China can submit another request while the partnership remains in force."
 chn_diplomacy.6.a: "File the licensing decision."
 chn_diplomacy.7.t: "A Federation Partnership Offer"
 chn_diplomacy.7.d: "The European Federation has proposed a strategic partnership with China. The agreement guarantees Chinese independence. Supply contracts require separate negotiations. Joining a faction or pursuing action over Panama requires a separate Chinese decision. Beijing must approve the partnership."
 chn_diplomacy.7.a: "Sign the partnership."
 chn_diplomacy.7.b: "Keep China uncommitted."
 chn_diplomacy.8.t: "The Federation Goes to War with the Iris"
 chn_diplomacy.8.d: "The European Federation is at war with the Iris. Beijing can enter the same war now, alongside the Federation, or keep its forces home and meet the hive when it arrives on its own."
 chn_diplomacy.8.a: "China enters the war."
 chn_diplomacy.8.b: "Not yet."
 CHN_diplomacy_efh_request_tt: "Requests a European partnership and guarantee of Chinese independence. Only acceptance commits China to this partner; another power cannot be approached while a partnership offer is pending."
 CHN_diplomacy_usa_request_tt: "Requests an American partnership and guarantee of Chinese independence. Only acceptance commits China to this partner; another power cannot be approached while a partnership offer is pending."
 CHN_diplomacy_fusion_request_tt: "The European Federation will be asked to license its fusion reactor design. Refusal returns 25 political power; another request remains possible."
