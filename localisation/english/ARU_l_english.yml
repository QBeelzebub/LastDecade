l_english:
 ARU: "Arab Union"
 ARU_DEF: "The Arab Union"
 ARU_ADJ: "Arab"
 ARU_democratic: "Arab Union"
 ARU_democratic_DEF: "The Arab Union"
 ARU_democratic_ADJ: "Arab"
 ARU_neutrality: "Arab Union"
 ARU_neutrality_DEF: "The Arab Union"
 ARU_neutrality_ADJ: "Arab"
 ARU_communism: "Arab People's Union"
 ARU_communism_DEF: "The Arab People's Union"
 ARU_communism_ADJ: "Arab"
 ARU_fascism: "Arab State"
 ARU_fascism_DEF: "The Arab State"
 ARU_fascism_ADJ: "Arab"
 ARU_LAST_DECADE_DESC: "Nine member seats from Jerusalem to Muscat, one secretariat in Baghdad, and an army that has never fought as one. The Union sells its oil to China and buys its wheat back from it. The Federation keeps the canal and the Gulf stations."
 ARU_Leader_DESC: "Secretary-General of the Arab Union, chosen by the nine seats for a four-year term. His decisions need six of them."

 ARU_layla_nuaimi_token: "Layla Al-Nuaimi"
 ARU_layla_nuaimi_token_desc: "Runs the Union's oil accounts. Knows to the barrel what China takes each month."

 ARU_nine_seats: "Nine Seats"
 ARU_nine_seats_desc: "Every member seat has a veto on its own ground and a vote on everyone else's. Most of the secretariat's work is getting six of them to agree."
 ARU_the_compact: "The Compact"
 ARU_the_compact_desc: "The seats agree to a common budget and a common army list. They still argue about both."
 ARU_oil_for_wheat: "Oil for Wheat"
 ARU_oil_for_wheat_desc: "The Union ships crude to Chinese refineries and takes grain, steel and electronics in return. The contract runs for ten years and is reviewed every one."
 ARU_the_red_sea_watch: "The Red Sea Watch"
 ARU_the_red_sea_watch_desc: "Garrisons on the Hejaz and Yemen coasts, facing the African shore."

 ARU_contract_round: "Contract Review"
 ARU_contract_round_desc: "This year's review of the oil contract went through without a walkout. The secretariat has more to spend for six months."

 ARU_affairs: "Union Affairs"
 ARU_affairs_desc: "The oil contract with China and the business of keeping nine seats in one room."
 ARU_review_the_contract: "Review the Contract"
 ARU_review_the_contract_desc: "The annual review of the oil-for-wheat contract with Beijing. Prices, volumes and who pays for the tankers."
 ARU_call_the_nine_seats: "Call the Nine Seats"
 ARU_call_the_nine_seats_desc: "An extraordinary session in Baghdad. Every seat sends its delegation, and most of them stay to the end."

 ARU_the_baghdad_secretariat: "The Baghdad Secretariat"
 ARU_the_baghdad_secretariat_desc: "The secretariat moves into its new building on the Tigris. It has more staff than the old one and the same number of votes."
 ARU_the_compact_holds: "The Compact Holds"
 ARU_the_compact_holds_desc: "Six seats sign the common budget, then the other three, after concessions on water rights."
 ARU_the_kurdish_seat: "The Kurdish Seat"
 ARU_the_kurdish_seat_desc: "The northern seat gets its own police, its own schools and a guaranteed share of the Mosul oil revenue. Its delegates stop walking out of sessions."
 ARU_the_oil_compact: "The Oil Compact"
 ARU_the_oil_compact_desc: "The fields at Mosul, Basrah and Dammam come under one extraction authority, which can now borrow against all three."
 ARU_the_gulf_terminals: "The Gulf Terminals"
 ARU_the_gulf_terminals_desc: "New refinery capacity at Basrah and a light industrial zone outside Baghdad. Most of the machinery is Chinese."
 ARU_sign_oil_for_wheat: "Oil for Wheat"
 ARU_sign_oil_for_wheat_desc: "Beijing signs the ten-year contract. It needs our oil more than we need its wheat, and both delegations know it."
 ARU_the_baghdad_garrison: "The Baghdad Garrison"
 ARU_the_baghdad_garrison_desc: "The Union's first common division is based in the capital, where every seat can see it."
 ARU_watch_the_red_sea: "The Red Sea Watch"
 ARU_watch_the_red_sea_desc: "The Federation's reports from Africa get worse every month. The coasts of the Hejaz and Yemen face that shore."
 ARU_the_air_umbrella: "The Air Umbrella"
 ARU_the_air_umbrella_desc: "Two airfields, at Damascus and Baghdad, enlarged to take the whole air arm."
 ARU_the_canal_docket: "The Canal Docket"
 ARU_the_canal_docket_desc: "A standing liaison office with the Federation's canal station in Cairo. It shares weather, shipping and anything else from across the water."

 aru.1.t: "War at the Canal"
 aru.1.d: "The parasites have crossed out of Africa at Suez and declared war on the Union. Federation units are fighting on the Sinai. The secretariat is in emergency session and every seat has sent its defence minister to Baghdad."
 aru.1.d_east: "The parasites have declared war on the Union. They are already at war with China, and the road east runs through Union ground. The secretariat is in emergency session and every seat has sent its defence minister to Baghdad."
 aru.1.a: "Hold the coasts and ask Beijing for rifles."
 aru.1.b: "We fight with what we have."
 aru.2.t: "Baghdad Asks for Rifles"
 aru.2.d: "The Arab Union is at war with the parasites and has asked for small arms and field equipment. The Union supplies a large share of our oil. If the hive takes Arabia, the next border it reaches is Persia."
 aru.2.a: "Send them."
 aru.2.b: "Not yet."
