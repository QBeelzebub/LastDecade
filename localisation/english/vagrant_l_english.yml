l_english:
 vagrant_1_desc: "The first Vagrant ever recorded. A measured, enduring warform that holds ground through sheer mass rather than speed. Whatever held it is gone."
 vagrant_2_desc: "A Vagrant built for forward momentum. It arrives at a position and keeps going."
 vagrant_3_desc: "The most resilient of the four. It anchors wherever it stands, and no attempt to remove one has finished inside its own timetable."
 vagrant_4_desc: "The Iris's own, and the most alien of the four. What it does when it is not fighting has never been established."

 host_parasite: "Host"
 host_parasite_desc: "A sub-surface organism that erupts to summon others and spray acid across armored positions."
 herd_parasite: "Herd"
 herd_parasite_desc: "An evolved Host, larger and more saturating. Its emergence draws more organisms from the ground with it."
 hollower: "Hollower"
 hollower_desc: "A Tromos siege organism built to dismantle hardened positions from the outside in."
 scourer: "Scourer"
 scourer_desc: "A fast Tromos assault breed designed for rapid terrain clearance and exploitation."
 arbiter: "Arbiter"
 arbiter_desc: "A precision organism engineered by VAGRANT-01, effective against both human formations and Iris parasite units."
 culler: "Culler"
 culler_desc: "An elimination-focused organism designed for targeted removal. Stays in contact until the target stops."
 magistrate: "Magistrate"
 magistrate_desc: "VAGRANT-01's capstone organism. A phase-adaptive strike organ reconfigures between human-lethal and Iris-disruptive biochemistry depending on what it engages, backed by a dense adaptive membrane drawn from the Culler lineage. Built to have no bad matchup, rather than specialising the way Arbiter and Culler do."

 vagrant_manifestation: "Vagrant Manifestation"
 vagrant_manifestation_desc: "The Iris turns its attention inward and something long dormant begins to move. A Vagrant was already in the ground before the Iris called for it."
 efh_vagrant_accord: "Vagrant Accord"
 efh_vagrant_accord_desc: "Two of the four known Vagrants have chosen to cooperate with the European Federation. Nobody in the research division is entirely comfortable with that word, chosen."

 vagrant_1_nest_builder: "Nest Architect"
 vagrant_1_nest_builder_desc: "Builds infrastructure and defends it. Plans ten steps ahead and commits to none of them until the ground is ready. A contractor with aligned interests, not an ally."

 vagrant_2_combat_liaison: "Combat Liaison"
 vagrant_2_combat_liaison_desc: "Functions as a direct interface between H&A command and the parasite front line. Its presence accelerates fieldwork and complicates every political meeting it attends."

 vagrant_3_hyperbiology_researcher: "Hyperbiology Collaborator"
 vagrant_3_hyperbiology_researcher_desc: "Sits in on H&A Hyperbiology sessions and corrects the researchers. Politely. The paperwork around its clearance level does not resolve cleanly."

 vagrant_4_iris_coordinator: "Network Conductor"
 vagrant_4_iris_coordinator_desc: "Coordinates parasite operations at a scale no Dispatcher can match. It adjusts the signal, and things happen."

 EFH_VAGRANT_2_NAME: "The Second"
 EFH_VAGRANT_3_NAME: "The Third"
 IRS_VAGRANT_4_NAME: "The Fourth"

 EFH_vagrant_2_advisor: "The Second"
 EFH_vagrant_2_advisor_desc: "A parasite aligned with the Federation. Operates as a liaison between H&A's Hyperbiology division and the military command structure. Its presence alone shifts how the Federation approaches the war."
 EFH_vagrant_2_b_advisor: "The Second"
 EFH_vagrant_2_b_advisor_desc: "A parasite aligned with the Federation. Operates as a liaison between H&A's Hyperbiology division and the military command structure. Its presence alone shifts how the Federation approaches the war."

 EFH_vagrant_3_advisor: "The Third"
 EFH_vagrant_3_advisor_desc: "A parasite aligned with the Federation. Works closely with H&A researchers on the Hyperbiology programme. Its insight into parasite cognition has no parallel."
 EFH_vagrant_3_b_advisor: "The Third"
 EFH_vagrant_3_b_advisor_desc: "A parasite aligned with the Federation. Works closely with H&A researchers on the Hyperbiology programme. Its insight into parasite cognition has no parallel."

 IRS_vagrant_4_advisor: "The Fourth"
 IRS_vagrant_4_advisor_desc: "Aligned with the Iris since emergence. Coordinates parasite activity across theatres at a scale no human command structure is built to track."
 IRS_vagrant_4_b_advisor: "The Fourth"
 IRS_vagrant_4_b_advisor_desc: "Aligned with the Iris since emergence. Coordinates parasite activity across theatres at a scale no human command structure is built to track."

 KNX_vagrant_one_advisor: "The First"
 KNX_vagrant_one_advisor_desc: "The oldest known vagrant. Builds a civilisation project from Knox County's remains. Transactional with outside powers, but loyal to nothing except its own design."
 KNX_vagrant_one_b_advisor: "The First"
 KNX_vagrant_one_b_advisor_desc: "The oldest known vagrant. Builds a civilisation project from Knox County's remains. Transactional with outside powers, but loyal to nothing except its own design."

 vagrant_1_core: "First Vagrant Core"
 vagrant_1_core_1: "First Vagrant Core"
 vagrant_2_core: "Second Vagrant Core"
 vagrant_2_core_1: "Second Vagrant Core"
