 vagrant_deployment_decisions: "Vagrant Deployment"
 vagrant_deployment_decisions_desc: "Assign each active vagrant to advisory work or field deployment. A vagrant cannot serve in both roles at once."

 KNX_deploy_vagrant_1_field: "Deploy the First as a Battalion"
 KNX_deploy_vagrant_1_field_desc: "Withdraw VAGRANT-01 from advisory duty and make its unique core available for a field battalion."
 KNX_assign_vagrant_1_advisory: "Assign the First to Advisory Duty"
 KNX_assign_vagrant_1_advisory_desc: "Return VAGRANT-01 to advisory work. Requires the First Vagrant Core to be back in stockpile. Disband any deployed or training battalion first."

 EFH_deploy_vagrant_2_field: "Deploy the Second as a Battalion"
 EFH_deploy_vagrant_2_field_desc: "Withdraw the Second from H&A advisory duty and make its unique core available for a field battalion."
 EFH_assign_vagrant_2_advisory: "Assign the Second to Advisory Duty"
 EFH_assign_vagrant_2_advisory_desc: "Return the Second to H&A advisory work. Requires the Second Vagrant Core to be back in stockpile. Disband any deployed or training battalion first."

 EFH_deploy_vagrant_3_field: "Deploy the Third as a Battalion"
 EFH_deploy_vagrant_3_field_desc: "Withdraw the Third from H&A advisory duty and make its unique core available for a field battalion."
 EFH_assign_vagrant_3_advisory: "Assign the Third to Advisory Duty"
 EFH_assign_vagrant_3_advisory_desc: "Return the Third to H&A advisory work. Requires the Third Vagrant Core to be back in stockpile. Disband any deployed or training battalion first."

 IRS_deploy_vagrant_4_field: "Deploy the Fourth as a Battalion"
 IRS_deploy_vagrant_4_field_desc: "Withdraw the Fourth from strategic advisory duty and make its unique core available for a field battalion."
 IRS_assign_vagrant_4_advisory: "Assign the Fourth to Advisory Duty"
 IRS_assign_vagrant_4_advisory_desc: "Return the Fourth to strategic advisory work. Requires the Fourth Vagrant Core to be back in stockpile. Disband any deployed or training battalion first."

 IRS_vagrant_4_surge_command: "Surge Command"
 IRS_vagrant_4_surge_command_desc: "Direct the Fourth to issue a full-spectrum coordination signal, synchronising every active swarm across all fronts simultaneously. The effect is brief. Nothing on the front acts independently while it runs. Requires the Fourth to be deployed in the field."

 IRS_vagrant_4_surge_idea: "Surge Command"
 IRS_vagrant_4_surge_idea_desc: "The Fourth is conducting direct swarm coordination across every active front."

 vagrant.1.t: "H&A Makes Contact"
 vagrant.1.d: "H&A field teams have located two parasite individuals near the research perimeter. They are watching. When approached by a Hyperbiology team, they responded with coherent signals. They are intelligent. They are aligned with us."
 vagrant.1.a: "Establish formal contact."

 vagrant.2.t: "The Second Has Returned"
 vagrant.2.d: "The signal went dark for sixty days. Then it came back. The Second has reformed through its Beckon. It reports no memory of the interval. It is ready to continue."
 vagrant.2.a: "Welcome it back."

 vagrant.3.t: "The Third Has Returned"
 vagrant.3.d: "The signal went dark for sixty days. Then it came back. The Third has reformed through its Beckon. It reports no memory of the interval. It is ready to continue."
 vagrant.3.a: "Welcome it back."

 vagrant.4.t: "The Second Has Returned"
 vagrant.4.d: "Both were gone at the same time. For four months there was nothing. The Second has reformed first. It scanned for the Third immediately on emergence. We do not know what that means to a parasite. We know what it means to us."
 vagrant.4.a: "Welcome it back."

 vagrant.5.t: "The Third Has Returned"
 vagrant.5.d: "Both were gone at the same time. For four months there was nothing. The Third has reformed. The Second was already back. Their reunion lasted three seconds in sensor range and then they moved to separate quadrants."
 vagrant.5.a: "Welcome it back."

 vagrant.6.t: "The Fourth Has Returned"
 vagrant.6.d: "A Beckon in [Root.GetCapitalStateName] has gone quiet and then active again. The Fourth has come back. It took thirty days. There are hundreds of Beckons it could have chosen. It chose that one."
 vagrant.6.a: "Continue operations."

 vagrant.7.t: "The First Has Returned"
 vagrant.7.d: "For six weeks the settlement ran on contingency command. Then the signal returned from the soil beneath the eastern grid. The First is back. It did not explain where it was. It resumed its schedules as if nothing had happened."
 vagrant.7.a: "Carry on."

 vagrant.8.t: "The Fourth Has Emerged"
 vagrant.8.d: "A new signal has appeared in the Beckon network. It does not match any known Dispatcher pattern. It moves through the relay structure with intent. It responds to Iris-directed commands but it is making its own. The Iris recognises it. The Fourth has emerged."
 vagrant.8.a: "Accept its alignment."

 vagrant.11.t: "H&A Makes Contact"
 vagrant.11.d: "H&A field teams have located two parasite individuals near the research perimeter. They are watching. When approached by a Hyperbiology team, they responded with coherent signals. They are intelligent. They are aligned with us."
 vagrant.11.a: "Establish formal contact."

 vagrant.9.t: "Signal Lost"
 vagrant.9.d: "The vagrant's division has been annihilated in the field. Its core signal has gone dark. It will reform in time, but for now it is gone. The division cannot be reconstructed until it returns."
 vagrant.9.a: "Understood."

 vagrant.99.a: "."
 vagrant.98.a: "."
