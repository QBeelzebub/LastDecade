l_english:
 CHN_business_as_usual: "Business as Usual"
 CHN_business_as_usual_desc: "Our great nation continues to prosper with what we have. We must uphold this status quo."
 CHN_power_seeking: "A China for the ages"
 CHN_power_seeking_desc: "We've fallen behind on the world stage, with Europe and America vying for dominance, why shouldn't we assert our influence in Asia?"
 CHN_Moore_Threads_investment: "Moore Threads Investment"
 CHN_Moore_Threads_investment_desc: "Semiconductors look to be more in demand day by day, we should capitalize on this."

 CHN_aggressive_JAP: "Posturing"
 CHN_align_EFH: "Partners"
 CHN_align_USA: "Friends"
 CHN_unalign_EFH: "Friends with the United States"
 CHN_unalign_USA: "Friends with the Federation"
 CHN_usa_partnership: "American Partnership"
 CHN_usa_partnership_desc: "American backing gives Chinese procurement offices access to a hyperpower's industrial support. Beijing keeps responsibility for its own forces."
 CHN_continuity_policy: "Continuity in Beijing"
 CHN_continuity_policy_desc: "Party authority rests on maintaining the prosperity already promised to China's population. Ministries keep their existing mandates."
 CHN_assertive_policy: "An Assertive China"
 CHN_assertive_policy_desc: "Beijing is prepared to spend political capital on a larger international role. The government accepts the domestic cost of a more forceful foreign policy."
 CHN_semiconductor_industry_1: "Chinese Foundries I"
 CHN_semiconductor_industry_1_desc: "Foundry investment gives Chinese electronics firms a steadier supply of domestic components. Initial contracts cover existing designs."
 CHN_semiconductor_industry_2: "Chinese Foundries II"
 CHN_semiconductor_industry_2_desc: "Packaging plants and wafer suppliers now work to common production schedules. Fewer completed chips wait for the next stage of assembly."
 CHN_semiconductor_industry_3: "Chinese Foundries III"
 CHN_semiconductor_industry_3_desc: "China can compete for the largest semiconductor orders with domestic production and research capacity. Keeping that position requires uninterrupted power and replacement equipment."
 CHN_army_supply_1: "Army Supply Standards I"
 CHN_army_supply_1_desc: "Chinese army depots use common requisition forms and maintenance schedules. Units carry fewer incompatible spares."
 CHN_army_supply_2: "Army Supply Standards II"
 CHN_army_supply_2_desc: "Field workshops are linked to the army's inland depots. Replacements can be routed around interrupted coastal deliveries."
 CHN_compute_export_capacity: "Reserved Export Capacity"
 CHN_compute_export_capacity_desc: "Chinese plants and computing facilities have reserved capacity for a foreign customer. Export receipts support the state while domestic production and research receive a smaller share."
 CHN_compute_export_customer: "Chinese Compute Deliveries"
 CHN_compute_export_customer_desc: "Contracted Chinese components and computing capacity support domestic research and production. The current allocation lasts 180 days."
 CHN_align_EFH_desc: "Beijing will ask the European Federation to accept a formal partnership. Acceptance commits China to the European partner; refusal leaves an American approach or renewed negotiations available. Only one partnership request can be pending."
 CHN_align_USA_desc: "Beijing will ask the United States to accept a formal partnership. Acceptance commits China to the American partner; refusal leaves a European approach or renewed negotiations available. Only one partnership request can be pending."
 CHN_export_mentality: "Export Mentality"
 CHN_export_mentality_desc: "China's new extraction capacity gives its trade offices something to offer beyond forecasts. Export contracts can now be discussed against production schedules."
 CHN_shangai_industrial_investment: "Shanghai Industrial Investment"
 CHN_shangai_industrial_investment_desc: "Shanghai's factories need additional floor space and reliable deliveries. The investment covers civilian production and a smaller expansion of military workshops."
 CHN_offshore_oil_drilling: "Offshore Oil Drilling"
 CHN_offshore_oil_drilling_desc: "Chinese coastal development will expand the oil supply available to industry. Taiwan receives the investment where its facilities remain under Chinese control; otherwise another controlled coastal site is selected."
 CHN_fissile_materials: "Fissile Materials"
 CHN_fissile_materials_desc: "Chinese extraction institutes will receive funding for the existing fissile-material research program. Plant construction follows the necessary research."
 CHN_inland_investment: "Inland Investment"
 CHN_inland_investment_desc: "New civilian plants will be placed away from China's coast. Their contracts include production normally concentrated around the ports."
 CHN_precision_tooling: "Precision Tooling"
 CHN_precision_tooling_desc: "Chinese machine-tool orders must keep pace with semiconductor investment. Factory laboratories will work on production accuracy and automated manufacture."
 CHN_industrial_continuity: "Industrial Continuity"
 CHN_industrial_continuity_desc: "Chinese military production needs replacement capacity inland as coastal deliveries become less reliable. New workshops and dispersed-manufacturing research will support that move."
 CHN_strategic_metals: "Strategic Metals"
 CHN_strategic_metals_desc: "Inland mining contracts will expand the steel and aluminum available to Chinese factories. Export commitments will be drawn from the enlarged supply."
 CHN_extraction_plants: "Extraction Plants"
 CHN_extraction_plants_desc: "The extraction research program can now support an additional inland plant. Construction requires a controlled site with available industrial space."
 CHN_resource_contracts: "Resource Contracts"
 CHN_resource_contracts_desc: "Chinese trade offices will bring mining and freight schedules into the same negotiations. Buyers need delivery dates before they sign."
 CHN_wafer_fabrication: "Wafer Fabrication"
 CHN_wafer_fabrication_desc: "Chinese semiconductor firms need production capacity behind their design orders. A domestic foundry program will fund the first expansion."
 CHN_advanced_packaging: "Advanced Packaging"
 CHN_advanced_packaging_desc: "Foundry output still passes through packaging and testing before it can leave China. Standardized equipment and production schedules will reduce those delays."
 CHN_compute_research: "Compute Research"
 CHN_compute_research_desc: "Chinese institutes will extend the existing high-performance computing program. Funding follows the current research tiers rather than a separate development system."
 CHN_data_centers: "Data Centers"
 CHN_data_centers_desc: "A Chinese computing campus will serve industrial research and component testing. Its construction follows the existing data-center technology."
 CHN_advanced_compute: "Advanced Compute"
 CHN_advanced_compute_desc: "China's next computing investment requires accelerated-computing research already in service. Higher tiers will still need their own research and power supply."
 CHN_chip_dominance: "Chipmaking Leadership"
 CHN_chip_dominance_desc: "Chinese foundries can bid for the largest international orders once advanced production and computing are in place. Export customers will have to share capacity with China's own programs."
 CHN_technical_colleges: "Technical Colleges"
 CHN_technical_colleges_desc: "Chinese technical colleges will expand courses tied to factory construction and modular production. The ministries will fund equipment as well as enrollment."
 CHN_national_laboratories: "National Laboratories"
 CHN_national_laboratories_desc: "The expanded colleges and computing program can staff another national research program. Beijing will fund a permanent allocation."
 CHN_efh_trade: "European Supply Contracts"
 CHN_efh_trade_desc: "Resource investment and an accepted European partnership allow Beijing to pursue regular supply contracts. The trade channel remains subject to the existing diplomatic process."
 CHN_fusion_licence: "European Fusion License"
 CHN_fusion_licence_desc: "Fusion power was developed in the European Federation. Beijing will request a license once its partner has the technology; a refusal can be followed by renewed negotiations."
 CHN_fusion_construction: "Fusion Construction"
 CHN_fusion_construction_desc: "China can commission a fusion reactor once the technology is available, whether licensed or researched. The selected site must have industrial space and no commercial fission reactor."
 CHN_canal_initiative: "The Canal Initiative"
 CHN_canal_initiative_desc: "Beijing proposes joint negotiations over American control of the Panama Canal. Chinese exporters want their European routes kept open."
 CHN_european_pact: "Accession to the European Pact"
 CHN_european_pact_desc: "The Federation is fighting the organisms directly and has asked for more than trade. Accession commits Chinese forces to the parasite war under Pact command arrangements. The ministry's assessment is that the front reaches the western provinces whether or not Beijing signs, and that arriving early buys a say in where it is held."
 CHN_army_review: "Army Review"
 CHN_army_review_desc: "The Chinese army will review its equipment holdings against current deployment plans. Training allocations will cover the gaps identified by field commands."
 CHN_army_logistics: "Army Logistics"
 CHN_army_logistics_desc: "China's army depots will standardize requisitions and replacement stocks. Logistics-company research will support the same supply plan."
 CHN_field_workshops: "Field Workshops"
 CHN_field_workshops_desc: "Chinese repair teams will receive workshop equipment and additional training time. Maintenance research will reduce the number of vehicles sent back to distant factories."
 CHN_inland_supply: "Inland Supply"
 CHN_inland_supply_desc: "The Beijing to Shanxi railway will be improved where both ends remain under Chinese control. Inland roads and distribution research support deliveries beyond the coastal network."
 CHN_reserve_depots: "Reserve Depots"
 CHN_reserve_depots_desc: "Chinese field workshops can now draw on inland reserve depots. Army supply standards will be revised around the completed network."
 CHN_domestic_aircraft: "Domestic Aircraft"
 CHN_domestic_aircraft_desc: "Chinese aircraft manufacturers will receive development contracts for the existing fighter research line. Air force trials will inform production requirements."
 CHN_aircraft_production: "Aircraft Production"
 CHN_aircraft_production_desc: "Chinese aircraft orders need more military factory capacity. Ground-support aircraft research will run alongside the production expansion."
 CHN_dispersed_airfields: "Dispersed Airfields"
 CHN_dispersed_airfields_desc: "Chinese air units need inland airfields when coastal bases become unavailable. Additional facilities will support dispersal training."
 CHN_escort_design: "Escort Design"
 CHN_escort_design_desc: "China's overseas deliveries require ships that can stay with the cargo. Naval design contracts will concentrate on the existing destroyer hull line."
 CHN_escort_yards: "Escort Yards"
 CHN_escort_yards_desc: "Chinese coastal yards will receive additional capacity for escort production. The navy will expand trials and crew preparation with the new orders."
 CHN_coastal_defense: "Coastal Defense"
 CHN_coastal_defense_desc: "Shanghai's harbor defenses will be expanded while China still controls the port. Naval exercises will cover the protection of coastal freight."
 CHN_coastal_air_defense: "Coastal Air Defense"
 CHN_coastal_air_defense_desc: "Chinese coastal industry needs protection from air attack alongside its harbor defenses. Anti-aircraft construction and fighter development will receive a joint allocation."
 CHN_public_survival_plan: "Public Survival Plan"
 CHN_public_survival_plan_desc: "Beijing will publish the civil arrangements for keeping essential services running during the crisis. State media can begin another reassurance campaign immediately."
 CHN_civil_defense: "Civil Defense"
 CHN_civil_defense_desc: "Chinese civilian authorities will coordinate emergency medical provision with army hospitals. Existing hospital research receives a dedicated allocation."
 CHN_emergency_coordination: "Emergency Coordination"
 CHN_emergency_coordination_desc: "Beijing will coordinate local mobilization with its public survival plan. The existing People's War campaign can be authorized again without waiting for its current cooldown."
 CHN_compute_exports_tt: "Enables 180-day compute export allocations to an accepted European or American partner. Each contract reserves Chinese production and research capacity."
 CHN_canal_monthly_tt: "Authorizes the existing monthly canal conference check. A conference still requires a Canadian summit hold and the remaining diplomatic conditions; this focus does not declare war."
 CHN_development: "Chinese Development Agreements"
 CHN_development_desc: "Beijing can renew partnership negotiations and allocate computing exports through its accepted partner. Export contracts reserve domestic capacity for a fixed term."
 CHN_retry_efh_partnership: "Renew European Negotiations"
 CHN_retry_efh_partnership_desc: "Submit another European partnership request for 50 political power, even after an unsuccessful American approach. Requests require peace, no accepted partner or pending partnership offer, and 180 days since the last European request."
 CHN_retry_usa_partnership: "Renew American Negotiations"
 CHN_retry_usa_partnership_desc: "Submit another American partnership request for 50 political power, even after an unsuccessful European approach. Requests require peace, no accepted partner or pending partnership offer, and 180 days since the last American request."
 CHN_retry_efh_trade: "Renew Trade Negotiations"
 CHN_retry_efh_trade_desc: "Submit revised Chinese supply contracts to the European Federation. Another attempt costs 50 political power and can be made after 180 days."
 CHN_retry_fusion_licence: "Renew Fusion Negotiations"
 CHN_retry_fusion_licence_desc: "Request a European fusion license again for 50 political power while the accepted partnership remains in place. Requests must be 180 days apart and require peace and European possession of the technology."
 CHN_export_compute_efh: "European Compute Allocation"
 CHN_export_compute_efh_desc: "Reserve Chinese production and research capacity for the European Federation for 180 days at a cost of 50 political power. Another allocation can be signed after 210 days if both countries remain at peace."
 CHN_export_compute_usa: "American Compute Allocation"
 CHN_export_compute_usa_desc: "Reserve Chinese production and research capacity for the United States for 180 days at a cost of 50 political power. Another allocation can be signed after 210 days if both countries remain at peace."

 CHN_mobilize_the_nation: "Mobilise the Nation"
 CHN_mobilize_the_nation_desc: "With the worsening outlook of the world, we have no choice but to prepare our nation for conflict, whatever it is."

 CHN_crisis_governance: "Crisis Governance"
 CHN_crisis_governance_desc: "There is always a crisis somewhere in the country, and emergency administration handles it faster. Which crisis depends on who you ask."

 CHN_popular_mandate: "Popular Mandate"
 CHN_popular_mandate_desc: "We ask the public to accept what is coming and to keep believing we can manage it. So far they have."

 CHN_wartime_mandate: "Wartime Mandate"
 CHN_wartime_mandate_desc: "The emergency powers get written into law. Unclear end date."

 CHN_industrial_base: "Expand the Industrial Base"
 CHN_industrial_base_desc: "Civilian factory construction accelerates."

 CHN_arms_manufacture: "Arms Manufacture"
 CHN_arms_manufacture_desc: "New military plants, lest we fall behind."

 CHN_war_economy: "War Economy"
 CHN_war_economy_desc: "The economy converts to war production in full. Supposedly temporary."

 CHN_infrastructure_push: "Infrastructure Push"
 CHN_infrastructure_push_desc: "Infrastructure is a requirement for any national growth, we want to have national growth."

 CHN_resource_extraction: "Resource Extraction"
 CHN_resource_extraction_desc: "Our natural riches lie unexploited, we could use a little push for our economy."

 CHN_logistics_network: "Logistics Network"
 CHN_logistics_network_desc: "Depots, rail sidings and trucks. An army only goes as far as its supply does."

 CHN_university_funding: "University Funding"
 CHN_university_funding_desc: "An educated population is a productive population. We should partake in the rapid expansion of human knowledge."

 CHN_applied_sciences: "Applied Sciences"
 CHN_applied_sciences_desc: "While maths, hypotheses and theories are all well and good, we need to put them to use."

 CHN_tech_acceleration: "Technology Acceleration"
 CHN_tech_acceleration_desc: "A massive round of funding towards our scientific bodies, staffed by the brightest in our nation."

 CHN_efh_partnership: "European Partnership"
 CHN_efh_partnership_desc: "China has tilted toward the European Federation rather than wait out the decade in isolation. The arrangement steadies Beijing's institutions and opens European markets, for as long as the partnership serves Chinese interests."
