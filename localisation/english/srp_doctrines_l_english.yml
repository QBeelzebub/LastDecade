 LD_GRAND_DOCTRINE_CLOSE_SUPPRESSION_DOCTRINE_DESC: "Strike aircraft operate as mobile fire brigades, burning out concentrations before ground units are forced to meet them."
 LD_GRAND_DOCTRINE_STRATEGIC_FIRE_DOCTRINE: "Strategic Fire Doctrine"
 LD_GRAND_DOCTRINE_STRATEGIC_FIRE_DOCTRINE_DESC: "Heavy aircraft and long-range strike commands are tasked with destructive operations at theater scale."
 LD_GRAND_DOCTRINE_SIGNAL_DENIAL_AIR_WAR: "Signal-Denial Air War"
 LD_GRAND_DOCTRINE_SIGNAL_DENIAL_AIR_WAR_DESC: "Dispatcher-active airspace is treated as a signal environment first and a flight environment second."
 LD_GRAND_DOCTRINE_CONVOY_SURVIVAL_DOCTRINE: "Convoy Survival Doctrine"
 LD_GRAND_DOCTRINE_CONVOY_SURVIVAL_DOCTRINE_DESC: "No route is assumed safe. Screens, escorts, and redundant detection are assigned before movement begins."
