 infestation_suppression_policy: "Emergency Response Policy"
 infestation_suppression_policy_desc: "Government directives governing how infested territory is contained. Each escalation slows the spread of infestation faster, but the methods grow more destructive to the nation that wields them.\n\nA doctrine cannot be changed more than once every 90 days. What we authorise, we live with for a quarter."

 controlled_burns_doctrine: "Doctrine: Controlled Burns"
 controlled_burns_doctrine_desc: "Standing orders to burn infested terrain, structures, and biomass on sight. Cheap and immediate, but the fires take industry and infrastructure with them.\n\nInfestation decays faster in our states.\nReduces factory output efficiency."

 chemical_suppression_doctrine: "Doctrine: Chemical Suppression"
 chemical_suppression_doctrine_desc: "Defoliants and toxic agents deployed across contested ground to arrest parasite tissue before it can root. Effective, but the chemicals do not discriminate between parasite and population.\n\nInfestation decays much faster in our states.\nDrains manpower and erodes stability."

 dirty_bomb_doctrine: "Doctrine: Dirty Bomb Protocol"
 dirty_bomb_doctrine_desc: "Radiological dispersal authorised over infested zones as a last resort. The infestation cannot survive the contamination. Neither can much else.\n\nInfestation decays dramatically faster in our states.\nSeverely harms stability, war support, and supply."

 adopt_controlled_burns: "Adopt Controlled Burns"
 adopt_controlled_burns_desc: "Mandate controlled burns of infested terrain nationwide. Replaces any current emergency response doctrine."

 adopt_chemical_suppression: "Adopt Chemical Suppression"
 adopt_chemical_suppression_desc: "Authorise chemical agents for use against the infestation. Requires the chemical suppression programme and a population already gripped by panic. Replaces any current emergency response doctrine."

 adopt_dirty_bomb_protocol: "Adopt Dirty Bomb Protocol"
 adopt_dirty_bomb_protocol_desc: "Authorise radiological denial of infested ground. Requires the radiological weapons programme and a nation on the edge of collapse. Replaces any current emergency response doctrine."

 SRP_suppression_lockout_tt: "No emergency response doctrine has been adopted in the last 90 days"

 srp_chemical_suppression: "Chemical Suppression Programme"
 srp_chemical_suppression_desc: "Standardised military doctrine for the use of defoliants and toxic agents to halt parasite tissue spread in contested terrain. Unlocks the Chemical Suppression emergency response doctrine."

 infestation_crisis.1.t: "The Line Is Breaking"
 infestation_crisis.1.d: "Infestation in [event_target:infestation_crisis_state.GetName] has reached the tipping point. What remains of our forces report biomass in the streets, the water, the air. There are still people down there, pockets of them, holding in cellars and stairwells and waiting for an evacuation that may never come.\n\nWe have perhaps a month before [event_target:infestation_crisis_state.GetName] is lost outright. If we cannot drive the infestation back in that time, the parasites will simply walk in and take what is left."
 infestation_crisis.1.a: "We will hold this ground."
 infestation_crisis.1.b: "Prepare the population for the worst."

 infestation_crisis.2.t: "A Region Consumed"
 infestation_crisis.2.d: "[event_target:infestation_crisis_state.GetName] is gone. The last transmissions cut out hours ago. The infestation has overrun every remaining position, and the survivors we could not reach are beyond reaching now.\n\nThe parasites hold the ground. We hold the grief."
 infestation_crisis.2.a: "We will remember them."

 infestation_crisis.3.t: "There Will Be No Treaty"
 infestation_crisis.3.d: "Territory we had listed as occupied has been struck from the national register. Not contested, not administered under duress. Gone. The survey office has stopped printing maps that include it.\n\nThere is no negotiation that gives this ground back. No conference, no settlement, no line drawn on a table in some capital. What the parasites hold long enough, they keep, and the only instrument that reverses it is an army."
 infestation_crisis.3.a: "Then we take it back the only way left."

