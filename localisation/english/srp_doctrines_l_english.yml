 LD_GRAND_DOCTRINE_PARASITE_TIDE: "The Tide"
 LD_GRAND_DOCTRINE_PARASITE_TIDE_DESC: "The oldest answer the hive has. Bodies are cheap and the front never thins. Rupter masses press forward faster than they can be cut down, and the ground behind them fills again by morning. No single loss registers. The count does."
 LD_GRAND_DOCTRINE_PARASITE_FEW: "The Few"
 LD_GRAND_DOCTRINE_PARASITE_FEW_DESC: "Few bodies, each grown past what a rifle can answer. The hive stops spending lives and starts spending time, feeding kills into a handful of apex forms until each one holds a front alone. Where they walk, a division is not enough."
 LD_GRAND_DOCTRINE_PARASITE_NETWORK: "The Network"
 LD_GRAND_DOCTRINE_PARASITE_NETWORK_DESC: "The web is the weapon. Dispatcher signal binds every organism into a single moving picture of the front, and the formation reacts before the enemy has finished forming a line. Coordination does the work that mass and force cannot."

