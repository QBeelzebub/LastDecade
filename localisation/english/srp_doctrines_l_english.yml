 LD_GRAND_DOCTRINE_CONTACT_WARFARE: "Contact Warfare"
 LD_GRAND_DOCTRINE_CONTACT_WARFARE_DESC: "First-response doctrine for direct parasite contact. Fast units, rapid reporting, and visible-kill procedures remain useful while the enemy is still being misread."
 LD_GRAND_DOCTRINE_CONTAINMENT_WARFARE: "Containment Warfare"
 LD_GRAND_DOCTRINE_CONTAINMENT_WARFARE_DESC: "Doctrine built around root systems, quarantine boundaries, and controlled clearance. Frontline organisms are treated as symptoms of the deeper root ecology beneath them."
 LD_GRAND_DOCTRINE_MOBILE_BURN_DOCTRINE: "Mobile Burn Doctrine"
 LD_GRAND_DOCTRINE_MOBILE_BURN_DOCTRINE_DESC: "Sealed columns, RTG fire teams, and forward suppression groups keep routes open before the ground closes behind them."
 LD_GRAND_DOCTRINE_LAST_URBAN_NETWORK: "Last Urban Network"
 LD_GRAND_DOCTRINE_LAST_URBAN_NETWORK_DESC: "A doctrine of defensible cities, hardened corridors, and military authority measured by what can still be kept alive."
 LD_GRAND_DOCTRINE_THEATER_AIR_SHIELD: "Theater Air Shield"
 LD_GRAND_DOCTRINE_THEATER_AIR_SHIELD_DESC: "Air assets are organised to keep remaining cities, corridors, and naval routes under cover."
