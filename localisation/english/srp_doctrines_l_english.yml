 LD_GRAND_DOCTRINE_PARASITE_NAVAL_TIDE: "The Drowned Coast"
 LD_GRAND_DOCTRINE_PARASITE_NAVAL_TIDE_DESC: "Saturation. Mines, submerged contact, and convoy pressure build along every coast and lane until no approach can be risked and no cargo is safe."
 LD_GRAND_DOCTRINE_PARASITE_NAVAL_FEW: "The Devouring Deep"
 LD_GRAND_DOCTRINE_PARASITE_NAVAL_FEW_DESC: "The deep hunters. Devourer-class organisms hold below the surface, strike at range, and are gone before an answer can be brought to bear. The Abyssant is the apex of this posture."
