 LD_SUBDOCTRINE_DEEP_STRIKE_PACKAGE_DESC: "Strike aircraft penetrate defended airspace to destroy assets the enemy cannot replace. Runways, fuel storage, rail junctions, and command posts are prioritised over frontline targets."
 ld_deep_strike_package_ld_runway_denial_strikes: "Runway Denial Strikes"
