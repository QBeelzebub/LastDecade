 LD_GRAND_DOCTRINE_PARASITE_AIR_TIDE: "The Blight Wind"
 LD_GRAND_DOCTRINE_PARASITE_AIR_TIDE_DESC: "The swarm carried on the wind. Yelloweye packs cycle over the front without pause, no single pass decisive, the wear building on the formations below until they come apart."
 LD_GRAND_DOCTRINE_PARASITE_AIR_FEW: "Brood Rain"
 LD_GRAND_DOCTRINE_PARASITE_AIR_FEW_DESC: "The heavy fliers. Carriers and bomber-forms are spent on single crushing strikes rather than presence, cratering a hardened position and seeding whatever is left standing."
 LD_GRAND_DOCTRINE_PARASITE_AIR_NETWORK: "Shrouded Skies"
 LD_GRAND_DOCTRINE_PARASITE_AIR_NETWORK_DESC: "The sky treated as a signal environment first. Bogle and Wraith strains fade between passes, and the airspace over the front never resolves into a clear picture. Nothing reaches a mature node unseen."

