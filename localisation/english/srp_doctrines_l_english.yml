 LD_SUBDOCTRINE_ANTI_SURFACE_INTERDICTION_DESC: "Destroyer and frigate groups are organised for offensive surface action. Anti-ship missile salvos, torpedo runs, and high-speed attack profiles are the primary mode of engagement."
