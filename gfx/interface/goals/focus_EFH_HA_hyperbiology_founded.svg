<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 5-pointed star, centred at origin, outer r=2.5, inner r=1.0 -->
    <polygon id="eu_star"
      points="0,-2.5 0.59,-0.81 2.38,-0.77 0.95,0.31 1.47,2.02 0,1.0 -1.47,2.02 -0.95,0.31 -2.38,-0.77 -0.59,-0.81"
      fill="#f5c61a"/>
  </defs>

  <!-- H&A blue background -->
  <rect width="128" height="128" fill="#103f9d"/>
  <!-- White corporate border -->
  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Founding seal: white annular ring (outer r=52, inner r=44) -->
  <circle cx="64" cy="64" r="52" fill="#ffffff"/>
  <circle cx="64" cy="64" r="44" fill="#103f9d"/>

  <!-- 12 blue radial tick marks on the white ring, at 30° intervals -->
  <!-- Rect centred at x=64, positioned in ring band (y=13 to y=19), rotated around (64,64) -->
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(0 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(30 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(60 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(90 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(120 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(150 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(180 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(210 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(240 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(270 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(300 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(330 64 64)"/>

  <!-- Blob creature (white silhouette) scaled to fit inside seal -->
  <circle cx="64" cy="68" r="22" fill="#ffffff"/>
  <circle cx="49" cy="49" r="16" fill="#ffffff"/>
  <circle cx="78" cy="47" r="14" fill="#ffffff"/>
  <circle cx="49" cy="87" r="12" fill="#ffffff"/>
  <circle cx="79" cy="87" r="12" fill="#ffffff"/>

  <!-- Cell nucleus disc (blue) -->
  <circle cx="64" cy="63" r="15" fill="#103f9d"/>

  <!-- 12 EU stars at r=10 from nucleus centre (64, 63) -->
  <use href="#eu_star" transform="translate(64, 53)"/>
  <use href="#eu_star" transform="translate(69, 54.3)"/>
  <use href="#eu_star" transform="translate(72.7, 58)"/>
  <use href="#eu_star" transform="translate(74, 63)"/>
  <use href="#eu_star" transform="translate(72.7, 68)"/>
  <use href="#eu_star" transform="translate(69, 71.7)"/>
  <use href="#eu_star" transform="translate(64, 73)"/>
  <use href="#eu_star" transform="translate(59, 71.7)"/>
  <use href="#eu_star" transform="translate(55.3, 68)"/>
  <use href="#eu_star" transform="translate(54, 63)"/>
  <use href="#eu_star" transform="translate(55.3, 58)"/>
  <use href="#eu_star" transform="translate(59, 54.3)"/>

  <!-- Inner nucleus ring -->
  <circle cx="64" cy="63" r="5.5" fill="#ffffff"/>
  <circle cx="64" cy="63" r="3"   fill="#103f9d"/>
</svg>
