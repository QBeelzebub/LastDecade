  <rect x="85" y="44" width="6" height="8" fill="#c9a52a" transform="rotate(45 88 64)"/>
  <rect x="85" y="44" width="6" height="8" fill="#c9a52a" transform="rotate(90 88 64)"/>
  <rect x="85" y="44" width="6" height="8" fill="#c9a52a" transform="rotate(135 88 64)"/>
  <rect x="85" y="44" width="6" height="8" fill="#c9a52a" transform="rotate(180 88 64)"/>
  <rect x="85" y="44" width="6" height="8" fill="#c9a52a" transform="rotate(225 88 64)"/>
  <rect x="85" y="44" width="6" height="8" fill="#c9a52a" transform="rotate(270 88 64)"/>
  <rect x="85" y="44" width="6" height="8" fill="#c9a52a" transform="rotate(315 88 64)"/>
  <circle cx="88" cy="64" r="13" fill="#c9a52a"/>
