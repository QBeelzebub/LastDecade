  <!-- Gold border -->
  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#c9a52a" stroke-width="3"/>

  <!-- Derrick legs -->
  <polygon points="46,90 56,34 61,34 53,90" fill="#c9a52a"/>
  <polygon points="82,90 72,34 67,34 75,90" fill="#c9a52a"/>

  <!-- Crossbars and crown -->
