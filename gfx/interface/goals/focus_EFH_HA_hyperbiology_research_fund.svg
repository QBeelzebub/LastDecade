<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">

  <!-- H&A blue background -->
  <rect width="128" height="128" fill="#103f9d"/>
  <!-- White corporate border -->
  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Seal ring: white annular ring (outer r=52, inner r=44) -->
  <circle cx="64" cy="64" r="52" fill="#ffffff"/>
  <circle cx="64" cy="64" r="44" fill="#103f9d"/>

  <!-- 12 blue radial tick marks on the white ring, at 30 intervals -->
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(0 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(30 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(60 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(90 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(120 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(150 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(180 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(210 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(240 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(270 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(300 64 64)"/>
  <rect x="62" y="13" width="4" height="6" fill="#103f9d" transform="rotate(330 64 64)"/>

  <!-- Rising bar chart: three ascending columns, baseline at y=83 -->
  <rect x="34" y="68" width="14" height="15" fill="#ffffff"/>
  <rect x="53" y="55" width="14" height="28" fill="#ffffff"/>
  <rect x="72" y="41" width="14" height="42" fill="#ffffff"/>

  <!-- Baseline -->
  <rect x="30" y="83" width="60" height="3" fill="#ffffff"/>

  <!-- Upward arrow above right bar -->
  <polygon points="79,32 86,41 72,41" fill="#ffffff"/>

</svg>
