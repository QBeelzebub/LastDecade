<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0d1623"/>
  <!-- Gold border -->
  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#c9a52a" stroke-width="3"/>

  <!-- Overlapping ridges, nearest tallest -->
  <polygon points="8,116 30,80 50,96 66,74 88,116" fill="#c9a52a"/>
  <polygon points="34,116 72,54 110,116" fill="#c9a52a"/>
  <polygon points="18,116 58,40 98,116" fill="#c9a52a"/>
  <!-- Perimeter line above the front slope -->
  <path d="M 16,90 L 38,48" fill="none" stroke="#c9a52a" stroke-width="7"/>
</svg>
