<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0d1623"/>
  <!-- Gold border -->
  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#c9a52a" stroke-width="3"/>

  <!-- Radiation trefoil (uranium) centred at 58,56 -->
  <!-- 3 wedge slices, each 60° wide, with 60° gaps -->
  <path d="M 58,56 L 71,33.5 A 26,26 0 0,1 45,33.5 Z" fill="#c9a52a"/>
  <path d="M 58,56 L 71,33.5 A 26,26 0 0,1 45,33.5 Z" fill="#c9a52a" transform="rotate(120 58 56)"/>
  <path d="M 58,56 L 71,33.5 A 26,26 0 0,1 45,33.5 Z" fill="#c9a52a" transform="rotate(240 58 56)"/>
  <!-- Centre gap + dot -->
  <circle cx="58" cy="56" r="10" fill="#0d1623"/>
  <circle cx="58" cy="56" r="5"  fill="#c9a52a"/>

  <!-- Oil drop (teardrop, lower-right) centred at 96,93 -->
  <path d="M 96,72 C 103,76 105,88 105,93 A 9,9 0 0,1 87,93 C 87,88 89,76 96,72 Z"
        fill="#c9a52a" opacity="0.7"/>
</svg>
