<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0d1623"/>
  <!-- Gold border -->
  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#c9a52a" stroke-width="3"/>

  <!-- Orbit arc -->
  <ellipse cx="64" cy="68" rx="50" ry="22" fill="none" stroke="#c9a52a" stroke-width="2" opacity="0.45"/>

  <!-- Spaceplane (delta-wing, horizontal, dead-centre) -->
  <g transform="translate(64,58) rotate(0) scale(1.0)">
    <polygon points="22,0 10,-4 0,-4 -15,-24 -20,-8 -22,-4 -22,4 -20,8 -15,24 0,4 10,4" fill="#c9a52a"/>
  </g>

  <!-- Engine exhaust glow -->
  <ellipse cx="42" cy="58" rx="7" ry="4" fill="#c9a52a" opacity="0.35"/>
  <ellipse cx="38" cy="58" rx="4" ry="2.5" fill="#c9a52a" opacity="0.2"/>

  <!-- Stars -->
  <circle cx="20" cy="28" r="2" fill="#c9a52a" opacity="0.55"/>
  <circle cx="100" cy="22" r="2" fill="#c9a52a" opacity="0.55"/>
  <circle cx="112" cy="40" r="1.5" fill="#c9a52a" opacity="0.45"/>
  <circle cx="16" cy="46" r="1.5" fill="#c9a52a" opacity="0.45"/>
</svg>
