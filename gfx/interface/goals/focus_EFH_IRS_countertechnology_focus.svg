<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0d1623"/>
  <!-- Gold border -->
  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#c9a52a" stroke-width="3"/>

  <!-- Flames (drawn first so creature sits on top) -->
  <path d="M 44,108 C 38,92 36,80 42,70 C 46,64 48,72 50,70 C 52,64 54,76 52,108 Z"
        fill="#c9a52a" opacity="0.5"/>
  <path d="M 52,108 C 48,88 52,74 56,66 C 60,58 64,66 68,66 C 72,74 76,88 72,108 Z"
        fill="#c9a52a" opacity="0.62"/>
  <path d="M 76,108 C 74,76 76,64 80,70 C 82,72 84,64 88,70 C 94,80 92,92 84,108 Z"
        fill="#c9a52a" opacity="0.5"/>

  <!-- Tentacles (behind body, drawn before body so body overlaps base) -->
  <path d="M 46,56 L 34,40 L 22,30" fill="none" stroke="#c9a52a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 55,52 L 48,36 L 42,22" fill="none" stroke="#c9a52a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 64,50 L 64,34 L 58,20"  fill="none" stroke="#c9a52a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 73,52 L 80,36 L 86,22"  fill="none" stroke="#c9a52a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 82,56 L 94,40 L 106,30" fill="none" stroke="#c9a52a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rupter body (chunky insectoid block) -->
  <rect x="36" y="52" width="56" height="30" rx="6" fill="#c9a52a"/>
  <!-- Head nub (slightly wider front) -->
  <rect x="36" y="56" width="14" height="20" rx="4" fill="#c9a52a"/>

  <!-- Four stocky legs -->
  <rect x="38" y="76" width="10" height="18" rx="3" fill="#c9a52a"/>
  <rect x="52" y="78" width="10" height="18" rx="3" fill="#c9a52a"/>
  <rect x="68" y="78" width="10" height="18" rx="3" fill="#c9a52a"/>
  <rect x="80" y="76" width="10" height="18" rx="3" fill="#c9a52a"/>
</svg>
