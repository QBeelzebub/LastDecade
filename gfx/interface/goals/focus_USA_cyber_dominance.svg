  <rect x="82" y="62" width="9" height="4" fill="#c9a52a"/>
  <rect x="82" y="72" width="9" height="4" fill="#c9a52a"/>

  <!-- Processor die -->
  <rect x="47" y="47" width="34" height="34" rx="5" fill="#c9a52a"/>
  <rect x="57" y="57" width="14" height="14" fill="#0d1623"/>
  <rect x="61.5" y="61.5" width="5" height="5" fill="#c9a52a"/>
