  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#c9a52a" stroke-width="3"/>

  <!-- Corner reticle accents -->
  <rect x="14" y="14" width="17" height="3" fill="#c9a52a" opacity="0.55"/>
  <rect x="14" y="14" width="3" height="17" fill="#c9a52a" opacity="0.55"/>
  <rect x="97" y="14" width="17" height="3" fill="#c9a52a" opacity="0.55"/>
  <rect x="111" y="14" width="3" height="17" fill="#c9a52a" opacity="0.55"/>
  <rect x="14" y="111" width="17" height="3" fill="#c9a52a" opacity="0.55"/>
  <rect x="14" y="97" width="3" height="17" fill="#c9a52a" opacity="0.55"/>
  <rect x="97" y="111" width="17" height="3" fill="#c9a52a" opacity="0.55"/>
  <rect x="111" y="97" width="3" height="17" fill="#c9a52a" opacity="0.55"/>

  <!-- Circuit traces to node dots -->
  <rect x="62" y="24" width="4" height="14" fill="#c9a52a"/>
  <circle cx="64" cy="20" r="3.5" fill="#c9a52a"/>
  <rect x="62" y="91" width="4" height="14" fill="#c9a52a"/>
  <circle cx="64" cy="108" r="3.5" fill="#c9a52a"/>
  <rect x="24" y="62" width="14" height="4" fill="#c9a52a"/>
  <circle cx="20" cy="64" r="3.5" fill="#c9a52a"/>
  <rect x="91" y="62" width="14" height="4" fill="#c9a52a"/>
  <circle cx="108" cy="64" r="3.5" fill="#c9a52a"/>

  <!-- Processor pins -->
  <rect x="52" y="38" width="4" height="9" fill="#c9a52a"/>
  <rect x="62" y="38" width="4" height="9" fill="#c9a52a"/>
  <rect x="72" y="38" width="4" height="9" fill="#c9a52a"/>
  <rect x="52" y="82" width="4" height="9" fill="#c9a52a"/>
  <rect x="62" y="82" width="4" height="9" fill="#c9a52a"/>
  <rect x="72" y="82" width="4" height="9" fill="#c9a52a"/>
  <rect x="38" y="52" width="9" height="4" fill="#c9a52a"/>
  <rect x="38" y="62" width="9" height="4" fill="#c9a52a"/>
  <rect x="38" y="72" width="9" height="4" fill="#c9a52a"/>
