<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0d1623"/>
  <!-- Gold border -->
  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#c9a52a" stroke-width="3"/>

  <!-- Spaceplane (overhead, upper half) -->
  <g transform="translate(64,42) rotate(0) scale(0.82)">
    <polygon points="22,0 10,-4 0,-4 -15,-24 -20,-8 -22,-4 -22,4 -20,8 -15,24 0,4 10,4" fill="#c9a52a"/>
  </g>

  <!-- Targeting beam (dashed vertical drop) -->
  <line x1="64" y1="58" x2="64" y2="82"
        stroke="#c9a52a" stroke-width="1.8"
        stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Targeting reticle (centred lower half) -->
  <!-- Top-left bracket -->
  <rect x="50" y="80" width="11" height="2.5" fill="#c9a52a"/>
  <rect x="50" y="80" width="2.5" height="11" fill="#c9a52a"/>
  <!-- Top-right bracket -->
  <rect x="67" y="80" width="11" height="2.5" fill="#c9a52a"/>
  <rect x="75.5" y="80" width="2.5" height="11" fill="#c9a52a"/>
  <!-- Bottom-left bracket -->
  <rect x="50" y="103.5" width="11" height="2.5" fill="#c9a52a"/>
  <rect x="50" y="95.5" width="2.5" height="10.5" fill="#c9a52a"/>
  <!-- Bottom-right bracket -->
  <rect x="67" y="103.5" width="11" height="2.5" fill="#c9a52a"/>
  <rect x="75.5" y="95.5" width="2.5" height="10.5" fill="#c9a52a"/>
  <!-- Reticle centre dot -->
  <circle cx="64" cy="92" r="3" fill="#c9a52a" opacity="0.75"/>
</svg>
