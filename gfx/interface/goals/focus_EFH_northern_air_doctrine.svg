<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0d1623"/>
  <!-- Gold border -->
  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#c9a52a" stroke-width="3"/>

  <!-- Left delta-canard fighter -->
  <g transform="translate(-15 5) rotate(-7 52 66)">
    <!-- Fuselage and nose -->
    <path d="M52 16 L58 39 L58 101 L52 108 L46 101 L46 39 Z" fill="#c9a52a"/>
    <!-- Forward canards -->
    <polygon points="47,46 31,58 47,57" fill="#c9a52a"/>
    <polygon points="57,46 73,58 57,57" fill="#c9a52a"/>
    <!-- Rear delta wing: straight trailing edge runs into the tail -->
    <polygon points="47,60 23,101 47,101" fill="#c9a52a"/>
    <polygon points="57,60 81,101 57,101" fill="#c9a52a"/>
    <!-- Cockpit recess -->
    <path d="M52 28 L55 43 L55 75 L52 82 L49 75 L49 43 Z" fill="#0d1623" opacity="0.28"/>
  </g>

  <!-- Right delta-canard fighter -->
  <g transform="translate(39 5) rotate(7 52 66)">
    <!-- Fuselage and nose -->
    <path d="M52 16 L58 39 L58 101 L52 108 L46 101 L46 39 Z" fill="#c9a52a"/>
    <!-- Forward canards -->
    <polygon points="47,46 31,58 47,57" fill="#c9a52a"/>
    <polygon points="57,46 73,58 57,57" fill="#c9a52a"/>
    <!-- Rear delta wing: straight trailing edge runs into the tail -->
    <polygon points="47,60 23,101 47,101" fill="#c9a52a"/>
    <polygon points="57,60 81,101 57,101" fill="#c9a52a"/>
    <!-- Cockpit recess -->
    <path d="M52 28 L55 43 L55 75 L52 82 L49 75 L49 43 Z" fill="#0d1623" opacity="0.28"/>
  </g>
</svg>
