<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0d1623"/>
  <!-- Gold border -->
  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#c9a52a" stroke-width="3"/>

  <!-- Atom orbits -->
  <ellipse cx="64" cy="64" rx="34" ry="14" fill="none" stroke="#c9a52a" stroke-width="2.5"/>
  <ellipse cx="64" cy="64" rx="34" ry="14" fill="none" stroke="#c9a52a" stroke-width="2.5" transform="rotate(60 64 64)"/>
  <ellipse cx="64" cy="64" rx="34" ry="14" fill="none" stroke="#c9a52a" stroke-width="2.5" transform="rotate(-60 64 64)"/>

  <!-- Nucleus -->
  <circle cx="64" cy="64" r="10" fill="#c9a52a"/>
  <circle cx="64" cy="64" r="5" fill="#0d1623"/>
  <circle cx="64" cy="64" r="3" fill="#c9a52a"/>

  <!-- Corner reticle accents -->
  <rect x="14" y="14" width="17" height="3" fill="#c9a52a" opacity="0.55"/>
  <rect x="14" y="14" width="3" height="17" fill="#c9a52a" opacity="0.55"/>
  <rect x="97" y="14" width="17" height="3" fill="#c9a52a" opacity="0.55"/>
  <rect x="111" y="14" width="3" height="17" fill="#c9a52a" opacity="0.55"/>
  <rect x="14" y="111" width="17" height="3" fill="#c9a52a" opacity="0.55"/>
  <rect x="14" y="97" width="3" height="17" fill="#c9a52a" opacity="0.55"/>
  <rect x="97" y="111" width="17" height="3" fill="#c9a52a" opacity="0.55"/>
  <rect x="111" y="97" width="3" height="17" fill="#c9a52a" opacity="0.55"/>
</svg>
