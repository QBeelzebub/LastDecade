<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0d1623"/>
  <!-- Gold border -->
  <rect x="4" y="4" width="120" height="120" fill="none" stroke="#c9a52a" stroke-width="3"/>

  <!-- Lead jet (largest, upper-right) -->
  <g transform="translate(73,44) rotate(-40) scale(0.9)">
    <polygon points="20,0 8,-5 -4,-5 -9,-22 -14,-5 -21,-2 -21,2 -14,5 -9,22 -4,5 8,5" fill="#c9a52a"/>
  </g>
  <!-- Lead exhaust glow -->
  <circle cx="57" cy="56" r="5" fill="#c9a52a" opacity="0.32"/>

  <!-- Wing jet 1 -->
  <g transform="translate(51,62) rotate(-40) scale(0.72)">
    <polygon points="20,0 8,-5 -4,-5 -9,-22 -14,-5 -21,-2 -21,2 -14,5 -9,22 -4,5 8,5" fill="#c9a52a" opacity="0.85"/>
  </g>
  <circle cx="38" cy="72" r="4" fill="#c9a52a" opacity="0.28"/>

  <!-- Wing jet 2 -->
  <g transform="translate(36,80) rotate(-40) scale(0.72)">
    <polygon points="20,0 8,-5 -4,-5 -9,-22 -14,-5 -21,-2 -21,2 -14,5 -9,22 -4,5 8,5" fill="#c9a52a" opacity="0.85"/>
  </g>
  <circle cx="23" cy="90" r="4" fill="#c9a52a" opacity="0.28"/>
</svg>
